  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
      createUserWithEmailAndPassword, signInWithEmailAndPassword,
      EmailAuthProvider, linkWithCredential, linkWithPopup, unlink,
      sendPasswordResetEmail, reauthenticateWithCredential, reauthenticateWithPopup,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAxyUfbjCJqBihgqt27I3r8NEnDzBv0870",
      authDomain: "tracker-2e97e.firebaseapp.com",
      projectId: "tracker-2e97e",
      storageBucket: "tracker-2e97e.firebasestorage.app",
      messagingSenderId: "415883101548",
      appId: "1:415883101548:web:2fe1b2d516d0b8713adf49"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const friendlyError = (e) => {
      const code = e?.code || "";
      if (code === "auth/email-already-in-use") return "An account already exists for that email. Try signing in instead.";
      if (code === "auth/invalid-email")        return "That doesn't look like a valid email.";
      if (code === "auth/weak-password")        return "Password is too weak. Use at least 6 characters.";
      if (code === "auth/user-not-found")       return "No account exists for that email. Tap 'Create account' to sign up.";
      if (code === "auth/wrong-password")       return "Wrong password. Try again or reset your password.";
      if (code === "auth/invalid-credential")   return "Wrong email or password. Try again or reset your password.";
      if (code === "auth/too-many-requests")    return "Too many attempts. Wait a moment and try again.";
      if (code === "auth/popup-closed-by-user") return null; // user cancelled, silent
      if (code === "auth/credential-already-in-use") return "That account is already linked to a different user.";
      if (code === "auth/provider-already-linked") return "That sign-in method is already linked to your account.";
      if (code === "auth/requires-recent-login") return "For security, please sign out and sign back in before doing this.";
      return e?.message || "Something went wrong. Please try again.";
    };

    window.__firebase = {
      signIn: () => signInWithPopup(auth, provider).catch(e => {
        const msg = friendlyError(e);
        if (msg) alert(msg);
      }),
      signInWithEmail: async (email, password) => {
        try {
          await signInWithEmailAndPassword(auth, email, password);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: friendlyError(e) };
        }
      },
      createWithEmail: async (email, password) => {
        try {
          await createUserWithEmailAndPassword(auth, email, password);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: friendlyError(e) };
        }
      },
      sendPasswordReset: async (email) => {
        try {
          await sendPasswordResetEmail(auth, email);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: friendlyError(e) };
        }
      },
      linkEmailToCurrentUser: async (email, password) => {
        try {
          const u = auth.currentUser;
          if (!u) return { ok: false, error: "Not signed in." };
          const cred = EmailAuthProvider.credential(email, password);
          await linkWithCredential(u, cred);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: friendlyError(e) };
        }
      },
      linkGoogleToCurrentUser: async () => {
        try {
          const u = auth.currentUser;
          if (!u) return { ok: false, error: "Not signed in." };
          await linkWithPopup(u, provider);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: friendlyError(e) };
        }
      },
      unlinkProvider: async (providerId) => {
        try {
          const u = auth.currentUser;
          if (!u) return { ok: false, error: "Not signed in." };
          if ((u.providerData || []).length <= 1) {
            return { ok: false, error: "You need at least one sign-in method. Link another method before removing this one." };
          }
          await unlink(u, providerId);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: friendlyError(e) };
        }
      },
      getLinkedProviders: () => {
        const u = auth.currentUser;
        if (!u) return [];
        return (u.providerData || []).map(p => p.providerId);
      },
      signOut: () => signOut(auth),
      onAuthStateChanged: (cb) => onAuthStateChanged(auth, cb),
      saveData: async (uid, data) => {
        await setDoc(doc(db, "users", uid), data);
        try { localStorage.setItem("tef_tracker_v2", JSON.stringify(data)); } catch(e) {}
      },
      loadData: async (uid) => {
        try {
          const snap = await getDoc(doc(db, "users", uid));
          if (snap.exists()) return snap.data();
        } catch(e) {}
        try {
          const local = localStorage.getItem("tef_tracker_v2");
          if (local) return JSON.parse(local);
        } catch(e) {}
        return null;
      }
    };
    window.dispatchEvent(new Event("firebaseReady"));
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ═══ CONSTANTS ═══════════════════════════════════════════════════════════
    const STORAGE_KEY = "tef_tracker_v2";

    // ═══ MODERN FLAT · FOREST PALETTE ═══════════════════════════════════════
    // Flat surfaces, thin borders, near-black ink, forest-green accent.
    const C = {
      bg:"#f3f5f1",                 // pale sage app surface
      bgGradTop:"#fafbfa",          // subtle top of bg gradient
      surface:"#ffffff",            // flat white cards
      card:"#ffffff", cardActive:"#ebf3e3",
      border:"#e7eae3", borderActive:"#c8dcb2",
      ink:"#0d130c",                // near-black primary text
      text:"#0d130c",
      textMuted:"#6b7563",          // muted sage-gray
      mutedGray:"#9aa493",          // lightest gray (labels, placeholders)
      fieldBg:"#f3f5f1",            // input background
      accent:"#4d8a4d",             // forest green accent (primary)
      accentDeep:"#1e4423",         // deep green (text on tint, done states)
      accentTint:"#ebf3e3",         // pale green tint (accent cards, done bg)
      accentFieldBg:"#d9e8c8",      // filled-input green
      // legacy aliases kept so existing references resolve to the new palette:
      accentLight:"#5fa85f",
      green:"#4d8a4d", greenDark:"#1e4423", greenText:"#1e4423",
      red:"#d4453f",
      workoutOnly:"#1e4423",
    };
    const HEAT = { 0:"#e7eae3", 1:"#cfe3b8", 2:"#9fce7a", 3:"#5fa85f", 4:"#1e4423", future:"#f3f5f1" };
    const MONTH_LABELS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    const MILESTONES = [
      { month:1, label:"Month 1",    pimsleur:30,  comprehension:60, innerFrench:12 },
      { month:2, label:"Month 2",    pimsleur:60,  comprehension:75, innerFrench:24 },
      { month:3, label:"Month 3",    pimsleur:90,  comprehension:85, innerFrench:36 },
      { month:6, label:"Exam Ready", pimsleur:180, comprehension:95, innerFrench:72 },
    ];

    const EMOJI_PRESETS = ["📌","📚","✍️","💪","🧘","🏃","🚴","🥗","💧","☕","🌱","💊","🧠","💤","🎵","🎨","💼","💰","🙏","❤️","🌅","📖"];

    const BUILTIN_HABITS = [
      { key:"pimsleur",    emoji:"🎧", label:"Pimsleur",    countField:"pimsleurTotal",    sublabelFn:d=>`Logging lesson ${d.pimsleurTotal||0}` },
      { key:"anki",        emoji:"🃏", label:"Flash cards", sublabelFn:()=>"20 new cards + reviews" },
      { key:"innerFrench", emoji:"🎙️", label:"Inner French", countField:"innerFrenchTotal", sublabelFn:d=>`Logging episode ${d.innerFrenchTotal||0}` },
      { key:"workout",     emoji:"🏋️", label:"Workout",     sublabelFn:()=>"Gym, cardio, recovery…" },
      { key:"eartest",     emoji:"👂", label:"Ear Test",    sublabelFn:()=>"Inner French audio-only %" },
    ];

    const WORKOUT_TYPES = [
      { key:"push",     label:"Push",     emoji:"👋" },
      { key:"pull",     label:"Pull",     emoji:"💪" },
      { key:"legs",     label:"Legs",     emoji:"🏋️‍♂️" },
      { key:"upper",    label:"Upper",    emoji:"⬆️" },
      { key:"lower",    label:"Lower",    emoji:"⬇️" },
      { key:"cardio",   label:"Cardio",   emoji:"🏊‍♂️" },
      { key:"recovery", label:"Recovery", emoji:"🧘" },
      { key:"mix",      label:"Mix",      emoji:"✖️" },
    ];

    const EXERCISE_PRESETS = {
      push:    ["Bench Press","Overhead Press","Incline Dumbbell Press","Push-ups","Tricep Pushdown","Lateral Raise","Dips","Chest Fly"],
      pull:    ["Pull-ups","Barbell Row","Lat Pulldown","Seated Cable Row","Face Pull","Bicep Curl","Hammer Curl","Reverse Fly"],
      legs:    ["Back Squat","Romanian Deadlift","Leg Press","Walking Lunge","Leg Curl","Leg Extension","Calf Raise","Hip Thrust","Bulgarian Split Squat"],
      upper:   ["Bench Press","Overhead Press","Pull-ups","Barbell Row","Dumbbell Curl","Tricep Extension"],
      lower:   ["Back Squat","Deadlift","Leg Press","Walking Lunge","Calf Raise","Hip Thrust"],
      cardio:  ["Running","Cycling","Rowing","Stairmaster","Incline Walk"],
      recovery:["Foam Rolling","Stretching","Yoga","Walk","Mobility Drills"],
      mix:     [],
    };

    // ─── ICONS ───────────────────────────────────────────────────────────
    // Geometric minimal set. Pure shapes, no literal pictographs.
    // 24x24 viewBox. Color (green when active, muted gray when not) passed in.
    const TabIcon = ({ name, active, color }) => {
      const c = color;
      const common = { width:22, height:22, viewBox:"0 0 24 24", fill:"none", xmlns:"http://www.w3.org/2000/svg" };

      if (name === "day") {
        // Concentric: outer ring + filled center dot
        return (
          <svg {...common}>
            <circle cx="12" cy="12" r="9" stroke={c} strokeWidth="1.8"/>
            <circle cx="12" cy="12" r="3" fill={c}/>
          </svg>
        );
      }
      if (name === "todo") {
        // Notepad with check + line — distinct from Day's concentric circle
        return (
          <svg {...common}>
            <rect x="3.5" y="5" width="17" height="14" rx="2.5" stroke={c} strokeWidth="1.8" fill="none"/>
            <path d="M7.5 9.5l2 2 4-4" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
            <path d="M7.5 14.5h9" stroke={c} strokeWidth="1.8" strokeLinecap="round"/>
          </svg>
        );
      }
      if (name === "workout") {
        // Three horizontal blocks (like dumbbell weights from above)
        return (
          <svg {...common}>
            <rect x="3" y="9.5" width="5" height="5" rx="0.8" fill={c}/>
            <rect x="9.5" y="9.5" width="5" height="5" rx="0.8" fill={c}/>
            <rect x="16" y="9.5" width="5" height="5" rx="0.8" fill={c}/>
          </svg>
        );
      }
      if (name === "progress") {
        // Ascending bar chart - 4 bars rising left to right
        return (
          <svg {...common}>
            <rect x="3" y="15" width="3.5" height="6" rx="0.6" fill={c}/>
            <rect x="8.5" y="11" width="3.5" height="10" rx="0.6" fill={c}/>
            <rect x="14" y="7" width="3.5" height="14" rx="0.6" fill={c}/>
            <rect x="19.5" y="3" width="1.5" height="18" rx="0.6" fill={c}/>
          </svg>
        );
      }
      if (name === "year") {
        // 3x3 dot grid
        const dots = [];
        for (let r=0; r<3; r++) for (let cc=0; cc<3; cc++) {
          dots.push(<circle key={`${r}-${cc}`} cx={5 + cc*7} cy={5 + r*7} r="1.6" fill={c}/>);
        }
        return <svg {...common}>{dots}</svg>;
      }
      if (name === "history") {
        // Circle with clock-hand pointing back
        return (
          <svg {...common}>
            <circle cx="12" cy="12" r="9" stroke={c} strokeWidth="1.8"/>
            <path d="M12 12L8 9" stroke={c} strokeWidth="1.8" strokeLinecap="round"/>
          </svg>
        );
      }
      if (name === "settings") {
        // Two concentric outlined rings (gear suggestion, but minimal)
        return (
          <svg {...common}>
            <circle cx="12" cy="12" r="9" stroke={c} strokeWidth="1.8"/>
            <circle cx="12" cy="12" r="3" stroke={c} strokeWidth="1.8"/>
          </svg>
        );
      }
      return null;
    };

    const TABS = [
      { key:"day",      label:"Day" },
      { key:"todo",     label:"Todo" },
      { key:"workout",  label:"Workout" },
      { key:"progress", label:"Progress" },
      { key:"year",     label:"Year" },
      { key:"history",  label:"History" },
      { key:"settings", label:"Settings" },
    ];

    const DEFAULT_DATA = {
      startDate: "", logs: {}, comprehensionLog: [],
      pimsleurTotal: 14, innerFrenchTotal: 2,
      customHabits: [], hiddenBuiltins: [], habitOrder: [],
      workoutSessions: {}, customExercises: {}, exerciseOrder: {},
      hiddenPresets: {}, renamedPresets: {},
      todos: [],
    };

    // ═══ SHARED STYLES (modern flat) ═════════════════════════════════════════
    const S = {
      card:        { background:C.surface, borderRadius:14, padding:16, border:`1px solid ${C.border}`, marginBottom:10 },
      cardActive:  { background:C.accentTint, borderRadius:14, padding:16, border:`1px solid ${C.borderActive}`, marginBottom:10 },
      sectionLabel:{ fontSize:10, letterSpacing:0.6, color:C.textMuted, textTransform:"uppercase", marginBottom:14, fontWeight:800 },
      smallLabel:  { fontSize:10, color:C.textMuted, textTransform:"uppercase", letterSpacing:0.6, marginBottom:10, fontWeight:800 },
      pillBtn:     { background:C.fieldBg, border:"none", borderRadius:8, color:C.textMuted, fontSize:11, fontWeight:700, padding:"7px 14px", cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.2 },
      pillBtnOn:   { background:C.accent, border:"none", borderRadius:8, color:"#fff", fontSize:11, fontWeight:700, padding:"7px 14px", cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.2 },
      input:       { background:C.fieldBg, border:`1px solid ${C.border}`, borderRadius:8, color:C.text, fontSize:14, padding:"10px 12px", fontFamily:"Inter,sans-serif" },
      primaryBtn:  { background:C.accent, border:"none", borderRadius:10, color:"#fff", fontSize:13, fontWeight:700, padding:"10px 16px", cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.2 },
      dangerBtn:   { width:"100%", padding:"14px", borderRadius:12, background:C.surface, border:`1px solid ${C.red}`, color:C.red, fontSize:14, fontWeight:600, cursor:"pointer", fontFamily:"Inter,sans-serif" },
      bodyPad:     { padding:"20px 16px" },
      serif:       { fontFamily:"'Inter', sans-serif" },  // serif retired; alias keeps refs working
    };

    // ═══ PURE HELPERS ════════════════════════════════════════════════════════
    const localDateKey = d => {
      const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${day}`;
    };
    const formatDate = (key, opts) => new Date(key+"T12:00:00").toLocaleDateString("en-US", opts);
    const getISOWeek = date => {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    };
    const pct = (cur, tgt) => Math.min(100, Math.round((cur/tgt)*100));
    const blankLog = () => ({ pimsleur:false, anki:false, innerFrench:false, workout:null, comprehension:"" });
    const hasAnyHabit = (log, customs) => !!log && (
      log.pimsleur || log.anki || log.innerFrench || log.workout ||
      (customs||[]).some(h => log[h.key])
    );

    function getExercisesForType(data, typeKey) {
      if (typeKey === "mix") {
        // Mix = union of all exercises across all other types
        const mixHidden = new Set((data.hiddenPresets||{}).mix || []);
        const seen = new Set();
        const all = [];
        ["push","pull","legs","upper","lower","cardio","recovery"].forEach(t => {
          getExercisesForType(data, t).forEach(name => {
            if (!seen.has(name) && !mixHidden.has(name)) { seen.add(name); all.push(name); }
          });
        });
        // include any mix-specific custom exercises too
        const mixCustoms = (data.customExercises||{}).mix || [];
        mixCustoms.forEach(name => { if (!seen.has(name) && !mixHidden.has(name)) { seen.add(name); all.push(name); } });
        // apply mix-specific reorder if present
        const order = (data.exerciseOrder||{}).mix || [];
        if (!order.length) return all;
        const sorted = order.filter(n => seen.has(n));
        const remaining = all.filter(n => !order.includes(n));
        return [...sorted, ...remaining];
      }
      const hidden = (data.hiddenPresets||{})[typeKey] || [];
      const renames = (data.renamedPresets||{})[typeKey] || {};
      const presets = (EXERCISE_PRESETS[typeKey]||[]).filter(n => !hidden.includes(n)).map(n => renames[n] || n);
      const customs = (data.customExercises||{})[typeKey] || [];
      const all = [...presets, ...customs];
      const order = (data.exerciseOrder||{})[typeKey] || [];
      if (!order.length) return all;
      const sorted = order.filter(n => all.includes(n));
      const remaining = all.filter(n => !order.includes(n));
      return [...sorted, ...remaining];
    }

    // ═══ REUSABLE COMPONENTS ═════════════════════════════════════════════════

    function NumberStepper({ value, onChange, min=0, max=999, step=1 }) {
      return (
        <div style={{ display:"flex", alignItems:"center", borderRadius:100, overflow:"hidden", background:"#ffffff", boxShadow:"none" }}>
          <button onClick={()=>onChange(Math.max(min, value-step))}
            style={{ width:32, height:34, background:"none", border:"none", fontSize:17, color:C.textMuted, cursor:"pointer", fontFamily:"Inter,sans-serif", lineHeight:1, fontWeight:600 }}>−</button>
          <input type="number" value={value} min={min} max={max}
            onChange={e=>{ const v=parseInt(e.target.value); if(!isNaN(v)) onChange(Math.min(max,Math.max(min,v))); }}
            style={{ width:38, textAlign:"center", border:"none", background:"none", fontSize:15, fontWeight:700, color:C.text, fontFamily:"Inter,sans-serif", padding:"6px 0", letterSpacing:-0.3 }} />
          <button onClick={()=>onChange(Math.min(max, value+step))}
            style={{ width:32, height:34, background:"none", border:"none", fontSize:17, color:C.accent, cursor:"pointer", fontFamily:"Inter,sans-serif", lineHeight:1, fontWeight:700 }}>+</button>
        </div>
      );
    }

    function Toggle({ on, onClick, size=30 }) {
      return (
        <div onClick={onClick} style={{
          width:size, height:size, borderRadius:"50%",
          background: on ? `${C.accent}` : "#ffffff",
          border: on ? `1.5px solid ${C.greenDark}` : `1.5px solid #e7eae3`,
          display:"flex", alignItems:"center", justifyContent:"center",
          fontSize:13, color:"#fff", fontWeight:800, cursor:"pointer", flexShrink:0,
          boxShadow:"none",
        }}>{on?"✓":""}</div>
      );
    }

    function ReorderArrows({ onUp, onDown, canUp, canDown }) {
      const btn = enabled => ({
        width:22, height:14, border:"none", borderRadius:4,
        background:"#ffffff", color: enabled?C.textMuted:C.mutedGray,
        fontSize:9, lineHeight:1, fontFamily:"Inter,sans-serif",
        cursor: enabled?"pointer":"default", padding:0,
        boxShadow:"none",
      });
      return (
        <div style={{ display:"flex", flexDirection:"column", gap:2 }}>
          <button onClick={onUp} disabled={!canUp} style={btn(canUp)}>▲</button>
          <button onClick={onDown} disabled={!canDown} style={btn(canDown)}>▼</button>
        </div>
      );
    }

    function HabitCard({ active, emoji, label, sublabel, onToggle, stepper, children }) {
      return (
        <div style={active ? S.cardActive : S.card}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:12 }}>
            <div style={{ display:"flex", alignItems:"center", gap:12, flex:1, minWidth:0 }}>
              <div style={{
                width:44, height:44, borderRadius:13,
                background: active ? C.accentTint : C.fieldBg,
                display:"flex", alignItems:"center", justifyContent:"center",
                fontSize:21, flexShrink:0,
                boxShadow:"none",
              }}>{emoji}</div>
              <div style={{ minWidth:0, flex:1 }}>
                <div style={{ color: active?C.greenText:C.text, fontSize:15, fontWeight:700, letterSpacing:-0.2 }}>{label}</div>
                <div style={{ color: active?C.green:C.textMuted, fontSize:12, marginTop:2, fontWeight: active?500:500 }}>{sublabel}</div>
              </div>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:8, flexShrink:0 }}>
              {stepper}
              <Toggle on={active} onClick={onToggle} />
            </div>
          </div>
          {children}
        </div>
      );
    }

    function EmojiPalette({ selected, onSelect }) {
      return (
        <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:14 }}>
          {EMOJI_PRESETS.map(e => (
            <button key={e} onClick={()=>onSelect(e)} style={{
              width:34, height:34, fontSize:18, borderRadius:8,
              background: selected===e ? `${C.accent}` : "#ffffff",
              border: selected===e ? "none" : `1px solid ${C.border}`,
              cursor:"pointer", fontFamily:"Inter,sans-serif",
              boxShadow:"none",
            }}>{e}</button>
          ))}
        </div>
      );
    }

    function SavedToast({ show }) {
      if (!show) return null;
      return <div style={{ textAlign:"center", marginTop:16, color:C.greenText, fontSize:11, letterSpacing:2, fontWeight:700 }}>✓ SAVED</div>;
    }

    function SectionDivider({ children }) {
      return <div style={{ paddingTop:20, marginTop:8 }}>{children}</div>;
    }

    // ═══ MAIN APP ════════════════════════════════════════════════════════════
    function App() {
      // Auth
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [syncing, setSyncing] = useState(false);
      const [loginMode, setLoginMode] = useState("choose"); // "choose" | "signin" | "create" | "reset"
      const [loginEmail, setLoginEmail] = useState("");
      const [loginPassword, setLoginPassword] = useState("");
      const [loginError, setLoginError] = useState("");
      const [loginBusy, setLoginBusy] = useState(false);
      const [loginInfo, setLoginInfo] = useState("");
      const [linkPanelOpen, setLinkPanelOpen] = useState(false);
      const [linkEmail, setLinkEmail] = useState("");
      const [linkPassword, setLinkPassword] = useState("");
      const [linkBusy, setLinkBusy] = useState(false);
      const [linkError, setLinkError] = useState("");
      const [linkSuccess, setLinkSuccess] = useState("");
      const [linkedRefresh, setLinkedRefresh] = useState(0);

      // Core
      const [data, setData] = useState({ ...DEFAULT_DATA, startDate: localDateKey(new Date()) });
      const [activeTab, setActiveTab] = useState("day");
      const [viewDate, setViewDate] = useState(localDateKey(new Date()));
      const [todayLog, setTodayLog] = useState(blankLog());
      const [saved, setSaved] = useState(false);

      // UI flags
      const [showCompForm, setShowCompForm] = useState(false);
      const [showWorkoutPicker, setShowWorkoutPicker] = useState(false);
      const [editingDate, setEditingDate] = useState(null);
      const [newHabitName, setNewHabitName] = useState("");
      const [newHabitEmoji, setNewHabitEmoji] = useState("📌");
      const [editingEmojiFor, setEditingEmojiFor] = useState(null);
      const [newExerciseName, setNewExerciseName] = useState("");
      const [expandedSession, setExpandedSession] = useState(null);
      const [editingExercise, setEditingExercise] = useState(null);
      const [libraryExpanded, setLibraryExpanded] = useState(false);
      const [libraryNewByType, setLibraryNewByType] = useState({});
      const [chartExpandedFor, setChartExpandedFor] = useState(null); // exercise name
      const [chartMetric, setChartMetric] = useState("volume"); // volume | e1rm | top

      // Todo tab state
      const [todoSheetOpen, setTodoSheetOpen] = useState(false);
      const [todoDraft, setTodoDraft] = useState({ title: "", dueDate: "", priority: "" });
      const [todoDateOpen, setTodoDateOpen] = useState(false);
      const [todoPriorityOpen, setTodoPriorityOpen] = useState(false);
      const [todoSwipedId, setTodoSwipedId] = useState(null);
      const [todoExpandedId, setTodoExpandedId] = useState(null);
      const [todoEditing, setTodoEditing] = useState(null); // {id, field: 'title'|'date'|'priority'|'notes'}

      const yearScrollRef = useRef(null);
      const today = localDateKey(new Date());

      // ─── Centralized data update ────────────────────────────────────────
      const update = useCallback(patch => {
        setData(prev => {
          const next = typeof patch === "function" ? patch(prev) : { ...prev, ...patch };
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch(e) {}
          if (user && window.__firebase) window.__firebase.saveData(user.uid, next);
          setSaved(true);
          setTimeout(() => setSaved(false), 1500);
          return next;
        });
      }, [user]);

      // ─── Auth ───────────────────────────────────────────────────────────
      useEffect(() => {
        const wait = () => {
          if (!window.__firebase) {
            window.addEventListener("firebaseReady", wait, { once:true });
            return;
          }
          window.__firebase.onAuthStateChanged(async u => {
            setUser(u);
            if (u) {
              setSyncing(true);
              const loaded = await window.__firebase.loadData(u.uid);
              if (loaded) {
                setData({ ...DEFAULT_DATA, ...loaded });
                if (loaded.logs?.[today]) setTodayLog(loaded.logs[today]);
              }
              setSyncing(false);
            }
            setAuthLoading(false);
          });
        };
        wait();
      }, [today]);

      // ─── Sync local todayLog when viewDate changes ──────────────────────
      useEffect(() => {
        const existing = data.logs[viewDate];
        const compEntry = (data.comprehensionLog||[]).find(e => e.date===viewDate);
        setTodayLog(existing
          ? { ...existing, comprehension: compEntry ? String(compEntry.value) : (existing.comprehension||"") }
          : { ...blankLog(), comprehension: compEntry ? String(compEntry.value) : "" });
        setShowCompForm(false);
        setShowWorkoutPicker(false);
      }, [viewDate, data.logs, data.comprehensionLog]);

      // ─── Year tab auto-scroll ───────────────────────────────────────────
      useEffect(() => {
        if (activeTab !== "year") return;
        let cancelled = false;
        const doScroll = () => {
          if (cancelled) return;
          const container = yearScrollRef.current;
          if (!container) return;
          const todayCol = container.querySelector('[data-today="1"]');
          if (!todayCol) { requestAnimationFrame(doScroll); return; }
          const cRect = container.getBoundingClientRect();
          const tRect = todayCol.getBoundingClientRect();
          const todayPos = container.scrollLeft + (tRect.left - cRect.left);
          container.scrollLeft = Math.max(0, todayPos - 22 - 38);
        };
        requestAnimationFrame(() => requestAnimationFrame(doScroll));
        return () => { cancelled = true; };
      }, [activeTab]);

      // ─── Derived values ─────────────────────────────────────────────────
      const hiddenBuiltins = data.hiddenBuiltins || [];
      const activeBuiltins = BUILTIN_HABITS.filter(h => !hiddenBuiltins.includes(h.key));

      const allActiveHabits = useMemo(() => {
        const items = [
          ...activeBuiltins.map(h => ({ ...h, isBuiltin:true })),
          ...(data.customHabits||[]).map(h => ({ ...h, isBuiltin:false })),
        ];
        const order = data.habitOrder || [];
        if (!order.length) return items;
        const sorted = order.map(k => items.find(h => h.key===k)).filter(Boolean);
        const remaining = items.filter(h => !order.includes(h.key));
        return [...sorted, ...remaining];
      }, [data.hiddenBuiltins, data.customHabits, data.habitOrder]);

      const streak = useMemo(() => {
        let count = 0;
        const d = new Date();
        while (true) {
          const log = data.logs[localDateKey(d)];
          if (!hasAnyHabit(log, data.customHabits)) break;
          count++;
          d.setDate(d.getDate()-1);
        }
        return count;
      }, [data.logs, data.customHabits]);

      const dayCount = useMemo(() => {
        // Day of year: Jan 1 = 1, Dec 31 = 365 (or 366 in leap year)
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 1);
        return Math.floor((now - start) / 86400000) + 1;
      }, []);

      const lastComp = useMemo(() => {
        const log = (data.comprehensionLog||[]).slice().sort((a,b) => a.date.localeCompare(b.date));
        return log.length ? log[log.length-1].value : null;
      }, [data.comprehensionLog]);

      const currentMilestone = MILESTONES.find(m => (data.pimsleurTotal||0) < m.pimsleur) || MILESTONES[MILESTONES.length-1];
      const selectedWorkout = WORKOUT_TYPES.find(w => w.key === todayLog.workout);
      const todaySession = (data.workoutSessions||{})[today] || null;

      // ─── Action: habits ─────────────────────────────────────────────────
      const toggleHabit = key => {
        const newLog = { ...todayLog, [key]: !todayLog[key] };
        setTodayLog(newLog);
        update({ logs: { ...data.logs, [viewDate]: newLog } });
      };

      const selectWorkout = type => {
        const newLog = { ...todayLog, workout: todayLog.workout===type ? null : type };
        setTodayLog(newLog);
        update({ logs: { ...data.logs, [viewDate]: newLog } });
        setShowWorkoutPicker(false);
      };

      const logComprehension = () => {
        const val = parseInt(todayLog.comprehension);
        if (isNaN(val) || val<0 || val>100) return;
        update({
          logs: { ...data.logs, [viewDate]: todayLog },
          comprehensionLog: [...(data.comprehensionLog||[]).filter(e=>e.date!==viewDate), { date:viewDate, value:val }],
        });
        setShowCompForm(false);
      };

      const clearComprehension = () => {
        update({ comprehensionLog: (data.comprehensionLog||[]).filter(e => e.date!==viewDate) });
        setTodayLog({ ...todayLog, comprehension:"" });
        setShowCompForm(false);
      };

      const updateCount = (field, val) => update({ [field]: val });

      const addCustomHabit = () => {
        const name = newHabitName.trim();
        if (!name) return;
        const key = "custom_" + name.toLowerCase().replace(/[^a-z0-9]/g,"_") + "_" + Date.now().toString(36);
        update({ customHabits: [...(data.customHabits||[]), { key, label:name, emoji: newHabitEmoji||"📌" }] });
        setNewHabitName("");
        setNewHabitEmoji("📌");
      };

      const updateHabitEmoji = (key, emoji) =>
        update({ customHabits: (data.customHabits||[]).map(h => h.key===key ? { ...h, emoji } : h) });

      const deleteCustomHabit = key => {
        if (!window.confirm("Delete this habit? It will be removed from all logged days.")) return;
        const newLogs = { ...data.logs };
        Object.keys(newLogs).forEach(d => {
          if (newLogs[d][key] !== undefined) {
            newLogs[d] = { ...newLogs[d] };
            delete newLogs[d][key];
          }
        });
        update({
          customHabits: (data.customHabits||[]).filter(h => h.key!==key),
          logs: newLogs,
        });
      };

      const toggleBuiltin = key => {
        const cur = data.hiddenBuiltins || [];
        update({ hiddenBuiltins: cur.includes(key) ? cur.filter(k=>k!==key) : [...cur, key] });
      };

      const moveHabit = (key, dir) => {
        const keys = allActiveHabits.map(h => h.key);
        const idx = keys.indexOf(key);
        const newIdx = idx + dir;
        if (idx<0 || newIdx<0 || newIdx>=keys.length) return;
        const newOrder = [...keys];
        [newOrder[idx], newOrder[newIdx]] = [newOrder[newIdx], newOrder[idx]];
        update({ habitOrder: newOrder });
      };

      // ─── Action: history ────────────────────────────────────────────────
      const toggleDayHabit = (date, habit) => {
        const cur = data.logs[date] || blankLog();
        const newLog = { ...cur, [habit]: !cur[habit] };
        update({ logs: { ...data.logs, [date]: newLog } });
        if (date === today) setTodayLog({ ...todayLog, ...newLog });
      };

      const setDayWorkout = (date, type) => {
        const cur = data.logs[date] || blankLog();
        const newLog = { ...cur, workout: cur.workout===type ? null : type };
        update({ logs: { ...data.logs, [date]: newLog } });
        if (date === today) setTodayLog({ ...todayLog, ...newLog });
      };

      const deleteDay = date => {
        const newLogs = { ...data.logs };
        delete newLogs[date];
        update({
          logs: newLogs,
          comprehensionLog: (data.comprehensionLog||[]).filter(e => e.date!==date),
        });
        if (date === today) setTodayLog(blankLog());
        setEditingDate(null);
      };


      // ─── Action: workout sessions ───────────────────────────────────────
      const startSession = typeKey => {
        const exNames = getExercisesForType(data, typeKey);

        // Look up the most recent sets per exercise across ALL session types.
        // This makes Mix pre-fill from any prior log, and lets parent workouts
        // pick up Mix entries automatically.
        const recentByName = {};
        Object.entries(data.workoutSessions||{})
          .filter(([d]) => d !== today)
          .sort((a,b) => b[0].localeCompare(a[0])) // newest first
          .forEach(([_, sess]) => {
            (sess.exercises||[]).forEach(e => {
              if (recentByName[e.name]) return; // already have a newer one
              if ((e.sets||[]).length === 0) return; // skip empty entries
              recentByName[e.name] = e.sets;
            });
          });

        const exercises = exNames.map((name, i) => {
          const recent = recentByName[name];
          return {
            id: `${typeKey}_${i}_${name}`,
            name,
            sets: recent ? recent.map(s => ({ weight: s.weight||0, reps: s.reps||0 })) : [],
            notes: "",
            done: false,
          };
        });

        const curLog = data.logs[today] || blankLog();
        update({
          workoutSessions: { ...(data.workoutSessions||{}), [today]: { type: typeKey, exercises } },
          logs: { ...data.logs, [today]: { ...curLog, workout: typeKey } },
        });
      };

      const clearSession = () => {
        const next = { ...(data.workoutSessions||{}) };
        delete next[today];
        update({ workoutSessions: next });
      };

      // Helper: apply a function to today's exercises array
      const mapExercises = fn => {
        const cur = (data.workoutSessions||{})[today];
        if (!cur) return;
        update({ workoutSessions: { ...(data.workoutSessions||{}), [today]: { ...cur, exercises: cur.exercises.map(fn) } } });
      };

      const addSet = exId => mapExercises(e =>
        e.id===exId ? { ...e, sets: [...e.sets, { weight:0, reps:0 }] } : e);

      const removeSet = (exId, idx) => mapExercises(e =>
        e.id===exId ? { ...e, sets: e.sets.filter((_,i) => i!==idx) } : e);

      const stepSet = (exId, idx, field, delta) => mapExercises(e =>
        e.id===exId
          ? { ...e, sets: e.sets.map((st,i) => i===idx
              ? { ...st, [field]: Math.round(Math.max(0, (st[field]||0) + delta) * 10) / 10 }
              : st) }
          : e);

      const setSetValue = (exId, idx, field, val) => mapExercises(e =>
        e.id===exId
          ? { ...e, sets: e.sets.map((st,i) => i===idx ? { ...st, [field]: val } : st) }
          : e);

      const toggleExerciseDone = exId => mapExercises(e =>
        e.id===exId ? { ...e, done: !e.done } : e);

      const updateExerciseNotes = (exId, notes) => mapExercises(e =>
        e.id===exId ? { ...e, notes } : e);

      const moveExercise = (exId, dir) => {
        const cur = (data.workoutSessions||{})[today];
        if (!cur) return;
        const idx = cur.exercises.findIndex(e => e.id===exId);
        const newIdx = idx + dir;
        if (idx<0 || newIdx<0 || newIdx>=cur.exercises.length) return;
        const arr = [...cur.exercises];
        [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
        update({
          exerciseOrder: { ...(data.exerciseOrder||{}), [cur.type]: arr.map(e => e.name) },
          workoutSessions: { ...(data.workoutSessions||{}), [today]: { ...cur, exercises: arr } },
        });
      };

      const addCustomExercise = (typeKey, name) => {
        const trimmed = name.trim();
        if (!trimmed) return;
        const cur = (data.customExercises||{})[typeKey] || [];
        if (cur.includes(trimmed) || (EXERCISE_PRESETS[typeKey]||[]).includes(trimmed)) return;
        const patch = { customExercises: { ...(data.customExercises||{}), [typeKey]: [...cur, trimmed] } };
        const sess = (data.workoutSessions||{})[today];
        if (sess && sess.type === typeKey) {
          patch.workoutSessions = {
            ...(data.workoutSessions||{}),
            [today]: { ...sess, exercises: [...sess.exercises, { id:`${typeKey}_custom_${Date.now()}`, name:trimmed, sets:[], notes:"", done:false }] },
          };
        }
        update(patch);
      };

      const renameExercise = (typeKey, oldName, newName) => {
        const trimmed = newName.trim();
        if (!trimmed || trimmed === oldName) return;
        const presets = EXERCISE_PRESETS[typeKey] || [];
        const renames = (data.renamedPresets||{})[typeKey] || {};
        const customs = (data.customExercises||{})[typeKey] || [];
        const originalPreset = presets.find(p => (renames[p] || p) === oldName);
        const patch = {};
        if (originalPreset) {
          patch.renamedPresets = { ...(data.renamedPresets||{}), [typeKey]: { ...renames, [originalPreset]: trimmed } };
        } else {
          patch.customExercises = { ...(data.customExercises||{}), [typeKey]: customs.map(c => c===oldName ? trimmed : c) };
        }
        const order = (data.exerciseOrder||{})[typeKey] || [];
        if (order.includes(oldName)) {
          patch.exerciseOrder = { ...(data.exerciseOrder||{}), [typeKey]: order.map(o => o===oldName ? trimmed : o) };
        }
        const sess = (data.workoutSessions||{})[today];
        if (sess && sess.type === typeKey) {
          patch.workoutSessions = {
            ...(data.workoutSessions||{}),
            [today]: { ...sess, exercises: sess.exercises.map(e => e.name===oldName ? { ...e, name:trimmed } : e) },
          };
        }
        update(patch);
      };

      const deleteExercise = (typeKey, name) => {
        // Mix is a union view, not an owner — deleting from Mix only hides it from Mix.
        if (typeKey === "mix") {
          const mixHidden = (data.hiddenPresets||{}).mix || [];
          if (mixHidden.includes(name)) return; // already hidden
          const patch = {
            hiddenPresets: { ...(data.hiddenPresets||{}), mix: [...mixHidden, name] },
          };
          // also remove any mix-specific custom entry with same name
          const mixCustoms = (data.customExercises||{}).mix || [];
          if (mixCustoms.includes(name)) {
            patch.customExercises = { ...(data.customExercises||{}), mix: mixCustoms.filter(c => c!==name) };
          }
          // remove from any in-progress mix session today
          const sess = (data.workoutSessions||{})[today];
          if (sess && sess.type === "mix") {
            patch.workoutSessions = {
              ...(data.workoutSessions||{}),
              [today]: { ...sess, exercises: sess.exercises.filter(e => e.name!==name) },
            };
          }
          update(patch);
          return;
        }
        const presets = EXERCISE_PRESETS[typeKey] || [];
        const renames = (data.renamedPresets||{})[typeKey] || {};
        const customs = (data.customExercises||{})[typeKey] || [];
        const originalPreset = presets.find(p => (renames[p] || p) === name);
        const patch = {};
        if (originalPreset) {
          const hidden = (data.hiddenPresets||{})[typeKey] || [];
          patch.hiddenPresets = { ...(data.hiddenPresets||{}), [typeKey]: [...hidden, originalPreset] };
        } else {
          patch.customExercises = { ...(data.customExercises||{}), [typeKey]: customs.filter(c => c!==name) };
        }
        const order = (data.exerciseOrder||{})[typeKey] || [];
        if (order.includes(name)) {
          patch.exerciseOrder = { ...(data.exerciseOrder||{}), [typeKey]: order.filter(o => o!==name) };
        }
        const sess = (data.workoutSessions||{})[today];
        if (sess && sess.type === typeKey) {
          patch.workoutSessions = {
            ...(data.workoutSessions||{}),
            [today]: { ...sess, exercises: sess.exercises.filter(e => e.name!==name) },
          };
        }
        update(patch);
      };

      const restorePreset = (typeKey, originalName) => {
        const hidden = (data.hiddenPresets||{})[typeKey] || [];
        update({ hiddenPresets: { ...(data.hiddenPresets||{}), [typeKey]: hidden.filter(h => h!==originalName) } });
      };

      // ─── Action: todos ──────────────────────────────────────────────────
      const PRIORITY_LABELS = { high: "High", med: "Medium", low: "Low" };
      const PRIORITY_COLORS = { high: C.accent, med: "#e8b86a", low: "#a8b894" };

      const newTodoId = () => `t_${Date.now()}_${Math.floor(Math.random()*1000)}`;

      const addTodo = () => {
        const title = (todoDraft.title||"").trim();
        if (!title) return;
        const newTodo = {
          id: newTodoId(),
          title,
          dueDate: todoDraft.dueDate || today,  // default to today if not specified
          priority: todoDraft.priority || null,
          notes: "",
          done: false,
          doneAt: null,
          createdAt: today,
        };
        update({ todos: [...(data.todos||[]), newTodo] });
        setTodoDraft({ title: "", dueDate: "", priority: "" });
        setTodoSheetOpen(false);
        setTodoDateOpen(false);
        setTodoPriorityOpen(false);
      };

      const updateTodo = (id, patch) => {
        const todos = (data.todos||[]).map(t => t.id===id ? { ...t, ...patch } : t);
        update({ todos });
      };

      const toggleTodo = id => {
        const todos = (data.todos||[]).map(t => {
          if (t.id !== id) return t;
          const willBeDone = !t.done;
          return { ...t, done: willBeDone, doneAt: willBeDone ? today : null };
        });
        update({ todos });
      };

      const deleteTodo = id => {
        const todos = (data.todos||[]).filter(t => t.id !== id);
        update({ todos });
        setTodoSwipedId(null);
        setTodoExpandedId(null);
      };

      // Date helpers for grouping
      const todoBucket = (dueDate) => {
        if (!dueDate) return "nodate";
        if (dueDate < today) return "overdue";   // shown inside "today"
        if (dueDate === today) return "today";
        // tomorrow
        const t = new Date(today + "T12:00:00");
        const tomorrow = new Date(t); tomorrow.setDate(t.getDate()+1);
        const tomorrowKey = localDateKey(tomorrow);
        if (dueDate === tomorrowKey) return "tomorrow";
        return "later";
      };

      const formatTodoDate = (dueDate) => {
        if (!dueDate) return null;
        const bucket = todoBucket(dueDate);
        if (bucket === "today") return "Due today";
        if (bucket === "tomorrow") return "Tomorrow";
        if (bucket === "overdue") {
          const d = new Date(dueDate+"T12:00:00");
          const t = new Date(today+"T12:00:00");
          const days = Math.round((t-d)/86400000);
          return days === 1 ? "Overdue · 1 day" : `Overdue · ${days} days`;
        }
        return formatDate(dueDate, {weekday:"short", month:"short", day:"numeric"});
      };


      // ─── Export & Reset ─────────────────────────────────────────────────
      const exportCSV = () => {
        // Export full data as multi-sheet XLSX workbook.
        // Fallback to CSV if SheetJS didn't load.
        if (typeof XLSX === "undefined") {
          window.alert("Export library didn't load. Try refreshing the page and exporting again.");
          return;
        }

        const customs = data.customHabits || [];
        const compByDate = {};
        (data.comprehensionLog||[]).forEach(e => { compByDate[e.date] = e.value; });

        const dateFmt = (key) => {
          const d = new Date(key+"T12:00:00");
          return formatDate(key,{weekday:"short", year:"numeric", month:"short", day:"numeric"});
        };

        // ─── SHEET 1: Daily Logs ─────────────────────────────────────
        const dailyRows = [];
        const builtinCols = [
          { key: "pimsleur",    label: "Pimsleur" },
          { key: "anki",        label: "Anki" },
          { key: "innerFrench", label: "Inner French" },
        ];
        const dailyHeader = [
          "Date", "Day of Week", "ISO Week",
          ...builtinCols.map(c => c.label),
          "Workout Type",
          ...customs.map(h => h.label),
          "Ear Test %",
          "Habits Logged", "Total Habits",
        ];
        dailyRows.push(dailyHeader);

        const allActiveCount = (() => {
          // count of habits that are "active" for any given day in the past
          // simplified: use current built-ins + customs minus hidden
          const hb = (data.hiddenBuiltins||[]);
          const builtinActive = builtinCols.filter(c => !hb.includes(c.key)).length;
          const workoutActive = hb.includes("workout") ? 0 : 1;
          const eartestActive = hb.includes("eartest") ? 0 : 1;
          return builtinActive + customs.length + workoutActive + eartestActive;
        })();

        Object.keys(data.logs).sort().forEach(d => {
          const l = data.logs[d] || {};
          const date = new Date(d+"T12:00:00");
          const dow = date.toLocaleDateString("en-US",{weekday:"long"});
          const wk = getISOWeek(date);
          const logged =
            (l.pimsleur?1:0) + (l.anki?1:0) + (l.innerFrench?1:0) +
            (l.workout?1:0) +
            (compByDate[d] !== undefined ? 1 : 0) +
            customs.reduce((sum,h)=>sum+(l[h.key]?1:0), 0);
          dailyRows.push([
            d, dow, wk,
            l.pimsleur ? "Yes" : "",
            l.anki ? "Yes" : "",
            l.innerFrench ? "Yes" : "",
            l.workout || "",
            ...customs.map(h => l[h.key] ? "Yes" : ""),
            compByDate[d] !== undefined ? compByDate[d] : "",
            logged, allActiveCount,
          ]);
        });

        // ─── SHEET 2: Workout Sets (exploded) ─────────────────────────
        const setsHeader = ["Date", "Day of Week", "Workout Type", "Exercise", "Order", "Set #", "Weight (lb)", "Reps", "Exercise Done", "Notes"];
        const setsRows = [setsHeader];
        const sessions = data.workoutSessions || {};
        Object.keys(sessions).sort().forEach(d => {
          const s = sessions[d];
          if (!s || !s.exercises) return;
          const dow = new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"});
          const typeLabel = (WORKOUT_TYPES.find(t => t.key===s.type)||{}).label || s.type;
          s.exercises.forEach((ex, exIdx) => {
            if (!ex.sets || ex.sets.length === 0) {
              // include exercises even if no sets logged, so they show up
              if (ex.done || ex.notes) {
                setsRows.push([d, dow, typeLabel, ex.name, exIdx+1, "", "", "", ex.done?"Yes":"", ex.notes||""]);
              }
            } else {
              ex.sets.forEach((set, setIdx) => {
                setsRows.push([
                  d, dow, typeLabel, ex.name, exIdx+1, setIdx+1,
                  set.weight || 0, set.reps || 0,
                  ex.done ? "Yes" : "",
                  setIdx === 0 ? (ex.notes||"") : "",
                ]);
              });
            }
          });
        });

        // ─── SHEET 3: Workout Sessions Summary ───────────────────────
        const sessSummaryHeader = ["Date", "Day of Week", "Workout Type", "# Exercises", "# Exercises Done", "Total Sets", "Total Volume (lb)"];
        const sessSummaryRows = [sessSummaryHeader];
        Object.keys(sessions).sort().forEach(d => {
          const s = sessions[d];
          if (!s || !s.exercises) return;
          const dow = new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"});
          const typeLabel = (WORKOUT_TYPES.find(t => t.key===s.type)||{}).label || s.type;
          const doneCount = s.exercises.filter(e => e.done).length;
          const totalSets = s.exercises.reduce((acc,e) => acc + (e.sets||[]).length, 0);
          const volume = s.exercises.reduce((acc,e) =>
            acc + (e.sets||[]).reduce((sum,st) => sum + (st.weight||0)*(st.reps||0), 0), 0);
          sessSummaryRows.push([d, dow, typeLabel, s.exercises.length, doneCount, totalSets, Math.round(volume)]);
        });

        // ─── SHEET 4: Todos ──────────────────────────────────────────
        const todoHeader = ["ID", "Title", "Due Date", "Priority", "Status", "Completed Date", "Created Date", "Notes"];
        const todoRows = [todoHeader];
        const allTodos = (data.todos||[]).slice().sort((a,b) => (a.createdAt||"").localeCompare(b.createdAt||""));
        allTodos.forEach(t => {
          todoRows.push([
            t.id, t.title,
            t.dueDate || "",
            t.priority || "",
            t.done ? "Completed" : "Active",
            t.doneAt || "",
            t.createdAt || "",
            t.notes || "",
          ]);
        });

        // ─── SHEET 5: Summary ────────────────────────────────────────
        const summaryRows = [
          ["Export generated", new Date().toLocaleString()],
          ["User", user?.email || ""],
          [],
          ["Current streak (days)", streak],
          ["Day of year", dayCount],
          ["ISO week", getISOWeek(new Date())],
          [],
          ["Pimsleur lesson", data.pimsleurTotal || 0],
          ["Inner French episode", data.innerFrenchTotal || 0],
          ["Latest Ear Test %", lastComp ?? ""],
          [],
          ["Days logged", Object.keys(data.logs||{}).length],
          ["Workout sessions logged", Object.keys(data.workoutSessions||{}).length],
          ["Active todos", (data.todos||[]).filter(t=>!t.done).length],
          ["Completed todos", (data.todos||[]).filter(t=>t.done).length],
          ["Custom habits", customs.length],
        ];

        // Build workbook
        const wb = XLSX.utils.book_new();
        const addSheet = (name, rows) => {
          const ws = XLSX.utils.aoa_to_sheet(rows);
          // auto-size columns based on the longest cell per column
          const colWidths = [];
          rows.forEach(r => {
            r.forEach((cell, i) => {
              const len = String(cell ?? "").length;
              if (!colWidths[i] || len > colWidths[i]) colWidths[i] = len;
            });
          });
          ws["!cols"] = colWidths.map(w => ({ wch: Math.min(Math.max(w+2, 10), 40) }));
          XLSX.utils.book_append_sheet(wb, ws, name);
        };

        addSheet("Summary", summaryRows);
        addSheet("Daily Logs", dailyRows);
        addSheet("Workout Sets", setsRows);
        addSheet("Workout Sessions", sessSummaryRows);
        addSheet("Todos", todoRows);

        XLSX.writeFile(wb, `tracker-export-${today}.xlsx`);

      const resetAllData = () => {
        if (!window.confirm("Reset ALL data? This cannot be undone.")) return;
        const fresh = { ...DEFAULT_DATA, startDate: today };

      // ─── Year grid computation ──────────────────────────────────────────
      const yearGrid = useMemo(() => {
        const todayDate = new Date();
        const year = todayDate.getFullYear();
        const startDate = new Date(year, 0, 1);
        while (startDate.getDay() !== 0) startDate.setDate(startDate.getDate()-1);
        const endDate = new Date(todayDate.getFullYear(), todayDate.getMonth()+12, todayDate.getDate());
        const weeks = [];
        let current = [], cursor = new Date(startDate);
        while (cursor <= endDate || current.length > 0) {
          const dateKey = localDateKey(cursor);
          const log = data.logs[dateKey];
          const customCount = log ? (data.customHabits||[]).filter(h => log[h.key]).length : 0;
          const count = log
            ? (log.pimsleur?1:0)+(log.anki?1:0)+(log.innerFrench?1:0)+(log.workout?1:0)+customCount
            : 0;
          const d = cursor.getDate(), m = cursor.getMonth();
          current.push({
            date: dateKey, count, month: m, day: d, year: cursor.getFullYear(),
            isFuture: cursor > todayDate,
            isToday: dateKey === today,
            hasFrench: log ? !!(log.pimsleur||log.anki||log.innerFrench||customCount>0) : false,
            hasWorkout: log ? !!log.workout : false,
            label: (d===1 && m===0) ? String(cursor.getFullYear()).slice(2) : ([1,10,20,30].includes(d) ? String(d) : ""),
          });
          if (current.length === 7) {
            const monday = new Date(current[1].date+"T12:00:00");
            weeks.push({ days: current, weekNum: getISOWeek(monday) });
            current = [];
          }
          cursor.setDate(cursor.getDate()+1);
          if (weeks.length > 120) break;
        }
        if (current.length > 0) {
          while (current.length < 7) current.push({ isFuture:true, count:0, label:"" });
          weeks.push({ days: current, weekNum: 0 });
        }
        return weeks;
      }, [data.logs, data.customHabits, today]);

      const heatColor = cell => {
        if (cell.isFuture) return HEAT.future;
        if (cell.hasWorkout && !cell.hasFrench) return C.workoutOnly;
        return HEAT[Math.min(cell.count, 4)] || HEAT[0];

      const yearStats = useMemo(() => {
        const logs = Object.values(data.logs);

              <div style={{ width:42, height:42, background:`${C.accent}`, borderRadius:12, color:"#fff", display:"inline-flex", alignItems:"center", justifyContent:"center", fontFamily:"'Inter',sans-serif", fontWeight:700, fontSize:22, marginBottom:14 }}>B</div>

            {/* CHOOSE: Google + email entry point */}
            {loginMode === "choose" && (
              <div style={{ width:"100%", display:"flex", flexDirection:"column", gap:10 }}>
                <button onClick={()=>window.__firebase.signIn()} style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:12, background:"#ffffff", border:"none", borderRadius:12, padding:"14px 24px", fontSize:15, color:C.text, fontWeight:600, cursor:"pointer", fontFamily:"Inter,sans-serif", boxShadow:"none" }}>
                  <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                  Continue with Google
                </button>
                <div style={{ display:"flex", alignItems:"center", gap:10, margin:"4px 0", color:C.mutedGray, fontSize:10, letterSpacing:2, textTransform:"uppercase", fontWeight:600 }}>

                </div>
                <button onClick={()=>{ setLoginMode("signin"); setLoginError(""); setLoginInfo(""); }} style={{ background:"#ffffff", border:`1px solid ${C.border}`, borderRadius:12, padding:"13px 20px", color:C.text, fontSize:14, fontWeight:600, cursor:"pointer", fontFamily:"Inter,sans-serif", boxShadow:"0 1px 0 #ffffff inset" }}>

            {/* EMAIL SIGN-IN form */}

                {loginError && <div style={{ fontSize:11, color:C.red, marginBottom:10, fontWeight:500 }}>{loginError}</div>}
                <button onClick={handleEmailSignIn} disabled={loginBusy || !loginEmail || !loginPassword} style={{ ...primaryBtn, opacity: (loginBusy || !loginEmail || !loginPassword) ? 0.5 : 1, cursor: loginBusy ? "wait" : "pointer" }}>

                <div style={{ display:"flex", justifyContent:"space-between", marginTop:8 }}>
                  <button onClick={()=>{ setLoginMode("choose"); setLoginError(""); setLoginInfo(""); }} style={ghostBtn}>← Back</button>
                  <button onClick={()=>{ setLoginMode("reset"); setLoginError(""); setLoginInfo(""); }} style={ghostBtn}>Forgot password?</button>
                </div>
                <div style={{ textAlign:"center", marginTop:18, fontSize:11, color:C.textMuted }}>
                  Don't have an email account yet?{" "}

                  <strong style={{color:C.accent}}>Note:</strong> This creates a brand-new, empty account. If you want to add email login to your existing Google account, sign in with Google first and link email from Settings.

                  value={loginPassword} onChange={e=>setLoginPassword(e.target.value)}

                {loginError && <div style={{ fontSize:11, color:C.red, marginBottom:10, fontWeight:500 }}>{loginError}</div>}
                <button onClick={handleCreate} disabled={loginBusy || !loginEmail || !loginPassword || loginPassword.length < 6} style={{ ...primaryBtn, opacity: (loginBusy || !loginEmail || !loginPassword || loginPassword.length<6) ? 0.5 : 1, cursor: loginBusy ? "wait" : "pointer" }}>
                  {loginBusy ? "CREATING…" : "CREATE ACCOUNT"}

                <button onClick={handleReset} disabled={loginBusy || !loginEmail} style={{ ...primaryBtn, opacity: (loginBusy || !loginEmail) ? 0.5 : 1, cursor: loginBusy ? "wait" : "pointer" }}>

              <span style={{ fontSize:14, fontWeight:700, color:C.ink, letterSpacing:-0.3 }}>tracker</span>

      );

      const tabStyle = active => ({

      const renderTabs = () => (
        <div style={{
          position:"fixed", bottom:0, left:0, right:0, zIndex:100,

        }}>
          <div style={{

          }}>
            <div style={{ display:"flex", padding:"8px 2px 9px" }}>
              {TABS.map(t => {

                  </button>

      );


      // ─── TAB: DAY ───────────────────────────────────────────────────────
      const renderWorkoutHabitCard = () => (
        <div key="workout" style={ todayLog.workout ? S.cardActive : S.card }>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:12 }}>
            <div style={{ display:"flex", alignItems:"center", gap:12, flex:1, minWidth:0 }}>
              <div style={{
                width:44, height:44, borderRadius:13,
                background: todayLog.workout ? C.accentTint : C.fieldBg,

              }}>🏋️</div>
              <div style={{ minWidth:0, flex:1 }}>
                <div style={{ color: todayLog.workout?C.greenText:C.text, fontSize:15, fontWeight:700, letterSpacing:-0.2 }}>Workout</div>
                <div style={{ color: todayLog.workout?C.green:C.textMuted, fontSize:12, marginTop:2, fontWeight:500 }}>

                </div>

            </div>
            <button onClick={()=>setShowWorkoutPicker(!showWorkoutPicker)} style={todayLog.workout ? S.pillBtnOn : S.pillBtn}>

          </div>
          {showWorkoutPicker && (
            <div style={{ marginTop:14, display:"flex", gap:8, flexWrap:"wrap" }}>
              {WORKOUT_TYPES.map(w => {

                    boxShadow:"none",
                  }}>
                    <div style={{ fontSize:20 }}>{w.emoji}</div>
                    <div style={{ marginTop:4, fontWeight:700 }}>{w.label}</div>
                  </button>
                );
              })}
            </div>
          )}
        </div>
      );

      const renderEarTestCard = () => {
        const compEntry = (data.comprehensionLog||[]).find(e => e.date===viewDate);
        const isLogged = !!compEntry;
        return (
          <div key="eartest" style={ isLogged ? S.cardActive : S.card }>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:12 }}>
              <div style={{ display:"flex", alignItems:"center", gap:12, flex:1, minWidth:0 }}>
                <div style={{
                  width:44, height:44, borderRadius:13,
                  background: isLogged ? C.accentTint : C.fieldBg,
                  display:"flex", alignItems:"center", justifyContent:"center",
                  fontSize:21, flexShrink:0,
                  boxShadow:"none",
                }}>👂</div>
                <div style={{ minWidth:0, flex:1 }}>
                  <div style={{ fontSize:15, fontWeight:700, color: isLogged?C.greenText:C.text, letterSpacing:-0.2 }}>Ear Test</div>
                  <div style={{ color: isLogged?C.green:C.textMuted, fontSize:12, marginTop:2, fontWeight:500 }}>Inner French audio-only %</div>
                </div>
              </div>
              <button onClick={()=>{ if (isLogged) clearComprehension(); else setShowCompForm(!showCompForm); }}
                style={ isLogged ? S.pillBtnOn : S.pillBtn }>LOG</button>
            </div>
            {showCompForm && (
              <div style={{ marginTop:12, display:"flex", gap:8 }}>
                <input type="number" min="0" max="100" value={todayLog.comprehension}
                  onChange={e=>setTodayLog({ ...todayLog, comprehension: e.target.value })}
                  placeholder="e.g. 65"
                  style={{ ...S.input, flex:1, fontSize:16, padding:"8px 12px" }} />
                <button onClick={logComprehension} style={{ ...S.primaryBtn, padding:"8px 16px" }}>SAVE</button>
              </div>
            )}
            {!showCompForm && isLogged && (
              <div onClick={()=>setShowCompForm(true)} style={{
                marginTop:10, fontFamily:"'Inter',sans-serif", fontSize:32, fontWeight:700, cursor:"pointer", letterSpacing:-1.5, lineHeight:1,
                color: compEntry.value>=75?C.greenText : compEntry.value>=60?C.accent : C.red,
              }}>{compEntry.value}%</div>
            )}
          </div>
        );
      };

      const renderDayHero = () => {
        // Today completion ring
        const totalToday = allActiveHabits.length;
        const doneToday = allActiveHabits.filter(h => {
          if (h.key === "eartest") return !!(data.comprehensionLog||[]).find(e => e.date === today);
          return !!(data.logs[today]||{})[h.key];
        }).length;
        const pctToday = totalToday > 0 ? Math.round((doneToday/totalToday)*100) : 0;
        const ringCircumference = 339.3; // 2π * 54
        const ringDashOffset = ringCircumference * (1 - pctToday/100);

        // Last workout (only count sessions that are still logged and have content)
        const lastWorkoutEntry = Object.entries(data.workoutSessions||{})
          .filter(([d, s]) => {
            const dayLog = (data.logs||{})[d];
            if (!dayLog || !dayLog.workout) return false;
            return (s.exercises||[]).some(e => e.done || (e.sets||[]).length > 0) || d === today;
          })
          .sort((a,b)=>b[0].localeCompare(a[0]))[0];
        const lastWorkout = lastWorkoutEntry ? {
          type: lastWorkoutEntry[1].type,
          date: lastWorkoutEntry[0],
          isToday: lastWorkoutEntry[0] === today,
        } : null;
        const lastWorkoutType = lastWorkout ? WORKOUT_TYPES.find(w => w.key===lastWorkout.type) : null;
        const lastWorkoutLabel = lastWorkout ? (() => {
          if (lastWorkout.isToday) return "today";
          const d = new Date(lastWorkout.date+"T12:00:00");
          const t = new Date(today+"T12:00:00");
          const diff = Math.round((t-d)/86400000);
          if (diff === 1) return "yesterday";
          if (diff < 7) return `${diff}d ago`;
          return formatDate(lastWorkout.date, {month:"short",day:"numeric"});
        })() : null;

        // Year time week number
        const todayWeek = getISOWeek(new Date());
        const hr = new Date().getHours();
        const greeting = hr < 12 ? "Good morning," : hr < 18 ? "Good afternoon," : "Good evening,";

        return (
          <div style={{ padding:"4px 16px 14px" }}>
            <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:18, padding:20 }}>
              <div style={{ display:"flex", alignItems:"center", gap:18 }}>
                <div style={{ position:"relative", width:104, height:104, flexShrink:0 }}>
                  <svg width="104" height="104" viewBox="0 0 124 124">
                    <circle cx="62" cy="62" r="54" stroke={C.fieldBg} strokeWidth="9" fill="none"/>
                    <circle cx="62" cy="62" r="54" stroke={C.accent} strokeWidth="9" fill="none"
                      strokeDasharray={ringCircumference} strokeDashoffset={ringDashOffset} strokeLinecap="round"
                      transform="rotate(-90 62 62)" style={{ transition:"stroke-dashoffset 0.6s ease" }}/>
                  </svg>
                  <div style={{ position:"absolute", inset:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center" }}>
                    <div style={{ fontFamily:"'Inter',sans-serif", fontWeight:800, fontSize:38, lineHeight:1, letterSpacing:-1.5, color:C.ink }}>{streak}</div>
                    <div style={{ fontSize:8, letterSpacing:0.8, textTransform:"uppercase", color:C.textMuted, fontWeight:800, marginTop:3 }}>Day Streak</div>
                  </div>
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:11, color:C.textMuted, fontWeight:500, marginBottom:1 }}>{greeting}</div>
                  <div style={{ fontSize:22, fontWeight:800, letterSpacing:-0.8, lineHeight:1.05, color:C.ink, marginBottom:12 }}>Breno.</div>
                  <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:10.5, color:C.textMuted, fontWeight:500 }}>
                      <span>Today</span>
                      <span><strong style={{color:C.ink, fontWeight:700}}>{doneToday}</strong> of <strong style={{color:C.ink, fontWeight:700}}>{totalToday}</strong> · <strong style={{color:C.accentDeep, fontWeight:700}}>{pctToday}%</strong></span>
                    </div>
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:10.5, color:C.textMuted, fontWeight:500 }}>
                      <span>Year Time</span>
                      <span>Day <strong style={{color:C.ink, fontWeight:700}}>{dayCount}</strong>, Week <strong style={{color:C.ink, fontWeight:700}}>{todayWeek}</strong></span>
                    </div>
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:10.5, color:C.textMuted, fontWeight:500 }}>
                      <span>Last workout</span>
                      <span style={{ color:C.accentDeep, fontWeight:700 }}>{lastWorkout ? `${lastWorkoutType?.emoji||""} ${lastWorkoutType?.label||lastWorkout.type} · ${lastWorkoutLabel}` : "—"}</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const renderDayTab = () => {
        const arrowBtn = disabled => ({
          width:40, height:40, borderRadius:14,
          background:"#ffffff",
          border:"none",
          color: disabled?C.mutedGray:C.text,
          fontSize:18, cursor: disabled?"default":"pointer",
          fontFamily:"Inter,sans-serif",
          display:"flex", alignItems:"center", justifyContent:"center",
          boxShadow:"none",
          opacity: disabled?0.4:1,
        });
        const goRel = delta => {
          const d = new Date(viewDate+"T12:00:00"); d.setDate(d.getDate()+delta);
          setViewDate(localDateKey(d));
        };
        const dayDiff = (() => {
          const d = new Date(viewDate+"T12:00:00");
          const t = new Date(today+"T12:00:00");
          return Math.round((t-d)/86400000);
        })();

        return (
          <div style={S.bodyPad}>
            {/* DAY NAV */}
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:16, gap:10 }}>
              <button onClick={()=>goRel(-1)} style={arrowBtn(false)}>‹</button>
              <div onClick={()=>setViewDate(today)} style={{ flex:1, textAlign:"center", cursor: viewDate!==today?"pointer":"default" }}>
                <div style={{ fontSize:10, letterSpacing:1.8, color: viewDate===today?C.accent:C.textMuted, textTransform:"uppercase", fontWeight:700 }}>
                  {viewDate===today ? "Today" : (dayDiff===1 ? "Yesterday" : `${dayDiff} days ago`)}
                </div>
                <div style={{ fontFamily:"'Inter',sans-serif", fontSize:17, fontWeight:600, color:C.text, marginTop:3, letterSpacing:-0.3 }}>{formatDate(viewDate, {weekday:"long",month:"long",day:"numeric"})}</div>
              </div>
              <button disabled={viewDate>=today} onClick={()=>{ if (viewDate<today) goRel(1); }} style={arrowBtn(viewDate>=today)}>›</button>
            </div>

            {allActiveHabits.map(h => {
              if (h.key === "workout") return renderWorkoutHabitCard();
              if (h.key === "eartest") return renderEarTestCard();
              const stepper = h.countField
                ? <NumberStepper value={data[h.countField]||0} onChange={v=>updateCount(h.countField, v)} />
                : null;
              return (
                <HabitCard key={h.key}
                  active={!!todayLog[h.key]}
                  emoji={h.emoji}
                  label={h.label}
                  sublabel={h.isBuiltin ? h.sublabelFn(data) : "Custom habit"}
                  onToggle={() => toggleHabit(h.key)}
                  stepper={stepper} />
              );
            })}

            <SavedToast show={saved} />
          </div>
        );
      };


      // ─── EXERCISE PROGRESS CHART ────────────────────────────────────────
      // Build per-session history for one exercise across all logged sessions.
      // Returns [{ date, volume, e1rm, top, sets:[{weight,reps}] }] sorted oldest→newest.
      const getExerciseHistory = (exName) => {
        const out = [];
        Object.entries(data.workoutSessions || {}).forEach(([date, sess]) => {
          const dayLog = (data.logs || {})[date];
          if (!dayLog || !dayLog.workout) return; // only count days marked as workouts
          (sess.exercises || []).forEach(e => {
            if (e.name !== exName) return;
            const sets = (e.sets || []).filter(st => (st.weight || 0) > 0 || (st.reps || 0) > 0);
            if (sets.length === 0) return;
            const volume = sets.reduce((a, st) => a + (st.weight || 0) * (st.reps || 0), 0);
            const top = sets.reduce((a, st) => Math.max(a, st.weight || 0), 0);
            // Epley estimated 1RM, taken from the best set
            const e1rm = Math.round(sets.reduce((a, st) => {
              const est = (st.weight || 0) * (1 + (st.reps || 0) / 30);
              return Math.max(a, est);
            }, 0));
            out.push({ date, volume, top, e1rm, sets });
          });
        });
        return out.sort((a, b) => a.date.localeCompare(b.date));
      };

      const METRIC_DEFS = {
        volume: { label: "Volume",  unit: "lb", pick: h => h.volume, fmt: v => v >= 1000 ? (v/1000).toFixed(1)+"k" : Math.round(v) },
        e1rm:   { label: "Est. 1RM", unit: "lb", pick: h => h.e1rm,  fmt: v => Math.round(v) },
        top:    { label: "Top set",  unit: "lb", pick: h => h.top,   fmt: v => Math.round(v) },
      };

      const ExerciseChart = ({ exName }) => {
        const history = getExerciseHistory(exName);
        const def = METRIC_DEFS[chartMetric];

        const TabRow = (
          <div style={{ display:"flex", gap:3, padding:2, background:C.fieldBg, borderRadius:9, marginBottom:12 }}>
            {Object.entries(METRIC_DEFS).map(([key, m]) => {
              const on = chartMetric === key;
              return (
                <button key={key} onClick={()=>setChartMetric(key)} style={{
                  flex:1, background: on?C.surface:"none", border:"none", borderRadius:7,
                  padding:"6px 4px", fontSize:10, fontWeight:700, letterSpacing:0.2,
                  color: on?C.ink:C.textMuted, cursor:"pointer", fontFamily:"Inter,sans-serif",
                }}>{m.label}</button>
              );
            })}
          </div>
        );

        if (history.length < 2) {
          return (
            <div style={{ marginTop:12, paddingTop:14, borderTop:`1px solid ${C.border}` }}>
              <div style={S.smallLabel}>Progress · {def.label}</div>
              {TabRow}
              <div style={{ padding:"24px 12px", textAlign:"center", color:C.mutedGray, fontSize:12, fontWeight:600 }}>
                {history.length === 0 ? "No history yet — log a few sessions." : "Log one more session to see a trend."}
              </div>
            </div>
          );
        }

        const vals = history.map(def.pick);
        const maxV = Math.max(...vals), minV = Math.min(...vals);
        const span = maxV - minV || 1;
        const W = 400, H = 120, padTop = 14, padBot = 16;
        const plotH = H - padTop - padBot;
        const x = i => history.length === 1 ? W/2 : (i/(history.length-1)) * (W - 20) + 10;
        const y = v => padTop + plotH * (1 - (v - minV)/span);
        const pts = history.map((h,i) => `${x(i)},${y(def.pick(h))}`).join(" ");
        const areaPts = `${pts} ${x(history.length-1)},${H-padBot} ${x(0)},${H-padBot}`;

        const latest = def.pick(history[history.length-1]);
        const first = def.pick(history[0]);
        const gain = latest - first;
        const gainPct = first > 0 ? Math.round((gain/first)*100) : 0;

        return (
          <div style={{ marginTop:12, paddingTop:14, borderTop:`1px solid ${C.border}` }}>
            <div style={S.smallLabel}>Progress · {history.length} sessions</div>
            {TabRow}
            <div style={{ height:H, margin:"0 -4px 12px" }}>
              <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{ overflow:"visible" }}>
                {[0,0.5,1].map(f => (
                  <line key={f} x1="0" y1={padTop+plotH*f} x2={W} y2={padTop+plotH*f}
                    stroke={C.border} strokeDasharray="2,3" />
                ))}
                <defs>
                  <linearGradient id="exArea" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor={C.accent} stopOpacity="0.28"/>
                    <stop offset="100%" stopColor={C.accent} stopOpacity="0"/>
                  </linearGradient>
                </defs>
                <polygon points={areaPts} fill="url(#exArea)" />
                <polyline points={pts} fill="none" stroke={C.accent} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
                {history.map((h,i) => (
                  <circle key={i} cx={x(i)} cy={y(def.pick(h))} r={i===history.length-1?4:2.6}
                    fill={i===history.length-1?C.accent:C.surface} stroke={C.accent} strokeWidth="2"/>
                ))}
              </svg>
            </div>
            <div style={{ display:"flex", gap:8, paddingTop:10, borderTop:`1px solid ${C.border}` }}>
              {[
                { num: def.fmt(latest), label: `Last (${def.unit})` },
                { num: (gain>=0?"+":"") + (chartMetric==="volume" ? gainPct+"%" : def.fmt(gain)), label: "Change" },
                { num: history.length, label: "Sessions" },
              ].map((s,i) => (
                <div key={i} style={{ flex:1, textAlign:"center" }}>
                  <div style={{ fontSize:15, fontWeight:800, color:C.accentDeep, letterSpacing:-0.5, lineHeight:1 }}>{s.num}</div>
                  <div style={{ fontSize:8, color:C.textMuted, fontWeight:800, letterSpacing:0.5, textTransform:"uppercase", marginTop:4 }}>{s.label}</div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      // ─── TAB: WORKOUT ───────────────────────────────────────────────────
      const renderSetRow = (exId, st, idx) => {
        const stepBtn = color => ({
          width:26, height:32, background:"none", border:"none",
          color, fontSize:15, fontFamily:"Inter,sans-serif", lineHeight:1, cursor:"pointer", fontWeight:600,
        });
        const wrap = { display:"flex", alignItems:"center", background:"#ffffff", borderRadius:10, overflow:"hidden", boxShadow:"none" };
        const numStyle = { width:40, textAlign:"center", border:"none", background:"none", fontSize:13, fontWeight:700, fontFamily:"Inter,sans-serif", color:C.text, padding:0, letterSpacing:-0.3 };
        const unitStyle = { fontSize:8, color:C.textMuted, letterSpacing:1, marginLeft:2, fontWeight:600 };

        return (
          <div key={idx} style={{ display:"grid", gridTemplateColumns:"22px 1fr 1fr 20px", gap:6, alignItems:"center" }}>
            <div style={{ fontSize:10, color:C.textMuted, fontWeight:700, letterSpacing:1 }}>S{idx+1}</div>
            <div style={wrap}>
              <button onClick={()=>stepSet(exId,idx,"weight",-5)} style={stepBtn(C.textMuted)}>−</button>
              <div style={{ flex:1, textAlign:"center", fontSize:13, fontWeight:700, color:C.text, fontFamily:"Inter,sans-serif" }}>
                <input type="number" step="0.5" value={st.weight||0}
                  onChange={e=>setSetValue(exId,idx,"weight",parseFloat(e.target.value)||0)}
                  style={numStyle} />
                <span style={unitStyle}>LB</span>
              </div>
              <button onClick={()=>stepSet(exId,idx,"weight",5)} style={stepBtn(C.accent)}>+</button>
            </div>
            <div style={wrap}>
              <button onClick={()=>stepSet(exId,idx,"reps",-1)} style={stepBtn(C.textMuted)}>−</button>
              <div style={{ flex:1, textAlign:"center", fontSize:13, fontWeight:700, color:C.text, fontFamily:"Inter,sans-serif" }}>
                <input type="number" step="0.5" value={st.reps||0}
