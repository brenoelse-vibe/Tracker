<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tracker" />
  <title>Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f0e8; font-family: Georgia, serif; }
    input:focus { outline: 2px solid #c17f24; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const STORAGE_KEY = "tef_tracker_v2";

    const localDateKey = (d) => {
      const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${day}`;
    };

    const defaultData = {
      startDate: localDateKey(new Date()),
      logs: {}, comprehensionLog: [],
      pimsleurTotal: 14, innerFrenchTotal: 2,
    };

    const milestones = [
      { month:1, label:"Month 1",  pimsleur:30,  comprehension:60, innerFrench:12 },
      { month:2, label:"Month 2",  pimsleur:60,  comprehension:75, innerFrench:24 },
      { month:3, label:"Month 3",  pimsleur:90,  comprehension:85, innerFrench:36 },
      { month:6, label:"Exam Ready", pimsleur:180, comprehension:95, innerFrench:72 },
    ];

    const WORKOUT_TYPES = [
      { key:"push",     label:"Push",     emoji:"💪" },
      { key:"pull",     label:"Pull",     emoji:"🏋️" },
      { key:"legs",     label:"Legs",     emoji:"🦵" },
      { key:"cardio",   label:"Cardio",   emoji:"🏃" },
      { key:"recovery", label:"Recovery", emoji:"🧘" },
    ];

    const monthLabels = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const bg="#f5f0e8", card="#ede8df", cardActive="#e8f0e4";
    const border="#ddd8ce", borderActive="#a8c8a0";
    const text="#2c2416", textMuted="#8c7e6a";
    const accent="#c17f24", green="#4a8c4a", red="#c44";
    const heatColors = { 0:"#e8e2d6",1:"#f5c98a",2:"#e89a3c",3:"#c46d10",4:"#7a3f08",future:"#f5f0e8",beforeStart:"#f0ebe2" };

    // +/- stepper for lesson/episode numbers
    function Stepper({ value, onChange, min=0, max=999 }) {
      return (
        <div style={{ display:"flex", alignItems:"center", border:`1px solid ${border}`, borderRadius:10, overflow:"hidden", background:bg }}>
          <button onClick={() => onChange(Math.max(min, value-1))}
            style={{ width:38, height:38, background:"none", border:"none", fontSize:22, color:textMuted, cursor:"pointer", fontFamily:"Georgia,serif", lineHeight:1 }}>−</button>
          <input type="number" value={value} min={min} max={max}
            onChange={e => { const v=parseInt(e.target.value); if(!isNaN(v)) onChange(Math.min(max,Math.max(min,v))); }}
            style={{ width:48, textAlign:"center", border:"none", background:"none", fontSize:16, fontWeight:"bold", color:text, fontFamily:"Georgia,serif", padding:"8px 0" }} />
          <button onClick={() => onChange(Math.min(max, value+1))}
            style={{ width:38, height:38, background:"none", border:"none", fontSize:22, color:accent, cursor:"pointer", fontFamily:"Georgia,serif", lineHeight:1 }}>+</button>
        </div>
      );
    }

    function App() {
      const [data, setData]           = useState(defaultData);
      const [activeTab, setActiveTab] = useState("today");
      const [todayLog, setTodayLog]   = useState({ pimsleur:false, anki:false, innerFrench:false, workout:null, comprehension:"" });
      const [showCompForm, setShowCompForm]         = useState(false);
      const [showWorkoutPicker, setShowWorkoutPicker] = useState(false);
      const [editingDate, setEditingDate] = useState(null);
      const [saved, setSaved]         = useState(false);

      const today = localDateKey(new Date());

      useEffect(() => {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) {
            const parsed = JSON.parse(stored);
            setData(parsed);
            if (parsed.logs[today]) setTodayLog(parsed.logs[today]);
          }
        } catch(e) {}
      }, []);

      const save = (newData) => {
        setData(newData);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(newData)); } catch(e) {}
        setSaved(true); setTimeout(() => setSaved(false), 1500);
      };

      const toggleHabit = (habit) => {
        const newLog = { ...todayLog, [habit]: !todayLog[habit] };
        setTodayLog(newLog);
        save({ ...data, logs: { ...data.logs, [today]: newLog } });
      };

      const selectWorkout = (type) => {
        const newLog = { ...todayLog, workout: todayLog.workout===type ? null : type };
        setTodayLog(newLog);
        save({ ...data, logs: { ...data.logs, [today]: newLog } });
        setShowWorkoutPicker(false);
      };

      const logComprehension = () => {
        const val = parseInt(todayLog.comprehension);
        if (isNaN(val)||val<0||val>100) return;
        const newCompLog = [...(data.comprehensionLog||[]).filter(e=>e.date!==today), {date:today,value:val}];
        save({ ...data, logs:{...data.logs,[today]:todayLog}, comprehensionLog:newCompLog });
        setShowCompForm(false);
      };

      const updateCount = (field, val) => save({ ...data, [field]: val });

      // Edit/delete a specific day from History
      const updateDayLog = (date, newLog) => {
        const newLogs = { ...data.logs, [date]: newLog };
        save({ ...data, logs: newLogs });
        if (date === today) setTodayLog({ ...todayLog, ...newLog });
      };
      const toggleDayHabit = (date, habit) => {
        const cur = data.logs[date] || { pimsleur:false, anki:false, innerFrench:false, workout:null, comprehension:"" };
        updateDayLog(date, { ...cur, [habit]: !cur[habit] });
      };
      const setDayWorkout = (date, type) => {
        const cur = data.logs[date] || { pimsleur:false, anki:false, innerFrench:false, workout:null, comprehension:"" };
        updateDayLog(date, { ...cur, workout: cur.workout===type ? null : type });
      };
      const deleteDay = (date) => {
        const newLogs = { ...data.logs };
        delete newLogs[date];
        const newCompLog = (data.comprehensionLog||[]).filter(e=>e.date!==date);
        save({ ...data, logs: newLogs, comprehensionLog: newCompLog });
        if (date === today) setTodayLog({ pimsleur:false, anki:false, innerFrench:false, workout:null, comprehension:"" });
        setEditingDate(null);
      };

      const getStreak = () => {
        let streak=0, d=new Date();
        while (true) {
          const key=localDateKey(d), log=data.logs[key];
          if (log&&(log.pimsleur||log.anki||log.innerFrench||log.workout)) { streak++; d.setDate(d.getDate()-1); } else break;
        }
        return streak;
      };

      const days     = (() => {
        const start = new Date(data.startDate+"T00:00:00");
        const now = new Date(); now.setHours(0,0,0,0);
        return Math.max(1, Math.floor((now-start)/86400000) + 1);
      })();
      const lastComp = (data.comprehensionLog||[]).slice(-1)[0]?.value ?? null;
      const streak   = getStreak();
      const curMile  = milestones.find(m=>(data.pimsleurTotal||0)<m.pimsleur)||milestones[milestones.length-1];
      const pct      = (c,t) => Math.min(100,Math.round((c/t)*100));
      const recentComp = (data.comprehensionLog||[]).slice(-7);
      const selWorkout = WORKOUT_TYPES.find(w=>w.key===todayLog.workout);

      const buildYearGrid = () => {
        const todayDate=new Date();
        const year=todayDate.getFullYear();
        const startDate=new Date(year,0,1);
        while (startDate.getDay()!==0) startDate.setDate(startDate.getDate()-1);
        const endDate=new Date(2027,5,30), weeks=[];
        let currentWeek=[], cursor=new Date(startDate);
        while (cursor<=endDate||currentWeek.length>0) {
          const dateKey=localDateKey(cursor), log=data.logs[dateKey];
          const count=log?(log.pimsleur?1:0)+(log.anki?1:0)+(log.innerFrench?1:0)+(log.workout?1:0):0;
          currentWeek.push({ date:dateKey, count, month:cursor.getMonth(), day:cursor.getDate(), year:cursor.getFullYear(),
            isFuture:cursor>todayDate, isToday:dateKey===today,
            hasFrench:log?!!(log.pimsleur||log.anki||log.innerFrench):false, hasWorkout:log?!!log.workout:false });
          if (currentWeek.length===7) { weeks.push(currentWeek); currentWeek=[]; }
          cursor.setDate(cursor.getDate()+1);
          if (weeks.length>90) break;
        }
        if (currentWeek.length>0) { while(currentWeek.length<7) currentWeek.push({isFuture:true,count:0}); weeks.push(currentWeek); }
        return weeks;
      };

      const getHeatColor = (cell) => {
        if (cell.isFuture)      return heatColors.future;
        if (cell.hasWorkout&&!cell.hasFrench) return "#2d6a2d";
        return heatColors[cell.count]||heatColors[0];
      };

      const yearStats = () => {
        const logs=Object.values(data.logs);
        return { active:logs.filter(l=>l.pimsleur||l.anki||l.innerFrench||l.workout).length,
                 full:logs.filter(l=>l.pimsleur&&l.anki&&l.innerFrench).length,
                 workouts:logs.filter(l=>l.workout).length };
      };

      const wCounts = () => {
        const c={}; WORKOUT_TYPES.forEach(w=>c[w.key]=0);
        Object.values(data.logs).forEach(l=>{ if(l.workout) c[l.workout]=(c[l.workout]||0)+1; });
        return c;
      };

      const T  = (active) => ({ flex:1, padding:"11px 0", background:"none", border:"none", color:active?accent:textMuted, fontSize:10, letterSpacing:1.5, textTransform:"uppercase", borderBottom:active?`2px solid ${accent}`:"2px solid transparent", cursor:"pointer", fontFamily:"Georgia,serif" });
      const CS = { background:card, borderRadius:14, padding:16, border:`1px solid ${border}`, marginBottom:12, boxShadow:"0 1px 3px rgba(0,0,0,0.06)" };
      const LS = { fontSize:11, letterSpacing:2, color:textMuted, textTransform:"uppercase", marginBottom:16 };
      const CK = (on) => ({ width:26, height:26, borderRadius:"50%", background:on?green:"transparent", border:`2px solid ${on?green:border}`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, color:"#fff", cursor:"pointer", flexShrink:0 });

      const HabitRow = ({ habitKey, emoji, label, sublabel, countField, countValue, children }) => (
        <div style={{ ...CS, background:todayLog[habitKey]?cardActive:card, border:`1px solid ${todayLog[habitKey]?borderActive:border}` }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div style={{ display:"flex", alignItems:"center", gap:12, flex:1 }}>
              <span style={{ fontSize:26 }}>{emoji}</span>
              <div>
                <div style={{ color:todayLog[habitKey]?green:text, fontSize:15, fontWeight:"bold" }}>{label}</div>
                <div style={{ color:textMuted, fontSize:11, marginTop:2 }}>{sublabel}</div>
              </div>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              {countField && (
                <Stepper value={countValue} onChange={v => updateCount(countField, v)} />
              )}
              <div onClick={() => toggleHabit(habitKey)} style={CK(todayLog[habitKey])}>{todayLog[habitKey]?"✓":""}</div>
            </div>
          </div>
          {children}
        </div>
      );

      return (
        <div style={{ fontFamily:"Georgia,serif", background:bg, minHeight:"100vh", color:text, maxWidth:430, margin:"0 auto", paddingBottom:80 }}>

          {/* HEADER */}
          <div style={{ background:"#ede8df", padding:"24px 20px 16px", borderBottom:`1px solid ${border}`, position:"sticky", top:0, zIndex:10 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
              <div>
                <div style={{ fontSize:10, letterSpacing:3, color:textMuted, textTransform:"uppercase", marginBottom:4 }}>Breno</div>
                <div style={{ fontSize:22, fontWeight:"bold", color:text }}>Progress Tracker</div>
              </div>
              <div style={{ textAlign:"right" }}>
                <div style={{ fontSize:30, fontWeight:"bold", color:streak>0?accent:"#c0b8a8" }}>{streak}</div>
                <div style={{ fontSize:10, color:textMuted, letterSpacing:2, textTransform:"uppercase" }}>day streak</div>
              </div>
            </div>
            <div style={{ marginTop:14, display:"flex", gap:10 }}>
              {[{label:"Day",value:days},{label:"Pimsleur",value:data.pimsleurTotal||0},{label:"Ear",value:lastComp!==null?`${lastComp}%`:"—"}].map(s=>(
                <div key={s.label} style={{ flex:1, background:bg, borderRadius:10, padding:"8px 0", border:`1px solid ${border}`, textAlign:"center" }}>
                  <div style={{ fontSize:18, fontWeight:"bold", color:accent }}>{s.value}</div>
                  <div style={{ fontSize:9, color:textMuted, letterSpacing:1, textTransform:"uppercase" }}>{s.label}</div>
                </div>
              ))}
            </div>
          </div>

          {/* TABS */}
          <div style={{ display:"flex", borderBottom:`1px solid ${border}`, background:"#ede8df" }}>
            {["today","progress","year","history","settings"].map(tab=>(
              <button key={tab} onClick={()=>setActiveTab(tab)} style={T(activeTab===tab)}>{tab}</button>
            ))}
          </div>

          {/* TODAY */}
          {activeTab==="today" && (
            <div style={{ padding:"20px 16px" }}>
              <div style={LS}>{new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div>

              <HabitRow habitKey="pimsleur" emoji="🎧" label="Pimsleur" sublabel={`Logging lesson ${data.pimsleurTotal||0}`} countField="pimsleurTotal" countValue={data.pimsleurTotal||0} />
              <HabitRow habitKey="anki"     emoji="🃏" label="Anki / 26s" sublabel="20 new cards + reviews" />
              <HabitRow habitKey="innerFrench" emoji="🎙️" label="Inner French" sublabel={`Logging episode ${data.innerFrenchTotal||0}`} countField="innerFrenchTotal" countValue={data.innerFrenchTotal||0} />

              {/* Workout */}
              <div style={{ ...CS, background:todayLog.workout?cardActive:card, border:`1px solid ${todayLog.workout?borderActive:border}` }}>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                    <span style={{ fontSize:26 }}>🏋️</span>
                    <div>
                      <div style={{ color:todayLog.workout?green:text, fontSize:15, fontWeight:"bold" }}>Workout</div>
                      <div style={{ color:textMuted, fontSize:11, marginTop:2 }}>{selWorkout?`${selWorkout.emoji} ${selWorkout.label}`:"Tap to log"}</div>
                    </div>
                  </div>
                  <button onClick={()=>setShowWorkoutPicker(!showWorkoutPicker)} style={{ background:todayLog.workout?green:bg, border:`1px solid ${todayLog.workout?green:border}`, borderRadius:8, color:todayLog.workout?"#fff":textMuted, fontSize:11, padding:"6px 14px", cursor:"pointer", fontFamily:"Georgia,serif" }}>
                    {todayLog.workout?"CHANGE":"LOG"}
                  </button>
                </div>
                {showWorkoutPicker && (
                  <div style={{ marginTop:14, display:"flex", gap:8, flexWrap:"wrap" }}>
                    {WORKOUT_TYPES.map(w=>(
                      <button key={w.key} onClick={()=>selectWorkout(w.key)} style={{ flex:"1 1 calc(33% - 8px)", padding:"10px 6px", borderRadius:10, background:todayLog.workout===w.key?green:bg, border:`1px solid ${todayLog.workout===w.key?green:border}`, color:todayLog.workout===w.key?"#fff":text, fontSize:12, cursor:"pointer", fontFamily:"Georgia,serif", textAlign:"center" }}>
                        <div style={{ fontSize:20 }}>{w.emoji}</div>
                        <div style={{ marginTop:4, fontWeight:"bold" }}>{w.label}</div>
                      </button>
                    ))}
                  </div>
                )}
              </div>

              {/* Ear test */}
              <div style={CS}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <div>
                    <div style={{ fontSize:15, fontWeight:"bold", color:text }}>👂 Ear Test</div>
                    <div style={{ color:textMuted, fontSize:11, marginTop:2 }}>Inner French audio-only %</div>
                  </div>
                  <button onClick={()=>setShowCompForm(!showCompForm)} style={{ background:bg, border:`1px solid ${border}`, borderRadius:8, color:textMuted, fontSize:11, padding:"6px 14px", cursor:"pointer", fontFamily:"Georgia,serif" }}>LOG</button>
                </div>
                {showCompForm && (
                  <div style={{ marginTop:12, display:"flex", gap:8 }}>
                    <input type="number" min="0" max="100" value={todayLog.comprehension} onChange={e=>setTodayLog({...todayLog,comprehension:e.target.value})} placeholder="e.g. 65" style={{ flex:1, background:bg, border:`1px solid ${border}`, borderRadius:8, color:text, fontSize:16, padding:"8px 12px", fontFamily:"Georgia,serif" }} />
                    <button onClick={logComprehension} style={{ background:accent, border:"none", borderRadius:8, color:"#fff", fontSize:13, fontWeight:"bold", padding:"8px 16px", cursor:"pointer", fontFamily:"Georgia,serif" }}>SAVE</button>
                  </div>
                )}
                {lastComp!==null&&!showCompForm&&(
                  <div style={{ marginTop:8, fontSize:28, fontWeight:"bold", color:lastComp>=75?green:lastComp>=60?accent:red }}>{lastComp}%</div>
                )}
              </div>

              {saved&&<div style={{ textAlign:"center", marginTop:16, color:green, fontSize:12, letterSpacing:2 }}>✓ SAVED</div>}
            </div>
          )}

          {/* PROGRESS */}
          {activeTab==="progress" && (
            <div style={{ padding:"20px 16px" }}>
              <div style={LS}>Next: {curMile.label}</div>
              {[
                { label:"Pimsleur Lessons", current:data.pimsleurTotal||0, target:curMile.pimsleur, unit:"lessons", emoji:"🎧" },
                { label:"Inner French",     current:data.innerFrenchTotal||0, target:curMile.innerFrench, unit:"episodes", emoji:"🎙️" },
                { label:"Ear Comprehension",current:lastComp||0, target:curMile.comprehension, unit:"%", emoji:"👂" },
              ].map(item=>(
                <div key={item.label} style={CS}>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:10 }}>
                    <div style={{ fontSize:14, color:text }}>{item.emoji} {item.label}</div>
                    <div style={{ fontSize:14, color:accent, fontWeight:"bold" }}>{item.current}/{item.target} {item.unit}</div>
                  </div>
                  <div style={{ height:8, background:border, borderRadius:4, overflow:"hidden" }}>
                    <div style={{ height:"100%", borderRadius:4, width:`${pct(item.current,item.target)}%`, background:pct(item.current,item.target)>=100?green:accent, transition:"width 0.6s ease" }} />
                  </div>
                  <div style={{ fontSize:11, color:textMuted, marginTop:6, textAlign:"right" }}>{pct(item.current,item.target)}% complete</div>
                </div>
              ))}

              <div style={CS}>
                <div style={{ fontSize:14, color:text, marginBottom:12 }}>🏋️ Workout Breakdown</div>
                <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                  {WORKOUT_TYPES.map(w=>(
                    <div key={w.key} style={{ flex:"1 1 calc(33% - 8px)", background:bg, borderRadius:10, padding:"10px 6px", border:`1px solid ${border}`, textAlign:"center" }}>
                      <div style={{ fontSize:18 }}>{w.emoji}</div>
                      <div style={{ fontSize:18, fontWeight:"bold", color:accent, marginTop:4 }}>{wCounts()[w.key]||0}</div>
                      <div style={{ fontSize:9, color:textMuted, textTransform:"uppercase", letterSpacing:1 }}>{w.label}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ marginTop:20, borderTop:`1px solid ${border}`, paddingTop:20 }}>
                <div style={LS}>6-month roadmap</div>
                {milestones.map(m=>{
                  const done=(data.pimsleurTotal||0)>=m.pimsleur;
                  return (
                    <div key={m.month} style={{ display:"flex", alignItems:"center", gap:14, marginBottom:14, opacity:done?1:0.6 }}>
                      <div style={{ width:34, height:34, borderRadius:"50%", flexShrink:0, background:done?green:bg, border:`2px solid ${done?green:border}`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, color:done?"#fff":textMuted, fontWeight:"bold" }}>{done?"✓":m.month}</div>
                      <div>
                        <div style={{ fontSize:14, color:done?green:text, fontWeight:"bold" }}>{m.label}</div>
                        <div style={{ fontSize:11, color:textMuted }}>Pimsleur {m.pimsleur} · Ear {m.comprehension}% · Inner French {m.innerFrench} eps</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* YEAR */}
          {activeTab==="year" && (
            <div style={{ padding:"20px 16px" }}>
              <div style={LS}>{new Date().getFullYear()} — Jun 2027</div>
              <div style={{ ...CS, display:"flex", justifyContent:"space-around", textAlign:"center" }}>
                {(()=>{ const s=yearStats(); return [{label:"Active days",value:s.active},{label:"Full days",value:s.full},{label:"Workouts",value:s.workouts}].map(st=>(
                  <div key={st.label}>
                    <div style={{ fontSize:22, fontWeight:"bold", color:accent }}>{st.value}</div>
                    <div style={{ fontSize:10, color:textMuted, letterSpacing:1, textTransform:"uppercase", marginTop:2 }}>{st.label}</div>
                  </div>
                ))})()}
              </div>

              <div style={{ ...CS, overflowX:"auto" }}>
                <div style={{ display:"flex", gap:3, minWidth:"fit-content" }}>
                  <div style={{ display:"flex", flexDirection:"column", gap:3, marginRight:4, paddingTop:18, position:"sticky", left:0, background:card, zIndex:1, paddingRight:4 }}>
                    {["","M","","W","","F",""].map((d,i)=>(
                      <div key={i} style={{ height:13, fontSize:8, color:textMuted, display:"flex", alignItems:"center", width:14 }}>{d}</div>
                    ))}
                  </div>
                  <div style={{ display:"flex", gap:3 }}>
                    {buildYearGrid().map((week,wi)=>{
                      const firstDay=week.find(d=>d.day===1);
                      const mLabel=firstDay ? (firstDay.month===0 ? `Jan ${String(firstDay.year).slice(2)}` : monthLabels[firstDay.month]) : "";
                      return (
                        <div key={wi} style={{ display:"flex", flexDirection:"column", gap:3 }}>
                          <div style={{ height:14, fontSize:9, color:textMuted, fontWeight:"bold", whiteSpace:"nowrap", overflow:"visible" }}>{mLabel}</div>
                          {week.map((cell,di)=>(
                            <div key={di} style={{ width:13, height:13, borderRadius:2, background:getHeatColor(cell), outline:cell.isToday?`1.5px solid ${text}`:"none", outlineOffset:cell.isToday?"1px":"0", boxSizing:"border-box" }} />
                          ))}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              <div style={{ fontSize:10, color:textMuted, letterSpacing:1, textAlign:"center" }}>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:6, marginBottom:6 }}>
                  <span>FRENCH</span>
                  {[0,1,2,3,4].map(c=><div key={c} style={{ width:13, height:13, borderRadius:2, background:heatColors[c] }}/>)}
                  <span>MORE</span>
                </div>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:6 }}>
                  <div style={{ width:13, height:13, borderRadius:2, background:"#2d6a2d" }}/>
                  <span>WORKOUT ONLY</span>
                </div>
              </div>
              <div style={{ marginTop:16, fontSize:11, color:textMuted, textAlign:"center", lineHeight:1.6 }}>
                Each square = one day. Fill every square before your exam.
              </div>
            </div>
          )}

          {/* HISTORY */}
          {activeTab==="history" && (
            <div style={{ padding:"20px 16px" }}>
              <div style={LS}>Ear comprehension trend</div>
              {recentComp.length>0 ? (
                <div style={CS}>
                  <div style={{ display:"flex", alignItems:"flex-end", gap:6, height:90 }}>
                    {recentComp.map((entry,i)=>(
                      <div key={i} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:4 }}>
                        <div style={{ fontSize:9, color:accent, fontWeight:"bold" }}>{entry.value}%</div>
                        <div style={{ width:"100%", borderRadius:4, minHeight:4, height:`${(entry.value/100)*65}px`, background:entry.value>=75?green:entry.value>=60?accent:red }}/>
                        <div style={{ fontSize:8, color:textMuted }}>{new Date(entry.date).getDate()}</div>
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                <div style={{ ...CS, textAlign:"center", color:textMuted, fontSize:13 }}>No ear test data yet. Log in Today tab.</div>
              )}

              <div style={{ ...LS, marginTop:8 }}>Daily log</div>
              <div style={{ fontSize:11, color:textMuted, marginBottom:10, fontStyle:"italic" }}>Tap a day to edit or delete it.</div>
              {Object.entries(data.logs).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,30).map(([date,log])=>{
                const w=WORKOUT_TYPES.find(w=>w.key===log.workout);
                const isEditing = editingDate===date;
                const isToday = date===today;
                return (
                  <div key={date} style={{ borderBottom:`1px solid ${border}` }}>
                    <div onClick={()=>setEditingDate(isEditing?null:date)} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 0", cursor:"pointer" }}>
                      <div style={{ fontSize:12, color:isEditing?accent:textMuted, fontWeight:isEditing?"bold":"normal" }}>
                        {new Date(date+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}
                        {isToday && <span style={{ marginLeft:6, fontSize:9, color:accent, letterSpacing:1 }}>TODAY</span>}
                      </div>
                      <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                        {[{key:"pimsleur",emoji:"🎧"},{key:"anki",emoji:"🃏"},{key:"innerFrench",emoji:"🎙️"}].map(h=>(
                          <span key={h.key} style={{ fontSize:16, opacity:log[h.key]?1:0.15 }}>{h.emoji}</span>
                        ))}
                        <span style={{ fontSize:16, opacity:w?1:0.15 }}>{w?w.emoji:"🏋️"}</span>
                        <span style={{ fontSize:11, color:textMuted, marginLeft:4 }}>{isEditing?"▲":"▼"}</span>
                      </div>
                    </div>
                    {isEditing && (
                      <div style={{ background:bg, borderRadius:10, padding:14, marginBottom:12, border:`1px solid ${border}` }}>
                        {[{key:"pimsleur",emoji:"🎧",label:"Pimsleur"},{key:"anki",emoji:"🃏",label:"Anki / 26s"},{key:"innerFrench",emoji:"🎙️",label:"Inner French"}].map(h=>(
                          <div key={h.key} onClick={()=>toggleDayHabit(date,h.key)} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 0", cursor:"pointer", borderBottom:`1px solid ${border}` }}>
                            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                              <span style={{ fontSize:20 }}>{h.emoji}</span>
                              <span style={{ fontSize:13, color:text }}>{h.label}</span>
                            </div>
                            <div style={CK(log[h.key])}>{log[h.key]?"✓":""}</div>
                          </div>
                        ))}
                        <div style={{ padding:"12px 0 8px" }}>
                          <div style={{ fontSize:11, color:textMuted, marginBottom:8, letterSpacing:1, textTransform:"uppercase" }}>Workout</div>
                          <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                            {WORKOUT_TYPES.map(wk=>(
                              <button key={wk.key} onClick={()=>setDayWorkout(date,wk.key)} style={{ flex:"1 1 calc(33% - 6px)", padding:"8px 4px", borderRadius:8, background:log.workout===wk.key?green:card, border:`1px solid ${log.workout===wk.key?green:border}`, color:log.workout===wk.key?"#fff":text, fontSize:11, cursor:"pointer", fontFamily:"Georgia,serif", textAlign:"center" }}>
                                <div style={{ fontSize:16 }}>{wk.emoji}</div>
                                <div style={{ marginTop:2 }}>{wk.label}</div>
                              </button>
                            ))}
                          </div>
                        </div>
                        <button onClick={()=>{ if(window.confirm(`Delete ${new Date(date+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})}?`)) deleteDay(date); }} style={{ width:"100%", padding:"10px", borderRadius:10, background:"none", border:`1px solid ${red}`, color:red, fontSize:12, cursor:"pointer", fontFamily:"Georgia,serif", marginTop:10 }}>
                          Delete this day
                        </button>
                      </div>
                    )}
                  </div>
                );
              })}
              {Object.keys(data.logs).length===0&&(
                <div style={{ color:textMuted, fontSize:13, textAlign:"center", padding:"20px 0" }}>No days logged yet.</div>
              )}
            </div>
          )}

          {/* SETTINGS */}
          {activeTab==="settings" && (
            <div style={{ padding:"20px 16px" }}>
              <div style={LS}>Adjust current progress</div>

              <div style={CS}>
                <div style={{ fontSize:14, fontWeight:"bold", color:text, marginBottom:4 }}>🎧 Pimsleur</div>
                <div style={{ fontSize:12, color:textMuted, marginBottom:16 }}>Set the lesson number you are currently on</div>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                  <div style={{ color:textMuted, fontSize:13 }}>Current lesson</div>
                  <Stepper value={data.pimsleurTotal||0} onChange={v=>updateCount("pimsleurTotal",v)} min={0} max={180} />
                </div>
              </div>

              <div style={CS}>
                <div style={{ fontSize:14, fontWeight:"bold", color:text, marginBottom:4 }}>🎙️ Inner French</div>
                <div style={{ fontSize:12, color:textMuted, marginBottom:16 }}>Set the episode number you are currently on</div>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                  <div style={{ color:textMuted, fontSize:13 }}>Current episode</div>
                  <Stepper value={data.innerFrenchTotal||0} onChange={v=>updateCount("innerFrenchTotal",v)} min={0} max={200} />
                </div>
              </div>

              {saved&&<div style={{ textAlign:"center", marginTop:4, marginBottom:16, color:green, fontSize:12, letterSpacing:2 }}>✓ SAVED</div>}

              <div style={{ borderTop:`1px solid ${border}`, paddingTop:20, marginTop:8 }}>
                <div style={LS}>Danger zone</div>
                <button onClick={()=>{
                  if(window.confirm("Reset ALL data? This cannot be undone.")) {
                    const fresh = { startDate: localDateKey(new Date()), logs:{}, comprehensionLog:[], pimsleurTotal:0, innerFrenchTotal:0 };
                    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh)); } catch(e) {}
                    setData(fresh);
                    setTodayLog({pimsleur:false,anki:false,innerFrench:false,workout:null,comprehension:""});
                    setShowCompForm(false);
                    setShowWorkoutPicker(false);
                    setSaved(true); setTimeout(()=>setSaved(false),1500);
                  }
                }} style={{ width:"100%", padding:"14px", borderRadius:14, background:"none", border:`1px solid ${red}`, color:red, fontSize:14, cursor:"pointer", fontFamily:"Georgia,serif" }}>
                  Reset all data
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
