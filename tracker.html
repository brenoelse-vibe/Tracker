        const nextLog = { ...curLog, workout: derivedType };
        update({ workoutSessions: nextWS, logs: { ...data.logs, [date]: nextLog } });
        if (date === today) setTodayLog(prev => ({ ...prev, workout: derivedType }));
      };

      // Pre-fill an exercise list for a type from the most recent prior sets.
      const buildExercisesForType = typeKey => {
        const exNames = getExercisesForType(data, typeKey);
        const recentByName = {};
        Object.entries(data.workoutSessions||{})
          .sort((a,b) => b[0].localeCompare(a[0]))
          .forEach(([_, arr]) => {
            (arr||[]).forEach(sess => (sess.exercises||[]).forEach(e => {
              if (recentByName[e.name]) return;
              if ((e.sets||[]).length === 0) return;
              recentByName[e.name] = e.sets;
            }));
          });
        return exNames.map((name, i) => {
          const recent = recentByName[name];
          return {
            id: `${typeKey}_${i}_${name}_${Math.random().toString(36).slice(2,6)}`,
            name,
            sets: recent ? recent.map(s => ({ weight: s.weight||0, reps: s.reps||0 })) : [],
            notes: "",
            done: false,
          };
        });
      };

      // Start a NEW session for today (allows multiple per day). Returns its id.
      const startSession = typeKey => {
        const sess = {
          id: makeSessionId(),
          type: typeKey,
          exercises: buildExercisesForType(typeKey),
          startedAt: Date.now(),
          endedAt: null,
        };
        writeSessions(today, [...todaySessions, sess]);
        setActiveSessionId(sess.id);
        return sess.id;
      };

      // From the picker: reopen today's existing session of this type if one exists,
      // otherwise start a fresh one. Prevents clobbering already-logged sets.
      const openOrStartSession = typeKey => {
        const existing = todaySessions.find(s => s.type === typeKey);
        if (existing) { setActiveSessionId(existing.id); setForcePicker(false); return existing.id; }
        const id = startSession(typeKey);
        setForcePicker(false);
        return id;
      };

      const deleteSession = (date, sessionId) => {
        writeSessions(date, sessionsOn(date).filter(s => s.id !== sessionId));
        if (sessionId === activeSessionId) setActiveSessionId(null);
      };

      // Apply a fn to the active session's exercises array.
      const mapExercises = fn => {
        if (!activeSession) return;
        const next = todaySessions.map(s =>
          s.id === activeSession.id ? { ...s, exercises: s.exercises.map(fn) } : s);
        writeSessions(today, next);
      };

      // Remove an exercise from the CURRENT session only (library/presets unaffected).
      const removeExerciseFromSession = exId => {
        if (!activeSession) return;
        const next = todaySessions.map(s =>
          s.id === activeSession.id ? { ...s, exercises: s.exercises.filter(e => e.id !== exId) } : s);
        writeSessions(today, next);
      };

      const addSet = exId => mapExercises(e =>
        e.id===exId ? { ...e, sets: [...e.sets, { weight:0, reps:0 }] } : e);

      const removeSet = (exId, idx) => mapExercises(e => {
        if (e.id !== exId) return e;
        const sets = e.sets.filter((_,i) => i!==idx);
        const allDone = sets.length > 0 && sets.every(st => st.done);
        return { ...e, sets, done: allDone };
      });

      const setSetValue = (exId, idx, field, val) => mapExercises(e =>
        e.id===exId
          ? { ...e, sets: e.sets.map((st,i) => i===idx ? { ...st, [field]: val } : st) }
          : e);

      // Toggle a single set's done flag; exercise.done auto-syncs to "all sets done".
      const toggleSetDone = (exId, idx) => {
        let wasDone = false;
        const ex = activeSession && activeSession.exercises.find(e => e.id===exId);
        if (ex && ex.sets[idx]) wasDone = !!ex.sets[idx].done;
        mapExercises(e => {
          if (e.id !== exId) return e;
          const sets = e.sets.map((st,i) => i===idx ? { ...st, done: !st.done } : st);
          const allDone = sets.length > 0 && sets.every(st => st.done);
          return { ...e, sets, done: allDone };
        });
      };

      // Most recent prior session's raw exercise object (unfiltered sets) for this exercise.
      // Scans across all days and all sessions, newest first, excluding the active session.
      const getPreviousExercise = exName => {
        const sessions = data.workoutSessions || {};
        const dates = Object.keys(sessions).sort(); // oldest→newest
        for (let i = dates.length - 1; i >= 0; i--) {
          const arr = sessions[dates[i]] || [];
          // within a day, later sessions are newer
          for (let j = arr.length - 1; j >= 0; j--) {
            if (activeSession && arr[j].id === activeSession.id) continue;
            const ex = (arr[j].exercises || []).find(e => e.name === exName && (e.sets||[]).length > 0);
            if (ex) return ex;
          }
        }
        return null;
      };

      // Look up the same set index from this exercise's most recent prior session.
      const getPreviousSet = (exName, idx) => {
        const ex = getPreviousExercise(exName);
        return ex && ex.sets[idx] ? ex.sets[idx] : null;
      };

      const updateExerciseNotes = (exId, notes) => mapExercises(e =>
        e.id===exId ? { ...e, notes } : e);

      const moveExercise = (exId, dir) => {
        if (!activeSession) return;
        const cur = activeSession;
        const idx = cur.exercises.findIndex(e => e.id===exId);
        const newIdx = idx + dir;
        if (idx<0 || newIdx<0 || newIdx>=cur.exercises.length) return;
        const arr = [...cur.exercises];
        [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
        const nextSessions = todaySessions.map(s => s.id===cur.id ? { ...s, exercises: arr } : s);
        update({
          exerciseOrder: { ...(data.exerciseOrder||{}), [cur.type]: arr.map(e => e.name) },
          workoutSessions: { ...(data.workoutSessions||{}), [today]: nextSessions },
        });
      };

      // Move an exercise from one index to another (for drag reorder).
      const reorderExercise = (fromIdx, toIdx) => {
        if (!activeSession) return;
        const cur = activeSession;
        if (fromIdx===toIdx || fromIdx<0 || toIdx<0 || fromIdx>=cur.exercises.length || toIdx>=cur.exercises.length) return;
        const arr = [...cur.exercises];
        const [m] = arr.splice(fromIdx, 1);
        arr.splice(toIdx, 0, m);
        const nextSessions = todaySessions.map(s => s.id===cur.id ? { ...s, exercises: arr } : s);
        update({
          exerciseOrder: { ...(data.exerciseOrder||{}), [cur.type]: arr.map(e => e.name) },
          workoutSessions: { ...(data.workoutSessions||{}), [today]: nextSessions },
        });
      };

      // Helper for exercise-library mutations: rewrite the active session's exercises if it matches typeKey.
      const sessionsWithActivePatched = (typeKey, exFn) => {
        if (!activeSession || activeSession.type !== typeKey) return null;
        return todaySessions.map(s => s.id===activeSession.id ? { ...s, exercises: exFn(s.exercises) } : s);
      };

      const addCustomExercise = (typeKey, name) => {
        const trimmed = name.trim();
        if (!trimmed) return;
        // Don't add a duplicate if it's already in the current session.
        if (activeSession && activeSession.type === typeKey &&
            (activeSession.exercises||[]).some(e => e.name.toLowerCase() === trimmed.toLowerCase())) return;
        const cur = (data.customExercises||{})[typeKey] || [];
        const isKnown = cur.includes(trimmed) || (EXERCISE_PRESETS[typeKey]||[]).includes(trimmed);
        // Only register it as a new custom library entry if it isn't already known.
        const patch = isKnown
          ? {}
          : { customExercises: { ...(data.customExercises||{}), [typeKey]: [...cur, trimmed] } };
        // Always add it to the active session (this is the part that was being skipped).
        const ns = sessionsWithActivePatched(typeKey, exs => [...exs, { id:`${typeKey}_ex_${Date.now()}`, name:trimmed, sets:[], notes:"", done:false }]);
        if (ns) patch.workoutSessions = { ...(data.workoutSessions||{}), [today]: ns };
        if (Object.keys(patch).length) update(patch);
      };

      const renameExercise = (typeKey, oldName, newName) => {
        const trimmed = newName.trim();
        if (!trimmed || trimmed === oldName) return;
        const presets = EXERCISE_PRESETS[typeKey] || [];
        const renames = (data.renamedPresets||{})[typeKey] || {};
        const customs = (data.customExercises||{})[typeKey] || [];
        const originalPreset = presets.find(p => (renames[p] || p) === oldName);
        const patch = {};
        if (originalPreset) {
          patch.renamedPresets = { ...(data.renamedPresets||{}), [typeKey]: { ...renames, [originalPreset]: trimmed } };
        } else {
          patch.customExercises = { ...(data.customExercises||{}), [typeKey]: customs.map(c => c===oldName ? trimmed : c) };
        }
        const order = (data.exerciseOrder||{})[typeKey] || [];
        if (order.includes(oldName)) {
          patch.exerciseOrder = { ...(data.exerciseOrder||{}), [typeKey]: order.map(o => o===oldName ? trimmed : o) };
        }
        const ns = sessionsWithActivePatched(typeKey, exs => exs.map(e => e.name===oldName ? { ...e, name:trimmed } : e));
        if (ns) patch.workoutSessions = { ...(data.workoutSessions||{}), [today]: ns };
        update(patch);
      };

      const restorePreset = (typeKey, originalName) => {
        const hidden = (data.hiddenPresets||{})[typeKey] || [];
        update({ hiddenPresets: { ...(data.hiddenPresets||{}), [typeKey]: hidden.filter(h => h!==originalName) } });
      };

      // ─── Action: todos ──────────────────────────────────────────────────
      const PRIORITY_LABELS = { high: "High", med: "Medium", low: "Low" };
      const PRIORITY_COLORS = { high: C.accent, med: "#e8b86a", low: "#a8b894" };

      const newTodoId = () => `t_${Date.now()}_${Math.floor(Math.random()*1000)}`;

      const updateTodo = (id, patch) => {
        const todos = (data.todos||[]).map(t => t.id===id ? { ...t, ...patch } : t);
        update({ todos });
      };

      const toggleTodo = id => {
        const todos = (data.todos||[]).map(t => {
          if (t.id !== id) return t;
          const willBeDone = !t.done;
          return { ...t, done: willBeDone, doneAt: willBeDone ? today : null };
        });
        update({ todos });
      };

      const deleteTodo = id => {
        const todos = (data.todos||[]).filter(t => t.id !== id);
        update({ todos });
        setTodoSwipedId(null);
        setTodoExpandedId(null);
      };

      // Date helpers for grouping

      // ─── Export & Reset ─────────────────────────────────────────────────
      const exportCSV = () => {
        // Export full data as multi-sheet XLSX workbook.
        // Fallback to CSV if SheetJS didn't load.
        if (typeof XLSX === "undefined") {
          window.alert("Export library didn't load. Try refreshing the page and exporting again.");
          return;
        }

        const customs = data.customHabits || [];

        const dateFmt = (key) => {
          const d = new Date(key+"T12:00:00");
          return formatDate(key,{weekday:"short", year:"numeric", month:"short", day:"numeric"});
        };

        // ─── SHEET 1: Daily Logs ─────────────────────────────────────
        const dailyRows = [];
        const dailyHeader = [
          "Date", "Day of Week", "ISO Week",
          "Workout Type",
          ...customs.map(h => h.label),
          "Habits Logged", "Total Habits",
        ];
        dailyRows.push(dailyHeader);

        const allActiveCount = (() => {
          const hb = (data.hiddenBuiltins||[]);
          const workoutActive = hb.includes("workout") ? 0 : 1;
          return customs.length + workoutActive;
        })();

        Object.keys(data.logs).sort().forEach(d => {
          const l = data.logs[d] || {};
          const date = new Date(d+"T12:00:00");
          const dow = date.toLocaleDateString("en-US",{weekday:"long"});
          const wk = getISOWeek(date);
          const logged =
            (l.workout?1:0) +
            customs.reduce((sum,h)=>sum+(l[h.key]?1:0), 0);
          dailyRows.push([
            d, dow, wk,
            l.workout || "",
            ...customs.map(h => l[h.key] ? "Yes" : ""),
            logged, allActiveCount,
          ]);
        });

        // ─── SHEET 2: Workout Sets (exploded) ─────────────────────────
        const setsHeader = ["Date", "Day of Week", "Session #", "Workout Type", "Exercise", "Order", "Set #", "Weight (lb)", "Reps", "Rest (s)", "Set Done", "Exercise Done", "Notes"];
        const setsRows = [setsHeader];
        const sessions = data.workoutSessions || {};
        Object.keys(sessions).sort().forEach(d => {
          const arr = sessions[d] || [];
          const dow = new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"});
          arr.forEach((s, sIdx) => {
            const typeLabel = (WORKOUT_TYPES.find(t => t.key===s.type)||{}).label || s.type;
            (s.exercises||[]).forEach((ex, exIdx) => {
              if (!ex.sets || ex.sets.length === 0) {
                if (ex.done || ex.notes) {
                  setsRows.push([d, dow, sIdx+1, typeLabel, ex.name, exIdx+1, "", "", "", "", "", ex.done?"Yes":"", ex.notes||""]);
                }
              } else {
                ex.sets.forEach((set, setIdx) => {
                  setsRows.push([
                    d, dow, sIdx+1, typeLabel, ex.name, exIdx+1, setIdx+1,
                    set.weight || 0, set.reps || 0,
                    (set.rest ?? "") === "" ? "" : set.rest,
                    set.done ? "Yes" : "",
                    ex.done ? "Yes" : "",
                    setIdx === 0 ? (ex.notes||"") : "",
                  ]);
                });
              }
            });
          });
        });

        // ─── SHEET 3: Workout Sessions Summary ───────────────────────
        const sessSummaryHeader = ["Date", "Day of Week", "Session #", "Workout Type", "# Exercises", "# Exercises Done", "Total Sets", "Total Volume (lb)"];
        const sessSummaryRows = [sessSummaryHeader];
        Object.keys(sessions).sort().forEach(d => {
          const arr = sessions[d] || [];
          const dow = new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"});
          arr.forEach((s, sIdx) => {
            const typeLabel = (WORKOUT_TYPES.find(t => t.key===s.type)||{}).label || s.type;
            const doneCount = (s.exercises||[]).filter(e => e.done).length;
            const totalSets = (s.exercises||[]).reduce((acc,e) => acc + (e.sets||[]).length, 0);
            const volume = (s.exercises||[]).reduce((acc,e) =>
              acc + (e.sets||[]).reduce((sum,st) => sum + (st.weight||0)*(st.reps||0), 0), 0);
            sessSummaryRows.push([d, dow, sIdx+1, typeLabel, (s.exercises||[]).length, doneCount, totalSets, Math.round(volume)]);
          });
        });

        // ─── SHEET 4: Todos ──────────────────────────────────────────
        const todoHeader = ["ID", "Title", "Due Date", "Priority", "Status", "Completed Date", "Created Date", "Notes"];
        const todoRows = [todoHeader];
        const allTodos = (data.todos||[]).slice().sort((a,b) => (a.createdAt||"").localeCompare(b.createdAt||""));
        allTodos.forEach(t => {
          todoRows.push([
            t.id, t.title,
            t.dueDate || "",
            t.priority || "",
            t.done ? "Completed" : "Active",
            t.doneAt || "",
            t.createdAt || "",
            t.notes || "",
          ]);
        });

        // ─── SHEET 5: Summary ────────────────────────────────────────
        const summaryRows = [
          ["Export generated", new Date().toLocaleString()],
          ["User", user?.email || ""],
          [],
          ["Current streak (days)", streak],
          ["Day of year", dayCount],
          ["ISO week", getISOWeek(new Date())],
          [],
          ["Days logged", Object.keys(data.logs||{}).length],
          ["Workout sessions logged", Object.keys(data.workoutSessions||{}).length],
          ["Active todos", (data.todos||[]).filter(t=>!t.done).length],
          ["Completed todos", (data.todos||[]).filter(t=>t.done).length],
          ["Custom habits", customs.length],
        ];

        // Build workbook
        const wb = XLSX.utils.book_new();
        const addSheet = (name, rows) => {
          const ws = XLSX.utils.aoa_to_sheet(rows);
          // auto-size columns based on the longest cell per column
          const colWidths = [];
          rows.forEach(r => {
            r.forEach((cell, i) => {
              const len = String(cell ?? "").length;
              if (!colWidths[i] || len > colWidths[i]) colWidths[i] = len;
            });
          });
          ws["!cols"] = colWidths.map(w => ({ wch: Math.min(Math.max(w+2, 10), 40) }));
          XLSX.utils.book_append_sheet(wb, ws, name);
        };

        addSheet("Summary", summaryRows);
        addSheet("Daily Logs", dailyRows);
        addSheet("Workout Sets", setsRows);
        addSheet("Workout Sessions", sessSummaryRows);
        addSheet("Todos", todoRows);

        XLSX.writeFile(wb, `tracker-export-${today}.xlsx`);
      };

      const resetAllData = () => {
        if (!window.confirm("Reset ALL data? This cannot be undone.")) return;
        const fresh = { ...DEFAULT_DATA, startDate: today };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh)); } catch(e) {}
        if (user && window.__firebase) window.__firebase.saveData(user.uid, fresh);
        setData(fresh);
        setTodayLog(blankLog());
        setShowWorkoutPicker(false);
        setSaved(true);
        setTimeout(() => setSaved(false), 1500);
      };

      // ─── Year grid computation ──────────────────────────────────────────
      const yearGrid = useMemo(() => {
        const todayDate = new Date();
        const year = todayDate.getFullYear();
        const startDate = new Date(year, 0, 1);
        while (startDate.getDay() !== 0) startDate.setDate(startDate.getDate()-1);
        const endDate = new Date(todayDate.getFullYear(), todayDate.getMonth()+12, todayDate.getDate());
        const weeks = [];
        let current = [], cursor = new Date(startDate);
        while (cursor <= endDate || current.length > 0) {
          const dateKey = localDateKey(cursor);
          const log = data.logs[dateKey];
          const customCount = log ? (data.customHabits||[]).filter(h => log[h.key]).length : 0;
          const count = log
            ? (log.workout?1:0)+customCount
            : 0;
          const d = cursor.getDate(), m = cursor.getMonth();
          current.push({
            date: dateKey, count, month: m, day: d, year: cursor.getFullYear(),
            isFuture: cursor > todayDate,
            isToday: dateKey === today,
            hasHabit: log ? customCount>0 : false,
            hasWorkout: log ? !!log.workout : false,
            label: (d===1 && m===0) ? String(cursor.getFullYear()).slice(2) : ([1,10,20,30].includes(d) ? String(d) : ""),
          });
          if (current.length === 7) {
            const monday = new Date(current[1].date+"T12:00:00");
            weeks.push({ days: current, weekNum: getISOWeek(monday) });
            current = [];
          }
          cursor.setDate(cursor.getDate()+1);
          if (weeks.length > 120) break;
        }
        if (current.length > 0) {
          while (current.length < 7) current.push({ isFuture:true, count:0, label:"" });
          weeks.push({ days: current, weekNum: 0 });
        }
        return weeks;
      }, [data.logs, data.customHabits, today]);

      const heatColor = cell => {
        if (cell.isFuture) return HEAT.future;
        if (cell.hasWorkout && !cell.hasHabit) return C.workoutOnly;
        return HEAT[Math.min(cell.count, 4)] || HEAT[0];
      };

      const yearStats = useMemo(() => {
        const logs = Object.values(data.logs);
        return {
          active: logs.filter(l => hasAnyHabit(l, data.customHabits)).length,
          full: logs.filter(l => l.workout && (data.customHabits||[]).length > 0 && (data.customHabits||[]).every(h => l[h.key])).length,
          workouts: Object.values(data.workoutSessions||{}).reduce((a, arr) => a + (arr||[]).length, 0),
        };
      }, [data.logs, data.customHabits, data.workoutSessions]);



      // Exit exercise wiggle/edit mode when navigating away (tab change or session change).
      useEffect(() => { setWigIdx(null); setDrag(null); setCurrentExId(null); }, [activeTab, activeSessionId]);

      // Exit wiggle/edit mode when tapping anywhere outside the pressed exercise tile.
      // (Tapping its own sets/whitespace stays; the delete badge and Done handle themselves.)
      useEffect(() => {
        if (wigIdx==null) return;
        const onDocDown = (e) => {
          if (drag) return;
          if (e.target.closest && (e.target.closest("[data-wig]") || e.target.closest("[data-wig-done]"))) return;
          setWigIdx(null);
        };
        document.addEventListener("pointerdown", onDocDown, true);
        return () => document.removeEventListener("pointerdown", onDocDown, true);
      }, [wigIdx, drag]);

      // Exercise drag-reorder window listeners (handlers assigned after gate).
      const dragHandlersRef = useRef({ move:()=>{}, end:()=>{} });
      useEffect(() => {
        if (!drag) return;
        const mv = e => dragHandlersRef.current.move(e);
        const up = () => dragHandlersRef.current.end();
        window.addEventListener("touchmove", mv, { passive:false });
        window.addEventListener("touchend", up);
        window.addEventListener("mousemove", mv);
        window.addEventListener("mouseup", up);
        return () => { window.removeEventListener("touchmove", mv); window.removeEventListener("touchend", up); window.removeEventListener("mousemove", mv); window.removeEventListener("mouseup", up); };
      }, [drag]);


      // ─── Gates ──────────────────────────────────────────────────────────
      if (authLoading) return (
        <div style={{ display:"flex", alignItems:"center", justifyContent:"center", minHeight:"100vh", flexDirection:"column", gap:16 }}>
          <div style={{ fontSize:28 }}>📊</div>
          <div style={{ fontSize:13, color:C.textMuted, letterSpacing:2, textTransform:"uppercase", fontWeight:600 }}>Loading…</div>
        </div>
      );

      if (!user) {
        const inputStyle = {
          width: "100%",
          background: "#ffffff",
          border: `1px solid ${C.border}`,
          borderRadius: 12,
          padding: "12px 14px",
          fontSize: 15,
          color: C.text,
          fontFamily: "Inter,sans-serif",
          fontWeight: 500,
          outline: "none",
          marginBottom: 10,
        };
        const primaryBtn = {
          width: "100%",
          background: `${C.accent}`,
          border: "none", borderRadius: 12, padding: "13px 20px",
          color: "#fff", fontSize: 14, fontWeight: 700, letterSpacing: 0.4,
          cursor: "pointer", fontFamily: "Inter,sans-serif",
          boxShadow:"none",
        };
        const ghostBtn = {
          background: "none", border: "none", color: C.textMuted,
          fontSize: 12, fontWeight: 600, padding: "8px 4px", cursor: "pointer",
          fontFamily: "Inter,sans-serif", letterSpacing: 0.2,
        };

        const handleEmailSignIn = async () => {
          setLoginError(""); setLoginBusy(true);
          const r = await window.__firebase.signInWithEmail(loginEmail.trim(), loginPassword);
          setLoginBusy(false);
          if (!r.ok) setLoginError(r.error);
        };
        const handleCreate = async () => {
          setLoginError(""); setLoginBusy(true);
          const r = await window.__firebase.createWithEmail(loginEmail.trim(), loginPassword);
          setLoginBusy(false);
          if (!r.ok) setLoginError(r.error);
        };
        const handleReset = async () => {
          setLoginError(""); setLoginInfo(""); setLoginBusy(true);
          const r = await window.__firebase.sendPasswordReset(loginEmail.trim());
          setLoginBusy(false);
          if (!r.ok) setLoginError(r.error);
          else setLoginInfo("Check your inbox for a reset link.");
        };

        return (
          <div style={{ display:"flex", alignItems:"center", justifyContent:"center", minHeight:"100vh", flexDirection:"column", gap:20, padding:32, maxWidth:380, margin:"0 auto" }}>
            <div style={{ textAlign:"center" }}>
              <div style={{ width:42, height:42, background:`${C.accent}`, borderRadius:12, color:"#fff", display:"inline-flex", alignItems:"center", justifyContent:"center", fontFamily:"'Inter',sans-serif", fontWeight:700, fontSize:22, marginBottom:14 }}>B</div>
              <div style={{ fontFamily:"'Inter',sans-serif", fontSize:30, fontWeight:600, color:C.text, letterSpacing:-1 }}>Tracker</div>
              <div style={{ fontSize:13, color:C.textMuted, marginTop:8, fontWeight:500 }}>
                {loginMode === "choose" && "Sign in to sync your data across devices"}
                {loginMode === "signin" && "Sign in with your email"}
                {loginMode === "create" && "Create a new email account"}
                {loginMode === "reset"  && "Reset your password"}
              </div>
            </div>

            {/* CHOOSE: Google + email entry point */}
            {loginMode === "choose" && (
              <div style={{ width:"100%", display:"flex", flexDirection:"column", gap:10 }}>
                <button onClick={()=>window.__firebase.signIn()} style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:12, background:"#ffffff", border:"none", borderRadius:12, padding:"14px 24px", fontSize:15, color:C.text, fontWeight:600, cursor:"pointer", fontFamily:"Inter,sans-serif", boxShadow:"none" }}>
                  <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                  Continue with Google
                </button>
                <div style={{ display:"flex", alignItems:"center", gap:10, margin:"4px 0", color:C.mutedGray, fontSize:10, letterSpacing:2, textTransform:"uppercase", fontWeight:600 }}>
                  <div style={{ flex:1, height:1, background:"rgba(140,126,106,0.2)" }}/>
                  or
                  <div style={{ flex:1, height:1, background:"rgba(140,126,106,0.2)" }}/>
                </div>
                <button onClick={()=>{ setLoginMode("signin"); setLoginError(""); setLoginInfo(""); }} style={{ background:"#ffffff", border:`1px solid ${C.border}`, borderRadius:12, padding:"13px 20px", color:C.text, fontSize:14, fontWeight:600, cursor:"pointer", fontFamily:"Inter,sans-serif" }}>
                  Sign in with email
                </button>
              </div>
            )}

            {/* EMAIL SIGN-IN form */}
            {loginMode === "signin" && (
              <div style={{ width:"100%" }}>
                <input type="email" placeholder="Email" autoComplete="email" autoCapitalize="off"
                  value={loginEmail} onChange={e=>setLoginEmail(e.target.value)} style={inputStyle}/>
                <input type="password" placeholder="Password" autoComplete="current-password"
                  value={loginPassword} onChange={e=>setLoginPassword(e.target.value)}
                  onKeyDown={e=>{ if (e.key==="Enter") handleEmailSignIn(); }} style={inputStyle}/>
                {loginError && <div style={{ fontSize:11, color:C.red, marginBottom:10, fontWeight:500 }}>{loginError}</div>}
                <button onClick={handleEmailSignIn} disabled={loginBusy || !loginEmail || !loginPassword} style={{ ...primaryBtn, opacity: (loginBusy || !loginEmail || !loginPassword) ? 0.5 : 1, cursor: loginBusy ? "wait" : "pointer" }}>
                  {loginBusy ? "SIGNING IN…" : "SIGN IN"}
                </button>
                <div style={{ display:"flex", justifyContent:"space-between", marginTop:8 }}>
                  <button onClick={()=>{ setLoginMode("choose"); setLoginError(""); setLoginInfo(""); }} style={ghostBtn}>← Back</button>
                  <button onClick={()=>{ setLoginMode("reset"); setLoginError(""); setLoginInfo(""); }} style={ghostBtn}>Forgot password?</button>
                </div>
                <div style={{ textAlign:"center", marginTop:18, fontSize:11, color:C.textMuted }}>
                  Don't have an email account yet?{" "}
                  <span onClick={()=>{ setLoginMode("create"); setLoginError(""); setLoginInfo(""); }} style={{ color:C.accent, fontWeight:700, cursor:"pointer" }}>Create one</span>
                </div>
              </div>
            )}

            {/* CREATE form */}
            {loginMode === "create" && (
              <div style={{ width:"100%" }}>
                <div style={{ background:C.accentTint, border:`1px solid ${C.borderActive}`, borderRadius:10, padding:"10px 12px", marginBottom:14, fontSize:11, color:C.text, fontWeight:500, lineHeight:1.5 }}>
                  <strong style={{color:C.accent}}>Note:</strong> This creates a brand-new, empty account. If you want to add email login to your existing Google account, sign in with Google first and link email from Settings.
                </div>
                <input type="email" placeholder="Email" autoComplete="email" autoCapitalize="off"
                  value={loginEmail} onChange={e=>setLoginEmail(e.target.value)} style={inputStyle}/>
                <input type="password" placeholder="Password (min 6 characters)" autoComplete="new-password"
                  value={loginPassword} onChange={e=>setLoginPassword(e.target.value)}
                  onKeyDown={e=>{ if (e.key==="Enter") handleCreate(); }} style={inputStyle}/>
                {loginError && <div style={{ fontSize:11, color:C.red, marginBottom:10, fontWeight:500 }}>{loginError}</div>}
                <button onClick={handleCreate} disabled={loginBusy || !loginEmail || !loginPassword || loginPassword.length < 6} style={{ ...primaryBtn, opacity: (loginBusy || !loginEmail || !loginPassword || loginPassword.length<6) ? 0.5 : 1, cursor: loginBusy ? "wait" : "pointer" }}>
                  {loginBusy ? "CREATING…" : "CREATE ACCOUNT"}
                </button>
                <div style={{ marginTop:8 }}>
                  <button onClick={()=>{ setLoginMode("choose"); setLoginError(""); setLoginInfo(""); }} style={ghostBtn}>← Back</button>
                </div>
              </div>
            )}

            {/* RESET form */}
            {loginMode === "reset" && (
              <div style={{ width:"100%" }}>
                <div style={{ fontSize:12, color:C.textMuted, marginBottom:12, lineHeight:1.5 }}>Enter your email and we'll send you a link to reset your password.</div>
                <input type="email" placeholder="Email" autoComplete="email" autoCapitalize="off"
                  value={loginEmail} onChange={e=>setLoginEmail(e.target.value)} style={inputStyle}/>
                {loginError && <div style={{ fontSize:11, color:C.red, marginBottom:10, fontWeight:500 }}>{loginError}</div>}
                {loginInfo && <div style={{ fontSize:11, color:C.greenText, marginBottom:10, fontWeight:600 }}>{loginInfo}</div>}
                <button onClick={handleReset} disabled={loginBusy || !loginEmail} style={{ ...primaryBtn, opacity: (loginBusy || !loginEmail) ? 0.5 : 1, cursor: loginBusy ? "wait" : "pointer" }}>
                  {loginBusy ? "SENDING…" : "SEND RESET LINK"}
                </button>
                <div style={{ marginTop:8 }}>
                  <button onClick={()=>{ setLoginMode("signin"); setLoginError(""); setLoginInfo(""); }} style={ghostBtn}>← Back to sign in</button>
                </div>
              </div>
            )}
          </div>
        );
      }

      // ─── Header + Tabs ──────────────────────────────────────────────────
      const renderHeader = () => (
        <div style={{ padding:"20px 18px 12px" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ width:26, height:26, background:C.ink, borderRadius:7, color:"#fff", display:"inline-flex", alignItems:"center", justifyContent:"center", fontFamily:"'Inter',sans-serif", fontWeight:800, fontSize:13, letterSpacing:-0.5 }}>B</span>
              <span style={{ fontSize:14, fontWeight:700, color:C.ink, letterSpacing:-0.3 }}>tracker</span>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ display:"inline-flex", alignItems:"center", gap:5, background: syncing?"#fdf0d4":C.accentTint, color: syncing?"#8a5a0d":C.accentDeep, padding:"4px 9px", borderRadius:6, fontSize:10, fontWeight:600, letterSpacing:0.3 }}>
                <span style={{ width:5, height:5, background: syncing?"#e0a020":C.accent, borderRadius:"50%" }}/>
                {syncing ? "SYNCING" : "SYNCED"}
              </span>
              <span onClick={()=>window.__firebase.signOut()} style={{ fontSize:10, color:C.textMuted, cursor:"pointer", textDecoration:"underline", fontWeight:500 }}>Sign out</span>
            </div>
          </div>
        </div>
      );

      const tabStyle = active => ({
        flex:1, padding:"6px 4px 4px", background:"none", border:"none",
        color: active?C.accentDeep:C.mutedGray,
        cursor:"pointer", fontFamily:"Inter,sans-serif",
        display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:2,
        position:"relative",
      });

      // Floating rest countdown — pinned just above the bottom nav.
      const renderRestBar = () => {
        if (!restEndAt && !restDone) return null;
        const remaining = restRemaining;
        const progress = restDuration > 0 ? Math.max(0, Math.min(1, remaining/restDuration)) : 0;
        return (
          <div style={{
            position:"fixed", left:10, right:10, zIndex:101,
            bottom:"calc(78px + env(safe-area-inset-bottom, 0px))",
            maxWidth:410, margin:"0 auto",
            display:"flex", alignItems:"center", gap:12,
            background: restDone ? C.accentBright : C.ink,
            borderRadius:14, padding:"12px 14px",
            transition:"background 0.3s ease",
          }}>
            {restDone ? (
              <div style={{ flex:1, color:"#fff", fontSize:15, fontWeight:800, letterSpacing:-0.3 }}>Rest done 💪</div>
            ) : (
              <>
                <div style={{ minWidth:54 }}>
                  <div style={{ fontSize:22, fontWeight:800, color:"#fff", letterSpacing:-0.5, fontVariantNumeric:"tabular-nums", lineHeight:1 }}>{fmtClock(remaining)}</div>
                  <div style={{ fontSize:10, color:"rgba(255,255,255,0.6)", fontWeight:600, marginTop:2 }}>Rest</div>
                </div>
                <div style={{ flex:1, height:4, background:"rgba(255,255,255,0.18)", borderRadius:2, overflow:"hidden" }}>
                  <div style={{ height:"100%", width:`${progress*100}%`, background:C.accentBright, borderRadius:2, transition:"width 0.25s linear" }} />
                </div>
                <button onClick={()=>addRest(15)} style={{ background:"rgba(255,255,255,0.14)", border:"none", color:"#fff", fontSize:11, fontWeight:700, borderRadius:8, padding:"7px 10px", cursor:"pointer", fontFamily:"Inter,sans-serif" }}>+15s</button>
                <button onClick={skipRest} style={{ background:"rgba(255,255,255,0.14)", border:"none", color:"#fff", fontSize:11, fontWeight:700, borderRadius:8, padding:"7px 10px", cursor:"pointer", fontFamily:"Inter,sans-serif" }}>Skip</button>
              </>
            )}
          </div>
        );
      };

      const renderTabs = () => (
        <div style={{
          position:"fixed", bottom:0, left:0, right:0, zIndex:100,
          display:"flex", justifyContent:"center",
          pointerEvents:"none",
          padding:"0 10px",
          paddingBottom:"calc(10px + env(safe-area-inset-bottom, 0px))",
        }}>
          <div style={{
            width:"100%", maxWidth:430,
            background:C.surface,
            border:`1px solid ${C.border}`,
            borderRadius:18,
            pointerEvents:"auto",
          }}>
            <div style={{ display:"flex", padding:"8px 2px 9px" }}>
              {TABS.map(t => {
                const active = activeTab === t.key;
                const color = active ? C.accentDeep : C.mutedGray;
                return (
                  <button key={t.key} onClick={()=>setActiveTab(t.key)} style={tabStyle(active)}>
                    <div style={{ height:22, display:"flex", alignItems:"center", justifyContent:"center" }}>
                      <TabIcon name={t.key} active={active} color={color} />
                    </div>
                    <div style={{ fontSize:9, fontWeight: active?800:600, letterSpacing:0.1, lineHeight:1, marginTop:3, color }}>{t.label}</div>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );


      // ─── TAB: DAY ───────────────────────────────────────────────────────
      const renderWorkoutHabitCard = () => {
        const on = !!todayLog.workout;
        return (
        <div key="workout">
          <div style={{
            display:"grid", gridTemplateColumns:"28px 1fr auto auto", alignItems:"center", gap:15,
            padding:"17px 0",
            borderBottom:`1px solid ${C.hair}`,
          }}>
            <div style={{ fontSize:20, textAlign:"center" }}>🏋️</div>
            <div style={{ minWidth:0 }}>
              <div style={{ fontFamily:"'Source Serif 4', Georgia, serif", color: on?C.accentDeep:C.ink, fontSize:20, fontWeight: on?600:500, letterSpacing:-0.2 }}>Workout</div>
              <div style={{ color:"#b0aaa0", fontSize:12, marginTop:2, fontWeight:450 }}>
                {selectedWorkout ? `${selectedWorkout.emoji} ${selectedWorkout.label}` : "Tap to log"}
              </div>
            </div>
            <button onClick={()=>setShowWorkoutPicker(!showWorkoutPicker)} style={on ? S.pillBtnOn : S.pillBtn}>
              {on ? "CHANGE" : "LOG"}
            </button>
            <div style={{ width:0 }} />
          </div>
          {showWorkoutPicker && (
            <div style={{ padding:"4px 0 14px", display:"flex", gap:8, flexWrap:"wrap" }}>
              {WORKOUT_TYPES.map(w => {
                const active = todayLog.workout === w.key;
                return (
                  <button key={w.key} onClick={()=>selectWorkout(w.key)} style={{
                    flex:"1 1 calc(33% - 8px)", padding:"10px 6px", borderRadius:10,
                    background: active?C.accent:C.fieldBg,
                    border: "none",
                    color: active?"#fff":C.text,
                    fontSize:12, cursor:"pointer", fontFamily:"Inter,sans-serif", textAlign:"center", fontWeight:600,
                  }}>
                    <div style={{ fontSize:20 }}>{w.emoji}</div>
                    <div style={{ marginTop:4, fontWeight:700 }}>{w.label}</div>
                  </button>
                );
              })}
            </div>
          )}
        </div>
        );
      };

      const renderDayHero = () => {
        // Today completion ring
        const totalToday = allActiveHabits.length;
        const doneToday = allActiveHabits.filter(h => !!(data.logs[today]||{})[h.key]).length;
        const pctToday = totalToday > 0 ? Math.round((doneToday/totalToday)*100) : 0;

        // Last workout across all sessions (flattened), newest first.
        const allSessionsFlat = [];
        Object.entries(data.workoutSessions||{}).forEach(([d, arr]) => {
          (arr||[]).forEach(s => {
            if ((s.exercises||[]).some(e => e.done || (e.sets||[]).length > 0) || d === today) {
              allSessionsFlat.push({ date: d, type: s.type, startedAt: s.startedAt||0 });
            }
          });
        });
        allSessionsFlat.sort((a,b) => b.date.localeCompare(a.date) || (b.startedAt - a.startedAt));
        const lastWorkout = allSessionsFlat[0] ? {
          type: allSessionsFlat[0].type,
          date: allSessionsFlat[0].date,
          isToday: allSessionsFlat[0].date === today,
        } : null;
        const lastWorkoutType = lastWorkout ? WORKOUT_TYPES.find(w => w.key===lastWorkout.type) : null;
        const lastWorkoutLabel = lastWorkout ? (() => {
          if (lastWorkout.isToday) return "today";
          const d = new Date(lastWorkout.date+"T12:00:00");
          const t = new Date(today+"T12:00:00");
          const diff = Math.round((t-d)/86400000);
          if (diff === 1) return "yesterday";
          if (diff < 7) return `${diff}d ago`;
          return formatDate(lastWorkout.date, {month:"short",day:"numeric"});
        })() : null;

        // Year time week number
        const todayWeek = getISOWeek(new Date());
        const hr = new Date().getHours();
        const greeting = hr < 12 ? "Good morning," : hr < 18 ? "Good afternoon," : "Good evening,";

        // date scrubber bits
        const goRel = delta => { const d = new Date(viewDate+"T12:00:00"); d.setDate(d.getDate()+delta); setViewDate(localDateKey(d)); };
        const isToday = viewDate === today;
        const dayDiff = (() => { const d = new Date(viewDate+"T12:00:00"); const t = new Date(today+"T12:00:00"); return Math.round((t-d)/86400000); })();
        const scrubLabel = isToday ? "Today" : (dayDiff===1 ? "Yesterday" : formatDate(viewDate, {month:"short",day:"numeric"}));

        const StatCol = ({ n, unit, label }) => (
          <div>
            <div style={{ fontSize:24, fontWeight:800, letterSpacing:-1, lineHeight:1, color:C.ink }}>
              {n}{unit && <span style={{ fontSize:13, color:C.mutedGray, fontWeight:700 }}>{unit}</span>}
            </div>
            <div style={{ fontSize:11, color:C.textMuted, fontWeight:600, marginTop:6 }}>{label}</div>
          </div>
        );

        return (
          <div style={{ padding:"2px 24px 0" }}>
            {/* greeting + date scrubber */}
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", padding:"16px 0 6px" }}>
              <div style={{ fontFamily:"'Source Serif 4', Georgia, serif", fontSize:31, fontWeight:600, letterSpacing:-0.5, lineHeight:1.12, color:C.ink, paddingRight:12 }}>
                {greeting.replace(/,$/,"")}, {(data.userName||"").trim() || (user?.displayName||"").split(" ")[0] || "there"}
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:6, flexShrink:0, marginTop:6 }}>
                <button onClick={()=>goRel(-1)} style={{ background:"none", border:"none", color:C.mutedGray, cursor:"pointer", fontSize:18, padding:0, lineHeight:1 }}>‹</button>
                <span onClick={()=>setViewDate(today)} style={{ fontSize:12, fontWeight:600, color:C.textMuted, cursor: isToday?"default":"pointer", minWidth:50, textAlign:"center" }}>{scrubLabel}</span>
                <button onClick={()=>{ if (viewDate<today) goRel(1); }} style={{ background:"none", border:"none", color:C.mutedGray, cursor:"pointer", fontSize:18, padding:0, lineHeight:1, opacity: viewDate>=today?0.35:1 }}>›</button>
              </div>
            </div>
          </div>
        );
      };

      // ─── Gap diagram ────────────────────────────────────────────────────
      // Renders a radar-style polygon: each habit is an axis at an equal angle.
      // Held habits push the actual shape to the outer (ideal) radius;
      // missed habits pull that vertex toward ~30% of the radius, producing
      // a visible "gap" segment from the actual vertex out to the ideal.
      const renderGapDiagram = () => {
        const axes = allActiveHabits.map(h => ({
          key: h.key, label: h.label,
          held: !!todayLog[h.key],
        }));
        const n = axes.length;
        if (n < 3) return null; // a polygon needs three points; below that we just show the habits.

        // Wide viewBox so left/right axis labels never clip.
        const W = 360, H = 300;
        const cx = W/2, cy = 150;
        const R = 92;                 // ideal radius (outer)
        const rMiss = R * 0.34;       // where a missed apex lands
        const heldCount = axes.filter(a => a.held).length;
        const closedPct = Math.round((heldCount / n) * 100);
        const allHeld = heldCount === n;
        const noneHeld = heldCount === 0;

        // start at 12 o'clock and go clockwise
        const angleFor = i => -Math.PI/2 + (i * 2*Math.PI / n);
        const pt = (i, r) => ({ x: cx + r*Math.cos(angleFor(i)), y: cy + r*Math.sin(angleFor(i)) });
        const idealPts = axes.map((_,i) => pt(i, R));
        const actualPts = axes.map((a,i) => pt(i, a.held ? R : rMiss));
        const poly = pts => pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");

        // Axis label sits centered horizontally on its vertex; above vertices in the
        // top half, below those in the bottom half. No side-anchoring → nothing clips.
        const PAD = 6;
        const labelFor = (i) => {
          const v = idealPts[i];
          const isTop = v.y < cy - 1;
          const isSide = Math.abs(v.y - cy) <= 1;
          const y = isTop ? v.y - 14 : (isSide ? v.y - 14 : v.y + 20);
          let x = Math.max(PAD + 30, Math.min(W - PAD - 30, v.x));
          return { x, y, anchor: "middle" };
        };

        return (
          <div style={{ background:"transparent", padding:"14px 4px 6px", margin:"6px 0 0" }}>
            <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="auto" style={{ display:"block", overflow:"visible" }}>
              {/* faint reference ring */}
              <circle cx={cx} cy={cy} r={R*0.5} fill="none" stroke="#ece6db" strokeWidth="1" strokeDasharray="1 3"/>
              {/* faint cross axes */}
              <line x1={cx} y1={cy-R} x2={cx} y2={cy+R} stroke="#ece6db" strokeWidth="1"/>
              <line x1={cx-R} y1={cy} x2={cx+R} y2={cy} stroke="#ece6db" strokeWidth="1"/>

              {/* IDEAL — dashed brass, only while there's a gap */}
              {!allHeld && (
                <polygon points={poly(idealPts)} fill="none" stroke="#d3bf9f" strokeWidth="1.2" strokeDasharray="3 5" opacity="0.7"/>
              )}

              {/* ACTUAL filled shape — hidden when nothing is held (no sad blob) */}
              {!noneHeld && (
                <AnimatedPolygon targetPts={actualPts} fill={C.accentBright} fillOpacity={0.16} stroke={C.accentDeep} strokeWidth={2.2}/>
              )}

              {/* dashed gap segments on missed axes */}
              {!noneHeld && axes.map((a, i) => a.held ? null : (
                <line key={"gap-"+i} x1={actualPts[i].x} y1={actualPts[i].y} x2={idealPts[i].x} y2={idealPts[i].y}
                      stroke="#d3bf9f" strokeWidth="1.2" strokeDasharray="2 4"/>
              ))}

              {/* vertex markers: solid green = held, open brass ring = missed */}
              {axes.map((a, i) => a.held ? (
                <circle key={"v-"+i} cx={actualPts[i].x} cy={actualPts[i].y} r="6" fill={C.accentDeep}/>
              ) : (
                <circle key={"v-"+i} cx={idealPts[i].x} cy={idealPts[i].y} r="4.5" fill="none" stroke="#d3bf9f" strokeWidth="1.4"/>
              ))}

              {/* axis labels */}
              {axes.map((a, i) => {
                const l = labelFor(i);
                return (
                  <text key={"lab-"+i} x={l.x} y={l.y} textAnchor={l.anchor} dominantBaseline="middle"
                        style={{ fontFamily:"Inter, sans-serif", fontSize:"12px", fontWeight:500, fill: a.held ? C.accentDeep : "#74706a", letterSpacing:"0.1px" }}>
                    {a.label}
                  </text>
                );
              })}
            </svg>

            {/* closed % — animated count-up, hidden at 0 but height reserved. */}
            <CountUp value={closedPct} hide={closedPct === 0} />
          </div>
        );
      };

      const renderDayTab = () => {
        return (
          <div style={{ padding:"0 24px 16px" }}>
            {renderGapDiagram()}

            {allActiveHabits.map(h => {
              if (h.key === "workout") return renderWorkoutHabitCard();
              return (
                <HabitCard key={h.key}
                  active={!!todayLog[h.key]}
                  emoji={h.emoji}
                  label={h.label}
                  sublabel={h.isBuiltin && h.sublabelFn ? h.sublabelFn(data) : ""}
                  onToggle={() => toggleHabit(h.key)}
                  stepper={null} />
              );
            })}

            <button onClick={()=>setActiveTab("settings")} style={{
              display:"flex", alignItems:"center", gap:10, width:"100%", marginTop:14,
              padding:"14px 16px", borderRadius:12, background:"none",
              border:`1.5px dashed ${C.border}`, cursor:"pointer", fontFamily:"Inter,sans-serif",
              color:C.textMuted, fontSize:14, fontWeight:600,
            }}>
              <span style={{ fontSize:18, color:C.accent, fontWeight:700, lineHeight:1 }}>+</span>
              {(data.customHabits||[]).length === 0 ? "Add your first habit" : "Add a habit"}
            </button>

            <SavedToast show={saved} />
          </div>
        );
      };


      // ─── EXERCISE PROGRESS CHART ────────────────────────────────────────
      // Build per-session history for one exercise across all logged sessions.
      // Returns [{ date, volume, e1rm, top, sets:[{weight,reps}] }] sorted oldest→newest.
      const getExerciseHistory = (exName) => {
        const out = [];
        Object.entries(data.workoutSessions || {}).forEach(([date, arr]) => {
          (arr || []).forEach(sess => {
            (sess.exercises || []).forEach(e => {
              if (e.name !== exName) return;
              const sets = (e.sets || []).filter(st => (st.weight || 0) > 0 || (st.reps || 0) > 0);
              if (sets.length === 0) return;
              const volume = sets.reduce((a, st) => a + (st.weight || 0) * (st.reps || 0), 0);
              const top = sets.reduce((a, st) => Math.max(a, st.weight || 0), 0);
              const e1rm = Math.round(sets.reduce((a, st) => {
                const est = (st.weight || 0) * (1 + (st.reps || 0) / 30);
                return Math.max(a, est);
              }, 0));
              out.push({ date, volume, top, e1rm, sets, startedAt: sess.startedAt||0 });
            });
          });
        });
        return out.sort((a, b) => a.date.localeCompare(b.date) || (a.startedAt - b.startedAt));
      };

      // Direction B: refined line chart. Weight (top set) by default; switches to
      // Reps automatically for bodyweight exercises (top weight always 0). Volume
      // available as a second metric. Range filters 1M/3M/1Y; x-axis is date-proportional.
      const fmtK = v => v >= 1000 ? (v/1000).toFixed(1)+"k" : Math.round(v);
      const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

      const ExerciseChart = ({ exName }) => {
        const allHist = getExerciseHistory(exName);
        const isBodyweight = allHist.length > 0 && allHist.every(h => (h.top || 0) === 0);

        // metric definitions adapt to bodyweight
        const unit = isBodyweight ? "reps" : "lb";
        const pick = h => {
          if (chartMetric === "volume") return isBodyweight ? h.sets.reduce((a,st)=>a+(st.reps||0),0) : h.volume;
          return isBodyweight ? h.sets.reduce((a,st)=>Math.max(a,st.reps||0),0) : h.top;
        };
        const showVal = v => (chartMetric === "volume" && !isBodyweight) ? fmtK(v) : Math.round(v);

        // range filter
        const now = new Date();
        const from = new Date(now);
        if (chartRange === "1M") from.setMonth(from.getMonth()-1);
        else if (chartRange === "3M") from.setMonth(from.getMonth()-3);
        else from.setFullYear(from.getFullYear()-1);
        const fromKey = localDateKey(from);
        const history = allHist.filter(h => h.date >= fromKey);

        const Tabs = (
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
            <div style={{ display:"flex", gap:18 }}>
              {[["top", isBodyweight?"Reps":"Weight"], ["volume", isBodyweight?"Total reps":"Volume"]].map(([key,lab]) => {
                const on = chartMetric === key;
                return (
                  <button key={key} onClick={()=>setChartMetric(key)} style={{
                    background:"none", border:"none", padding:"4px 0", cursor:"pointer",
                    fontFamily:"Georgia,'Source Serif 4',serif", fontSize:15, fontWeight:700, letterSpacing:-0.2,
                    color: on?C.ink:C.mutedGray, borderBottom: on?`2px solid ${C.accent}`:"2px solid transparent",
                  }}>{lab}</button>
                );
              })}
            </div>
            <div style={{ display:"inline-flex", gap:2, background:C.fieldBg, borderRadius:9, padding:2 }}>
              {["1M","3M","1Y"].map(r => {
                const on = chartRange === r;
                return (
                  <button key={r} onClick={()=>setChartRange(r)} style={{
                    background:on?C.surface:"none", border:"none", borderRadius:7, padding:"5px 11px",
                    fontSize:10, fontWeight:700, color:on?C.ink:C.textMuted, cursor:"pointer", fontFamily:"Inter,sans-serif",
                  }}>{r}</button>
                );
              })}
            </div>
          </div>
        );

        if (history.length < 2) {
          return (
            <div style={{ marginTop:12, paddingTop:14, borderTop:`1px solid ${C.border}` }}>
              {Tabs}
              <div style={{ padding:"22px 12px", textAlign:"center", color:C.mutedGray, fontSize:13, fontWeight:600, fontFamily:"Georgia,serif", fontStyle:"italic" }}>
                {history.length === 0 ? "No history in this range yet." : "Log one more session to see a trend."}
              </div>
            </div>
          );
        }

        // geometry — date-proportional x, nice y ticks
        const vals = history.map(pick);
        let dmin = Math.min(...vals), dmax = Math.max(...vals);
        if (dmin === dmax) { const v=dmin; dmin = v - (v*0.08||3); dmax = v + (v*0.08||3); }
        // nice ticks
        const niceStep = (rng, want) => { const raw=rng/want, mag=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/mag; return (n<1.5?1:n<3?2:n<7?5:10)*mag; };
        const step = niceStep(dmax-dmin, 3);
        const lo = Math.floor(dmin/step)*step, hi = Math.ceil(dmax/step)*step;
        const ticks = []; for(let v=lo; v<=hi+1e-6; v+=step) ticks.push(+v.toFixed(2));

        const W=340, H=158, pad={l:32,r:14,t:18,b:24};
        const tmin=new Date(history[0].date).getTime(), tmax=new Date(history[history.length-1].date).getTime(), tspan=(tmax-tmin)||1;
        const X = d => pad.l + (new Date(d).getTime()-tmin)/tspan*(W-pad.l-pad.r);
        const Y = v => pad.t + (1-(v-lo)/(hi-lo))*(H-pad.t-pad.b);

        const n = history.length;
        const linePts = history.map(h => `${X(h.date).toFixed(1)} ${Y(pick(h)).toFixed(1)}`);
        const linePath = "M" + linePts.join(" L");
        const lastV = pick(history[n-1]);
        const lx = X(history[n-1].date), ly = Y(lastV);

        // x labels at month boundaries
        const seen = new Set(); let xlabs = [];
        history.forEach((h,i) => { const mo = new Date(h.date).getMonth(); if(i===0||i===n-1||!seen.has(mo)){ seen.add(mo); xlabs.push({x:X(h.date), label:MONTH_ABBR[mo]}); } });

        // facts
        const latest = history[n-1];
        const heaviestH = history.reduce((a,b)=> pick(b)>pick(a)?b:a, history[0]);
        const lastReps = (latest.sets||[]).map(st=>st.reps||0).join(",");
        const first = pick(history[0]);
        const gain = lastV - first;
        const gainTxt = (gain>=0?"↑ ":"↓ ") + showVal(Math.abs(gain)) + " " + unit;

        return (
          <div style={{ marginTop:12, paddingTop:14, borderTop:`1px solid ${C.border}` }}>
            {Tabs}
            <div style={{ fontFamily:"Georgia,'Source Serif 4',serif", fontSize:14, fontWeight:600, color:C.ink, marginBottom:6, letterSpacing:-0.2 }}>
              <span style={{ color: gain>=0?C.accentDeep:C.red, fontWeight:700 }}>{gainTxt}</span>
              <span style={{ color:C.mutedGray, fontWeight:400, fontStyle:"italic" }}> · {n} sessions</span>
            </div>
            <div style={{ margin:"4px -2px 2px" }}>
              <svg viewBox={`0 0 ${W} ${H}`} width="100%" preserveAspectRatio="xMidYMid meet" style={{ display:"block", width:"100%", height:"auto", maxHeight:170, overflow:"visible" }}>
                {ticks.map((v,i)=>(
                  <g key={i}>
                    <line x1={pad.l} y1={Y(v).toFixed(1)} x2={W-pad.r} y2={Y(v).toFixed(1)} stroke={C.hair} strokeWidth="1"/>
                    <text x={pad.l-6} y={(Y(v)+3).toFixed(1)} fontSize="9" fontWeight="600" fill={C.mutedGray} textAnchor="end" fontFamily="Inter,sans-serif">{showVal(v)}</text>
                  </g>
                ))}
                <path d={linePath} fill="none" stroke={C.accent} strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round"/>
                <circle cx={lx.toFixed(1)} cy={ly.toFixed(1)} r="4" fill={C.accentDeep}/>
                <text x={lx.toFixed(1)} y={(ly-10).toFixed(1)} fontSize="11" fontWeight="700" fill={C.ink} textAnchor="middle" fontFamily="Inter,sans-serif">{showVal(lastV)}</text>
                {xlabs.map((l,i)=>(
                  <text key={i} x={l.x.toFixed(1)} y={H-pad.b+16} fontSize="9" fill={C.mutedGray} textAnchor="middle" fontFamily="Inter,sans-serif">{l.label}</text>
                ))}
              </svg>
            </div>
            <div style={{ marginTop:10 }}>
              {[
                { k:"last session", v: isBodyweight ? `${showVal(lastV)} reps` : `${Math.round(latest.top)} lb${lastReps?` · ${lastReps}`:""}` },
                { k: isBodyweight?"best set":"heaviest", v: isBodyweight ? `${showVal(pick(heaviestH))} reps` : `${Math.round(heaviestH.top)} lb` },
              ].map((f,i)=>(
                <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", padding:"9px 0", borderBottom: i===0?`1px solid ${C.hair}`:"none" }}>
                  <span style={{ fontFamily:"Georgia,serif", fontStyle:"italic", fontSize:13.5, color:C.textMuted }}>{f.k}</span>
                  <span style={{ fontFamily:"Georgia,serif", fontSize:15, fontWeight:700, color:C.ink, fontVariantNumeric:"tabular-nums" }}>{f.v}</span>
                </div>
              ))}
            </div>
          </div>
        );
      };

      // ─── Strength session UI (push-day-live) ───────────────────────────
      // Set row: grid 26·1fr·1fr·auto, serif. Done rows show muted values; not-done
      // rows show faint underline inputs. mini-chk 27px/8r, #d9d3c8 border, #85a95f
      // fill when done. Swipe a row left to delete (transparent fg over the section).
      const renderSetRow = (exId, st, idx, rowBg) => {
        const hasW = (st.weight||0) > 0, hasR = (st.reps||0) > 0;
        const num = <div style={{ fontFamily:"Georgia,serif", fontStyle:"italic", fontSize:13, textAlign:"center", color:"#a39c8d" }}>{idx+1}</div>;
        const chk = (
          <div onClick={()=>toggleSetDone(exId,idx)} style={{
            width:27, height:27, borderRadius:8, flexShrink:0,
            background: st.done?"#85a95f":"transparent",
            border: st.done?"1.5px solid #85a95f":"1.5px solid #d9d3c8",
            display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer",
          }}>
            {st.done && <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/></svg>}
          </div>
        );
        const cell = (
          <div style={{ display:"grid", gridTemplateColumns:"24px 1fr 1fr 34px", gap:14, alignItems:"center", padding:"8px 2px 8px 0" }}>
            {num}
            {st.done ? (
              <>
                <div style={{ fontFamily:"Georgia,serif", fontSize:19, fontWeight:600, textAlign:"center", color:"#848482", fontVariantNumeric:"tabular-nums" }}>{hasW?st.weight:""}</div>
                <div style={{ fontFamily:"Georgia,serif", fontSize:19, fontWeight:600, textAlign:"center", color:"#848482", fontVariantNumeric:"tabular-nums" }}>{hasR?st.reps:""}</div>
              </>
            ) : (
              <>
                <div style={{ display:"flex", justifyContent:"center" }}>
                  <input type="number" step="0.5" value={hasW?st.weight:""} placeholder="" className="set-field"
                    onChange={e=>setSetValue(exId,idx,"weight",parseFloat(e.target.value)||0)}
                    style={{ width:"58%", minWidth:48, border:"none", borderBottom:"1.5px solid #e6e0d3", background:"transparent", textAlign:"center", fontFamily:"Georgia,serif", fontSize:21, fontWeight:600, color:"#1c1a17", padding:"6px 0", fontVariantNumeric:"tabular-nums", outline:"none", MozAppearance:"textfield" }} />
                </div>
                <div style={{ display:"flex", justifyContent:"center" }}>
                  <input type="number" step="1" value={hasR?st.reps:""} placeholder="" className="set-field"
                    onChange={e=>setSetValue(exId,idx,"reps",parseFloat(e.target.value)||0)}
                    style={{ width:"58%", minWidth:48, border:"none", borderBottom:"1.5px solid #e6e0d3", background:"transparent", textAlign:"center", fontFamily:"Georgia,serif", fontSize:21, fontWeight:600, color:"#1c1a17", padding:"6px 0", fontVariantNumeric:"tabular-nums", outline:"none", MozAppearance:"textfield" }} />
                </div>
              </>
            )}
            <div style={{ display:"flex", justifyContent:"center" }}>{chk}</div>
          </div>
        );
        return <SwipeRow key={idx} variant="flat" bg={rowBg} onDelete={()=>removeSet(exId,idx)}>{cell}</SwipeRow>;
      };

      // ── wiggle / long-press drag for exercises ──
      const beginExDrag = (exIdx, clientY) => {
        const nodes = Array.from(document.querySelectorAll("[data-exrow]"));
        dragRef.current.slots = nodes.map(n => ({ top:n.offsetTop, h:n.offsetHeight }));
        const node = nodes[exIdx];
        dragRef.current.offset = node ? (clientY - node.getBoundingClientRect().top) : 0;
        dragRef.current.fromIdx = exIdx;
        try{navigator.vibrate&&navigator.vibrate(14);}catch(_){}
        setDrag({ fromIdx:exIdx, curIdx:exIdx, y: node? node.offsetTop : 0 });
      };
      const exPressStart = (e, exIdx) => {
        if (editingExercise!=null) return;
        const pt = e.touches ? e.touches[0] : e;
        const p = exPressRef.current; p.x=pt.clientX; p.y=pt.clientY;
        clearTimeout(p.timer);
        if (wigIdx!=null) {
          if (wigIdx===exIdx) { beginExDrag(exIdx, pt.clientY); }   // this one is wiggling: grab to drag
          else { setWigIdx(null); }                                 // tapping a different one exits wiggle
          return;
        }
        p.timer = setTimeout(() => { setWigIdx(exIdx); try{navigator.vibrate&&navigator.vibrate(20);}catch(_){} beginExDrag(exIdx, pt.clientY); }, 450);
      };
      const exPressCancel = () => { clearTimeout(exPressRef.current.timer); };
      const exDragMove = (e) => {
        const p = exPressRef.current;
        const pt = e.touches ? e.touches[0] : e;
        if (p.timer && (Math.abs(pt.clientY-p.y)>8 || Math.abs(pt.clientX-p.x)>8)) { clearTimeout(p.timer); p.timer=null; }
        setDrag(cur => {
          if (!cur) return cur;
          if (e.cancelable) e.preventDefault();
          const listEl = document.querySelector("[data-exlist]");
          const listTop = listEl ? listEl.getBoundingClientRect().top : 0;
          const slots = dragRef.current.slots;
          const y = pt.clientY - listTop - dragRef.current.offset;
          const dh = slots[cur.fromIdx] ? slots[cur.fromIdx].h : 0;
          const mid = y + dh/2;
          let target = 0;
          for (let k=0;k<slots.length;k++){ if (mid > slots[k].top + slots[k].h/2) target = k+1; }
          target = Math.max(0, Math.min(slots.length-1, target>cur.fromIdx ? target-1 : target));
          return { ...cur, y, curIdx:target };
        });
      };
      const exDragEnd = () => {
        clearTimeout(exPressRef.current.timer);
        setDrag(cur => { if (cur && cur.fromIdx!==cur.curIdx) { reorderExercise(cur.fromIdx, cur.curIdx); setWigIdx(cur.curIdx); try{navigator.vibrate&&navigator.vibrate([14,10,14]);}catch(_){} } return null; });
      };
      dragHandlersRef.current.move = exDragMove;
      dragHandlersRef.current.end = exDragEnd;

      const renderExerciseCard = (ex, exIdx, isActive) => {
        const workSets = ex.sets.filter(s => !(s.duration > 0));
        const rowBg = "#fdfdfc";
        const isRenaming = editingExercise === ex.id;
        const isWig = wigIdx === exIdx;
        const isDragged = drag && drag.fromIdx === exIdx;
        let shiftY = 0;
        if (drag && !isDragged) {
          const dh = dragRef.current.slots[drag.fromIdx] ? dragRef.current.slots[drag.fromIdx].h : 0;
          if (drag.fromIdx < drag.curIdx && exIdx > drag.fromIdx && exIdx <= drag.curIdx) shiftY = -dh;
          if (drag.fromIdx > drag.curIdx && exIdx >= drag.curIdx && exIdx < drag.fromIdx) shiftY = dh;
        }
        const wrLabel = (t) => <div style={{ fontFamily:"Georgia,serif", fontStyle:"italic", fontSize:12, color:"#b3aca0", textAlign:"center" }}>{t}</div>;

        return (
          <div key={ex.id} data-exrow {...(isWig?{"data-wig":"1"}:{})}
            onFocusCapture={()=>{ if(wigIdx==null && !drag && currentExId!==ex.id) setCurrentExId(ex.id); }}
            onClick={()=>{ if(wigIdx==null && !drag && currentExId!==ex.id) setCurrentExId(ex.id); }}
            style={{
            position:"relative",
            margin:"0 -16px", padding:"18px 24px",
            background:"#fdfdfc",
            borderTop: exIdx===0 ? "none" : "1px solid #eeeae3",
            transform: isDragged ? `translateY(${drag.y - (dragRef.current.slots[exIdx]?dragRef.current.slots[exIdx].top:0)}px) scale(1.02)` : (shiftY ? `translateY(${shiftY}px)` : "none"),
            transition: isDragged ? "none" : "transform 0.2s cubic-bezier(0.2,0,0,1)",
            boxShadow: isDragged ? "0 16px 38px -12px rgba(40,40,36,0.3)" : "none",
            borderRadius: isDragged ? 14 : 0,
            zIndex: isDragged ? 30 : (isWig ? 5 : "auto"),
            animation: (isWig && !isDragged) ? "exWiggle 0.3s ease-in-out infinite" : "none",
            touchAction: drag ? "none" : "auto",
            WebkitUserSelect: isWig ? "none" : "auto", userSelect: isWig ? "none" : "auto",
            WebkitTouchCallout: "none",
          }}>
            {/* delete badge (wiggle mode), top-right */}
            {isWig && (
              <div onClick={(e)=>{ e.stopPropagation(); setPendingDelEx(ex.id); }}
                style={{ position:"absolute", right:10, top:10, width:26, height:26, borderRadius:"50%", background:"#c2503f", border:"2px solid #fff", display:"flex", alignItems:"center", justifyContent:"center", zIndex:31, cursor:"pointer", boxShadow:"0 2px 6px rgba(0,0,0,0.18)" }}>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" strokeWidth="3" strokeLinecap="round"/></svg>
              </div>
            )}

            {/* grip handle (wiggle mode) */}
            {isWig && (
              <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:8, color:"#bdb6a8" }}>
                <span style={{ display:"grid", gridTemplateColumns:"repeat(2,3px)", gap:3 }}>
                  {[0,1,2,3,4,5].map(i=><i key={i} style={{ width:3, height:3, borderRadius:"50%", background:"#bdb6a8", display:"block" }}/>)}
                </span>
                <span style={{ fontFamily:"Georgia,serif", fontStyle:"italic", fontSize:12, color:"#bdb6a8" }}>hold &amp; drag to move</span>
              </div>
            )}

            {/* header: sage dot (active) + name + graph icon. Long-press = wiggle/drag; double-tap = rename. */}
            <div
              onTouchStart={e=>exPressStart(e, exIdx)} onTouchEnd={exPressCancel}
              onMouseDown={e=>exPressStart(e, exIdx)} onMouseUp={exPressCancel}
              onContextMenu={e=>e.preventDefault()}
              style={{ display:"flex", alignItems:"center", gap:9, marginBottom:4, cursor: isWig?"grab":"default", WebkitUserSelect:"none", userSelect:"none", WebkitTouchCallout:"none", touchAction:"manipulation" }}>
              {isActive && !isWig && <span style={{ width:8, height:8, borderRadius:"50%", background:"#85a95f", flexShrink:0 }} />}
              {isRenaming ? (
                <input type="text" defaultValue={ex.name} autoFocus
                  onBlur={e=>{ const v=e.target.value.trim(); if(v) renameExercise(activeSession.type, ex.name, v); setEditingExercise(null); }}
                  onKeyDown={e=>{ if(e.key==="Enter") e.target.blur(); if(e.key==="Escape") setEditingExercise(null); }}
                  style={{ flex:1, fontFamily:"Georgia,serif", fontSize:20, fontWeight:600, color:"#1c1a17", border:"none", borderBottom:"2px solid #85a95f", background:"transparent", outline:"none", padding:"2px 0", letterSpacing:-0.25 }} />
              ) : (
                <div
                  onClick={()=>{ if(isWig||drag) return; const now=Date.now(); if(now-tapRef.current.last<300){ setEditingExercise(ex.id); } tapRef.current.last=now; }}
                  style={{ fontFamily:"Georgia,serif", fontSize:20, fontWeight:600, color:"#1c1a17", letterSpacing:-0.25, userSelect:"none" }}>{ex.name}</div>
              )}
              {!isWig && !isRenaming && (
                <button onClick={(e)=>{ e.stopPropagation(); setChartExpandedFor(chartExpandedFor===ex.name?null:ex.name); }}
                  style={{ width:30, height:30, borderRadius:9, border:"none", background:"transparent", display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", flexShrink:0, marginLeft:"auto" }}>
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 19V5M4 19h16M8 15l3.5-4 3 2.5L20 8" stroke={chartExpandedFor===ex.name?"#85a95f":"#9a948a"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                </button>
              )}
            </div>

            {/* body — pointer-disabled during wiggle so taps drive the drag */}
            <div style={{ pointerEvents: isWig ? "none" : "auto" }}>
              {workSets.length > 0 && (
                <div style={{ display:"grid", gridTemplateColumns:"24px 1fr 1fr 34px", gap:14, padding:"8px 2px 2px 0", marginTop:6 }}>
                  <span/>{wrLabel("w")}{wrLabel("r")}<span/>
                </div>
              )}
              {workSets.length > 0 && ex.sets.map((st, idx) => (
                (st.duration > 0) ? null : <React.Fragment key={idx}>{renderSetRow(ex.id, st, idx, rowBg)}</React.Fragment>
              ))}

              {/* "+ add set" + rest only on the active (current) exercise */}
              {isActive && (
                <button onClick={()=>addSet(ex.id)}
                  style={{ background:"none", border:"none", color:C.accentDeep, fontSize:14, fontWeight:600, cursor:"pointer", fontFamily:"Georgia,serif", fontStyle:"italic", padding:"14px 0 2px" }}>+ add set</button>
              )}

              {chartExpandedFor===ex.name && <ExerciseChart exName={ex.name} />}

              {isActive && (
                <div style={{ marginTop:8 }}>
                  <RestTimer prefill={(data.restTimer||DEFAULT_DATA.restTimer).defaultSec} C={C} />
                </div>
              )}
            </div>
          </div>
        );
      };

      // ─── TAB: WORKOUT ───────────────────────────────────────────────────
      const renderWorkoutSession = () => {
        const sess = activeSession;
        const w = WORKOUT_TYPES.find(t => t.key===sess.type);
        const timeStr = sess.startedAt ? new Date(sess.startedAt).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:APP_TZ}) : null;
        const isTimed = !!TIMED_TYPES[sess.type];
        const doneCount = (sess.exercises||[]).filter(e => e.done).length;
        const totalCount = (sess.exercises||[]).length;

        return (
          <>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:4 }}>
              <button onClick={()=>setActiveSessionId(null)}
                style={{ display:"inline-flex", alignItems:"center", gap:5, background:"none", border:"none", padding:0, cursor:"pointer", fontFamily:"Georgia,serif", fontStyle:"italic", color:C.textMuted, fontSize:14 }}>
                ← back
              </button>
              {timeStr && (
                <div style={{ textAlign:"right", lineHeight:1.25 }}>
                  <div style={{ display:"inline-flex", alignItems:"center", gap:6, fontFamily:"Georgia,serif", fontWeight:600, fontSize:18, color:"#85a95f", fontVariantNumeric:"tabular-nums" }}>
                    <span style={{ width:6, height:6, borderRadius:"50%", background:"#85a95f", display:"inline-block" }}/>
                    <SessionElapsed startedAt={sess.startedAt} />
                  </div>
                  <div style={{ fontFamily:"Georgia,serif", fontStyle:"italic", fontSize:12, color:C.mutedGray, marginTop:1 }}>started {timeStr}</div>
                </div>
              )}
            </div>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom: isTimed?6:2 }}>
              <div style={{ fontFamily:"Georgia,serif", fontSize:32, fontWeight:600, color:C.ink, letterSpacing:-0.6, lineHeight:1.05 }}>{w?w.label:"Workout"}</div>
              <button onClick={()=>{ if(window.confirm("Delete this session?")) deleteSession(today, sess.id); }}
                style={{ background:"none", border:"none", color:C.mutedGray, fontSize:13, fontFamily:"Georgia,serif", fontStyle:"italic", cursor:"pointer", padding:0 }}>delete</button>
            </div>

            {isTimed ? renderTimedSession(sess) : (() => {
              const manualIdx = currentExId ? sess.exercises.findIndex(e => e.id===currentExId) : -1;
              const activeIdx = manualIdx >= 0 ? manualIdx : sess.exercises.findIndex(e => !e.done);
              return (
                <>
                  <div style={{ fontFamily:"Georgia,serif", fontStyle:"italic", fontSize:13, color:C.mutedGray, marginBottom:6 }}>{doneCount} of {totalCount} done</div>

                  <div data-exlist style={{ position:"relative" }}
                    onClick={(e)=>{ if(wigIdx!=null && !drag && e.target===e.currentTarget){ setWigIdx(null); } }}>
                    {sess.exercises.map((ex, exIdx) => renderExerciseCard(ex, exIdx, exIdx === activeIdx))}
                  </div>

                  {sess.exercises.length === 0 && (
                    <div style={{ textAlign:"center", color:C.mutedGray, fontSize:13, padding:"24px 0 8px", lineHeight:1.5, fontFamily:"Georgia,serif", fontStyle:"italic" }}>
                      No exercises yet. Add one below.
                    </div>
                  )}

                  {wigIdx!=null ? (
                    <div style={{ marginTop:16 }} data-wig-done="1">
                      <button onClick={()=>setWigIdx(null)}
                        style={{ width:"100%", background:"#85a95f", color:"#fff", border:"none", borderRadius:14, padding:14, fontFamily:"Georgia,serif", fontWeight:600, fontSize:15, cursor:"pointer" }}>Done</button>
                    </div>
                  ) : (
                  <>
                  <div style={{ padding:"16px 0 4px", borderTop:`1px solid #eeeae3` }}>
                    <input type="text" value={newExerciseName} onChange={e=>setNewExerciseName(e.target.value)} placeholder="+ add exercise"
                      onKeyDown={e=>{ if(e.key==="Enter" && newExerciseName.trim()) { addCustomExercise(sess.type, newExerciseName); setNewExerciseName(""); } }}
                      style={{ width:"100%", background:"transparent", border:"none", padding:"4px 0", fontSize:15, color:C.textMuted, fontFamily:"Georgia,serif", fontStyle:"italic", outline:"none" }} />
                  </div>

                  <div style={{ marginTop:20 }}>
                    <button onClick={()=>setActiveSessionId(null)}
                      style={{ width:"100%", background:"#1c1a17", color:"#fff", border:"none", borderRadius:14, padding:16, fontFamily:"Georgia,serif", fontWeight:600, fontSize:17, cursor:"pointer" }}>Finish workout</button>
                    <div style={{ paddingTop:14, paddingLeft:2 }}>
                      <button onClick={()=>{ if(window.confirm("Discard this workout? Its sets will be lost.")) deleteSession(today, sess.id); }}
                        style={{ background:"transparent", border:"none", fontFamily:"Georgia,serif", fontStyle:"italic", fontSize:12, color:"#bdb6a8", cursor:"pointer" }}>discard workout</button>
                    </div>
                  </div>
                  </>
                  )}
                </>
              );
            })()}

            {pendingDelEx!=null && (() => {
              const exObj = sess.exercises.find(e => e.id===pendingDelEx);
              return (
                <div onClick={(e)=>{ if(e.target===e.currentTarget) setPendingDelEx(null); }}
                  style={{ position:"fixed", inset:0, background:"rgba(28,26,23,0.28)", display:"flex", alignItems:"flex-end", justifyContent:"center", zIndex:100 }}>
                  <div style={{ background:"#fdfdfc", width:"100%", maxWidth:430, borderRadius:"20px 20px 0 0", padding:"22px 22px calc(22px + env(safe-area-inset-bottom))", boxShadow:"0 -10px 40px -12px rgba(40,40,36,0.3)" }}>
                    <div style={{ fontFamily:"Georgia,serif", fontSize:18, fontWeight:600, color:"#1c1a17", marginBottom:4 }}>Delete {exObj?exObj.name:"exercise"}?</div>
                    <div style={{ fontFamily:"Georgia,serif", fontStyle:"italic", fontSize:13, color:"#8a8578", marginBottom:18 }}>This removes it from the workout.</div>
                    <button onClick={()=>{ removeExerciseFromSession(pendingDelEx); setPendingDelEx(null); }}
                      style={{ width:"100%", background:"#c2503f", color:"#fff", border:"none", borderRadius:13, padding:15, fontFamily:"Georgia,serif", fontWeight:600, fontSize:16, cursor:"pointer" }}>Delete</button>
                    <button onClick={()=>setPendingDelEx(null)}
