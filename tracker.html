  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fdfdfc;
      background-attachment: fixed;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      color: #35322c;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }
    @keyframes chkPop { 0%{transform:scale(1)} 30%{transform:scale(1.18)} 60%{transform:scale(.94)} 100%{transform:scale(1)} }
    @keyframes exWiggle { 0%{transform:rotate(-0.6deg)} 50%{transform:rotate(0.7deg)} 100%{transform:rotate(-0.6deg)} }
    @keyframes restBreathe { 0%,100%{opacity:1} 50%{opacity:0.66} }
    @keyframes chkRipple { 0%{opacity:.5;transform:scale(1)} 100%{opacity:0;transform:scale(2.1)} }
    @keyframes flashWash { 0%{background:rgba(82,176,51,0)} 20%{background:rgba(82,176,51,0.28)} 55%{background:rgba(82,176,51,0.28)} 100%{background:rgba(82,176,51,0)} }
    .chk-pop { animation: chkPop .42s cubic-bezier(.34,1.6,.5,1); }
    .chk-ripple { animation: chkRipple .5s ease-out; }
    .flash-wash { animation: flashWash .7s ease-out; }
    input:focus { outline: 2px solid #7ac943; }
    input.set-field:focus { outline: none; border-bottom-color: #85a95f !important; }
    input.set-field::placeholder { color: #c2ccc4; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    ::-webkit-scrollbar { display: none; }
  </style>

<body>
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
      createUserWithEmailAndPassword, signInWithEmailAndPassword,
      EmailAuthProvider, linkWithCredential, linkWithPopup, unlink,
      sendPasswordResetEmail, reauthenticateWithCredential, reauthenticateWithPopup,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAxyUfbjCJqBihgqt27I3r8NEnDzBv0870",
      authDomain: "tracker-2e97e.firebaseapp.com",
      projectId: "tracker-2e97e",
      storageBucket: "tracker-2e97e.firebasestorage.app",
      messagingSenderId: "415883101548",
      appId: "1:415883101548:web:2fe1b2d516d0b8713adf49"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const friendlyError = (e) => {
      const code = e?.code || "";
      if (code === "auth/email-already-in-use") return "An account already exists for that email. Try signing in instead.";
      if (code === "auth/invalid-email")        return "That doesn't look like a valid email.";
      if (code === "auth/weak-password")        return "Password is too weak. Use at least 6 characters.";
      if (code === "auth/user-not-found")       return "No account exists for that email. Tap 'Create account' to sign up.";
      if (code === "auth/wrong-password")       return "Wrong password. Try again or reset your password.";
      if (code === "auth/invalid-credential")   return "Wrong email or password. Try again or reset your password.";
      if (code === "auth/too-many-requests")    return "Too many attempts. Wait a moment and try again.";
      if (code === "auth/popup-closed-by-user") return null; // user cancelled, silent
      if (code === "auth/credential-already-in-use") return "That account is already linked to a different user.";
      if (code === "auth/provider-already-linked") return "That sign-in method is already linked to your account.";
      if (code === "auth/requires-recent-login") return "For security, please sign out and sign back in before doing this.";
      return e?.message || "Something went wrong. Please try again.";
    };

    window.__firebase = {
      signIn: () => signInWithPopup(auth, provider).catch(e => {
        const msg = friendlyError(e);
        if (msg) alert(msg);
      }),
      signInWithEmail: async (email, password) => {
        try {
          await signInWithEmailAndPassword(auth, email, password);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: friendlyError(e) };
        }
      },
      createWithEmail: async (email, password) => {
        try {
          await createUserWithEmailAndPassword(auth, email, password);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: friendlyError(e) };
        }
      },
      sendPasswordReset: async (email) => {
        try {
          await sendPasswordResetEmail(auth, email);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: friendlyError(e) };
        }
      },
      linkEmailToCurrentUser: async (email, password) => {
        try {
          const u = auth.currentUser;
          if (!u) return { ok: false, error: "Not signed in." };
          const cred = EmailAuthProvider.credential(email, password);
          await linkWithCredential(u, cred);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: friendlyError(e) };
        }
      },
      linkGoogleToCurrentUser: async () => {
        try {
          const u = auth.currentUser;
          if (!u) return { ok: false, error: "Not signed in." };
          await linkWithPopup(u, provider);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: friendlyError(e) };
        }
      },
      unlinkProvider: async (providerId) => {
        try {
          const u = auth.currentUser;
          if (!u) return { ok: false, error: "Not signed in." };
          if ((u.providerData || []).length <= 1) {
            return { ok: false, error: "You need at least one sign-in method. Link another method before removing this one." };
          }
          await unlink(u, providerId);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: friendlyError(e) };
        }
      },
      getLinkedProviders: () => {
        const u = auth.currentUser;
        if (!u) return [];
        return (u.providerData || []).map(p => p.providerId);
      },
      signOut: () => signOut(auth),
      onAuthStateChanged: (cb) => onAuthStateChanged(auth, cb),
      saveData: async (uid, data) => {
        await setDoc(doc(db, "users", uid), data);
        try { localStorage.setItem("tef_tracker_v2", JSON.stringify(data)); } catch(e) {}
      },
      loadData: async (uid) => {
        try {
          const snap = await getDoc(doc(db, "users", uid));
          if (snap.exists()) return snap.data();
        } catch(e) {}
        try {
          const local = localStorage.getItem("tef_tracker_v2");
          if (local) return JSON.parse(local);
        } catch(e) {}
        return null;
      }
    };
    window.dispatchEvent(new Event("firebaseReady"));
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ═══ CONSTANTS ═══════════════════════════════════════════════════════════
    const STORAGE_KEY = "tef_tracker_v2";

    // ═══ MODERN FLAT · FOREST PALETTE ═══════════════════════════════════════
    // Minimal + lime. Vivid fill, darker greens for legible text on white.
    const C = {
      bg:"#ffffff",                 // pure white app surface
      bgGradTop:"#ffffff",
      surface:"#ffffff",            // flat white cards
      card:"#ffffff", cardActive:"#eef7e4",
      border:"#e8ece6", borderActive:"#cfe8b3",
      ink:"#15231a",                // near-black primary text
      text:"#15231a",
      textMuted:"#5e6e62",          // darker muted sage-gray
      mutedGray:"#8a978d",          // darker light gray (labels, placeholders)
      hair:"#eef2ec",               // hairline divider
      fieldBg:"#f1f6ef",            // input background
      accentBright:"#7ac943",       // vivid lime — fills, checks, active dots
      accent:"#4a8f2f",             // darker green — text/buttons on white
      accentDeep:"#3c7a26",         // darkest — small text legibility
      accentTint:"#eef7e4",         // pale lime tint (done bg)
      accentFieldBg:"#dbefc4",      // filled-input lime
      // legacy aliases kept so existing references resolve cleanly:
      accentLight:"#7ac943",
      green:"#7ac943", greenDark:"#4a8f2f", greenText:"#3c7a26",
      red:"#d4453f",
      pink:"#ec4899", pinkDeep:"#be185d", pinkTint:"#fce7f3",
      workoutOnly:"#4a8f2f",
    };
    const HEAT = { 0:"#eef2ec", 1:"#d6eebc", 2:"#aadd76", 3:"#7ac943", 4:"#4a8f2f", future:"#ffffff" };
    const MONTH_LABELS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    const BUILTIN_HABITS = [
      { key:"workout", emoji:"🏋️", label:"Workout", sublabelFn:()=>"Gym, cardio, recovery…" },
    ];

    const EMOJI_PRESETS = ["📌","📚","✍️","💪","🧘","🏃","🚴","🥗","💧","☕","🌱","💊","🧠","💤","🎵","🎨","💼","💰","🙏","❤️","🌅","📖"];

    const WORKOUT_TYPES = [
      { key:"push",     label:"Push",     emoji:"👋" },
      { key:"pull",     label:"Pull",     emoji:"💪" },
      { key:"legs",     label:"Legs",     emoji:"🏋️‍♂️" },
      { key:"upper",    label:"Upper",    emoji:"⬆️" },
      { key:"lower",    label:"Lower",    emoji:"⬇️" },
      { key:"running",  label:"Running",  emoji:"🏃", timed:"stopwatch" },
      { key:"swimming", label:"Swimming", emoji:"🏊‍♂️", timed:"duration" },
      { key:"cycling",  label:"Cycling",  emoji:"🚴", timed:"duration" },
      { key:"recovery", label:"Recovery", emoji:"🧘" },
      { key:"mix",      label:"Mix",      emoji:"✖️" },
    ];
    // Types whose session is a simple time log (no sets/reps). "stopwatch" = live count-up timer; "duration" = manual minutes entry.
    const TIMED_TYPES = { running:"stopwatch", swimming:"duration", cycling:"duration" };

    const EXERCISE_PRESETS = {
      push:    ["Bench Press","Overhead Press","Incline Dumbbell Press","Push-ups","Tricep Pushdown","Lateral Raise","Dips","Chest Fly"],
      pull:    ["Pull-ups","Barbell Row","Lat Pulldown","Seated Cable Row","Face Pull","Bicep Curl","Hammer Curl","Reverse Fly"],
      legs:    ["Back Squat","Romanian Deadlift","Leg Press","Walking Lunge","Leg Curl","Leg Extension","Calf Raise","Hip Thrust","Bulgarian Split Squat"],
      upper:   ["Bench Press","Overhead Press","Pull-ups","Barbell Row","Dumbbell Curl","Tricep Extension"],
      lower:   ["Back Squat","Deadlift","Leg Press","Walking Lunge","Calf Raise","Hip Thrust"],
      running: [],
      swimming:[],
      cycling: [],
      recovery:["Foam Rolling","Stretching","Yoga","Walk","Mobility Drills"],
      mix:     [],
    };

    // ─── ICONS ───────────────────────────────────────────────────────────
    // Geometric minimal set. Pure shapes, no literal pictographs.
    // 24x24 viewBox. Color (green when active, muted gray when not) passed in.
    const TabIcon = ({ name, active, color }) => {
      const c = color;
      const common = { width:22, height:22, viewBox:"0 0 24 24", fill:"none", xmlns:"http://www.w3.org/2000/svg" };

      if (name === "day") {
        return (
          <svg {...common}>
            <circle cx="12" cy="12" r="8" stroke={c} strokeWidth="2"/>
            <circle cx="12" cy="12" r="3" fill={c}/>
          </svg>
        );
      }
      if (name === "todo") {
        return (
          <svg {...common}>
            <rect x="4.5" y="4.5" width="15" height="15" rx="4.5" stroke={c} strokeWidth="2"/>
            <path d="M8.5 12l2.2 2.2 4.6-4.7" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        );
      }
      if (name === "workout") {
        return (
          <svg {...common}>
            <rect x="2.5" y="9.5" width="3" height="5" rx="1.2" fill={c}/>
            <rect x="18.5" y="9.5" width="3" height="5" rx="1.2" fill={c}/>
            <rect x="6.5" y="10.7" width="11" height="2.6" rx="1.3" fill={c}/>
          </svg>
        );
      }
      if (name === "year") {
        return (
          <svg {...common}>
            <rect x="4" y="4" width="16" height="16" rx="4.5" stroke={c} strokeWidth="2"/>
            <circle cx="8.5" cy="8.5" r="1.3" fill={c}/>
            <circle cx="12.5" cy="8.5" r="1.3" fill={c}/>
            <circle cx="8.5" cy="12.5" r="1.3" fill={c}/>
            <circle cx="15.5" cy="12.5" r="1.3" fill={c}/>
          </svg>
        );
      }
      if (name === "history") {
        return (
          <svg {...common}>
            <circle cx="12" cy="12" r="8" stroke={c} strokeWidth="2"/>
            <path d="M12 8v4l2.5 1.5" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        );
      }
      if (name === "settings") {
        return (
          <svg {...common}>
            <circle cx="12" cy="12" r="3" stroke={c} strokeWidth="2"/>
            <path d="M12 3v2.5M12 18.5V21M21 12h-2.5M5.5 12H3M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8M18.4 18.4l-1.8-1.8M7.4 7.4L5.6 5.6" stroke={c} strokeWidth="2" strokeLinecap="round"/>
          </svg>
        );
      }
      return null;
    };

    const TABS = [
      { key:"day",      label:"Day" },
      { key:"todo",     label:"Todo" },
      { key:"workout",  label:"Workout" },
      { key:"year",     label:"Year" },
      { key:"history",  label:"History" },
      { key:"settings", label:"Settings" },
    ];

    const DEFAULT_DATA = {
      startDate: "", logs: {},
      customHabits: [], hiddenBuiltins: [], habitOrder: [],
      workoutSessions: {}, customExercises: {}, exerciseOrder: {},
      hiddenPresets: {}, renamedPresets: {},
      todos: [],
      restTimer: { promptOnCheck: true, defaultSec: 90, sound: true, vibrate: true, visual: true, custom: [] },
      userName: "",
    };
    const REST_PRESETS = [30, 90, 120, 180]; // 0:30 / 1:30 / 2:00 / 3:00
    const fmtClock = s => `${Math.floor(s/60)}:${String(Math.max(0,s%60)).padStart(2,"0")}`;

    // ═══ SHARED STYLES (modern flat) ═════════════════════════════════════════
    const S = {
      card:        { background:C.surface, borderRadius:14, padding:16, border:`1px solid ${C.border}`, marginBottom:10 },
      cardActive:  { background:C.accentTint, borderRadius:14, padding:16, border:`1px solid ${C.borderActive}`, marginBottom:10 },
      sectionLabel:{ fontSize:10, letterSpacing:0.6, color:C.textMuted, textTransform:"uppercase", marginBottom:14, fontWeight:800 },
      smallLabel:  { fontSize:10, color:C.textMuted, textTransform:"uppercase", letterSpacing:0.6, marginBottom:10, fontWeight:800 },
      pillBtn:     { background:C.fieldBg, border:"none", borderRadius:8, color:C.textMuted, fontSize:11, fontWeight:700, padding:"7px 14px", cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.2 },
      pillBtnOn:   { background:C.accent, border:"none", borderRadius:8, color:"#fff", fontSize:11, fontWeight:700, padding:"7px 14px", cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.2 },
      input:       { background:C.fieldBg, border:`1px solid ${C.border}`, borderRadius:8, color:C.text, fontSize:14, padding:"10px 12px", fontFamily:"Inter,sans-serif" },
      primaryBtn:  { background:C.accent, border:"none", borderRadius:10, color:"#fff", fontSize:13, fontWeight:700, padding:"10px 16px", cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.2 },
      dangerBtn:   { width:"100%", padding:"14px", borderRadius:12, background:C.surface, border:`1px solid ${C.red}`, color:C.red, fontSize:14, fontWeight:600, cursor:"pointer", fontFamily:"Inter,sans-serif" },
      bodyPad:     { padding:"20px 16px" },
      serif:       { fontFamily:"'Inter', sans-serif" },  // serif retired; alias keeps refs working
    };

    // ═══ PURE HELPERS ════════════════════════════════════════════════════════
    const APP_TZ = "America/Toronto";
    const localDateKey = d => {
      // Date key (YYYY-MM-DD) computed in the app timezone (Toronto), so "today"
      // matches Toronto regardless of the device's own timezone.
      const parts = new Intl.DateTimeFormat("en-CA", { timeZone: APP_TZ, year:"numeric", month:"2-digit", day:"2-digit" }).formatToParts(d);
      const y = parts.find(p=>p.type==="year").value, m = parts.find(p=>p.type==="month").value, day = parts.find(p=>p.type==="day").value;
      return `${y}-${m}-${day}`;
    };
    const formatDate = (key, opts) => new Date(key+"T12:00:00").toLocaleDateString("en-US", opts);
    const getISOWeek = date => {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    };
    const pct = (cur, tgt) => Math.min(100, Math.round((cur/tgt)*100));
    const blankLog = () => ({ workout:null });
    const hasAnyHabit = (log, customs) => !!log && (
      log.workout || (customs||[]).some(h => log[h.key])
    );

    // ─── Migration: workoutSessions[date] from single {type,exercises} to an
    // array of sessions [{id,type,exercises,startedAt,endedAt}]. Idempotent.
    let _sidCounter = 0;
    const makeSessionId = () => `s_${Date.now().toString(36)}_${(_sidCounter++).toString(36)}`;
    const asArray = v => Array.isArray(v) ? v : [];
    const asObject = v => (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
    const migrateData = raw => {
      if (!raw || typeof raw !== "object") return { ...DEFAULT_DATA };

      // workoutSessions → object of arrays of well-formed sessions
      const wsRaw = asObject(raw.workoutSessions);
      const migrated = {};
      Object.keys(wsRaw).forEach(date => {
        const v = wsRaw[date];
        const sanitizeSession = s => ({
          id: (s && s.id) || makeSessionId(),
          type: ((s && s.type) === "cardio") ? "running" : ((s && s.type) || "mix"),
          exercises: asArray(s && s.exercises).filter(e => e && typeof e === "object").map(e => ({
            id: e.id || `ex_${Math.random().toString(36).slice(2,8)}`,
            name: typeof e.name === "string" ? e.name : "Exercise",
            sets: asArray(e.sets).filter(st => st && typeof st === "object"),
            notes: typeof e.notes === "string" ? e.notes : "",
            done: !!e.done,
          })),
          startedAt: (s && s.startedAt) || null,
          endedAt: (s && s.endedAt) || null,
        });
        if (Array.isArray(v)) {
          const arr = v.filter(s => s && typeof s === "object").map(sanitizeSession);
          if (arr.length) migrated[date] = arr;
        } else if (v && typeof v === "object") {
          migrated[date] = [sanitizeSession(v)];
        }
      });

      // logs → object of well-formed log entries (each must be a plain object)
      const logsRaw = asObject(raw.logs);
      const logs = {};
      Object.keys(logsRaw).forEach(date => {
        const l = logsRaw[date];
        if (l && typeof l === "object" && !Array.isArray(l)) {
          const clean = { workout: typeof l.workout === "string" ? l.workout : null };
          // preserve any custom-habit boolean flags
          Object.keys(l).forEach(k => { if (k !== "workout" && typeof l[k] === "boolean") clean[k] = l[k]; });
          logs[date] = clean;
        }
      });

      // customHabits → array of well-formed habit defs
      const customHabits = asArray(raw.customHabits)
        .filter(h => h && typeof h === "object" && typeof h.key === "string")
        .map(h => ({ key: h.key, emoji: typeof h.emoji === "string" ? h.emoji : "", label: typeof h.label === "string" ? h.label : "Habit" }));

      // todos → array of well-formed todos
      const todos = asArray(raw.todos)
        .filter(t => t && typeof t === "object")
        .map(t => ({
          id: t.id || `todo_${Math.random().toString(36).slice(2,8)}`,
          title: typeof t.title === "string" ? t.title : "",
          done: !!t.done, doneAt: t.doneAt || null,
          createdAt: t.createdAt || Date.now(),
          dueDate: t.dueDate || null, priority: t.priority || null,
          notes: typeof t.notes === "string" ? t.notes : "",
        }));

      return {
        ...DEFAULT_DATA,
        ...raw,
        startDate: typeof raw.startDate === "string" && raw.startDate ? raw.startDate : DEFAULT_DATA.startDate,
        userName: typeof raw.userName === "string" ? raw.userName : "",
        workoutSessions: migrated,
        logs,
        customHabits,
        hiddenBuiltins: asArray(raw.hiddenBuiltins).filter(x => typeof x === "string"),
        habitOrder: asArray(raw.habitOrder).filter(x => typeof x === "string"),
        customExercises: asObject(raw.customExercises),
        exerciseOrder: asObject(raw.exerciseOrder),
        hiddenPresets: asObject(raw.hiddenPresets),
        renamedPresets: asObject(raw.renamedPresets),
        todos,
        restTimer: { ...DEFAULT_DATA.restTimer, ...asObject(raw.restTimer), custom: asArray(raw.restTimer && raw.restTimer.custom).filter(n => typeof n === "number") },
      };
    };

    function getExercisesForType(data, typeKey) {
      if (typeKey === "mix") {
        // Mix = union of all exercises across all other types
        const mixHidden = new Set((data.hiddenPresets||{}).mix || []);
        const seen = new Set();
        const all = [];
        ["push","pull","legs","upper","lower","running","swimming","cycling","recovery"].forEach(t => {
          getExercisesForType(data, t).forEach(name => {
            if (!seen.has(name) && !mixHidden.has(name)) { seen.add(name); all.push(name); }
          });
        });
        // include any mix-specific custom exercises too
        const mixCustoms = (data.customExercises||{}).mix || [];
        mixCustoms.forEach(name => { if (!seen.has(name) && !mixHidden.has(name)) { seen.add(name); all.push(name); } });
        // apply mix-specific reorder if present
        const order = (data.exerciseOrder||{}).mix || [];
        if (!order.length) return all;
        const sorted = order.filter(n => seen.has(n));
        const remaining = all.filter(n => !order.includes(n));
        return [...sorted, ...remaining];
      }
      const hidden = (data.hiddenPresets||{})[typeKey] || [];
      const renames = (data.renamedPresets||{})[typeKey] || {};
      const presets = (EXERCISE_PRESETS[typeKey]||[]).filter(n => !hidden.includes(n)).map(n => renames[n] || n);
      const customs = (data.customExercises||{})[typeKey] || [];
      const all = [...presets, ...customs];
      const order = (data.exerciseOrder||{})[typeKey] || [];
      if (!order.length) return all;
      const sorted = order.filter(n => all.includes(n));
      const remaining = all.filter(n => !order.includes(n));
      return [...sorted, ...remaining];
    }

    // ═══ REUSABLE COMPONENTS ═════════════════════════════════════════════════

    // Rounded-square check (rectangular to match bento language)
    // ── Animated check: spring + ripple + haptic, driven by STATE TRANSITION
    //    (off→on) so it fires whether the user tapped check, name, or emoji.
    function Toggle({ on, onClick, size=28 }) {
      const [pop, setPop] = useState(false);
      const [ripple, setRipple] = useState(false);
      const prev = useRef(on);
      useEffect(() => {
        if (on && !prev.current) {
          setPop(false); setRipple(false);
          requestAnimationFrame(() => { setPop(true); setRipple(true); });
          if (navigator.vibrate) { try { navigator.vibrate(12); } catch(e){} }
        }
        prev.current = on;
      }, [on]);
      return (
        <div onClick={onClick} style={{ position:"relative", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, cursor:"pointer", width:size, height:size }}>
          {ripple && (
            <span className="chk-ripple" onAnimationEnd={()=>setRipple(false)} style={{
              position:"absolute", width:size, height:size, borderRadius:8,
              border:`2px solid ${C.accent}`, pointerEvents:"none",
            }}/>
          )}
          <div className={pop?"chk-pop":""} onAnimationEnd={()=>setPop(false)} style={{
            width:size, height:size, borderRadius:8,
            background: on ? C.accent : "transparent",
            border: on ? `1.5px solid ${C.accent}` : `1.5px solid #d9d3c8`,
            display:"flex", alignItems:"center", justifyContent:"center",
            transition:"background 0.18s ease, border-color 0.18s ease",
          }}>
            <svg width={Math.round(size*0.5)} height={Math.round(size*0.5)} viewBox="0 0 24 24" fill="none" style={{
              opacity: on ? 1 : 0,
              transform: on ? "scale(1)" : "scale(0.4)",
              transition:"opacity 0.16s ease, transform 0.22s cubic-bezier(.34,1.8,.5,1)",
            }}>
              <path d="M5 12.5l4.5 4.5L19 7" stroke="#fff" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </div>
        </div>
      );
    }

    // ── Animated count-up number for the gap %. Hides at 0 but reserves height
    //    so the layout never jumps.
    function CountUp({ value, hide }) {
      const [shown, setShown] = useState(value);
      const raf = useRef(0);
      const fromVal = useRef(value);
      useEffect(() => {
        cancelAnimationFrame(raf.current);
        fromVal.current = shown;
        const start = performance.now();
        const dur = 450;
        const tick = (t) => {
          const k = Math.min(1, (t - start) / dur);
          const eased = 1 - Math.pow(1 - k, 3);
          setShown(Math.round(fromVal.current + (value - fromVal.current) * eased));
          if (k < 1) raf.current = requestAnimationFrame(tick);
        };
        raf.current = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf.current);
      }, [value]);
      return (
        <div style={{ textAlign:"center", height:46, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <span style={{ fontFamily:"'Source Serif 4', Georgia, serif", fontWeight:600, fontSize:30, color:C.accentDeep, opacity: hide ? 0 : 1, transition:"opacity 0.25s ease" }}>
            {shown}<span style={{ fontSize:15, color:"#b0aaa0", fontWeight:400 }}>%</span>
          </span>
        </div>
      );
    }

    // ── Polygon whose vertex coordinates animate (rAF interpolation, not CSS
    //    transition on the `points` attribute — that's browser-flaky).
    function AnimatedPolygon({ targetPts, fill, fillOpacity, stroke, strokeWidth }) {
      const [pts, setPts] = useState(targetPts);
      const fromRef = useRef(targetPts);
      const raf = useRef(0);
      useEffect(() => {
        cancelAnimationFrame(raf.current);
        fromRef.current = pts;
        const start = performance.now();
        const dur = 480;
        const tick = (t) => {
          const k = Math.min(1, (t - start) / dur);
          const eased = 1 - Math.pow(1 - k, 3);
          const next = targetPts.map((p, i) => {
            const f = fromRef.current[i] || p;
            return { x: f.x + (p.x - f.x) * eased, y: f.y + (p.y - f.y) * eased };
          });
          setPts(next);
          if (k < 1) raf.current = requestAnimationFrame(tick);
        };
        raf.current = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf.current);
      }, [JSON.stringify(targetPts)]);
      const str = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
      return <polygon points={str} fill={fill} fillOpacity={fillOpacity} stroke={stroke} strokeWidth={strokeWidth} strokeLinejoin="round"/>;
    }

    // Todo completion animation — mark (wash + check pop + press dip) →
    // strike sweep → release → banish to right → collapse. ~600ms total.
    // Verified by JSDOM interaction test in the build harness.
    function ComboRow({ item, onToggle, onComplete, onDelete }) {
      const [done, setDone] = useState(false);
      const [strike, setStrike] = useState(0);
      const [dip, setDip] = useState(false);
      const [wash, setWash] = useState(false);
      const [banish, setBanish] = useState(false);
      const [deleting, setDeleting] = useState(false);
      const [collapsing, setCollapsing] = useState(false);
      const [h, setH] = useState("auto");
      const ref = useRef(null);
      const nameRef = useRef(null);
      const [width, setWidth] = useState(0);
      useEffect(() => { if (nameRef.current) setWidth(nameRef.current.offsetWidth); }, [item.title]);
      // Delete: fade in place + collapse (no horizontal motion — distinct from completion).
      const triggerDelete = () => {
        if (deleting || done) return;
        setDeleting(true);
        if (navigator.vibrate) { try { navigator.vibrate(18); } catch(e){} }
        setTimeout(() => {
          const ht = ref.current ? ref.current.getBoundingClientRect().height : 56;
          setH(ht+"px");
          requestAnimationFrame(()=>{ setCollapsing(true); requestAnimationFrame(()=>setH("0px")); });
        }, 180);
        setTimeout(() => onDelete && onDelete(item.id), 440);
      };
      const begin = () => {
        if (done) return;
        setDone(true);
        setDip(true);
        setWash(true);
        if (navigator.vibrate) { try { navigator.vibrate([10, 40, 6]); } catch(e){} }
        setTimeout(() => {
          const start = performance.now(), dur = 200;
          const tick = (t) => {
            const k = Math.min(1, (t-start)/dur);
            setStrike(k);
            if (k<1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        }, 80);
        setTimeout(() => setDip(false), 200);
        setTimeout(() => {
          setBanish(true);
          setTimeout(() => {
            const ht = ref.current ? ref.current.getBoundingClientRect().height : 56;
            setH(ht+"px");
            requestAnimationFrame(() => { setCollapsing(true); requestAnimationFrame(() => setH("0px")); });
          }, 20);
          setTimeout(() => onComplete && onComplete(item.id), 280);
        }, 320);
      };
      const r = Math.round(51 + (176-51)*strike);
      const g = Math.round(49 + (175-49)*strike);
      const b = Math.round(44 + (166-44)*strike);
      return (
        <div ref={ref} style={{
          overflow:"hidden",
          height: collapsing ? h : "auto",
          transition: collapsing ? "height .29s cubic-bezier(.34,1.2,.5,1)" : "none",
        }}>
          <SwipeRow variant="todo" onDelete={triggerDelete}>
            <div className={wash?"flash-wash":""} onAnimationEnd={(e)=>{ if(e.animationName==='flashWash') setWash(false); }} style={{
              display:"grid", gridTemplateColumns:"1fr auto", alignItems:"center", gap:12, padding:"15px 0", borderBottom:`1px solid ${C.hair}`,
              transform: banish ? "translateX(110%)" : (dip ? "translateY(5px)" : "translateY(0)"),
              opacity: deleting ? 0 : (banish ? 0 : 1),
              transition: deleting
                ? "opacity .22s ease"
                : banish
                  ? "transform .26s cubic-bezier(.34,1.2,.5,1), opacity .22s ease"
                  : "transform .11s cubic-bezier(.4,.0,.2,1)",
            }}>
              <div onClick={begin} style={{ cursor:"pointer", userSelect:"none", position:"relative", display:"inline-block" }}>
                <span ref={nameRef} style={{
                  fontFamily:"'Source Serif 4', Georgia, serif", fontSize:19, fontWeight:500, letterSpacing:-0.2,
                  color: `rgb(${r},${g},${b})`,
                  display:"inline-block",
                }}>{item.title}</span>
                <span style={{
                  position:"absolute", left:0, top:"50%", height:1.5,
                  background: C.accentDeep,
                  width: (width*strike).toFixed(1)+"px",
                  transform:"translateY(-50%)",
                  borderRadius:1,
                  opacity: strike>0?0.85:0,
                }}/>
              </div>
              <Toggle on={done} onClick={begin} />
            </div>
          </SwipeRow>
        </div>
      );
    }

    // Swipe-to-delete row. Drag left (touch or mouse) to reveal a delete button;
    // tap it to confirm. Works reliably in mobile Safari (no native slider needed).
    function SwipeRow({ onDelete, children, variant, bg }) {
      const [dx, setDx] = useState(0);          // current translate
      const [open, setOpen] = useState(false);  // delete revealed
      const startX = useRef(null);
      const startY = useRef(null);
      const axis = useRef(null);                // null | "h" | "v" — locked after first decisive move
      const moved = useRef(false);
      const isTodo = variant === "todo";
      const isFlat = variant === "flat";
      const REVEAL = isTodo ? 80 : 72;
      const ENGAGE = 26;                        // px of horizontal travel before the row follows the finger
      const LOCK = 12;                          // px before we decide scroll vs swipe
      const RESIST = 0.28;                      // row moves at 28% of finger travel — very heavy
      const OPEN_AT = REVEAL * 0.62;            // how far the row must travel to lock open

      const begin = (x, y) => { startX.current = x; startY.current = y; axis.current = null; moved.current = false; };
      const move = (x, y) => {
        if (startX.current === null) return;
        const adx = Math.abs(x - startX.current);
        const ady = Math.abs(y - startY.current);
        // Decide intent once movement is decisive: if mostly vertical, lock to scroll and bail.
        if (axis.current === null && (adx > LOCK || ady > LOCK)) {
          axis.current = adx > ady * 1.6 ? "h" : "v";
        }
        if (axis.current !== "h") return;       // vertical scroll — leave the row alone
        moved.current = true;
        // subtract the engage dead-zone, then apply resistance so the row lags the finger
        const raw = x - startX.current + (open ? -REVEAL/RESIST : 0);
        const past = raw < 0 ? Math.min(0, raw + ENGAGE) : Math.max(0, raw - ENGAGE);
        setDx(Math.max(-REVEAL, Math.min(0, past * RESIST)));
      };
      const end = () => {
        if (startX.current === null) return;
        startX.current = null; startY.current = null;
        if (axis.current !== "h") { axis.current = null; return; }
        axis.current = null;
        const shouldOpen = dx < -OPEN_AT;
        setOpen(shouldOpen);
        setDx(shouldOpen ? -REVEAL : 0);
      };

      return (
        <div style={{ position:"relative", overflow:"hidden" }}>
          {/* delete action behind the row */}
          <div style={{ position:"absolute", top:0, right:0, bottom:0, width:REVEAL, display:"flex", alignItems:"center", justifyContent:"center", background: (isTodo||isFlat) ? "#a85542" : C.red, borderRadius: (isTodo||isFlat) ? 0 : 8 }}>
            <button onClick={()=>{ setOpen(false); setDx(0); onDelete(); }}
              style={{ background:"none", border:"none", color:"#fff", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", width:"100%", height:"100%", padding:0, fontFamily: (isTodo||isFlat) ? "'Source Serif 4', Georgia, serif" : "Inter, sans-serif", fontStyle: (isTodo||isFlat) ? "italic" : "normal", fontSize: (isTodo||isFlat) ? 14 : 13, letterSpacing: (isTodo||isFlat) ? 0.3 : 0 }}>
              {(isTodo||isFlat) ? "delete" : (
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
              )}
            </button>
          </div>
          {/* foreground row */}
          <div
            onTouchStart={e=>begin(e.touches[0].clientX, e.touches[0].clientY)}
            onTouchMove={e=>move(e.touches[0].clientX, e.touches[0].clientY)}
            onTouchEnd={end}
            onClickCapture={e=>{ if (moved.current) { e.stopPropagation(); e.preventDefault(); moved.current=false; } }}
            style={{ background: isTodo ? "#fdfdfc" : (isFlat ? (bg || C.surface) : C.bg), transform:`translateX(${dx}px)`, transition: startX.current===null?"transform 0.2s ease":"none", position:"relative", zIndex:1 }}>
            {children}
          </div>
        </div>
      );
    }

    function ReorderArrows({ onUp, onDown, canUp, canDown }) {
      const btn = enabled => ({
        width:22, height:14, border:"none", borderRadius:4,
        background:C.fieldBg, color: enabled?C.textMuted:C.mutedGray,
        fontSize:9, lineHeight:1, fontFamily:"Inter,sans-serif",
        cursor: enabled?"pointer":"default", padding:0,
      });
      return (
        <div style={{ display:"flex", flexDirection:"column", gap:2 }}>
          <button onClick={onUp} disabled={!canUp} style={btn(canUp)}>▲</button>
          <button onClick={onDown} disabled={!canDown} style={btn(canDown)}>▼</button>
        </div>
      );
    }

    // Running session screen: a big ring + a tree that grows as you run.
    // 30-min cycle (full bloom at 30 min). Grass+trunk sketch in the first ~5s,
    // then branches/leaves/flowers/fruit evolve. Pause holds; Finish records via
    // onFinish(seconds); "See your growth" replays the bloom (<=7s, proportional).
    function RunningGrow({ label, emoji, onFinish, onCancel, C }) {
      const HALF=1800;                 // 30 minutes, in seconds
      const RING=892;                  // 2*pi*142
      const FL=['#c4553f','#e0992f','#d96aa0','#c9b03a','#8f6ad9','#e07a9c'];
      const LEAF='#6fae4f', LEAF2='#82bd5e', BARK='#7a6a55', GRASS='#5fa83f', RASP='#c4553f', BLUE='#5b6fa8';
      const GROUND=210, CX=120;
      const grassFlowers=[{x:46,c:FL[0]},{x:70,c:FL[2]},{x:150,c:FL[1]},{x:178,c:FL[3]},{x:100,c:FL[4]},{x:198,c:FL[5]}];

      const [phase,setPhase]=useState('idle');   // idle|run|paused|done|replay
      const [elapsed,setElapsed]=useState(0);
      const elapsedRef=useRef(0), rafRef=useRef(null), lastRef=useRef(0), speedRef=useRef(1);
      const finalRef=useRef(0), modeRef=useRef('run'), replayTargetRef=useRef(0);
      const [, force]=useState(0);

      const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(sec).padStart(2,'0');};
      const seg=(g,a,b)=>Math.max(0,Math.min(1,(g-a)/(b-a)));
      const easeOut=t=>1-Math.pow(1-t,2.2);

      const flower=(cx,cy,r,color,a)=>{ const R=r*easeOut(a); let s='<g>';
        for(let k=0;k<5;k++){ const ang=(k/5)*Math.PI*2-Math.PI/2; const px=cx+Math.cos(ang)*R*0.66, py=cy+Math.sin(ang)*R*0.66;
          s+=`<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="${(R*0.42).toFixed(1)}" ry="${(R*0.56).toFixed(1)}" fill="${color}" opacity="0.92" transform="rotate(${(ang*180/Math.PI+90).toFixed(0)} ${px.toFixed(1)} ${py.toFixed(1)})"/>`; }
        s+=`<circle cx="${cx}" cy="${cy}" r="${(R*0.32).toFixed(1)}" fill="#fff8e6"/><circle cx="${cx}" cy="${cy}" r="${(R*0.18).toFixed(1)}" fill="#d9a82f"/>`; return s+'</g>'; };
      const raspberry=(cx,cy,r,color,a)=>{ const R=r*easeOut(a); let s='<g>';
        [[0,-R*0.6],[-R*0.55,-R*0.1],[R*0.55,-R*0.1],[-R*0.3,R*0.5],[R*0.3,R*0.5],[0,R*0.05]].forEach(o=>{ s+=`<circle cx="${(cx+o[0]).toFixed(1)}" cy="${(cy+o[1]).toFixed(1)}" r="${(R*0.36).toFixed(1)}" fill="${color}"/>`; }); return s+'</g>'; };
      const blueberry=(cx,cy,r,color,a)=>{ const R=r*easeOut(a);
        return `<circle cx="${cx}" cy="${cy}" r="${R.toFixed(1)}" fill="${color}"/><path d="M${(cx-R*0.4).toFixed(1)} ${(cy-R*0.5).toFixed(1)} L${cx} ${(cy-R*0.2).toFixed(1)} L${(cx+R*0.4).toFixed(1)} ${(cy-R*0.5).toFixed(1)}" stroke="#2f4a6a" stroke-width="0.9" fill="none" stroke-linejoin="round"/>`; };

      const buildTree=(t)=>{
        const g=Math.min(1,t/HALF); let s='';
        const grassA=Math.min(1,t/2.5);
        if(grassA>0){ for(let i=0;i<8;i++){ const x=36+i*27, h=(11+7)*easeOut(grassA); s+=`<path d="M${x} ${GROUND} q -3 ${-h} -1 ${-h-3} M${x} ${GROUND} q 3 ${-h} 1 ${-h-3}" stroke="${GRASS}" stroke-width="2" fill="none" stroke-linecap="round"/>`; }
          s+=`<line x1="18" y1="${GROUND}" x2="222" y2="${GROUND}" stroke="${GRASS}" stroke-width="2" stroke-linecap="round"/>`; }
        const trunkA=Math.min(1,Math.max(0,(t-2.5)/2.5)); const trunkH=120*easeOut(trunkA); const topY=GROUND-trunkH;
        if(trunkH>3){ const wB=7*trunkA+2, wT=3*trunkA+1.5;
          s+=`<path d="M${CX-wB} ${GROUND} C ${CX-wB} ${GROUND-trunkH*0.5}, ${CX-wT} ${GROUND-trunkH*0.8}, ${CX-wT} ${topY} L ${CX+wT} ${topY} C ${CX+wT} ${GROUND-trunkH*0.8}, ${CX+wB} ${GROUND-trunkH*0.5}, ${CX+wB} ${GROUND} Z" fill="${BARK}"/>`;
          if(trunkA>0.6){ const ra=(trunkA-0.6)/0.4; s+=`<path d="M${CX-wB} ${GROUND} q ${-8*ra} -1 ${-12*ra} 3" stroke="${BARK}" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M${CX+wB} ${GROUND} q ${8*ra} -1 ${12*ra} 3" stroke="${BARK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`; } }
        const openA=Math.min(1,Math.max(0,(t-3.5)/1.5));
        if(openA>0){ s+=flower(grassFlowers[0].x,GROUND-6,8,grassFlowers[0].c,openA); s+=flower(grassFlowers[1].x,GROUND-5,8,grassFlowers[1].c,Math.min(1,Math.max(0,(t-4.2)/1.3))); }
        if(trunkA<1) return s;
        const brA=seg(g,0.05,0.22), by=topY+12, L=44*easeOut(brA);
        if(brA>0){ s+=`<path d="M${CX} ${by} q ${-L*0.6} -8 ${-L} -24" stroke="${BARK}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M${CX} ${by} q ${L*0.6} -8 ${L} -24" stroke="${BARK}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M${CX} ${by+16} q ${-L*0.5} -2 ${-L*0.78} -14" stroke="${BARK}" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M${CX} ${by+16} q ${L*0.5} -2 ${L*0.78} -14" stroke="${BARK}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`; }
        const cyTop=topY-22, canA=seg(g,0.18,0.55);
        if(canA>0){ const lobes=[[CX,cyTop-16,28],[CX-32,cyTop+2,24],[CX+32,cyTop+2,24],[CX-15,cyTop-4,22],[CX+15,cyTop-4,22],[CX,cyTop+14,22],[CX-26,cyTop-12,18],[CX+26,cyTop-12,18]];
          let fill=''; lobes.forEach(l=>fill+=`<circle cx="${l[0]}" cy="${l[1]}" r="${(l[2]*canA).toFixed(1)}" fill="#eaf3e4"/>`); s+=`<g>${fill}</g>`;
          lobes.forEach((l,i)=>{ const a=seg(g,0.18+i*0.035,0.3+i*0.035); if(a>0) s+=`<circle cx="${l[0]}" cy="${l[1]}" r="${(l[2]*a).toFixed(1)}" fill="none" stroke="${i%2?LEAF2:LEAF}" stroke-width="2"/>`; }); }
        for(let i=2;i<6;i++){ const a=seg(g,0.3+(i-2)*0.07,0.4+(i-2)*0.07); if(a>0) s+=flower(grassFlowers[i].x,GROUND-(4+(i%3)),8,grassFlowers[i].c,a); }
        const canopyFl=[[CX-30,cyTop+8,FL[5]],[CX+30,cyTop+4,FL[2]],[CX,cyTop-14,FL[4]]];
        canopyFl.forEach((p,i)=>{ const a=seg(g,0.5+i*0.05,0.6+i*0.05); if(a>0) s+=flower(p[0],p[1],6.5,p[2],a); });
        const fruit=[[CX-26,cyTop-2,'r'],[CX+24,cyTop-8,'b'],[CX-8,cyTop+14,'b'],[CX+12,cyTop+10,'r'],[CX+2,cyTop-16,'r'],[CX-20,cyTop+4,'b']];
        fruit.forEach((f,i)=>{ const a=seg(g,0.72+i*0.045,0.82+i*0.045); if(a>0){ s+= f[2]==='r'? raspberry(f[0],f[1],5.5,RASP,a) : blueberry(f[0],f[1],4.6,BLUE,a); } });
        return s;
      };

      const tick=(now)=>{
        const dt=(now-lastRef.current)/1000*speedRef.current; lastRef.current=now;
        let e=elapsedRef.current+dt;
        if(modeRef.current==='replay' && e>=replayTargetRef.current){ e=replayTargetRef.current; elapsedRef.current=e; setElapsed(e); force(x=>x+1); setPhase('done'); return; }
        elapsedRef.current=e; setElapsed(e); force(x=>x+1);
        rafRef.current=requestAnimationFrame(tick);
      };
      const begin=()=>{ modeRef.current='run'; setPhase('run'); elapsedRef.current=0; setElapsed(0); speedRef.current=1; lastRef.current=performance.now(); rafRef.current=requestAnimationFrame(tick); };
      const pauseToggle=()=>{ if(phase==='run'){ cancelAnimationFrame(rafRef.current); setPhase('paused'); } else if(phase==='paused'){ lastRef.current=performance.now(); setPhase('run'); rafRef.current=requestAnimationFrame(tick); } };
      const finish=()=>{ cancelAnimationFrame(rafRef.current); finalRef.current=Math.floor(elapsedRef.current); setPhase('done'); };
      const replay=()=>{ modeRef.current='replay'; replayTargetRef.current=finalRef.current; const dur=Math.min(7,(finalRef.current/HALF)*7)||0.4; speedRef.current=finalRef.current/dur; elapsedRef.current=0; setElapsed(0); setPhase('replay'); lastRef.current=performance.now(); rafRef.current=requestAnimationFrame(tick); };
      useEffect(()=>()=>cancelAnimationFrame(rafRef.current),[]);

      const frac=Math.min(1,(elapsed%HALF)/HALF);
      const treeHTML=buildTree(elapsed);
      const isDone=phase==='done';

      return (
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", paddingTop:6 }}>
          <div style={{ position:"relative", width:300, height:300, margin:"6px 0" }}>
            <svg width="300" height="300" viewBox="0 0 300 300" style={{ position:"absolute", inset:0, transform:"rotate(-90deg)" }}>
              <circle cx="150" cy="150" r="142" fill="none" stroke={C.hair} strokeWidth="6"/>
              <circle cx="150" cy="150" r="142" fill="none" stroke={C.accent} strokeWidth="6" strokeLinecap="round" strokeDasharray={RING} strokeDashoffset={RING*(1-frac)}/>
            </svg>
            <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center" }}>
              <svg width="240" height="240" viewBox="0 0 240 240" dangerouslySetInnerHTML={{__html:treeHTML}} />
            </div>
            {phase==='idle' && (
              <button onClick={begin} style={{ position:"absolute", left:"50%", top:"50%", transform:"translate(-50%,-50%)", width:96, height:96, borderRadius:"50%", background:C.ink, color:"#fff", border:"none", fontFamily:"'Source Serif 4',Georgia,serif", fontSize:18, fontWeight:600, cursor:"pointer", boxShadow:"0 6px 20px -6px rgba(20,40,20,0.4)" }}>Start</button>
            )}
          </div>

          {phase!=='idle' && (
            <div style={{ fontFamily:"'Source Serif 4',Georgia,serif", fontSize:46, fontWeight:600, letterSpacing:-1, fontVariantNumeric:"tabular-nums", color:C.ink, margin:"12px 0 2px" }}>{fmt(elapsed)}</div>
          )}
          <div style={{ fontFamily:"'Source Serif 4',Georgia,serif", fontStyle:"italic", fontSize:13, color:C.mutedGray, minHeight:18 }}>
            {phase==='idle'?'':phase==='run'?'growing as you run':phase==='paused'?'paused':phase==='replay'?'replaying your growth':`recorded · ${fmt(finalRef.current)}`}
          </div>

          {(phase==='run'||phase==='paused') && (
            <div style={{ display:"flex", gap:10, width:"100%", marginTop:18 }}>
              <button onClick={pauseToggle} style={{ flex:1, border:`1px solid ${C.border}`, background:"#fff", color:C.ink, borderRadius:15, padding:16, fontFamily:"'Source Serif 4',Georgia,serif", fontWeight:600, fontSize:16, cursor:"pointer" }}>{phase==='paused'?'Resume':'Pause'}</button>
              <button onClick={finish} style={{ flex:1, border:"none", background:C.ink, color:"#fff", borderRadius:15, padding:16, fontFamily:"'Source Serif 4',Georgia,serif", fontWeight:600, fontSize:16, cursor:"pointer" }}>Finish</button>
            </div>
          )}
          {isDone && (
            <div style={{ width:"100%", marginTop:18, display:"flex", flexDirection:"column", gap:10 }}>
              <button onClick={replay} style={{ width:"100%", border:`1px solid ${C.border}`, background:"#fff", color:C.ink, borderRadius:15, padding:15, fontFamily:"'Source Serif 4',Georgia,serif", fontWeight:600, fontSize:16, cursor:"pointer" }}>See your growth</button>
              <button onClick={()=>onFinish(finalRef.current)} style={{ width:"100%", border:"none", background:C.accent, color:"#fff", borderRadius:15, padding:16, fontFamily:"'Source Serif 4',Georgia,serif", fontWeight:600, fontSize:16, cursor:"pointer" }}>Save run</button>
            </div>
          )}
        </div>
      );
    }

    // Rest timer: idle "rest" button → tap reveals a settable timer (↕ hint inside
    // the ring, number breathing) → scrub up/down (heavy) to set → tap to start the
    // clockwise countdown → scrub still adjusts mid-rest. Reset returns to set state.
    function RestTimer({ prefill, C }) {
      const STEP=52, R=27, CIRC=2*Math.PI*27;
      const SAGE="#85a95f", OVER="#c2843f";
      const [phase,setPhase]=useState('idle'); // idle|set|run  (overtime tracked by overRef)
      const durRef=useRef(prefill||120), remainRef=useRef(prefill||120), totalRef=useRef(prefill||120), overRef=useRef(0);
      const rafRef=useRef(null), lastRef=useRef(0);
      const [,force]=useState(0); const bump=()=>force(x=>x+1);
      const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,'0');};
      const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};

      const tick=(now)=>{ const dt=(now-lastRef.current)/1000; lastRef.current=now;
        if(overRef.current>0){ overRef.current+=dt; }
        else { remainRef.current-=dt; if(remainRef.current<=0){ remainRef.current=0; overRef.current=0.01; vib([30,50,30]); } }
        bump(); rafRef.current=requestAnimationFrame(tick); };
      useEffect(()=>()=>cancelAnimationFrame(rafRef.current),[]);

      const reveal=()=>{ setPhase('set'); durRef.current=prefill||120; overRef.current=0; vib(12); bump(); };
      const startCountdown=()=>{ totalRef.current=remainRef.current=durRef.current; overRef.current=0; setPhase('run'); lastRef.current=performance.now(); vib(16); rafRef.current=requestAnimationFrame(tick); };
      const reset=()=>{ cancelAnimationFrame(rafRef.current); remainRef.current=durRef.current; overRef.current=0; setPhase('set'); vib(12); bump(); };
      const dismiss=()=>{ cancelAnimationFrame(rafRef.current); overRef.current=0; setPhase('idle'); vib(12); bump(); };
      const adjust=(sec)=>{ if(phase==='set'){ durRef.current=Math.max(15,durRef.current+sec); } else if(phase==='run'&&overRef.current===0){ remainRef.current=Math.max(5,remainRef.current+sec); totalRef.current=Math.max(totalRef.current,remainRef.current); } else return; vib(sec>0?[22,14,22]:18); bump(); };

      const dragRef=useRef({on:false,moved:false,y:0,acc:0});
      const onDown=e=>{ if(phase==='idle')return; const d=dragRef.current; d.on=true; d.moved=false; d.y=(e.touches?e.touches[0]:e).clientY; d.acc=0; };
      const onMove=e=>{ const d=dragRef.current; if(!d.on)return; const y=(e.touches?e.touches[0]:e).clientY; const dy=d.y-y; if(Math.abs(dy)>6)d.moved=true; const st=Math.trunc((dy-d.acc)/STEP); if(st!==0){ adjust(st*15); d.acc+=st*STEP; } if(e.cancelable)e.preventDefault(); };
      const onUp=()=>{ const d=dragRef.current; if(!d.on)return; d.on=false; if(!d.moved && phase==='set') startCountdown(); };

      if(phase==='idle'){
        return (
          <button onClick={reveal} style={{ fontFamily:"Georgia,serif", fontStyle:"italic", fontSize:15, color:C.textMuted, background:"transparent", border:`1px solid ${C.border}`, borderRadius:16, padding:"13px 24px", cursor:"pointer", marginTop:4 }}>rest</button>
        );
      }
      const settable=phase==='set';
      const over=overRef.current>0;
      const frac=over?1:(phase==='run'? (totalRef.current>0?remainRef.current/totalRef.current:0) : 1);
      const num = settable ? fmt(durRef.current) : (over ? "+"+fmt(overRef.current) : fmt(remainRef.current));
      const ringColor = settable ? "#cbd8c0" : (over ? OVER : SAGE);
      const numColor = over ? OVER : C.ink;
      const sub = settable ? "set rest · tap to start" : (over ? "overtime" : "resting");
      return (
        <div style={{ position:"relative", display:"flex", alignItems:"center", gap:22, marginTop:6 }}>
          <div style={{ display:"flex", alignItems:"center", gap:20, touchAction:"none", borderRadius:18, padding:"6px 8px 6px 4px" }}
               onTouchStart={onDown} onTouchMove={onMove} onTouchEnd={onUp}
               onMouseDown={onDown} onMouseMove={e=>dragRef.current.on&&onMove(e)} onMouseUp={onUp}>
            <div style={{ position:"relative", width:74, height:74, flexShrink:0 }}>
              <svg width="74" height="74" viewBox="0 0 74 74" style={{ position:"absolute", inset:0, transform:"scale(-1,1)" }}>
                <circle cx="37" cy="37" r={R} fill="none" stroke={C.hair} strokeWidth="4"/>
                <circle cx="37" cy="37" r={R} fill="none" stroke={ringColor} strokeWidth="4" strokeLinecap="round"
                  strokeDasharray={CIRC} strokeDashoffset={CIRC*(1-frac)} transform="rotate(-90 37 37)"/>
              </svg>
              {settable && (
                <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", opacity:0.5 }}>
                  <svg width="12" height="28" viewBox="0 0 12 28" fill="none"><path d="M6 3V25" stroke="#8a978d" strokeWidth="1.4" strokeLinecap="round"/><path d="M2 7L6 3L10 7" stroke="#8a978d" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/><path d="M2 21L6 25L10 21" stroke="#8a978d" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
                </div>
              )}
            </div>
            <div>
              <div style={{ fontFamily:"Georgia,serif", fontSize:31, fontWeight:600, color: numColor, fontVariantNumeric:"tabular-nums", letterSpacing:-0.5, lineHeight:1, animation: settable?"restBreathe 2.4s ease-in-out infinite":"none" }}>{num}</div>
              <div style={{ fontFamily:"Georgia,serif", fontStyle:"italic", fontSize:12, color: over?OVER:C.mutedGray, marginTop:4 }}>{sub}</div>
            </div>
          </div>
          <div style={{ display:"flex", gap:8, marginLeft:"auto" }}>
            <button onClick={(e)=>{ e.stopPropagation(); dismiss(); }} title="done" style={{ width:34, height:34, borderRadius:10, border:`1px solid #cfd9c2`, background:"#f1f5ec", display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer" }}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="#5c8a3f" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </button>
            <button onClick={(e)=>{ e.stopPropagation(); reset(); }} title="reset" style={{ width:34, height:34, borderRadius:10, border:`1px solid ${C.border}`, background:"transparent", display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer" }}>
              <svg width="15" height="15" viewBox="0 0 18 18" fill="none"><path d="M3.5 9a5.5 5.5 0 1 1 1.7 4" stroke={C.textMuted} strokeWidth="1.6" strokeLinecap="round"/><path d="M5 16.5L5.2 12L9.5 12.2" stroke={C.textMuted} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </button>
          </div>
        </div>
      );
    }

    // Workout picker list with "settle" press animation: the chosen row scales up
    // and goes green, the others part vertically and fade, and onPick fires at the
    // motion peak (~120ms) so the session screen overlaps the tail — no perceived wait.
    function WorkoutSettleList({ types, onPick, C }) {
      const [active, setActive] = useState(null); // index being pressed
      const lockRef = useRef(false);              // sync guard vs React's async batching

      const press = (idx, key) => {
        if (lockRef.current) return;
        lockRef.current = true;
        setActive(idx);
        if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
        setTimeout(() => onPick(key), 120);
        setTimeout(() => { setActive(null); lockRef.current = false; }, 260);
      };

      return (
        <div>
          {types.map((w, i) => {
            const isActive = active === i;
            const isOther  = active !== null && active !== i;
            const dir = active !== null ? (i < active ? -1 : 1) : 0;
            return (
              <div key={w.key} onClick={() => press(i, w.key)} style={{
                display:"grid", gridTemplateColumns:"30px 1fr auto", alignItems:"center", gap:16,
                padding:"16px 2px", borderBottom:`1px solid ${C.hair}`, cursor:"pointer", userSelect:"none",
                transform: isActive ? "scale(1.04)" : isOther ? `translateY(${dir*14}px)` : "none",
                opacity: isOther ? 0.2 : 1,
                transition: "transform 0.22s cubic-bezier(0.22,1,0.36,1), opacity 0.22s ease",
                willChange: "transform",
              }}>
                <div style={{ fontSize:21, textAlign:"center", opacity:0.9 }}>{w.emoji}</div>
                <div style={{
                  fontFamily:"'Source Serif 4', Georgia, serif", fontSize:20, fontWeight:500,
                  letterSpacing:-0.2, color: isActive ? C.accentDeep : C.ink,
                  transition:"color 0.2s ease",
                }}>{w.label}</div>
                <div style={{ color:"#cfc7b8", fontSize:19, fontFamily:"'Source Serif 4', Georgia, serif" }}>›</div>
              </div>
            );
          })}
        </div>
      );
    }

    // Minimal habit row: emoji column, name/sub, optional stepper, square check.
    // Done state B: thick lime left edge + check halo. Bigger type.
    function HabitCard({ active, emoji, label, sublabel, onToggle, stepper, children }) {
      return (
        <div>
          <div style={{
            display:"grid", gridTemplateColumns:"28px 1fr auto auto", alignItems:"center", gap:15,
            padding:"17px 0",
            borderBottom:`1px solid ${C.hair}`,
          }}>
            <div onClick={onToggle} style={{ fontSize:20, textAlign:"center", cursor:"pointer" }}>{emoji}</div>
            <div onClick={onToggle} style={{ minWidth:0, cursor:"pointer", userSelect:"none" }}>
              <div style={{ fontFamily:"'Source Serif 4', Georgia, serif", color: active?C.accentDeep:C.ink, fontSize:20, fontWeight: active?600:500, letterSpacing:-0.2 }}>{label}</div>
              {sublabel ? <div style={{ color:C.faint||"#b0aaa0", fontSize:12, marginTop:2, fontWeight:450 }}>{sublabel}</div> : null}
            </div>
            <div style={{ display:"flex", alignItems:"center" }}>{stepper}</div>
            <Toggle on={active} onClick={onToggle} />
          </div>
          {children}
        </div>
      );
    }

    function EmojiPalette({ selected, onSelect }) {
      return (
        <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:14 }}>
          {EMOJI_PRESETS.map(e => (
            <button key={e} onClick={()=>onSelect(e)} style={{
              width:34, height:34, fontSize:18, borderRadius:8,
              background: selected===e ? `${C.accent}` : "#ffffff",
              border: selected===e ? "none" : `1px solid ${C.border}`,
              cursor:"pointer", fontFamily:"Inter,sans-serif",
              boxShadow:"none",
            }}>{e}</button>
          ))}
        </div>
      );
    }

    function SavedToast({ show }) {
      if (!show) return null;
      return <div style={{ textAlign:"center", marginTop:16, color:C.greenText, fontSize:11, letterSpacing:2, fontWeight:700 }}>✓ SAVED</div>;
    }

    // Running elapsed time since the session started — ticks every second.
    function SessionElapsed({ startedAt, color }) {
      const [, force] = useState(0);
      useEffect(() => {
        if (!startedAt) return;
        const id = setInterval(() => force(x => x+1), 1000);
        return () => clearInterval(id);
      }, [startedAt]);
      if (!startedAt) return null;
      const secs = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
      const h = Math.floor(secs/3600), m = Math.floor((secs%3600)/60), s = secs%60;
      const pad = n => String(n).padStart(2,"0");
      const txt = h>0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
      return <span style={{ fontVariantNumeric:"tabular-nums" }}>{txt}</span>;
    }

    function SectionDivider({ children }) {
      return <div style={{ paddingTop:20, marginTop:8 }}>{children}</div>;
    }

    // ═══ MAIN APP ════════════════════════════════════════════════════════════
    function App() {
      // Auth
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [syncing, setSyncing] = useState(false);
      const [loginMode, setLoginMode] = useState("choose"); // "choose" | "signin" | "create" | "reset"
      const [loginEmail, setLoginEmail] = useState("");
      const [loginPassword, setLoginPassword] = useState("");
      const [loginError, setLoginError] = useState("");
      const [loginBusy, setLoginBusy] = useState(false);
      const [loginInfo, setLoginInfo] = useState("");
      const [linkPanelOpen, setLinkPanelOpen] = useState(false);
      const [linkEmail, setLinkEmail] = useState("");
      const [linkPassword, setLinkPassword] = useState("");
      const [linkBusy, setLinkBusy] = useState(false);
      const [linkError, setLinkError] = useState("");
      const [linkSuccess, setLinkSuccess] = useState("");
      const [linkedRefresh, setLinkedRefresh] = useState(0);

      // Core
      const [data, setData] = useState({ ...DEFAULT_DATA, startDate: localDateKey(new Date()) });
      const [activeTab, setActiveTab] = useState("day");
      const [viewDate, setViewDate] = useState(localDateKey(new Date()));
      const [todayLog, setTodayLog] = useState(blankLog());
      const [saved, setSaved] = useState(false);

      // UI flags
      const [showWorkoutPicker, setShowWorkoutPicker] = useState(false);
      const [editingDate, setEditingDate] = useState(null);
      const [newHabitName, setNewHabitName] = useState("");
      const [newHabitEmoji, setNewHabitEmoji] = useState("");
      const [editingEmojiFor, setEditingEmojiFor] = useState(null);
      const [newExerciseName, setNewExerciseName] = useState("");
      const [editingExercise, setEditingExercise] = useState(null); // exId being renamed
      const [wigIdx, setWigIdx] = useState(null);                   // exIdx currently wiggling (per-exercise), or null
      const [drag, setDrag] = useState(null);                       // {fromIdx,curIdx,y}
      const [pendingDelEx, setPendingDelEx] = useState(null);       // exId awaiting delete confirm
      const [currentExId, setCurrentExId] = useState(null);         // exId user is actively working in (overrides auto)
      const dragRef = useRef({ startY:0, offset:0, slots:[], fromIdx:-1 });
      const exPressRef = useRef({ timer:null, x:0, y:0 });
      const tapRef = useRef({ last:0 });
      const [historyView, setHistoryView] = useState("workouts"); // workouts | daily
      const [expandedFeedId, setExpandedFeedId] = useState(null);
      const [calMonthOffset, setCalMonthOffset] = useState(0); // 0 = current month, -1 = last month, etc.
      const [libraryNewByType, setLibraryNewByType] = useState({});
      const [chartExpandedFor, setChartExpandedFor] = useState(null); // exercise name
      const [chartMetric, setChartMetric] = useState("top"); // top (weight) | volume
      const [chartRange, setChartRange] = useState("3M");      // 1M | 3M | 1Y
      const [forcePicker, setForcePicker] = useState(false); // "back" to picker/breakdown even with a session
      const [activeSessionId, setActiveSessionId] = useState(null); // which of a day's sessions is open for editing
      // Rest timer: endAt is an absolute epoch ms (survives lock/app-switch); duration for the progress bar.
      const [restEndAt, setRestEndAt] = useState(null);
      const [restDuration, setRestDuration] = useState(0);
      const [restNow, setRestNow] = useState(Date.now());
      const [restDone, setRestDone] = useState(false);   // briefly true when it hits zero (for pulse)
      const [setPromptFor, setSetPromptFor] = useState(null); // "exId:idx" whose preset chooser is open
      // Run timer (count-UP stopwatch for cardio). runStartAt = absolute epoch ms when started; null = stopped.
      const [runExId, setRunExId] = useState(null);       // which exercise's run timer is active
      const [runStartAt, setRunStartAt] = useState(null); // epoch ms the run began
      const [runNow, setRunNow] = useState(Date.now());   // ticking clock
      const [durationInput, setDurationInput] = useState(""); // manual minutes entry for swimming/cycling

      // Todo tab state
      const [showDoneToday, setShowDoneToday] = useState(false);
      const [quickAddDraft, setQuickAddDraft] = useState("");

      const yearScrollRef = useRef(null);
      const today = localDateKey(new Date());

      // ─── Centralized data update ────────────────────────────────────────
      const update = useCallback(patch => {
        setData(prev => {
          const next = typeof patch === "function" ? patch(prev) : { ...prev, ...patch };
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch(e) {}
          if (user && window.__firebase) window.__firebase.saveData(user.uid, next);
          setSaved(true);
          setTimeout(() => setSaved(false), 1500);
          return next;
        });
      }, [user]);

      // ─── Auth ───────────────────────────────────────────────────────────
      useEffect(() => {
        let settled = false;
        const finish = () => { if (!settled) { settled = true; setAuthLoading(false); } };

        // Fallback: if Firebase never initializes (script blocked, offline, slow),
        // give up after 5s, load whatever is in localStorage, and show the app anyway.
        const fallbackTimer = setTimeout(() => {
          if (settled) return;
          try {
            const local = localStorage.getItem(STORAGE_KEY);
            if (local) {
              const migrated = migrateData({ ...DEFAULT_DATA, ...JSON.parse(local) });
              setData(migrated);
              const tl = migrated.logs && migrated.logs[today];
              if (tl) setTodayLog(tl);
            }
          } catch (e) { console.error("Local fallback error:", e); }
          finish();
        }, 5000);

        const wait = () => {
          if (!window.__firebase) {
            window.addEventListener("firebaseReady", wait, { once:true });
            return;
          }
          window.__firebase.onAuthStateChanged(async u => {
            try {
              setUser(u);
              if (u) {
                setSyncing(true);
                const loaded = await window.__firebase.loadData(u.uid);
                if (loaded) {
                  const migrated = migrateData({ ...DEFAULT_DATA, ...loaded });
                  setData(migrated);
                  const tl = migrated.logs && migrated.logs[today];
                  if (tl) setTodayLog(tl);
                }
                setSyncing(false);
              }
              clearTimeout(fallbackTimer);
              finish();
            } catch (err) {
              console.error("Load error:", err);
              setSyncing(false);
              clearTimeout(fallbackTimer);
              finish();
            }
          });
        };
        wait();
        return () => clearTimeout(fallbackTimer);
      }, [today]);

      // ─── Sync local todayLog when viewDate changes ──────────────────────
      useEffect(() => {
        const existing = data.logs[viewDate];
        setTodayLog(existing ? { ...existing } : { ...blankLog() });
        setShowWorkoutPicker(false);
      }, [viewDate, data.logs]);

      // ─── Year tab auto-scroll ───────────────────────────────────────────
      useEffect(() => {
        if (activeTab !== "year") return;
        let cancelled = false;
        const doScroll = () => {
          if (cancelled) return;
          const container = yearScrollRef.current;
          if (!container) return;
          const todayCol = container.querySelector('[data-today="1"]');
          if (!todayCol) { requestAnimationFrame(doScroll); return; }
          const cRect = container.getBoundingClientRect();
          const tRect = todayCol.getBoundingClientRect();
          const todayPos = container.scrollLeft + (tRect.left - cRect.left);
          container.scrollLeft = Math.max(0, todayPos - 22 - 38);
        };
        requestAnimationFrame(() => requestAnimationFrame(doScroll));
        return () => { cancelled = true; };
      }, [activeTab]);

      // ─── Rest timer ─────────────────────────────────────────────────────
      // Tick once per second while a timer is running; uses absolute endAt so it
      // stays accurate across screen-lock / app-switch.
      useEffect(() => {
        if (!restEndAt) return;
        const id = setInterval(() => setRestNow(Date.now()), 250);
        return () => clearInterval(id);
      }, [restEndAt]);

      const restRemaining = restEndAt ? Math.max(0, Math.round((restEndAt - restNow)/1000)) : 0;

      const fireRestAlert = () => {
        const cfg = data.restTimer || DEFAULT_DATA.restTimer;
        if (cfg.vibrate && navigator.vibrate) { try { navigator.vibrate([200,100,200]); } catch(e){} }
        if (cfg.sound) {
          try {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            const ac = new Ctx();
            [0, 0.25].forEach(t => {
              const o = ac.createOscillator(), g = ac.createGain();
              o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
              g.gain.setValueAtTime(0.0001, ac.currentTime + t);
              g.gain.exponentialRampToValueAtTime(0.4, ac.currentTime + t + 0.02);
              g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.2);
              o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.22);
            });
          } catch(e) {}
        }
      };

      // Detect the moment the timer crosses zero.
      useEffect(() => {
        if (restEndAt && restRemaining === 0) {
          fireRestAlert();
          setRestEndAt(null);
          const cfg = data.restTimer || DEFAULT_DATA.restTimer;
          if (cfg.visual) {
            setRestDone(true);
            const t = setTimeout(() => setRestDone(false), 2500);
            return () => clearTimeout(t);
          }
        }
      }, [restRemaining, restEndAt]);

      const startRest = sec => { setRestDone(false); setRestDuration(sec); setRestEndAt(Date.now() + sec*1000); setSetPromptFor(null); };
      const addRest   = sec => { if (restEndAt) { setRestEndAt(restEndAt + sec*1000); setRestDuration(d => d + sec); } };
      // Record rest seconds on a specific set, then (if >0) start the countdown.
      const chooseRest = (exId, idx, sec) => {
        mapExercises(e => e.id===exId
          ? { ...e, sets: e.sets.map((st,i) => i===idx ? { ...st, rest: sec } : st) }
          : e);
        setSetPromptFor(null);
        if (sec > 0) startRest(sec); else setRestDone(false);
      };
      const skipRest  = () => { setRestEndAt(null); setRestDone(false); };

      // ─── Run timer (count-up stopwatch) ─────────────────────────────────
      useEffect(() => {
        if (!runStartAt) return;
        const id = setInterval(() => setRunNow(Date.now()), 250);
        return () => clearInterval(id);
      }, [runStartAt]);

      const runElapsed = runStartAt ? Math.max(0, Math.floor((runNow - runStartAt)/1000)) : 0;

      const startRun = exId => { setRunExId(exId); setRunNow(Date.now()); setRunStartAt(Date.now()); };
      const stopRun = () => {
        const secs = runElapsed;
        if (runExId && secs > 0) {
          // Record the run as a set: store seconds in a `duration` field on a new/first set.
          mapExercises(e => {
            if (e.id !== runExId) return e;
            const sets = [ ...(e.sets||[]), { duration: secs, weight:0, reps:0, done:true } ];
            return { ...e, sets, done:true };
          });
        }
        setRunStartAt(null); setRunExId(null);
      };
      const cancelRun = () => { setRunStartAt(null); setRunExId(null); };
      const fmtStopwatch = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
      const fmtDuration = s => {
        const m = Math.round(s/60);
        if (m < 60) return `${m} min`;
        const h = Math.floor(m/60), rm = m%60;
        return rm ? `${h}h ${rm}m` : `${h}h`;
      };

      // ─── Timed-session helpers (Running / Swimming / Cycling) ───────────
      // Each bout is stored as one entry in the session's exercises array:
      //   { id, name:<type label>, sets:[{ duration: seconds, done:true }], done:true }
      const SESSION_RUN_ID = "__session_timer__";
      const logSessionBout = seconds => {
        if (!activeSession || seconds <= 0) return;
        const w = WORKOUT_TYPES.find(t => t.key === activeSession.type);
        const entry = { id:`bout_${Date.now()}`, name:(w?w.label:"Session"), sets:[{ duration: seconds, done:true }], notes:"", done:true };
        const next = todaySessions.map(s => s.id===activeSession.id ? { ...s, exercises:[...(s.exercises||[]), entry] } : s);
        writeSessions(today, next);
      };
      const deleteSessionBout = boutId => {
        if (!activeSession) return;
        const next = todaySessions.map(s => s.id===activeSession.id ? { ...s, exercises:(s.exercises||[]).filter(e => e.id!==boutId) } : s);
        writeSessions(today, next);
      };
      // Session-level stopwatch (for Running) — reuses run timer state with a sentinel id.
      const startSessionRun = () => { setRunExId(SESSION_RUN_ID); setRunNow(Date.now()); setRunStartAt(Date.now()); };
      const stopSessionRun = () => { const secs = runElapsed; if (secs > 0) logSessionBout(secs); setRunStartAt(null); setRunExId(null); };


      const hiddenBuiltins = asArray(data.hiddenBuiltins);
      const activeBuiltins = BUILTIN_HABITS.filter(h => !hiddenBuiltins.includes(h.key));

      const allActiveHabits = useMemo(() => {
        const items = [
          ...activeBuiltins.map(h => ({ ...h, isBuiltin:true })),
          ...asArray(data.customHabits).map(h => ({ ...h, isBuiltin:false })),
        ];
        const order = asArray(data.habitOrder);
        if (!order.length) return items;
        const sorted = order.map(k => items.find(h => h.key===k)).filter(Boolean);
        const remaining = items.filter(h => !order.includes(h.key));
        return [...sorted, ...remaining];
      }, [data.hiddenBuiltins, data.customHabits, data.habitOrder]);

      const streak = useMemo(() => {
        let count = 0;
        const d = new Date();
        while (true) {
          const log = data.logs[localDateKey(d)];
          if (!hasAnyHabit(log, data.customHabits)) break;
          count++;
          d.setDate(d.getDate()-1);
        }
        return count;
      }, [data.logs, data.customHabits]);

      const dayCount = useMemo(() => {
        // Day of year: Jan 1 = 1, Dec 31 = 365 (or 366 in leap year)
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 1);
        return Math.floor((now - start) / 86400000) + 1;
      }, []);

      // ─── Workout session accessors (array model) ────────────────────────
      const sessionsOn = date => (data.workoutSessions||{})[date] || [];
      const todaySessions = sessionsOn(today);
      // The session currently open for editing (defaults to the most recent today).
      const activeSession = activeSessionId
        ? todaySessions.find(s => s.id === activeSessionId) || null
        : null;
      const selectedWorkout = activeSession ? WORKOUT_TYPES.find(w => w.key === activeSession.type) : null;

      // ─── Action: habits ─────────────────────────────────────────────────
      const toggleHabit = key => {
        const newLog = { ...todayLog, [key]: !todayLog[key] };
        setTodayLog(newLog);
        update({ logs: { ...data.logs, [viewDate]: newLog } });
      };

      const selectWorkout = type => {
        const newLog = { ...todayLog, workout: todayLog.workout===type ? null : type };
        setTodayLog(newLog);
        update({ logs: { ...data.logs, [viewDate]: newLog } });
        setShowWorkoutPicker(false);
      };

      const updateRestTimer = patch => update({ restTimer: { ...(data.restTimer||DEFAULT_DATA.restTimer), ...patch } });

      const addCustomHabit = () => {
        const name = newHabitName.trim();
        if (!name) return;
        const key = "custom_" + name.toLowerCase().replace(/[^a-z0-9]/g,"_") + "_" + Date.now().toString(36);
        update({ customHabits: [...(data.customHabits||[]), { key, label:name, emoji: (newHabitEmoji||"").trim() }] });
        setNewHabitName("");
        setNewHabitEmoji("");
      };

      const updateHabitEmoji = (key, emoji) =>
        update({ customHabits: (data.customHabits||[]).map(h => h.key===key ? { ...h, emoji } : h) });

      const renameHabit = (key, label) => {
        const name = (label||"").trim();
        if (!name) return; // ignore empty — keep the old name
        update({ customHabits: (data.customHabits||[]).map(h => h.key===key ? { ...h, label: name } : h) });
      };

      const deleteCustomHabit = key => {
        if (!window.confirm("Delete this habit? It will be removed from all logged days.")) return;
        const newLogs = { ...data.logs };
        Object.keys(newLogs).forEach(d => {
          if (newLogs[d][key] !== undefined) {
            newLogs[d] = { ...newLogs[d] };
            delete newLogs[d][key];
          }
        });
        update({
          customHabits: (data.customHabits||[]).filter(h => h.key!==key),
          logs: newLogs,
        });
      };

      const toggleBuiltin = key => {
        const cur = data.hiddenBuiltins || [];
        update({ hiddenBuiltins: cur.includes(key) ? cur.filter(k=>k!==key) : [...cur, key] });
      };

      const moveHabit = (key, dir) => {
        const keys = allActiveHabits.map(h => h.key);
        const idx = keys.indexOf(key);
        const newIdx = idx + dir;
        if (idx<0 || newIdx<0 || newIdx>=keys.length) return;
        const newOrder = [...keys];
        [newOrder[idx], newOrder[newIdx]] = [newOrder[newIdx], newOrder[idx]];
        update({ habitOrder: newOrder });
      };

      // ─── Action: history ────────────────────────────────────────────────
      const toggleDayHabit = (date, habit) => {
        const cur = data.logs[date] || blankLog();
        const newLog = { ...cur, [habit]: !cur[habit] };
        update({ logs: { ...data.logs, [date]: newLog } });
        if (date === today) setTodayLog({ ...todayLog, ...newLog });
      };

      const setDayWorkout = (date, type) => {
        const cur = data.logs[date] || blankLog();
        const newLog = { ...cur, workout: cur.workout===type ? null : type };
        update({ logs: { ...data.logs, [date]: newLog } });
        if (date === today) setTodayLog({ ...todayLog, ...newLog });
      };

      const deleteDay = date => {
        const newLogs = { ...data.logs };
        delete newLogs[date];
        update({ logs: newLogs });
        if (date === today) setTodayLog(blankLog());
        setEditingDate(null);
      };


      // ─── Action: workout sessions (array model) ─────────────────────────
      // Single source of truth for writing a day's sessions. Also DERIVES the
      // habit log's workout flag from the sessions so the two never drift:
      //   ≥1 session  → logs[date].workout = most-recent session's type
      //   0 sessions  → logs[date].workout = null  (habit row unchecks)
      const writeSessions = (date, sessions) => {
        const nextWS = { ...(data.workoutSessions||{}) };
        if (sessions.length === 0) delete nextWS[date];
        else nextWS[date] = sessions;
        const curLog = data.logs[date] || blankLog();
        const derivedType = sessions.length ? sessions[sessions.length-1].type : null;
