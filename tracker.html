<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tracker" />
  <title>Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f0e8; font-family: Georgia, serif; }
    input:focus { outline: 2px solid #c17f24; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAxyUfbjCJqBihgqt27I3r8NEnDzBv0870",
      authDomain: "tracker-2e97e.firebaseapp.com",
      projectId: "tracker-2e97e",
      storageBucket: "tracker-2e97e.firebasestorage.app",
      messagingSenderId: "415883101548",
      appId: "1:415883101548:web:2fe1b2d516d0b8713adf49"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.__firebase = {
      signIn: () => signInWithPopup(auth, provider).catch(e => alert("Sign-in error: " + e.message)),
      signOut: () => signOut(auth),
      onAuthStateChanged: (cb) => onAuthStateChanged(auth, cb),
      saveData: async (uid, data) => {
        await setDoc(doc(db, "users", uid), data);
        try { localStorage.setItem("tef_tracker_v2", JSON.stringify(data)); } catch(e) {}
      },
      loadData: async (uid) => {
        try {
          const snap = await getDoc(doc(db, "users", uid));
          if (snap.exists()) return snap.data();
        } catch(e) {}
        try {
          const local = localStorage.getItem("tef_tracker_v2");
          if (local) return JSON.parse(local);
        } catch(e) {}
        return null;
      }
    };
    window.dispatchEvent(new Event("firebaseReady"));
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ═══ CONSTANTS ═══════════════════════════════════════════════════════════
    const STORAGE_KEY = "tef_tracker_v2";

    const C = {
      bg:"#f5f0e8", card:"#ede8df", cardActive:"#e8f0e4",
      border:"#ddd8ce", borderActive:"#a8c8a0",
      text:"#2c2416", textMuted:"#8c7e6a", mutedGray:"#c0b8a8",
      accent:"#c17f24", green:"#4a8c4a", red:"#c44",
      workoutOnly:"#2d6a2d",
    };
    const HEAT = { 0:"#e8e2d6", 1:"#f5c98a", 2:"#e89a3c", 3:"#c46d10", 4:"#7a3f08", future:"#f5f0e8" };
    const MONTH_LABELS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    const MILESTONES = [
      { month:1, label:"Month 1",    pimsleur:30,  comprehension:60, innerFrench:12 },
      { month:2, label:"Month 2",    pimsleur:60,  comprehension:75, innerFrench:24 },
      { month:3, label:"Month 3",    pimsleur:90,  comprehension:85, innerFrench:36 },
      { month:6, label:"Exam Ready", pimsleur:180, comprehension:95, innerFrench:72 },
    ];

    const EMOJI_PRESETS = ["📌","📚","✍️","💪","🧘","🏃","🚴","🥗","💧","☕","🌱","💊","🧠","💤","🎵","🎨","💼","💰","🙏","❤️","🌅","📖"];

    const BUILTIN_HABITS = [
      { key:"pimsleur",    emoji:"🎧", label:"Pimsleur",    countField:"pimsleurTotal",    sublabelFn:d=>`Logging lesson ${d.pimsleurTotal||0}` },
      { key:"anki",        emoji:"🃏", label:"Flash cards", sublabelFn:()=>"20 new cards + reviews" },
      { key:"innerFrench", emoji:"🎙️", label:"Inner French", countField:"innerFrenchTotal", sublabelFn:d=>`Logging episode ${d.innerFrenchTotal||0}` },
      { key:"workout",     emoji:"🏋️", label:"Workout",     sublabelFn:()=>"Gym, cardio, recovery…" },
      { key:"eartest",     emoji:"👂", label:"Ear Test",    sublabelFn:()=>"Inner French audio-only %" },
    ];

    const WORKOUT_TYPES = [
      { key:"push",     label:"Push",     emoji:"💪" },
      { key:"pull",     label:"Pull",     emoji:"🏋️" },
      { key:"legs",     label:"Legs",     emoji:"🦵" },
      { key:"upper",    label:"Upper",    emoji:"🙆" },
      { key:"lower",    label:"Lower",    emoji:"🧎" },
      { key:"cardio",   label:"Cardio",   emoji:"🏃" },
      { key:"recovery", label:"Recovery", emoji:"🧘" },
    ];

    const EXERCISE_PRESETS = {
      push:    ["Bench Press","Overhead Press","Incline Dumbbell Press","Push-ups","Tricep Pushdown","Lateral Raise","Dips","Chest Fly"],
      pull:    ["Pull-ups","Barbell Row","Lat Pulldown","Seated Cable Row","Face Pull","Bicep Curl","Hammer Curl","Reverse Fly"],
      legs:    ["Back Squat","Romanian Deadlift","Leg Press","Walking Lunge","Leg Curl","Leg Extension","Calf Raise","Hip Thrust","Bulgarian Split Squat"],
      upper:   ["Bench Press","Overhead Press","Pull-ups","Barbell Row","Dumbbell Curl","Tricep Extension"],
      lower:   ["Back Squat","Deadlift","Leg Press","Walking Lunge","Calf Raise","Hip Thrust"],
      cardio:  ["Running","Cycling","Rowing","Stairmaster","Incline Walk"],
      recovery:["Foam Rolling","Stretching","Yoga","Walk","Mobility Drills"],
    };

    const TABS = [
      { key:"day", label:"day" }, { key:"workout", label:"workout" },
      { key:"progress", label:"progress" }, { key:"year", label:"year" },
      { key:"history", label:"history" }, { key:"settings", label:"settings" },
    ];

    const DEFAULT_DATA = {
      startDate: "", logs: {}, comprehensionLog: [],
      pimsleurTotal: 14, innerFrenchTotal: 2,
      customHabits: [], hiddenBuiltins: [], habitOrder: [],
      workoutSessions: {}, customExercises: {}, exerciseOrder: {},
      hiddenPresets: {}, renamedPresets: {},
    };

    // ═══ SHARED STYLES ═══════════════════════════════════════════════════════
    const S = {
      card:        { background:C.card, borderRadius:14, padding:16, border:`1px solid ${C.border}`, marginBottom:12, boxShadow:"0 1px 3px rgba(0,0,0,0.06)" },
      cardActive:  { background:C.cardActive, borderRadius:14, padding:16, border:`1px solid ${C.borderActive}`, marginBottom:12, boxShadow:"0 1px 3px rgba(0,0,0,0.06)" },
      sectionLabel:{ fontSize:11, letterSpacing:2, color:C.textMuted, textTransform:"uppercase", marginBottom:16 },
      smallLabel:  { fontSize:11, color:C.textMuted, textTransform:"uppercase", letterSpacing:1, marginBottom:10 },
      pillBtn:     { background:C.bg, border:`1px solid ${C.border}`, borderRadius:8, color:C.textMuted, fontSize:11, padding:"6px 14px", cursor:"pointer", fontFamily:"Georgia,serif" },
      pillBtnOn:   { background:C.green, border:`1px solid ${C.green}`, borderRadius:8, color:"#fff", fontSize:11, padding:"6px 14px", cursor:"pointer", fontFamily:"Georgia,serif" },
      input:       { background:C.bg, border:`1px solid ${C.border}`, borderRadius:8, color:C.text, fontSize:14, padding:"10px 12px", fontFamily:"Georgia,serif" },
      primaryBtn:  { background:C.accent, border:"none", borderRadius:8, color:"#fff", fontSize:13, fontWeight:"bold", padding:"10px 16px", cursor:"pointer", fontFamily:"Georgia,serif" },
      dangerBtn:   { width:"100%", padding:"14px", borderRadius:14, background:"none", border:`1px solid ${C.red}`, color:C.red, fontSize:14, cursor:"pointer", fontFamily:"Georgia,serif" },
      bodyPad:     { padding:"20px 16px" },
    };

    // ═══ PURE HELPERS ════════════════════════════════════════════════════════
    const localDateKey = d => {
      const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${day}`;
    };
    const formatDate = (key, opts) => new Date(key+"T12:00:00").toLocaleDateString("en-US", opts);
    const getISOWeek = date => {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    };
    const pct = (cur, tgt) => Math.min(100, Math.round((cur/tgt)*100));
    const blankLog = () => ({ pimsleur:false, anki:false, innerFrench:false, workout:null, comprehension:"" });
    const hasAnyHabit = (log, customs) => !!log && (
      log.pimsleur || log.anki || log.innerFrench || log.workout ||
      (customs||[]).some(h => log[h.key])
    );

    function getExercisesForType(data, typeKey) {
      const hidden = (data.hiddenPresets||{})[typeKey] || [];
      const renames = (data.renamedPresets||{})[typeKey] || {};
      const presets = (EXERCISE_PRESETS[typeKey]||[]).filter(n => !hidden.includes(n)).map(n => renames[n] || n);
      const customs = (data.customExercises||{})[typeKey] || [];
      const all = [...presets, ...customs];
      const order = (data.exerciseOrder||{})[typeKey] || [];
      if (!order.length) return all;
      const sorted = order.filter(n => all.includes(n));
      const remaining = all.filter(n => !order.includes(n));
      return [...sorted, ...remaining];
    }

    // ═══ REUSABLE COMPONENTS ═════════════════════════════════════════════════

    function NumberStepper({ value, onChange, min=0, max=999, step=1 }) {
      return (
        <div style={{ display:"flex", alignItems:"center", border:`1px solid ${C.border}`, borderRadius:10, overflow:"hidden", background:C.bg }}>
          <button onClick={()=>onChange(Math.max(min, value-step))}
            style={{ width:38, height:38, background:"none", border:"none", fontSize:22, color:C.textMuted, cursor:"pointer", fontFamily:"Georgia,serif", lineHeight:1 }}>−</button>
          <input type="number" value={value} min={min} max={max}
            onChange={e=>{ const v=parseInt(e.target.value); if(!isNaN(v)) onChange(Math.min(max,Math.max(min,v))); }}
            style={{ width:48, textAlign:"center", border:"none", background:"none", fontSize:16, fontWeight:"bold", color:C.text, fontFamily:"Georgia,serif", padding:"8px 0" }} />
          <button onClick={()=>onChange(Math.min(max, value+step))}
            style={{ width:38, height:38, background:"none", border:"none", fontSize:22, color:C.accent, cursor:"pointer", fontFamily:"Georgia,serif", lineHeight:1 }}>+</button>
        </div>
      );
    }

    function Toggle({ on, onClick, size=26 }) {
      return (
        <div onClick={onClick} style={{
          width:size, height:size, borderRadius:"50%",
          background: on?C.green:"transparent",
          border:`2px solid ${on?C.green:C.border}`,
          display:"flex", alignItems:"center", justifyContent:"center",
          fontSize:14, color:"#fff", cursor:"pointer", flexShrink:0,
        }}>{on?"✓":""}</div>
      );
    }

    function ReorderArrows({ onUp, onDown, canUp, canDown }) {
      const btn = enabled => ({
        width:22, height:14, border:`1px solid ${C.border}`, borderRadius:4,
        background:C.bg, color: enabled?C.textMuted:C.mutedGray,
        fontSize:9, lineHeight:1, fontFamily:"Georgia,serif",
        cursor: enabled?"pointer":"default", padding:0,
      });
      return (
        <div style={{ display:"flex", flexDirection:"column", gap:2 }}>
          <button onClick={onUp} disabled={!canUp} style={btn(canUp)}>▲</button>
          <button onClick={onDown} disabled={!canDown} style={btn(canDown)}>▼</button>
        </div>
      );
    }

    function HabitCard({ active, emoji, label, sublabel, onToggle, stepper, children }) {
      return (
        <div style={active ? S.cardActive : S.card}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div style={{ display:"flex", alignItems:"center", gap:12, flex:1 }}>
              <span style={{ fontSize:26 }}>{emoji}</span>
              <div>
                <div style={{ color: active?C.green:C.text, fontSize:15, fontWeight:"bold" }}>{label}</div>
                <div style={{ color:C.textMuted, fontSize:11, marginTop:2 }}>{sublabel}</div>
              </div>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              {stepper}
              <Toggle on={active} onClick={onToggle} />
            </div>
          </div>
          {children}
        </div>
      );
    }

    function EmojiPalette({ selected, onSelect }) {
      return (
        <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:14 }}>
          {EMOJI_PRESETS.map(e => (
            <button key={e} onClick={()=>onSelect(e)} style={{
              width:34, height:34, fontSize:18, borderRadius:8,
              background: selected===e ? C.accent : C.bg,
              border: `1px solid ${selected===e ? C.accent : C.border}`,
              cursor:"pointer", fontFamily:"Georgia,serif",
            }}>{e}</button>
          ))}
        </div>
      );
    }

    function SavedToast({ show }) {
      if (!show) return null;
      return <div style={{ textAlign:"center", marginTop:16, color:C.green, fontSize:12, letterSpacing:2 }}>✓ SAVED</div>;
    }

    function SectionDivider({ children }) {
      return <div style={{ borderTop:`1px solid ${C.border}`, paddingTop:20, marginTop:8 }}>{children}</div>;
    }

    // ═══ MAIN APP ════════════════════════════════════════════════════════════
    function App() {
      // Auth
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [syncing, setSyncing] = useState(false);

      // Core
      const [data, setData] = useState({ ...DEFAULT_DATA, startDate: localDateKey(new Date()) });
      const [activeTab, setActiveTab] = useState("day");
      const [viewDate, setViewDate] = useState(localDateKey(new Date()));
      const [todayLog, setTodayLog] = useState(blankLog());
      const [saved, setSaved] = useState(false);

      // UI flags
      const [showCompForm, setShowCompForm] = useState(false);
      const [showWorkoutPicker, setShowWorkoutPicker] = useState(false);
      const [editingDate, setEditingDate] = useState(null);
      const [newHabitName, setNewHabitName] = useState("");
      const [newHabitEmoji, setNewHabitEmoji] = useState("📌");
      const [editingEmojiFor, setEditingEmojiFor] = useState(null);
      const [newExerciseName, setNewExerciseName] = useState("");
      const [expandedSession, setExpandedSession] = useState(null);
      const [editingExercise, setEditingExercise] = useState(null);

      const yearScrollRef = useRef(null);
      const today = localDateKey(new Date());

      // ─── Centralized data update ────────────────────────────────────────
      const update = useCallback(patch => {
        setData(prev => {
          const next = typeof patch === "function" ? patch(prev) : { ...prev, ...patch };
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch(e) {}
          if (user && window.__firebase) window.__firebase.saveData(user.uid, next);
          setSaved(true);
          setTimeout(() => setSaved(false), 1500);
          return next;
        });
      }, [user]);

      // ─── Auth ───────────────────────────────────────────────────────────
      useEffect(() => {
        const wait = () => {
          if (!window.__firebase) {
            window.addEventListener("firebaseReady", wait, { once:true });
            return;
          }
          window.__firebase.onAuthStateChanged(async u => {
            setUser(u);
            if (u) {
              setSyncing(true);
              const loaded = await window.__firebase.loadData(u.uid);
              if (loaded) {
                setData({ ...DEFAULT_DATA, ...loaded });
                if (loaded.logs?.[today]) setTodayLog(loaded.logs[today]);
              }
              setSyncing(false);
            }
            setAuthLoading(false);
          });
        };
        wait();
      }, [today]);

      // ─── Sync local todayLog when viewDate changes ──────────────────────
      useEffect(() => {
        const existing = data.logs[viewDate];
        const compEntry = (data.comprehensionLog||[]).find(e => e.date===viewDate);
        setTodayLog(existing
          ? { ...existing, comprehension: compEntry ? String(compEntry.value) : (existing.comprehension||"") }
          : { ...blankLog(), comprehension: compEntry ? String(compEntry.value) : "" });
        setShowCompForm(false);
        setShowWorkoutPicker(false);
      }, [viewDate, data.logs, data.comprehensionLog]);

      // ─── Year tab auto-scroll ───────────────────────────────────────────
      useEffect(() => {
        if (activeTab !== "year") return;
        let cancelled = false;
        const doScroll = () => {
          if (cancelled) return;
          const container = yearScrollRef.current;
          if (!container) return;
          const todayCol = container.querySelector('[data-today="1"]');
          if (!todayCol) { requestAnimationFrame(doScroll); return; }
          const cRect = container.getBoundingClientRect();
          const tRect = todayCol.getBoundingClientRect();
          const todayPos = container.scrollLeft + (tRect.left - cRect.left);
          container.scrollLeft = Math.max(0, todayPos - 22 - 38);
        };
        requestAnimationFrame(() => requestAnimationFrame(doScroll));
        return () => { cancelled = true; };
      }, [activeTab]);

      // ─── Derived values ─────────────────────────────────────────────────
      const hiddenBuiltins = data.hiddenBuiltins || [];
      const activeBuiltins = BUILTIN_HABITS.filter(h => !hiddenBuiltins.includes(h.key));

      const allActiveHabits = useMemo(() => {
        const items = [
          ...activeBuiltins.map(h => ({ ...h, isBuiltin:true })),
          ...(data.customHabits||[]).map(h => ({ ...h, isBuiltin:false })),
        ];
        const order = data.habitOrder || [];
        if (!order.length) return items;
        const sorted = order.map(k => items.find(h => h.key===k)).filter(Boolean);
        const remaining = items.filter(h => !order.includes(h.key));
        return [...sorted, ...remaining];
      }, [data.hiddenBuiltins, data.customHabits, data.habitOrder]);

      const streak = useMemo(() => {
        let count = 0;
        const d = new Date();
        while (true) {
          const log = data.logs[localDateKey(d)];
          if (!hasAnyHabit(log, data.customHabits)) break;
          count++;
          d.setDate(d.getDate()-1);
        }
        return count;
      }, [data.logs, data.customHabits]);

      const dayCount = useMemo(() => {
        const keys = Object.keys(data.logs).filter(k => hasAnyHabit(data.logs[k], data.customHabits));
        const earliest = keys.length ? keys.sort()[0] : data.startDate;
        const start = new Date(earliest + "T00:00:00");
        const now = new Date(); now.setHours(0,0,0,0);
        return Math.max(1, Math.floor((now-start)/86400000) + 1);
      }, [data.logs, data.customHabits, data.startDate]);

      const lastComp = useMemo(() => {
        const log = (data.comprehensionLog||[]).slice().sort((a,b) => a.date.localeCompare(b.date));
        return log.length ? log[log.length-1].value : null;
      }, [data.comprehensionLog]);

      const currentMilestone = MILESTONES.find(m => (data.pimsleurTotal||0) < m.pimsleur) || MILESTONES[MILESTONES.length-1];
      const selectedWorkout = WORKOUT_TYPES.find(w => w.key === todayLog.workout);
      const todaySession = (data.workoutSessions||{})[today] || null;

      // ─── Action: habits ─────────────────────────────────────────────────
      const toggleHabit = key => {
        const newLog = { ...todayLog, [key]: !todayLog[key] };
        setTodayLog(newLog);
        update({ logs: { ...data.logs, [viewDate]: newLog } });
      };

      const selectWorkout = type => {
        const newLog = { ...todayLog, workout: todayLog.workout===type ? null : type };
        setTodayLog(newLog);
        update({ logs: { ...data.logs, [viewDate]: newLog } });
        setShowWorkoutPicker(false);
      };

      const logComprehension = () => {
        const val = parseInt(todayLog.comprehension);
        if (isNaN(val) || val<0 || val>100) return;
        update({
          logs: { ...data.logs, [viewDate]: todayLog },
          comprehensionLog: [...(data.comprehensionLog||[]).filter(e=>e.date!==viewDate), { date:viewDate, value:val }],
        });
        setShowCompForm(false);
      };

      const clearComprehension = () => {
        update({ comprehensionLog: (data.comprehensionLog||[]).filter(e => e.date!==viewDate) });
        setTodayLog({ ...todayLog, comprehension:"" });
        setShowCompForm(false);
      };

      const updateCount = (field, val) => update({ [field]: val });

      const addCustomHabit = () => {
        const name = newHabitName.trim();
        if (!name) return;
        const key = "custom_" + name.toLowerCase().replace(/[^a-z0-9]/g,"_") + "_" + Date.now().toString(36);
        update({ customHabits: [...(data.customHabits||[]), { key, label:name, emoji: newHabitEmoji||"📌" }] });
        setNewHabitName("");
        setNewHabitEmoji("📌");
      };

      const updateHabitEmoji = (key, emoji) =>
        update({ customHabits: (data.customHabits||[]).map(h => h.key===key ? { ...h, emoji } : h) });

      const deleteCustomHabit = key => {
        if (!window.confirm("Delete this habit? It will be removed from all logged days.")) return;
        const newLogs = { ...data.logs };
        Object.keys(newLogs).forEach(d => {
          if (newLogs[d][key] !== undefined) {
            newLogs[d] = { ...newLogs[d] };
            delete newLogs[d][key];
          }
        });
        update({
          customHabits: (data.customHabits||[]).filter(h => h.key!==key),
          logs: newLogs,
        });
      };

      const toggleBuiltin = key => {
        const cur = data.hiddenBuiltins || [];
        update({ hiddenBuiltins: cur.includes(key) ? cur.filter(k=>k!==key) : [...cur, key] });
      };

      const moveHabit = (key, dir) => {
        const keys = allActiveHabits.map(h => h.key);
        const idx = keys.indexOf(key);
        const newIdx = idx + dir;
        if (idx<0 || newIdx<0 || newIdx>=keys.length) return;
        const newOrder = [...keys];
        [newOrder[idx], newOrder[newIdx]] = [newOrder[newIdx], newOrder[idx]];
        update({ habitOrder: newOrder });
      };

      // ─── Action: history ────────────────────────────────────────────────
      const toggleDayHabit = (date, habit) => {
        const cur = data.logs[date] || blankLog();
        const newLog = { ...cur, [habit]: !cur[habit] };
        update({ logs: { ...data.logs, [date]: newLog } });
        if (date === today) setTodayLog({ ...todayLog, ...newLog });
      };

      const setDayWorkout = (date, type) => {
        const cur = data.logs[date] || blankLog();
        const newLog = { ...cur, workout: cur.workout===type ? null : type };
        update({ logs: { ...data.logs, [date]: newLog } });
        if (date === today) setTodayLog({ ...todayLog, ...newLog });
      };

      const deleteDay = date => {
        const newLogs = { ...data.logs };
        delete newLogs[date];
        update({
          logs: newLogs,
          comprehensionLog: (data.comprehensionLog||[]).filter(e => e.date!==date),
        });
        if (date === today) setTodayLog(blankLog());
        setEditingDate(null);
      };


      // ─── Action: workout sessions ───────────────────────────────────────
      const startSession = typeKey => {
        const exNames = getExercisesForType(data, typeKey);
        const past = Object.entries(data.workoutSessions||{})
          .filter(([d, s]) => d !== today && s.type === typeKey)
          .sort((a,b) => b[0].localeCompare(a[0]));
        const last = past[0]?.[1];

        const exercises = exNames.map((name, i) => {
          const prev = last ? (last.exercises||[]).find(e => e.name === name) : null;
          return {
            id: `${typeKey}_${i}_${name}`,
            name,
            sets: prev ? (prev.sets||[]).map(s => ({ weight: s.weight||0, reps: s.reps||0 })) : [],
            notes: "",
            done: false,
          };
        });

        const curLog = data.logs[today] || blankLog();
        update({
          workoutSessions: { ...(data.workoutSessions||{}), [today]: { type: typeKey, exercises } },
          logs: { ...data.logs, [today]: { ...curLog, workout: typeKey } },
        });
      };

      const clearSession = () => {
        const next = { ...(data.workoutSessions||{}) };
        delete next[today];
        update({ workoutSessions: next });
      };

      // Helper: apply a function to today's exercises array
      const mapExercises = fn => {
        const cur = (data.workoutSessions||{})[today];
        if (!cur) return;
        update({ workoutSessions: { ...(data.workoutSessions||{}), [today]: { ...cur, exercises: cur.exercises.map(fn) } } });
      };

      const addSet = exId => mapExercises(e =>
        e.id===exId ? { ...e, sets: [...e.sets, { weight:0, reps:0 }] } : e);

      const removeSet = (exId, idx) => mapExercises(e =>
        e.id===exId ? { ...e, sets: e.sets.filter((_,i) => i!==idx) } : e);

      const stepSet = (exId, idx, field, delta) => mapExercises(e =>
        e.id===exId
          ? { ...e, sets: e.sets.map((st,i) => i===idx
              ? { ...st, [field]: Math.round(Math.max(0, (st[field]||0) + delta) * 10) / 10 }
              : st) }
          : e);

      const setSetValue = (exId, idx, field, val) => mapExercises(e =>
        e.id===exId
          ? { ...e, sets: e.sets.map((st,i) => i===idx ? { ...st, [field]: val } : st) }
          : e);

      const toggleExerciseDone = exId => mapExercises(e =>
        e.id===exId ? { ...e, done: !e.done } : e);

      const updateExerciseNotes = (exId, notes) => mapExercises(e =>
        e.id===exId ? { ...e, notes } : e);

      const moveExercise = (exId, dir) => {
        const cur = (data.workoutSessions||{})[today];
        if (!cur) return;
        const idx = cur.exercises.findIndex(e => e.id===exId);
        const newIdx = idx + dir;
        if (idx<0 || newIdx<0 || newIdx>=cur.exercises.length) return;
        const arr = [...cur.exercises];
        [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
        update({
          exerciseOrder: { ...(data.exerciseOrder||{}), [cur.type]: arr.map(e => e.name) },
          workoutSessions: { ...(data.workoutSessions||{}), [today]: { ...cur, exercises: arr } },
        });
      };

      const addCustomExercise = (typeKey, name) => {
        const trimmed = name.trim();
        if (!trimmed) return;
        const cur = (data.customExercises||{})[typeKey] || [];
        if (cur.includes(trimmed) || (EXERCISE_PRESETS[typeKey]||[]).includes(trimmed)) return;
        const patch = { customExercises: { ...(data.customExercises||{}), [typeKey]: [...cur, trimmed] } };
        const sess = (data.workoutSessions||{})[today];
        if (sess && sess.type === typeKey) {
          patch.workoutSessions = {
            ...(data.workoutSessions||{}),
            [today]: { ...sess, exercises: [...sess.exercises, { id:`${typeKey}_custom_${Date.now()}`, name:trimmed, sets:[], notes:"", done:false }] },
          };
        }
        update(patch);
      };

      const renameExercise = (typeKey, oldName, newName) => {
        const trimmed = newName.trim();
        if (!trimmed || trimmed === oldName) return;
        const presets = EXERCISE_PRESETS[typeKey] || [];
        const renames = (data.renamedPresets||{})[typeKey] || {};
        const customs = (data.customExercises||{})[typeKey] || [];
        const originalPreset = presets.find(p => (renames[p] || p) === oldName);
        const patch = {};
        if (originalPreset) {
          patch.renamedPresets = { ...(data.renamedPresets||{}), [typeKey]: { ...renames, [originalPreset]: trimmed } };
        } else {
          patch.customExercises = { ...(data.customExercises||{}), [typeKey]: customs.map(c => c===oldName ? trimmed : c) };
        }
        const order = (data.exerciseOrder||{})[typeKey] || [];
        if (order.includes(oldName)) {
          patch.exerciseOrder = { ...(data.exerciseOrder||{}), [typeKey]: order.map(o => o===oldName ? trimmed : o) };
        }
        const sess = (data.workoutSessions||{})[today];
        if (sess && sess.type === typeKey) {
          patch.workoutSessions = {
            ...(data.workoutSessions||{}),
            [today]: { ...sess, exercises: sess.exercises.map(e => e.name===oldName ? { ...e, name:trimmed } : e) },
          };
        }
        update(patch);
      };

      const deleteExercise = (typeKey, name) => {
        const presets = EXERCISE_PRESETS[typeKey] || [];
        const renames = (data.renamedPresets||{})[typeKey] || {};
        const customs = (data.customExercises||{})[typeKey] || [];
        const originalPreset = presets.find(p => (renames[p] || p) === name);
        const patch = {};
        if (originalPreset) {
          const hidden = (data.hiddenPresets||{})[typeKey] || [];
          patch.hiddenPresets = { ...(data.hiddenPresets||{}), [typeKey]: [...hidden, originalPreset] };
        } else {
          patch.customExercises = { ...(data.customExercises||{}), [typeKey]: customs.filter(c => c!==name) };
        }
        const order = (data.exerciseOrder||{})[typeKey] || [];
        if (order.includes(name)) {
          patch.exerciseOrder = { ...(data.exerciseOrder||{}), [typeKey]: order.filter(o => o!==name) };
        }
        const sess = (data.workoutSessions||{})[today];
        if (sess && sess.type === typeKey) {
          patch.workoutSessions = {
            ...(data.workoutSessions||{}),
            [today]: { ...sess, exercises: sess.exercises.filter(e => e.name!==name) },
          };
        }
        update(patch);
      };

      const restorePreset = (typeKey, originalName) => {
        const hidden = (data.hiddenPresets||{})[typeKey] || [];
        update({ hiddenPresets: { ...(data.hiddenPresets||{}), [typeKey]: hidden.filter(h => h!==originalName) } });
      };

      // ─── Export & Reset ─────────────────────────────────────────────────
      const exportCSV = () => {
        const customs = data.customHabits || [];
        const headers = ["Date","Pimsleur","Anki","Inner French","Workout", ...customs.map(h=>h.label), "Ear%"];
        const esc = v => {
          const s = String(v??"");
          return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
        };
        const compByDate = {};
        (data.comprehensionLog||[]).forEach(e => { compByDate[e.date] = e.value; });
        const rows = [headers.map(esc).join(",")];
        Object.keys(data.logs).sort().forEach(d => {
          const l = data.logs[d] || {};
          rows.push([
            d,
            l.pimsleur ? "TRUE" : "FALSE",
            l.anki ? "TRUE" : "FALSE",
            l.innerFrench ? "TRUE" : "FALSE",
            l.workout || "",
            ...customs.map(h => l[h.key] ? "TRUE" : "FALSE"),
            compByDate[d] ?? "",
          ].map(esc).join(","));
        });
        const blob = new Blob([rows.join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `tracker-export-${today}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const resetAllData = () => {
        if (!window.confirm("Reset ALL data? This cannot be undone.")) return;
        const fresh = { ...DEFAULT_DATA, startDate: today };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh)); } catch(e) {}
        if (user && window.__firebase) window.__firebase.saveData(user.uid, fresh);
        setData(fresh);
        setTodayLog(blankLog());
        setShowCompForm(false);
        setShowWorkoutPicker(false);
        setSaved(true);
        setTimeout(() => setSaved(false), 1500);
      };

      // ─── Year grid computation ──────────────────────────────────────────
      const yearGrid = useMemo(() => {
        const todayDate = new Date();
        const year = todayDate.getFullYear();
        const startDate = new Date(year, 0, 1);
        while (startDate.getDay() !== 0) startDate.setDate(startDate.getDate()-1);
        const endDate = new Date(todayDate.getFullYear(), todayDate.getMonth()+12, todayDate.getDate());
        const weeks = [];
        let current = [], cursor = new Date(startDate);
        while (cursor <= endDate || current.length > 0) {
          const dateKey = localDateKey(cursor);
          const log = data.logs[dateKey];
          const customCount = log ? (data.customHabits||[]).filter(h => log[h.key]).length : 0;
          const count = log
            ? (log.pimsleur?1:0)+(log.anki?1:0)+(log.innerFrench?1:0)+(log.workout?1:0)+customCount
            : 0;
          const d = cursor.getDate(), m = cursor.getMonth();
          current.push({
            date: dateKey, count, month: m, day: d, year: cursor.getFullYear(),
            isFuture: cursor > todayDate,
            isToday: dateKey === today,
            hasFrench: log ? !!(log.pimsleur||log.anki||log.innerFrench||customCount>0) : false,
            hasWorkout: log ? !!log.workout : false,
            label: (d===1 && m===0) ? String(cursor.getFullYear()).slice(2) : ([1,10,20,30].includes(d) ? String(d) : ""),
          });
          if (current.length === 7) {
            const monday = new Date(current[1].date+"T12:00:00");
            weeks.push({ days: current, weekNum: getISOWeek(monday) });
            current = [];
          }
          cursor.setDate(cursor.getDate()+1);
          if (weeks.length > 120) break;
        }
        if (current.length > 0) {
          while (current.length < 7) current.push({ isFuture:true, count:0, label:"" });
          weeks.push({ days: current, weekNum: 0 });
        }
        return weeks;
      }, [data.logs, data.customHabits, today]);

      const heatColor = cell => {
        if (cell.isFuture) return HEAT.future;
        if (cell.hasWorkout && !cell.hasFrench) return C.workoutOnly;
        return HEAT[Math.min(cell.count, 4)] || HEAT[0];
      };

      const yearStats = useMemo(() => {
        const logs = Object.values(data.logs);
        return {
          active: logs.filter(l => hasAnyHabit(l, data.customHabits)).length,
          full: logs.filter(l => l.pimsleur && l.anki && l.innerFrench && (data.customHabits||[]).every(h => l[h.key])).length,
          workouts: logs.filter(l => l.workout).length,
        };
      }, [data.logs, data.customHabits]);

      const workoutCounts = useMemo(() => {
        const c = {};
        WORKOUT_TYPES.forEach(w => c[w.key] = 0);
        Object.values(data.logs).forEach(l => { if (l.workout) c[l.workout] = (c[l.workout]||0) + 1; });
        return c;
      }, [data.logs]);


      // ─── Gates ──────────────────────────────────────────────────────────
      if (authLoading) return (
        <div style={{ display:"flex", alignItems:"center", justifyContent:"center", minHeight:"100vh", background:C.bg, flexDirection:"column", gap:16 }}>
          <div style={{ fontSize:28 }}>📊</div>
          <div style={{ fontSize:13, color:C.textMuted, letterSpacing:2, textTransform:"uppercase" }}>Loading…</div>
        </div>
      );

      if (!user) return (
        <div style={{ display:"flex", alignItems:"center", justifyContent:"center", minHeight:"100vh", background:C.bg, flexDirection:"column", gap:24, padding:32 }}>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontSize:10, letterSpacing:3, color:C.textMuted, textTransform:"uppercase", marginBottom:8 }}>Breno</div>
            <div style={{ fontSize:28, fontWeight:"bold", color:C.text }}>Progress Tracker</div>
            <div style={{ fontSize:13, color:C.textMuted, marginTop:8 }}>Sign in to sync your data across devices</div>
          </div>
          <button onClick={()=>window.__firebase.signIn()} style={{ display:"flex", alignItems:"center", gap:12, background:C.card, border:`1px solid ${C.border}`, borderRadius:14, padding:"14px 24px", fontSize:15, color:C.text, cursor:"pointer", fontFamily:"Georgia,serif", boxShadow:"0 2px 8px rgba(0,0,0,0.08)" }}>
            <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Continue with Google
          </button>
        </div>
      );

      // ─── Header + Tabs ──────────────────────────────────────────────────
      const renderHeader = () => (
        <div style={{ background:"#ede8df", padding:"24px 20px 16px", borderBottom:`1px solid ${C.border}`, position:"sticky", top:0, zIndex:10 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
            <div>
              <div style={{ fontSize:10, letterSpacing:3, color:C.textMuted, textTransform:"uppercase", marginBottom:4 }}>Breno</div>
              <div style={{ fontSize:22, fontWeight:"bold", color:C.text }}>Progress Tracker</div>
              <div style={{ fontSize:9, color:C.textMuted, marginTop:2, display:"flex", alignItems:"center", gap:6 }}>
                <span style={{ width:6, height:6, borderRadius:"50%", background: syncing?"#f0a020":C.green, display:"inline-block" }}/>
                <span>{syncing ? "Syncing…" : user.email}</span>
                <span onClick={()=>window.__firebase.signOut()} style={{ color:C.accent, cursor:"pointer", marginLeft:4 }}>Sign out</span>
              </div>
            </div>
            <div style={{ textAlign:"right" }}>
              <div style={{ fontSize:30, fontWeight:"bold", color: streak>0?C.accent:C.mutedGray }}>{streak}</div>
              <div style={{ fontSize:10, color:C.textMuted, letterSpacing:2, textTransform:"uppercase" }}>day streak</div>
            </div>
          </div>
          <div style={{ marginTop:14, display:"flex", gap:10 }}>
            {[
              { label:"Day", value: dayCount },
              { label:"Pimsleur", value: data.pimsleurTotal||0 },
              { label:"Ear", value: lastComp!==null?`${lastComp}%`:"—" },
            ].map(s => (
              <div key={s.label} style={{ flex:1, background:C.bg, borderRadius:10, padding:"8px 0", border:`1px solid ${C.border}`, textAlign:"center" }}>
                <div style={{ fontSize:18, fontWeight:"bold", color:C.accent }}>{s.value}</div>
                <div style={{ fontSize:9, color:C.textMuted, letterSpacing:1, textTransform:"uppercase" }}>{s.label}</div>
              </div>
            ))}
          </div>
        </div>
      );

      const tabStyle = active => ({
        flexShrink:0, padding:"11px 18px", background:"none", border:"none",
        color: active?C.accent:C.textMuted, fontSize:10, letterSpacing:1.5,
        textTransform:"uppercase",
        borderBottom: active?`2px solid ${C.accent}`:"2px solid transparent",
        cursor:"pointer", fontFamily:"Georgia,serif", whiteSpace:"nowrap",
      });

      const renderTabs = () => (
        <div style={{ position:"relative", background:"#ede8df", borderBottom:`1px solid ${C.border}` }}>
          <div style={{ display:"flex", overflowX:"auto", scrollbarWidth:"none" }}>
            {TABS.map(t => (
              <button key={t.key} onClick={()=>setActiveTab(t.key)} style={tabStyle(activeTab===t.key)}>{t.label}</button>
            ))}
          </div>
          <div style={{ position:"absolute", right:0, top:0, bottom:2, width:24, background:"linear-gradient(to right, rgba(237,232,223,0), #ede8df 60%)", pointerEvents:"none" }}/>
        </div>
      );


      // ─── TAB: DAY ───────────────────────────────────────────────────────
      const renderWorkoutHabitCard = () => (
        <div key="workout" style={ todayLog.workout ? S.cardActive : S.card }>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div style={{ display:"flex", alignItems:"center", gap:12 }}>
              <span style={{ fontSize:26 }}>🏋️</span>
              <div>
                <div style={{ color: todayLog.workout?C.green:C.text, fontSize:15, fontWeight:"bold" }}>Workout</div>
                <div style={{ color:C.textMuted, fontSize:11, marginTop:2 }}>
                  {selectedWorkout ? `${selectedWorkout.emoji} ${selectedWorkout.label}` : "Tap to log"}
                </div>
              </div>
            </div>
            <button onClick={()=>setShowWorkoutPicker(!showWorkoutPicker)} style={todayLog.workout ? S.pillBtnOn : S.pillBtn}>
              {todayLog.workout ? "CHANGE" : "LOG"}
            </button>
          </div>
          {showWorkoutPicker && (
            <div style={{ marginTop:14, display:"flex", gap:8, flexWrap:"wrap" }}>
              {WORKOUT_TYPES.map(w => {
                const active = todayLog.workout === w.key;
                return (
                  <button key={w.key} onClick={()=>selectWorkout(w.key)} style={{
                    flex:"1 1 calc(33% - 8px)", padding:"10px 6px", borderRadius:10,
                    background: active?C.green:C.bg,
                    border: `1px solid ${active?C.green:C.border}`,
                    color: active?"#fff":C.text,
                    fontSize:12, cursor:"pointer", fontFamily:"Georgia,serif", textAlign:"center",
                  }}>
                    <div style={{ fontSize:20 }}>{w.emoji}</div>
                    <div style={{ marginTop:4, fontWeight:"bold" }}>{w.label}</div>
                  </button>
                );
              })}
            </div>
          )}
        </div>
      );

      const renderEarTestCard = () => {
        const compEntry = (data.comprehensionLog||[]).find(e => e.date===viewDate);
        const isLogged = !!compEntry;
        return (
          <div key="eartest" style={ isLogged ? S.cardActive : S.card }>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div>
                <div style={{ fontSize:15, fontWeight:"bold", color: isLogged?C.green:C.text }}>👂 Ear Test</div>
                <div style={{ color:C.textMuted, fontSize:11, marginTop:2 }}>Inner French audio-only %</div>
              </div>
              <button onClick={()=>{ if (isLogged) clearComprehension(); else setShowCompForm(!showCompForm); }}
                style={ isLogged ? S.pillBtnOn : S.pillBtn }>LOG</button>
            </div>
            {showCompForm && (
              <div style={{ marginTop:12, display:"flex", gap:8 }}>
                <input type="number" min="0" max="100" value={todayLog.comprehension}
                  onChange={e=>setTodayLog({ ...todayLog, comprehension: e.target.value })}
                  placeholder="e.g. 65"
                  style={{ ...S.input, flex:1, fontSize:16, padding:"8px 12px" }} />
                <button onClick={logComprehension} style={{ ...S.primaryBtn, padding:"8px 16px" }}>SAVE</button>
              </div>
            )}
            {!showCompForm && isLogged && (
              <div onClick={()=>setShowCompForm(true)} style={{
                marginTop:8, fontSize:28, fontWeight:"bold", cursor:"pointer",
                color: compEntry.value>=75?C.green : compEntry.value>=60?C.accent : C.red,
              }}>{compEntry.value}%</div>
            )}
          </div>
        );
      };

      const renderDayTab = () => {
        const arrowBtn = disabled => ({
          width:42, height:42, borderRadius:21,
          background: disabled?C.bg:C.card,
          border:`1px solid ${C.border}`,
          color: disabled?C.mutedGray:C.text,
          fontSize:20, cursor: disabled?"default":"pointer",
          fontFamily:"Georgia,serif",
          display:"flex", alignItems:"center", justifyContent:"center",
        });
        const goRel = delta => {
          const d = new Date(viewDate+"T12:00:00"); d.setDate(d.getDate()+delta);
          setViewDate(localDateKey(d));
        };
        const dayDiff = (() => {
          const d = new Date(viewDate+"T12:00:00");
          const t = new Date(today+"T12:00:00");
          return Math.round((t-d)/86400000);
        })();

        return (
          <div style={S.bodyPad}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:16, gap:10 }}>
              <button onClick={()=>goRel(-1)} style={arrowBtn(false)}>‹</button>
              <div onClick={()=>setViewDate(today)} style={{ flex:1, textAlign:"center", cursor: viewDate!==today?"pointer":"default" }}>
                <div style={{ fontSize:11, letterSpacing:2, color: viewDate===today?C.accent:C.textMuted, textTransform:"uppercase" }}>
                  {viewDate===today ? "Today" : (dayDiff===1 ? "Yesterday" : `${dayDiff} days ago`)}
                </div>
                <div style={{ fontSize:14, color:C.text, marginTop:2 }}>{formatDate(viewDate, {weekday:"long",month:"long",day:"numeric"})}</div>
              </div>
              <button disabled={viewDate>=today} onClick={()=>{ if (viewDate<today) goRel(1); }} style={arrowBtn(viewDate>=today)}>›</button>
            </div>

            {allActiveHabits.map(h => {
              if (h.key === "workout") return renderWorkoutHabitCard();
              if (h.key === "eartest") return renderEarTestCard();
              const stepper = h.countField
                ? <NumberStepper value={data[h.countField]||0} onChange={v=>updateCount(h.countField, v)} />
                : null;
              return (
                <HabitCard key={h.key}
                  active={!!todayLog[h.key]}
                  emoji={h.emoji}
                  label={h.label}
                  sublabel={h.isBuiltin ? h.sublabelFn(data) : "Custom habit"}
                  onToggle={() => toggleHabit(h.key)}
                  stepper={stepper} />
              );
            })}

            <SavedToast show={saved} />
          </div>
        );
      };


      // ─── TAB: WORKOUT ───────────────────────────────────────────────────
      const renderSetRow = (exId, st, idx) => {
        const stepBtn = color => ({
          width:26, height:32, background:"none", border:"none",
          color, fontSize:16, fontFamily:"Georgia,serif", lineHeight:1, cursor:"pointer",
        });
        const wrap = { display:"flex", alignItems:"center", background:C.bg, border:`1px solid ${C.border}`, borderRadius:8, overflow:"hidden" };
        const numStyle = { width:40, textAlign:"center", border:"none", background:"none", fontSize:12, fontWeight:"bold", fontFamily:"Georgia,serif", color:C.text, padding:0 };
        const unitStyle = { fontSize:8, color:C.textMuted, letterSpacing:1, marginLeft:2, fontWeight:"normal" };

        return (
          <div key={idx} style={{ display:"grid", gridTemplateColumns:"22px 1fr 1fr 20px", gap:6, alignItems:"center" }}>
            <div style={{ fontSize:10, color:C.textMuted, fontWeight:"bold", letterSpacing:1 }}>S{idx+1}</div>
            <div style={wrap}>
              <button onClick={()=>stepSet(exId,idx,"weight",-5)} style={stepBtn(C.textMuted)}>−</button>
              <div style={{ flex:1, textAlign:"center", fontSize:12, fontWeight:"bold", color:C.text, fontFamily:"Georgia,serif" }}>
                <input type="number" step="0.5" value={st.weight||0}
                  onChange={e=>setSetValue(exId,idx,"weight",parseFloat(e.target.value)||0)}
                  style={numStyle} />
                <span style={unitStyle}>LB</span>
              </div>
              <button onClick={()=>stepSet(exId,idx,"weight",5)} style={stepBtn(C.accent)}>+</button>
            </div>
            <div style={wrap}>
              <button onClick={()=>stepSet(exId,idx,"reps",-1)} style={stepBtn(C.textMuted)}>−</button>
              <div style={{ flex:1, textAlign:"center", fontSize:12, fontWeight:"bold", color:C.text, fontFamily:"Georgia,serif" }}>
                <input type="number" step="0.5" value={st.reps||0}
                  onChange={e=>setSetValue(exId,idx,"reps",parseFloat(e.target.value)||0)}
                  style={{ ...numStyle, width:32 }} />
                <span style={unitStyle}>REPS</span>
              </div>
              <button onClick={()=>stepSet(exId,idx,"reps",1)} style={stepBtn(C.accent)}>+</button>
            </div>
            <button onClick={()=>removeSet(exId,idx)} style={{ width:20, height:20, background:"none", border:"none", color:C.textMuted, fontSize:14, cursor:"pointer", fontFamily:"Georgia,serif" }}>×</button>
          </div>
        );
      };

      const renderExerciseCard = (ex, exIdx) => {
        const isRenaming = editingExercise && editingExercise.id === ex.id;
        const total = todaySession.exercises.length;
        const typeLabel = WORKOUT_TYPES.find(t=>t.key===todaySession.type)?.label || todaySession.type;

        return (
          <div key={ex.id} style={ ex.done ? S.cardActive : S.card }>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12, gap:10 }}>
              <div style={{ flex:1, display:"flex", alignItems:"center", gap:8 }}>
                <ReorderArrows
                  onUp={()=>moveExercise(ex.id,-1)}
                  onDown={()=>moveExercise(ex.id,1)}
                  canUp={exIdx>0}
                  canDown={exIdx<total-1} />
                {isRenaming ? (
                  <input type="text" defaultValue={ex.name} autoFocus
                    onBlur={e=>{ renameExercise(todaySession.type, ex.name, e.target.value); setEditingExercise(null); }}
                    onKeyDown={e=>{ if(e.key==="Enter") e.target.blur(); if(e.key==="Escape") setEditingExercise(null); }}
                    style={{ flex:1, background:C.bg, border:`1px solid ${C.accent}`, borderRadius:6, padding:"6px 8px", fontSize:14, fontWeight:"bold", color:C.text, fontFamily:"Georgia,serif" }} />
                ) : (
                  <div onClick={()=>setEditingExercise({ id: ex.id })}
                    style={{ fontSize:14, fontWeight:"bold", color: ex.done?C.green:C.text, cursor:"pointer", flex:1 }}>
                    {ex.name}
                  </div>
                )}
              </div>
              <button onClick={()=>{ if(window.confirm(`Remove "${ex.name}" from ${typeLabel}? Future sessions of this type won't include it.`)) deleteExercise(todaySession.type, ex.name); }}
                style={{ width:24, height:24, borderRadius:6, background:"none", border:`1px solid ${C.border}`, color:C.textMuted, fontSize:14, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, fontFamily:"Georgia,serif", lineHeight:1, padding:0, marginRight:14 }}>×</button>
              <Toggle on={ex.done} onClick={()=>toggleExerciseDone(ex.id)} />
            </div>

            {ex.sets.length > 0 && (
              <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                {ex.sets.map((st, idx) => renderSetRow(ex.id, st, idx))}
              </div>
            )}

            <button onClick={()=>addSet(ex.id)}
              style={{ marginTop: ex.sets.length?8:0, background:"none", border:`1px dashed ${C.border}`, borderRadius:8, width:"100%", padding:7, fontSize:11, color:C.textMuted, letterSpacing:1, fontFamily:"Georgia,serif", cursor:"pointer" }}>+ ADD SET</button>

            <textarea value={ex.notes||""} onChange={e=>updateExerciseNotes(ex.id, e.target.value)} placeholder="Notes (optional)…" rows="1"
              style={{ width:"100%", marginTop:8, fontSize:11, color:C.text, fontStyle:"italic", padding:"8px 10px", background:C.bg, borderRadius:6, border:`1px solid ${C.border}`, borderLeftWidth:2, borderLeftColor:C.accent, fontFamily:"Georgia,serif", resize:"vertical", minHeight:32 }} />
          </div>
        );
      };

      const renderWorkoutSession = () => {
        const w = WORKOUT_TYPES.find(t => t.key===todaySession.type);
        const doneCount = (todaySession.exercises||[]).filter(e => e.done).length;
        const totalCount = (todaySession.exercises||[]).length;
        const hiddenForType = (data.hiddenPresets||{})[todaySession.type] || [];

        return (
          <>
            <div style={{ ...S.cardActive, display:"flex", alignItems:"center", gap:12 }}>
              <div style={{ fontSize:32 }}>{w?w.emoji:"🏋️"}</div>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:17, fontWeight:"bold", color:C.green }}>{w?w.label:"Workout"} Day</div>
                <div style={{ fontSize:11, color:C.textMuted, marginTop:2 }}>{formatDate(today,{weekday:"long",month:"long",day:"numeric"})} · {doneCount} of {totalCount} done</div>
              </div>
              <button onClick={()=>{ if(window.confirm("Change workout type? Current sets and notes will be lost.")) clearSession(); }}
                style={{ background:"none", border:`1px solid ${C.border}`, borderRadius:8, color:C.textMuted, fontSize:10, padding:"6px 10px", letterSpacing:1, fontFamily:"Georgia,serif", cursor:"pointer" }}>CHANGE</button>
            </div>

            {todaySession.exercises.map((ex, exIdx) => renderExerciseCard(ex, exIdx))}

            <div style={{ display:"flex", gap:8, marginBottom:12 }}>
              <input type="text" value={newExerciseName} onChange={e=>setNewExerciseName(e.target.value)} placeholder="Add custom exercise…"
                onKeyDown={e=>{ if(e.key==="Enter") { addCustomExercise(todaySession.type, newExerciseName); setNewExerciseName(""); } }}
                style={{ flex:1, background:C.bg, border:`1px dashed ${C.accent}`, borderRadius:14, padding:"12px 14px", fontSize:12, color:C.text, fontFamily:"Georgia,serif", letterSpacing:1 }} />
              <button onClick={()=>{ addCustomExercise(todaySession.type, newExerciseName); setNewExerciseName(""); }}
                style={{ background:C.accent, border:"none", borderRadius:14, color:"#fff", fontSize:12, fontWeight:"bold", padding:"0 18px", cursor:"pointer", fontFamily:"Georgia,serif", letterSpacing:1 }}>ADD</button>
            </div>

            {hiddenForType.length > 0 && (
              <div style={{ ...S.card, marginTop:4 }}>
                <div style={S.smallLabel}>Deleted exercises</div>
                {hiddenForType.map(h => (
                  <div key={h} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"6px 0", borderTop:`1px solid ${C.border}` }}>
                    <span style={{ fontSize:11, color:C.textMuted, textDecoration:"line-through" }}>{h}</span>
                    <button onClick={()=>restorePreset(todaySession.type, h)} style={{ background:"none", border:`1px solid ${C.accent}`, borderRadius:6, color:C.accent, fontSize:10, padding:"3px 8px", cursor:"pointer", fontFamily:"Georgia,serif" }}>RESTORE</button>
                  </div>
                ))}
              </div>
            )}

            <SavedToast show={saved} />
          </>
        );
      };

      const renderWorkoutPicker = () => {
        const recent = Object.entries(data.workoutSessions||{})
          .filter(([d]) => d!==today)
          .sort((a,b) => b[0].localeCompare(a[0]))
          .slice(0,7);

        return (
          <>
            <div style={S.sectionLabel}>Pick today's workout</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:20 }}>
              {WORKOUT_TYPES.map(w => {
                const count = getExercisesForType(data, w.key).length;
                return (
                  <button key={w.key} onClick={()=>startSession(w.key)} style={{
                    ...S.card, marginBottom:0, padding:"18px 12px", textAlign:"center", cursor:"pointer", fontFamily:"Georgia,serif",
                  }}>
                    <div style={{ fontSize:30, lineHeight:1, marginBottom:6 }}>{w.emoji}</div>
                    <div style={{ fontSize:14, fontWeight:"bold", color:C.text }}>{w.label}</div>
                    <div style={{ fontSize:10, color:C.textMuted, marginTop:2 }}>{count} exercises</div>
                  </button>
                );
              })}
            </div>

            {recent.length > 0 && (
              <div style={S.card}>
                <div style={{ fontSize:13, fontWeight:"bold", marginBottom:10 }}>Recent sessions</div>
                {recent.map(([d, s], i) => {
                  const w = WORKOUT_TYPES.find(t => t.key===s.type);
                  const doneCount = (s.exercises||[]).filter(e => e.done).length;
                  const totalSets = (s.exercises||[]).reduce((acc,e) => acc + (e.sets||[]).length, 0);
                  const isExp = expandedSession === d;
                  return (
                    <div key={d} style={{ borderTop: i===0?"none":`1px solid ${C.border}` }}>
                      <div onClick={()=>setExpandedSession(isExp?null:d)}
                        style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 0", fontSize:12, cursor:"pointer" }}>
                        <span style={{ color: isExp?C.accent:C.textMuted, fontWeight: isExp?"bold":"normal" }}>
                          {formatDate(d, {weekday:"short",month:"short",day:"numeric"})}
                        </span>
                        <span style={{ display:"flex", alignItems:"center", gap:8 }}>
                          <span style={{ fontWeight:"bold", color:C.text }}>
                            {w?w.emoji:""} {w?w.label:s.type} · {doneCount}/{(s.exercises||[]).length}
                          </span>
                          <span style={{ fontSize:10, color:C.textMuted }}>{isExp?"▲":"▼"}</span>
                        </span>
                      </div>
                      {isExp && (
                        <div style={{ padding:"4px 0 12px 0" }}>
                          {(s.exercises||[]).filter(e => (e.sets||[]).length>0 || e.done).length === 0 && (
                            <div style={{ fontSize:11, color:C.textMuted, fontStyle:"italic", padding:"4px 0" }}>No exercises logged for this session.</div>
                          )}
                          {(s.exercises||[]).filter(e => (e.sets||[]).length>0 || e.done).map(e => (
                            <div key={e.id} style={{ padding:"6px 10px", marginBottom:4, background:C.bg, borderRadius:6, borderLeft:`2px solid ${e.done?C.green:C.border}` }}>
                              <div style={{ fontSize:12, fontWeight:"bold", color: e.done?C.green:C.text, display:"flex", alignItems:"center", gap:6 }}>
                                {e.done && <span style={{ color:C.green }}>✓</span>}
                                <span>{e.name}</span>
                              </div>
                              {(e.sets||[]).length > 0 && (
                                <div style={{ fontSize:10, color:C.textMuted, marginTop:3, lineHeight:1.4 }}>
                                  {e.sets.map(st => `${st.weight||0}lb × ${st.reps||0}`).join("  ·  ")}
                                </div>
                              )}
                              {e.notes && (
                                <div style={{ fontSize:10, color:C.textMuted, marginTop:3, fontStyle:"italic" }}>{e.notes}</div>
                              )}
                            </div>
                          ))}
                          <div style={{ fontSize:10, color:C.textMuted, marginTop:6, textAlign:"right", letterSpacing:1 }}>{totalSets} total sets</div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </>
        );
      };

      const renderWorkoutTab = () => (
        <div style={S.bodyPad}>
          {todaySession ? renderWorkoutSession() : renderWorkoutPicker()}
        </div>
      );


      // ─── TAB: PROGRESS ──────────────────────────────────────────────────
      const renderProgressTab = () => {
        const items = [
          { label:"Pimsleur Lessons", current:data.pimsleurTotal||0, target:currentMilestone.pimsleur, unit:"lessons", emoji:"🎧" },
          { label:"Inner French",     current:data.innerFrenchTotal||0, target:currentMilestone.innerFrench, unit:"episodes", emoji:"🎙️" },
          { label:"Ear Comprehension",current:lastComp||0, target:currentMilestone.comprehension, unit:"%", emoji:"👂" },
        ];
        return (
          <div style={S.bodyPad}>
            <div style={S.sectionLabel}>Next: {currentMilestone.label}</div>
            {items.map(item => {
              const p = pct(item.current, item.target);
              return (
                <div key={item.label} style={S.card}>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:10 }}>
                    <div style={{ fontSize:14, color:C.text }}>{item.emoji} {item.label}</div>
                    <div style={{ fontSize:14, color:C.accent, fontWeight:"bold" }}>{item.current}/{item.target} {item.unit}</div>
                  </div>
                  <div style={{ height:8, background:C.border, borderRadius:4, overflow:"hidden" }}>
                    <div style={{ height:"100%", borderRadius:4, width:`${p}%`, background: p>=100?C.green:C.accent, transition:"width 0.6s ease" }} />
                  </div>
                  <div style={{ fontSize:11, color:C.textMuted, marginTop:6, textAlign:"right" }}>{p}% complete</div>
                </div>
              );
            })}

            <div style={S.card}>
              <div style={{ fontSize:14, color:C.text, marginBottom:12 }}>🏋️ Workout Breakdown</div>
              <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                {WORKOUT_TYPES.map(w => (
                  <div key={w.key} style={{ flex:"1 1 calc(33% - 8px)", background:C.bg, borderRadius:10, padding:"10px 6px", border:`1px solid ${C.border}`, textAlign:"center" }}>
                    <div style={{ fontSize:18 }}>{w.emoji}</div>
                    <div style={{ fontSize:18, fontWeight:"bold", color:C.accent, marginTop:4 }}>{workoutCounts[w.key]||0}</div>
                    <div style={{ fontSize:9, color:C.textMuted, textTransform:"uppercase", letterSpacing:1 }}>{w.label}</div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{ marginTop:20, borderTop:`1px solid ${C.border}`, paddingTop:20 }}>
              <div style={S.sectionLabel}>6-month roadmap</div>
              {MILESTONES.map(m => {
                const done = (data.pimsleurTotal||0) >= m.pimsleur;
                return (
                  <div key={m.month} style={{ display:"flex", alignItems:"center", gap:14, marginBottom:14, opacity: done?1:0.6 }}>
                    <div style={{ width:34, height:34, borderRadius:"50%", flexShrink:0, background: done?C.green:C.bg, border:`2px solid ${done?C.green:C.border}`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, color: done?"#fff":C.textMuted, fontWeight:"bold" }}>{done?"✓":m.month}</div>
                    <div>
                      <div style={{ fontSize:14, color: done?C.green:C.text, fontWeight:"bold" }}>{m.label}</div>
                      <div style={{ fontSize:11, color:C.textMuted }}>Pimsleur {m.pimsleur} · Ear {m.comprehension}% · Inner French {m.innerFrench} eps</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      };

      // ─── TAB: YEAR ──────────────────────────────────────────────────────
      const renderYearTab = () => {
        const yearRange = (() => {
          const t = new Date();
          const end = new Date(t.getFullYear(), t.getMonth()+12, 1);
          return `${t.getFullYear()} — ${MONTH_LABELS[end.getMonth()]} ${end.getFullYear()}`;
        })();
        const todayColIdx = yearGrid.findIndex(w => w.days.some(d => d.isToday));

        return (
          <div style={S.bodyPad}>
            <div style={S.sectionLabel}>{yearRange}</div>

            <div style={{ ...S.card, display:"flex", justifyContent:"space-around", textAlign:"center" }}>
              {[
                { label:"Active days", value:yearStats.active },
                { label:"Full days", value:yearStats.full },
                { label:"Workouts", value:yearStats.workouts },
              ].map(st => (
                <div key={st.label}>
                  <div style={{ fontSize:22, fontWeight:"bold", color:C.accent }}>{st.value}</div>
                  <div style={{ fontSize:10, color:C.textMuted, letterSpacing:1, textTransform:"uppercase", marginTop:2 }}>{st.label}</div>
                </div>
              ))}
            </div>

            <div ref={yearScrollRef} style={{ ...S.card, overflowX:"auto" }}>
              <div style={{ display:"flex", gap:3, minWidth:"fit-content" }}>
                <div style={{ display:"flex", flexDirection:"column", gap:3, marginRight:4, paddingTop:34, position:"sticky", left:0, background:C.card, zIndex:1, paddingRight:4 }}>
                  {["","M","","W","","F",""].map((d,i) => (
                    <div key={i} style={{ height:16, fontSize:8, color:C.textMuted, display:"flex", alignItems:"center", width:14 }}>{d}</div>
                  ))}
                </div>
                <div style={{ display:"flex", gap:3 }}>
                  {yearGrid.map((week, wi) => {
                    const firstDay = week.days.find(d => d.day===1);
                    const mLabel = firstDay
                      ? (firstDay.month===0 ? `Jan ${String(firstDay.year).slice(2)}` : MONTH_LABELS[firstDay.month])
                      : "";
                    const wn = week.weekNum;
                    const showWeek = wn>0 && (wn%4===0 || wi===0 || wi===yearGrid.length-1);
                    const isTodayCol = wi === todayColIdx;
                    return (
                      <div key={wi} data-today={isTodayCol?"1":undefined} style={{ display:"flex", flexDirection:"column", gap:3 }}>
                        <div style={{ height:14, fontSize:8, color:C.accent, fontWeight:"bold", whiteSpace:"nowrap", textAlign:"center", width:16 }}>{showWeek ? `W${wn}` : ""}</div>
                        <div style={{ height:14, fontSize:9, color:C.textMuted, fontWeight:"bold", whiteSpace:"nowrap", overflow:"visible" }}>{mLabel}</div>
                        {week.days.map((cell, di) => {
                          const bgCol = heatColor(cell);
                          const isDark = [HEAT[3], HEAT[4], C.workoutOnly].includes(bgCol);
                          const numCol = isDark ? "rgba(255,255,255,0.85)" : "rgba(0,0,0,0.45)";
                          return (
                            <div key={di} style={{
                              width:16, height:16, borderRadius:3,
                              background: bgCol,
                              outline: cell.isToday?`1.5px solid ${C.text}`:"none",
                              outlineOffset: cell.isToday?"1px":"0",
                              boxSizing:"border-box",
                              display:"flex", alignItems:"center", justifyContent:"center",
                              fontSize:7, fontWeight:"bold", color:numCol, lineHeight:1,
                              fontFamily:"Georgia,serif",
                            }}>{cell.label||""}</div>
                          );
                        })}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            <div style={{ fontSize:10, color:C.textMuted, letterSpacing:1, textAlign:"center" }}>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:6, marginBottom:6 }}>
                <span>COMBO</span>
                {[0,1,2,3,4].map(c => <div key={c} style={{ width:14, height:14, borderRadius:3, background:HEAT[c] }}/>)}
                <span>MORE</span>
              </div>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:6 }}>
                <div style={{ width:14, height:14, borderRadius:3, background:C.workoutOnly }}/>
                <span>WORKOUT ONLY</span>
              </div>
            </div>
            <div style={{ marginTop:16, fontSize:11, color:C.textMuted, textAlign:"center", lineHeight:1.6 }}>
              Each square = one day. Fill every square before your exam.
            </div>
          </div>
        );
      };


      // ─── TAB: HISTORY ───────────────────────────────────────────────────
      const renderHistoryEditor = (date, log) => (
        <div style={{ background:C.bg, borderRadius:10, padding:14, marginBottom:12, border:`1px solid ${C.border}` }}>
          {[{key:"pimsleur",emoji:"🎧",label:"Pimsleur"},{key:"anki",emoji:"🃏",label:"Flash cards"},{key:"innerFrench",emoji:"🎙️",label:"Inner French"},...(data.customHabits||[])].map(h => (
            <div key={h.key} onClick={()=>toggleDayHabit(date,h.key)} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 0", cursor:"pointer", borderBottom:`1px solid ${C.border}` }}>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ fontSize:20 }}>{h.emoji}</span>
                <span style={{ fontSize:13, color:C.text }}>{h.label}</span>
              </div>
              <Toggle on={log[h.key]} onClick={()=>toggleDayHabit(date,h.key)} />
            </div>
          ))}
          <div style={{ padding:"12px 0 8px" }}>
            <div style={{ fontSize:11, color:C.textMuted, marginBottom:8, letterSpacing:1, textTransform:"uppercase" }}>Workout</div>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
              {WORKOUT_TYPES.map(wk => {
                const active = log.workout === wk.key;
                return (
                  <button key={wk.key} onClick={()=>setDayWorkout(date,wk.key)} style={{
                    flex:"1 1 calc(33% - 6px)", padding:"8px 4px", borderRadius:8,
                    background: active?C.green:C.card,
                    border: `1px solid ${active?C.green:C.border}`,
                    color: active?"#fff":C.text,
                    fontSize:11, cursor:"pointer", fontFamily:"Georgia,serif", textAlign:"center",
                  }}>
                    <div style={{ fontSize:16 }}>{wk.emoji}</div>
                    <div style={{ marginTop:2 }}>{wk.label}</div>
                  </button>
                );
              })}
            </div>
          </div>
          <button onClick={()=>{ if(window.confirm(`Delete ${formatDate(date,{weekday:"long",month:"short",day:"numeric"})}?`)) deleteDay(date); }}
            style={{ width:"100%", padding:"10px", borderRadius:10, background:"none", border:`1px solid ${C.red}`, color:C.red, fontSize:12, cursor:"pointer", fontFamily:"Georgia,serif", marginTop:10 }}>
            Delete this day
          </button>
        </div>
      );

      const renderHistoryTab = () => (
        <div style={S.bodyPad}>
          <div style={S.sectionLabel}>Daily log</div>
          <div style={{ fontSize:11, color:C.textMuted, marginBottom:10, fontStyle:"italic" }}>Tap a day to edit or delete it.</div>
          {Object.entries(data.logs).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,30).map(([date, log]) => {
            const w = WORKOUT_TYPES.find(w => w.key===log.workout);
            const isEditing = editingDate === date;
            const isToday = date === today;
            return (
              <div key={date} style={{ borderBottom:`1px solid ${C.border}` }}>
                <div onClick={()=>setEditingDate(isEditing?null:date)} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 0", cursor:"pointer" }}>
                  <div style={{ fontSize:12, color: isEditing?C.accent:C.textMuted, fontWeight: isEditing?"bold":"normal" }}>
                    {formatDate(date,{weekday:"short",month:"short",day:"numeric"})}
                    {isToday && <span style={{ marginLeft:6, fontSize:9, color:C.accent, letterSpacing:1 }}>TODAY</span>}
                  </div>
                  <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                    {[{key:"pimsleur",emoji:"🎧"},{key:"anki",emoji:"🃏"},{key:"innerFrench",emoji:"🎙️"},...(data.customHabits||[])].map(h => (
                      <span key={h.key} style={{ fontSize:16, opacity: log[h.key]?1:0.15 }}>{h.emoji}</span>
                    ))}
                    <span style={{ fontSize:16, opacity: w?1:0.15 }}>{w?w.emoji:"🏋️"}</span>
                    <span style={{ fontSize:11, color:C.textMuted, marginLeft:4 }}>{isEditing?"▲":"▼"}</span>
                  </div>
                </div>
                {isEditing && renderHistoryEditor(date, log)}
              </div>
            );
          })}
          {Object.keys(data.logs).length === 0 && (
            <div style={{ color:C.textMuted, fontSize:13, textAlign:"center", padding:"20px 0" }}>No days logged yet.</div>
          )}
        </div>
      );


      // ─── TAB: SETTINGS ──────────────────────────────────────────────────
      const renderSettingsHabits = () => (
        <SectionDivider>
          <div style={S.sectionLabel}>Habits</div>

          <div style={S.card}>
            <div style={S.smallLabel}>Built-in</div>
            {BUILTIN_HABITS.map(h => {
              const hidden = hiddenBuiltins.includes(h.key);
              return (
                <div key={h.key} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 0", borderTop:`1px solid ${C.border}`, opacity: hidden?0.5:1 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                    <span style={{ fontSize:18 }}>{h.emoji}</span>
                    <span style={{ fontSize:14, color:C.text, textDecoration: hidden?"line-through":"none" }}>{h.label}</span>
                  </div>
                  <button onClick={()=>toggleBuiltin(h.key)} style={{
                    background: hidden?C.accent:"none",
                    border: `1px solid ${hidden?C.accent:C.border}`,
                    borderRadius:8, color: hidden?"#fff":C.textMuted,
                    fontSize:11, padding:"4px 12px", cursor:"pointer", fontFamily:"Georgia,serif",
                  }}>{hidden ? "RESTORE" : "HIDE"}</button>
                </div>
              );
            })}
            <div style={{ fontSize:10, color:C.textMuted, marginTop:10, fontStyle:"italic", lineHeight:1.5 }}>Hiding a built-in habit removes it from new days. Days where you already logged it keep their data.</div>
          </div>

          <div style={S.card}>
            <div style={S.smallLabel}>Custom</div>
            <div style={{ display:"flex", gap:8, marginBottom:10 }}>
              <input type="text" value={newHabitEmoji} onChange={e=>setNewHabitEmoji(e.target.value || "📌")} maxLength="4"
                style={{ width:54, textAlign:"center", background:C.bg, border:`1px solid ${C.border}`, borderRadius:8, fontSize:20, padding:"8px 0", fontFamily:"Georgia,serif" }} />
              <input type="text" value={newHabitName} onChange={e=>setNewHabitName(e.target.value)} placeholder="New habit name…"
                onKeyDown={e=>{ if(e.key==="Enter") addCustomHabit(); }}
                style={{ ...S.input, flex:1 }} />
              <button onClick={addCustomHabit} style={S.primaryBtn}>ADD</button>
            </div>
            <EmojiPalette selected={newHabitEmoji} onSelect={setNewHabitEmoji} />
            <div style={{ fontSize:10, color:C.textMuted, marginBottom:14, fontStyle:"italic", lineHeight:1.5 }}>Pick from above or type any emoji in the box. Tap an existing habit's emoji to change it.</div>

            {(data.customHabits||[]).length === 0 && (
              <div style={{ color:C.textMuted, fontSize:12, textAlign:"center", padding:"8px 0" }}>No custom habits yet. Type a name above to add one.</div>
            )}
            {(data.customHabits||[]).map(h => {
              const isEditing = editingEmojiFor === h.key;
              return (
                <div key={h.key} style={{ borderTop:`1px solid ${C.border}` }}>
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 0" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                      <span onClick={()=>setEditingEmojiFor(isEditing?null:h.key)} style={{
                        fontSize:22, cursor:"pointer", padding:"2px 8px", borderRadius:8,
                        background: isEditing?C.bg:"none",
                        border: `1px solid ${isEditing?C.border:"transparent"}`,
                      }}>{h.emoji}</span>
                      <span style={{ fontSize:14, color:C.text }}>{h.label}</span>
                    </div>
                    <button onClick={()=>deleteCustomHabit(h.key)} style={{ background:"none", border:`1px solid ${C.red}`, borderRadius:8, color:C.red, fontSize:11, padding:"4px 12px", cursor:"pointer", fontFamily:"Georgia,serif" }}>DELETE</button>
                  </div>
                  {isEditing && (
                    <div style={{ display:"flex", flexWrap:"wrap", gap:6, padding:"8px 0 12px" }}>
                      <input type="text" defaultValue={h.emoji}
                        onBlur={e=>{ updateHabitEmoji(h.key, e.target.value || "📌"); setEditingEmojiFor(null); }}
                        maxLength="4"
                        style={{ width:54, textAlign:"center", background:C.bg, border:`1px solid ${C.border}`, borderRadius:8, fontSize:18, padding:"6px 0", fontFamily:"Georgia,serif" }} />
                      {EMOJI_PRESETS.map(e => (
                        <button key={e} onClick={()=>{ updateHabitEmoji(h.key, e); setEditingEmojiFor(null); }} style={{
                          width:34, height:34, fontSize:18, borderRadius:8,
                          background: h.emoji===e?C.accent:C.bg,
                          border: `1px solid ${h.emoji===e?C.accent:C.border}`,
                          cursor:"pointer", fontFamily:"Georgia,serif",
                        }}>{e}</button>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </SectionDivider>
      );
