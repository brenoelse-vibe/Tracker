      const renderSettingsHabitOrder = () => (
        <SectionDivider>
          <div style={S.sectionLabel}>Habit order</div>
          <div style={S.card}>
            <div style={{ fontSize:12, color:C.textMuted, marginBottom:12, lineHeight:1.5 }}>Tap ▲▼ to reorder how habits appear on the Day tab.</div>
            {allActiveHabits.map((h, i) => {
              const btnStyle = disabled => ({
                width:32, height:32, borderRadius:8,
                background: disabled?C.bg:C.card,
                border: `1px solid ${C.border}`,
                color: disabled?C.mutedGray:C.text,
                fontSize:14, cursor: disabled?"default":"pointer",
                fontFamily:"Georgia,serif",
              });
              return (
                <div key={h.key} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 0", borderTop: i===0?"none":`1px solid ${C.border}` }}>
                  <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                    <span style={{ fontSize:18 }}>{h.emoji}</span>
                    <span style={{ fontSize:14, color:C.text }}>{h.label}</span>
                  </div>
                  <div style={{ display:"flex", gap:6 }}>
                    <button onClick={()=>moveHabit(h.key,-1)} disabled={i===0} style={btnStyle(i===0)}>▲</button>
                    <button onClick={()=>moveHabit(h.key,1)} disabled={i===allActiveHabits.length-1} style={btnStyle(i===allActiveHabits.length-1)}>▼</button>
                  </div>
                </div>
              );
            })}
          </div>
        </SectionDivider>
      );

      const renderSettingsTab = () => (
        <div style={S.bodyPad}>
          <div style={S.sectionLabel}>Adjust current progress</div>

          <div style={S.card}>
            <div style={{ fontSize:14, fontWeight:"bold", color:C.text, marginBottom:4 }}>🎧 Pimsleur</div>
            <div style={{ fontSize:12, color:C.textMuted, marginBottom:16 }}>Set the lesson number you are currently on</div>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              <div style={{ color:C.textMuted, fontSize:13 }}>Current lesson</div>
              <NumberStepper value={data.pimsleurTotal||0} onChange={v=>updateCount("pimsleurTotal",v)} min={0} max={180} />
            </div>
          </div>

          <div style={S.card}>
            <div style={{ fontSize:14, fontWeight:"bold", color:C.text, marginBottom:4 }}>🎙️ Inner French</div>
            <div style={{ fontSize:12, color:C.textMuted, marginBottom:16 }}>Set the episode number you are currently on</div>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              <div style={{ color:C.textMuted, fontSize:13 }}>Current episode</div>
              <NumberStepper value={data.innerFrenchTotal||0} onChange={v=>updateCount("innerFrenchTotal",v)} min={0} max={200} />
            </div>
          </div>

          <SavedToast show={saved} />

          {renderSettingsHabits()}
          {renderSettingsHabitOrder()}

          <SectionDivider>
            <div style={S.sectionLabel}>Export</div>
            <div style={S.card}>
              <div style={{ fontSize:13, color:C.textMuted, marginBottom:12, lineHeight:1.5 }}>Download all logged days as a spreadsheet. Opens in Excel, Numbers, or Google Sheets.</div>
              <button onClick={exportCSV} style={{ width:"100%", padding:"12px", borderRadius:10, background:C.accent, border:"none", color:"#fff", fontSize:13, fontWeight:"bold", cursor:"pointer", fontFamily:"Georgia,serif", letterSpacing:1 }}>
                📊 EXPORT TO CSV
              </button>
            </div>
          </SectionDivider>

          <SectionDivider>
            <div style={S.sectionLabel}>Danger zone</div>
            <button onClick={resetAllData} style={S.dangerBtn}>Reset all data</button>
          </SectionDivider>
        </div>
      );

      // ─── Root render ────────────────────────────────────────────────────
      return (
        <div style={{ fontFamily:"Georgia,serif", background:C.bg, minHeight:"100vh", color:C.text, maxWidth:430, margin:"0 auto", paddingBottom:80 }}>
          {renderHeader()}
          {renderTabs()}
          {activeTab === "day"      && renderDayTab()}
          {activeTab === "workout"  && renderWorkoutTab()}
          {activeTab === "progress" && renderProgressTab()}
          {activeTab === "year"     && renderYearTab()}
          {activeTab === "history"  && renderHistoryTab()}
          {activeTab === "settings" && renderSettingsTab()}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>

</body>
</html>
