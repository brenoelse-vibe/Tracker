                      style={{ width:"100%", background:"transparent", color:"#8a8578", border:"none", padding:14, fontFamily:"Georgia,serif", fontStyle:"italic", fontSize:14, cursor:"pointer", marginTop:4 }}>Cancel</button>
                  </div>
                </div>
              );
            })()}

            <SavedToast show={saved} />
          </>
        );
      };

      // Timed session UI: stopwatch (running) or manual duration entry (swimming/cycling).
      const renderTimedSession = sess => {
        const mode = TIMED_TYPES[sess.type];
        const w = WORKOUT_TYPES.find(t => t.key === sess.type);
        const bouts = (sess.exercises||[]).flatMap(e => (e.sets||[]).filter(s => s.duration > 0).map(s => ({ boutId:e.id, secs:s.duration })));
        const totalSecs = bouts.reduce((a,b) => a + b.secs, 0);
        const isRunning = runExId === SESSION_RUN_ID && runStartAt;

        return (
          <>
            {mode === "stopwatch" ? (
              <RunningGrow
                label={w?w.label:"Running"}
                emoji={w?w.emoji:"🏃"}
                onFinish={(secs)=>{ if(secs>0) logSessionBout(secs); }}
                C={C}
              />
            ) : (
              <div style={{ background:C.pinkTint, borderRadius:16, padding:"18px 16px", marginBottom:14 }}>
                <div style={{ fontSize:12, fontWeight:700, letterSpacing:1, textTransform:"uppercase", color:C.pink, marginBottom:10, textAlign:"center" }}>Log {w?w.label.toLowerCase():"session"} time</div>
                <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                  <input type="number" min="1" max="600" value={durationInput} onChange={e=>setDurationInput(e.target.value)} placeholder="Minutes"
                    style={{ flex:1, textAlign:"center", background:"#fff", border:`1px solid ${C.pink}`, borderRadius:11, padding:"14px", fontSize:20, fontWeight:800, color:C.pinkDeep, fontFamily:"Inter,sans-serif", outline:"none" }} />
                  <button onClick={()=>{ const m=parseInt(durationInput); if(m>0){ logSessionBout(m*60); setDurationInput(""); } }}
                    style={{ padding:"14px 20px", borderRadius:11, background:C.pink, border:"none", color:"#fff", fontSize:15, fontWeight:700, cursor:"pointer", fontFamily:"Inter,sans-serif" }}>Log</button>
                </div>
              </div>
            )}

            {bouts.length > 0 && (
              <div style={{ marginBottom:8 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:8 }}>
                  <span style={{ fontSize:12, fontWeight:800, color:C.ink, letterSpacing:-0.2 }}>This session</span>
                  <span style={{ fontSize:12, fontWeight:700, color:C.pinkDeep }}>{fmtDuration(totalSecs)} total</span>
                </div>
                {bouts.map((b,i) => (
                  <div key={i} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"11px 0", borderBottom:`1px solid ${C.hair}` }}>
                    <span style={{ fontSize:14, fontWeight:700, color:C.text }}>{w?w.emoji:"⏱️"} {mode==="stopwatch" ? fmtStopwatch(b.secs) : fmtDuration(b.secs)}</span>
                    <button onClick={()=>deleteSessionBout(b.boutId)} style={{ background:"none", border:"none", color:C.mutedGray, fontSize:18, cursor:"pointer", fontFamily:"Inter,sans-serif", lineHeight:1, padding:"0 4px" }}>×</button>
                  </div>
                ))}
              </div>
            )}
          </>
        );
      };

      const renderWorkoutPicker = () => {
        // Flat, equal list of every workout type in natural order (Push→Mix),
        // anchored low so the rows sit in the thumb zone. Pressing a row plays the
        // "settle" animation and opens the session. No suggestion, no Start button.
        return (
          <>
            <div style={{ minHeight:"58vh", display:"flex", flexDirection:"column", justifyContent:"flex-end" }}>
              <WorkoutSettleList types={WORKOUT_TYPES} onPick={openOrStartSession} C={C} />
            </div>

          </>
        );
      };

      // ─── TAB: TODO ──────────────────────────────────────────────────────
      const chipStyle = active => ({
        display:"inline-flex", alignItems:"center", gap:5,
        background: active?"#fbe9e8":"#ffffff",
        border:`1px solid ${active?"#f0b3b0":"#e7eae3"}`,
        borderRadius:100, padding:"6px 11px 6px 9px",
        fontSize:11, fontWeight:600,
        color: active?C.accent:C.textMuted,
        cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.1,
      });

      const renderTodoTab = () => {
        const allTodos = data.todos || [];
        const open = allTodos.filter(t => !t.done);
        const doneToday = allTodos.filter(t => t.done && (t.doneAt||"").startsWith(today));

        const submitQuickAdd = () => {
          const title = (quickAddDraft||"").trim();
          if (!title) return;
          const newTodo = {
            id: newTodoId(),
            title,
            dueDate: null,
            priority: null,
            notes: "",
            done: false,
            doneAt: null,
            createdAt: today,
          };
          update({ todos: [...(data.todos||[]), newTodo] });
          setQuickAddDraft("");
        };

        return (
          <div style={{ padding:"0 24px 80px" }}>
            <div style={{ fontFamily:"'Source Serif 4', Georgia, serif", fontSize:30, fontWeight:600, letterSpacing:-0.5, padding:"8px 0 18px", color:C.ink }}>
              {showDoneToday ? "Done today" : "To do"}
            </div>

            <div>
              {(showDoneToday ? doneToday : open).map(t => (
                showDoneToday ? (
                  <div key={t.id} style={{ display:"grid", gridTemplateColumns:"1fr auto", alignItems:"center", gap:12, padding:"15px 0", borderBottom:`1px solid ${C.hair}` }}>
                    <div onClick={()=>toggleTodo(t.id)} style={{
                      cursor:"pointer", userSelect:"none",
                      fontFamily:"'Source Serif 4', Georgia, serif", fontSize:19, fontWeight:500, letterSpacing:-0.2,
                      color:"#b0aaa0",
                      textDecoration:"line-through", textDecorationColor:"#cfc7b8",
                    }}>{t.title}</div>
                    <Toggle on={true} onClick={()=>toggleTodo(t.id)} />
                  </div>
                ) : (
                  <ComboRow key={t.id} item={t} onComplete={(id)=>toggleTodo(id)} onDelete={(id)=>deleteTodo(id)} />
                )
              ))}

              {!showDoneToday && open.length === 0 && (
                <div style={{ fontFamily:"'Source Serif 4', Georgia, serif", fontStyle:"italic", color:C.textMuted, padding:"28px 0 14px", textAlign:"center" }}>
                  Nothing to do.
                </div>
              )}
              {showDoneToday && doneToday.length === 0 && (
                <div style={{ fontFamily:"'Source Serif 4', Georgia, serif", fontStyle:"italic", color:C.textMuted, padding:"28px 0 14px", textAlign:"center" }}>
                  Nothing done today yet.
                </div>
              )}
            </div>

            {!showDoneToday && (
              <div style={{ display:"grid", gridTemplateColumns:"1fr auto", alignItems:"center", gap:12, padding:"18px 0 6px", borderBottom:`1px solid ${C.hair}` }}>
                <input type="text" value={quickAddDraft}
                  onChange={e=>setQuickAddDraft(e.target.value)}
                  onKeyDown={e=>{ if (e.key==="Enter") submitQuickAdd(); }}
                  placeholder="Add a task…"
                  style={{ background:"transparent", border:"none", outline:"none", fontFamily:"'Source Serif 4', Georgia, serif", fontSize:19, fontWeight:500, color:C.ink, padding:"6px 0", width:"100%" }} />
                <button onClick={submitQuickAdd} disabled={!quickAddDraft.trim()} style={{
                  border:"none", background:"transparent", cursor: quickAddDraft.trim()?"pointer":"default",
                  color: quickAddDraft.trim()?C.accentDeep:"#d9d3c8", fontSize:22, fontWeight:600, padding:"4px 8px", lineHeight:1,
                }}>↵</button>
              </div>
            )}

            <div style={{ display:"flex", justifyContent:"center", padding:"22px 0 0" }}>
              <button onClick={()=>setShowDoneToday(s=>!s)} style={{
                background:"none", border:"none", cursor:"pointer",
                fontFamily:"'Source Serif 4', Georgia, serif", fontStyle:"italic", fontSize:14, color:C.textMuted, letterSpacing:0.1,
              }}>
                {showDoneToday
                  ? "← back to open tasks"
                  : doneToday.length === 0 ? "nothing done today" : `${doneToday.length} done today →`}
              </button>
            </div>
          </div>
        );
      };

      const renderWorkoutTab = () => {
        const body = (activeSession && !forcePicker) ? renderWorkoutSession() : renderWorkoutPicker();
        return <div style={S.bodyPad}>{body}</div>;
      };

      // ─── TAB: YEAR ──────────────────────────────────────────────────────
      const renderYearTab = () => {
        const yearRange = (() => {
          const t = new Date();
          const end = new Date(t.getFullYear(), t.getMonth()+12, 1);
          return `${t.getFullYear()} — ${MONTH_LABELS[end.getMonth()]} ${end.getFullYear()}`;
        })();
        const todayColIdx = yearGrid.findIndex(w => w.days.some(d => d.isToday));

        return (
          <div style={S.bodyPad}>
            <div style={S.sectionLabel}>{yearRange}</div>

            <div style={{ ...S.card, display:"flex", justifyContent:"space-around", textAlign:"center" }}>
              {[
                { label:"Active days", value:yearStats.active },
                { label:"Full days", value:yearStats.full },
                { label:"Workouts", value:yearStats.workouts },
              ].map(st => (
                <div key={st.label}>
                  <div style={{ fontFamily:"'Inter',sans-serif", fontSize:26, fontWeight:600, color:C.accent, letterSpacing:-1, lineHeight:1 }}>{st.value}</div>
                  <div style={{ fontSize:10, color:C.textMuted, letterSpacing:1, textTransform:"uppercase", marginTop:4, fontWeight:600 }}>{st.label}</div>
                </div>
              ))}
            </div>

            <div ref={yearScrollRef} style={{ ...S.card, overflowX:"auto" }}>
              <div style={{ display:"flex", gap:3, minWidth:"fit-content" }}>
                <div style={{ display:"flex", flexDirection:"column", gap:3, marginRight:4, paddingTop:34, position:"sticky", left:0, background:"#ffffff", zIndex:1, paddingRight:4 }}>
                  {["","M","","W","","F",""].map((d,i) => (
                    <div key={i} style={{ height:16, fontSize:8, color:C.textMuted, display:"flex", alignItems:"center", width:14, fontWeight:600 }}>{d}</div>
                  ))}
                </div>
                <div style={{ display:"flex", gap:3 }}>
                  {yearGrid.map((week, wi) => {
                    const firstDay = week.days.find(d => d.day===1);
                    const mLabel = firstDay
                      ? (firstDay.month===0 ? `Jan ${String(firstDay.year).slice(2)}` : MONTH_LABELS[firstDay.month])
                      : "";
                    const wn = week.weekNum;
                    const showWeek = wn>0 && (wn%4===0 || wi===0 || wi===yearGrid.length-1);
                    const isTodayCol = wi === todayColIdx;
                    return (
                      <div key={wi} data-today={isTodayCol?"1":undefined} style={{ display:"flex", flexDirection:"column", gap:3 }}>
                        <div style={{ height:14, fontSize:8, color:C.accent, fontWeight:700, whiteSpace:"nowrap", textAlign:"center", width:16 }}>{showWeek ? `W${wn}` : ""}</div>
                        <div style={{ height:14, fontSize:9, color:C.textMuted, fontWeight:700, whiteSpace:"nowrap", overflow:"visible" }}>{mLabel}</div>
                        {week.days.map((cell, di) => {
                          const bgCol = heatColor(cell);
                          const isDark = [HEAT[3], HEAT[4], C.workoutOnly].includes(bgCol);
                          const numCol = isDark ? "#ffffff" : "rgba(0,0,0,0.45)";
                          return (
                            <div key={di} style={{
                              width:16, height:16, borderRadius:3,
                              background: bgCol,
                              outline: cell.isToday?`1.5px solid ${C.text}`:"none",
                              outlineOffset: cell.isToday?"1px":"0",
                              boxSizing:"border-box",
                              display:"flex", alignItems:"center", justifyContent:"center",
                              fontSize:7, fontWeight:700, color:numCol, lineHeight:1,
                              fontFamily:"Inter,sans-serif",
                            }}>{cell.label||""}</div>
                          );
                        })}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            <div style={{ fontSize:10, color:C.textMuted, letterSpacing:1, textAlign:"center", fontWeight:600 }}>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:6, marginBottom:6 }}>
                <span>COMBO</span>
                {[0,1,2,3,4].map(c => <div key={c} style={{ width:14, height:14, borderRadius:3, background:HEAT[c] }}/>)}
                <span>MORE</span>
              </div>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:6 }}>
                <div style={{ width:14, height:14, borderRadius:3, background:C.workoutOnly }}/>
                <span>WORKOUT ONLY</span>
              </div>
            </div>
            <div style={{ marginTop:16, fontSize:11, color:C.textMuted, textAlign:"center", lineHeight:1.6, fontWeight:500 }}>
              Each square = one day. Fill every square before your exam.
            </div>
          </div>
        );
      };


      // ─── TAB: HISTORY ───────────────────────────────────────────────────
      const renderHistoryEditor = (date, log) => (
        <div style={{ background:"#ffffff", borderRadius:14, padding:14, marginBottom:12, boxShadow:"none" }}>
          {(data.customHabits||[]).map(h => (
            <div key={h.key} onClick={()=>toggleDayHabit(date,h.key)} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 0", cursor:"pointer", borderBottom:`1px solid ${C.border}` }}>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ fontSize:20 }}>{h.emoji}</span>
                <span style={{ fontSize:13, color:C.text, fontWeight:500 }}>{h.label}</span>
              </div>
              <Toggle on={log[h.key]} onClick={()=>toggleDayHabit(date,h.key)} />
            </div>
          ))}
          <div style={{ padding:"12px 0 8px" }}>
            <div style={{ fontSize:11, color:C.textMuted, marginBottom:8, letterSpacing:1, textTransform:"uppercase", fontWeight:600 }}>Workout</div>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
              {WORKOUT_TYPES.map(wk => {
                const active = log.workout === wk.key;
                return (
                  <button key={wk.key} onClick={()=>setDayWorkout(date,wk.key)} style={{
                    flex:"1 1 calc(33% - 6px)", padding:"8px 4px", borderRadius:10,
                    background: active?`${C.accent}`:"#ffffff",
                    border:"none",
                    color: active?"#fff":C.text,
                    fontSize:11, fontWeight:600, cursor:"pointer", fontFamily:"Inter,sans-serif", textAlign:"center",
                    boxShadow:"none",
                  }}>
                    <div style={{ fontSize:16 }}>{wk.emoji}</div>
                    <div style={{ marginTop:2 }}>{wk.label}</div>
                  </button>
                );
              })}
            </div>
          </div>
          <button onClick={()=>{ if(window.confirm(`Delete ${formatDate(date,{weekday:"long",month:"short",day:"numeric"})}?`)) deleteDay(date); }}
            style={{ width:"100%", padding:"10px", borderRadius:12, background:"#ffffff", border:`1px solid ${C.red}`, color:C.red, fontSize:12, fontWeight:600, cursor:"pointer", fontFamily:"Inter,sans-serif", marginTop:10 }}>
            Delete this day
          </button>
        </div>
      );

      // ─── Workout history helpers ────────────────────────────────────────
      // Flatten all sessions across all dates → [{date, sess}], newest first.
      const allSessionsFlattened = (() => {
        const out = [];
        Object.keys(data.workoutSessions||{}).forEach(date => {
          (data.workoutSessions[date]||[]).forEach(sess => out.push({ date, sess }));
        });
        out.sort((a,b) => b.date.localeCompare(a.date) || ((b.sess.startedAt||0) - (a.sess.startedAt||0)));
        return out;
      })();

      const sessionVolume = sess => (sess.exercises||[]).reduce((a,e)=>a+(e.sets||[]).reduce((s,st)=>s+(st.weight||0)*(st.reps||0),0),0);
      const sessionSets = sess => (sess.exercises||[]).reduce((a,e)=>a+(e.sets||[]).length,0);

      // Per-type session count + volume over the last N sessions, for trend bars.
      const typeTrend = typeKey => {
        const list = allSessionsFlattened.filter(x => x.sess.type === typeKey).slice(0, 10).reverse();
        return list.map(x => ({ date: x.date, volume: sessionVolume(x.sess), sets: sessionSets(x.sess) }));
      };

      const renderWorkoutFeed = () => {
        if (allSessionsFlattened.length === 0) {
          return <div style={{ color:C.textMuted, fontSize:13, textAlign:"center", padding:"30px 0", fontWeight:500 }}>No workouts logged yet.</div>;
        }
        // group by date
        const byDate = [];
        allSessionsFlattened.forEach(x => {
          const last = byDate[byDate.length-1];
          if (last && last.date === x.date) last.items.push(x.sess);
          else byDate.push({ date: x.date, items: [x.sess] });
        });
        const dateLabel = d => {
          if (d === today) return "Today";
          const y = new Date(); y.setDate(y.getDate()-1);
          if (d === localDateKey(y)) return "Yesterday";
          return formatDate(d,{weekday:"long",month:"short",day:"numeric"});
        };
        return byDate.map(grp => (
          <div key={grp.date} style={{ marginBottom:6 }}>
            <div style={{ fontSize:12, fontWeight:800, color:C.textMuted, letterSpacing:-0.2, margin:"16px 0 2px" }}>{dateLabel(grp.date)}</div>
            {grp.items.map(sess => {
              const w = WORKOUT_TYPES.find(t => t.key===sess.type);
              const vol = sessionVolume(sess), sets = sessionSets(sess);
              const exDone = (sess.exercises||[]).filter(e=>(e.sets||[]).length>0||e.done).length;
              const timeStr = sess.startedAt ? new Date(sess.startedAt).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:APP_TZ}) : null;
              const isExp = expandedFeedId === sess.id;
              return (
                <div key={sess.id}>
                  <div onClick={()=>setExpandedFeedId(isExp?null:sess.id)} style={{ display:"flex", alignItems:"center", gap:12, padding:"12px 0", borderBottom:`1px solid ${C.hair}`, cursor:"pointer" }}>
                    <div style={{ width:38, height:38, borderRadius:10, background:C.fieldBg, display:"flex", alignItems:"center", justifyContent:"center", fontSize:19, flexShrink:0 }}>{w?w.emoji:"🏋️"}</div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:14, fontWeight:700, letterSpacing:-0.2, color:C.ink }}>{w?w.label:sess.type}</div>
                      <div style={{ fontSize:11, color:C.mutedGray, fontWeight:500, marginTop:2 }}>
                        {exDone} exercise{exDone!==1?"s":""}{sets>0?` · ${sets} sets`:""}{vol>0?` · ${vol>=1000?(vol/1000).toFixed(1)+"k":Math.round(vol)} lb`:""}
                      </div>
                    </div>
                    {timeStr && <div style={{ fontSize:11, color:C.mutedGray, fontWeight:600 }}>{timeStr}</div>}
                    <span style={{ fontSize:11, color:C.mutedGray }}>{isExp?"▲":"▼"}</span>
                  </div>
                  {isExp && (
                    <div style={{ padding:"6px 0 12px" }}>
                      {(sess.exercises||[]).filter(e=>(e.sets||[]).length>0||e.done).length===0 && (
                        <div style={{ fontSize:11, color:C.mutedGray, fontStyle:"italic", padding:"4px 0" }}>No exercises logged.</div>
                      )}
                      {(sess.exercises||[]).filter(e=>(e.sets||[]).length>0||e.done).map(e => (
                        <div key={e.id} style={{ padding:"8px 12px", marginBottom:4, background:C.fieldBg, borderRadius:10, borderLeft: e.done?`3px solid ${C.accentBright}`:"none" }}>
                          <div style={{ fontSize:12, fontWeight:700, color: e.done?C.accentDeep:C.text, letterSpacing:-0.2 }}>{e.done?"✓ ":""}{e.name}</div>
                          {(e.sets||[]).length>0 && (
                            <div style={{ fontSize:10, color:C.mutedGray, marginTop:3, lineHeight:1.4, fontWeight:500 }}>
                              {e.sets.map(st => `${st.weight||0}×${st.reps||0}`).join("  ·  ")}
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        ));
      };

      const renderWorkoutTrends = () => {
        const typesWithData = WORKOUT_TYPES.filter(t => allSessionsFlattened.some(x => x.sess.type===t.key));
        if (typesWithData.length === 0) return null;
        return (
          <div style={{ marginBottom:8 }}>
            <div style={{ fontSize:13, fontWeight:800, color:C.ink, letterSpacing:-0.2, margin:"4px 0 12px" }}>Volume trend by type</div>
            {typesWithData.map(t => {
              const trend = typeTrend(t.key);
              const max = Math.max(1, ...trend.map(p=>p.volume));
              const totalSessions = allSessionsFlattened.filter(x=>x.sess.type===t.key).length;
              return (
                <div key={t.key} style={{ marginBottom:16 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
                    <span style={{ fontSize:16 }}>{t.emoji}</span>
                    <span style={{ fontSize:13, fontWeight:700, color:C.text, letterSpacing:-0.2 }}>{t.label}</span>
                    <span style={{ fontSize:11, color:C.mutedGray, fontWeight:600, marginLeft:"auto" }}>{totalSessions} session{totalSessions!==1?"s":""}</span>
                  </div>
                  <div style={{ display:"flex", alignItems:"flex-end", gap:3, height:44 }}>
                    {trend.map((p,i) => (
                      <div key={i} title={`${Math.round(p.volume)} lb`} style={{ flex:1, minWidth:4, height:`${Math.max(6,(p.volume/max)*100)}%`, background: i===trend.length-1?C.accentBright:C.accentTint, borderRadius:3 }} />
                    ))}
                    {trend.length===0 && <div style={{ fontSize:11, color:C.mutedGray, fontStyle:"italic" }}>No volume data</div>}
                  </div>
                </div>
              );
            })}
          </div>
        );
      };

      // Workout-only calendar: month grid colored by session count.
      const renderWorkoutCalendar = () => {
        const byDate = {};
        Object.keys(data.workoutSessions||{}).forEach(d => { byDate[d] = (data.workoutSessions[d]||[]).length; });
        const dayColor = n => n===0 ? HEAT[0] : n===1 ? HEAT[2] : n===2 ? HEAT[3] : HEAT[4];

        const base = new Date();
        const mDate = new Date(base.getFullYear(), base.getMonth() + calMonthOffset, 1);
        const year = mDate.getFullYear(), month = mDate.getMonth();
        const daysInMonth = new Date(year, month+1, 0).getDate();
        const startDow = mDate.getDay();
        const cells = [];
        for (let i=0;i<startDow;i++) cells.push(null);
        for (let d=1; d<=daysInMonth; d++) cells.push(d);
        const atCurrent = calMonthOffset >= 0;

        const navBtn = (dir, disabled) => ({
          width:34, height:34, borderRadius:9, border:"none",
          background: disabled ? "transparent" : C.fieldBg,
          color: disabled ? C.border : C.ink,
          fontSize:18, fontWeight:700, lineHeight:1, cursor: disabled?"default":"pointer",
          fontFamily:"Inter,sans-serif", display:"flex", alignItems:"center", justifyContent:"center",
        });

        return (
          <div>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", margin:"4px 0 12px" }}>
              <div style={{ fontSize:13, fontWeight:800, color:C.ink, letterSpacing:-0.2 }}>Workout calendar</div>
              <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                <button onClick={()=>setCalMonthOffset(o=>o-1)} style={navBtn(-1, false)}>‹</button>
                <div style={{ fontSize:13, fontWeight:700, color:C.ink, minWidth:96, textAlign:"center" }}>{MONTH_LABELS[month]} {year}</div>
                <button onClick={()=>!atCurrent && setCalMonthOffset(o=>o+1)} style={navBtn(1, atCurrent)} disabled={atCurrent}>›</button>
              </div>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4 }}>
              {["S","M","T","W","T","F","S"].map((d,i)=>(<div key={"h"+i} style={{ fontSize:8, color:C.mutedGray, textAlign:"center", fontWeight:700, marginBottom:2 }}>{d}</div>))}
              {cells.map((d,i) => {
                if (d===null) return <div key={"e"+i} />;
                const key = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
                const n = byDate[key]||0;
                const isToday = key===today;
                return (
                  <div key={key} style={{ aspectRatio:"1", borderRadius:7, background:dayColor(n), display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, fontWeight:700, color: n>=2?"#fff":C.mutedGray, border: isToday?`2px solid ${C.ink}`:"none", boxSizing:"border-box" }}>{d}</div>
                );
              })}
            </div>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:6, fontSize:9, color:C.mutedGray, fontWeight:700, letterSpacing:1, marginTop:14 }}>
              <span>NONE</span>
              {[0,2,3,4].map(n=><div key={n} style={{ width:11, height:11, borderRadius:2, background: n===0?HEAT[0]:n===2?HEAT[2]:n===3?HEAT[3]:HEAT[4] }}/>)}
              <span>MORE</span>
            </div>
          </div>
        );
      };

      const renderHistoryTab = () => (
        <div style={S.bodyPad}>
          {/* sub-view switcher */}
          <div style={{ display:"flex", gap:6, background:C.fieldBg, borderRadius:12, padding:4, marginBottom:18, marginTop:4 }}>
            {[["workouts","Workouts"],["daily","Daily log"]].map(([k,label]) => (
              <button key={k} onClick={()=>setHistoryView(k)} style={{
                flex:1, padding:"9px 0", borderRadius:9, border:"none", cursor:"pointer", fontFamily:"Inter,sans-serif",
                fontSize:13, fontWeight:700, letterSpacing:-0.2,
                background: historyView===k ? C.surface : "transparent",
                color: historyView===k ? C.ink : C.mutedGray,
                boxShadow: historyView===k ? "0 1px 3px rgba(0,0,0,0.06)" : "none",
              }}>{label}</button>
            ))}
          </div>

          {historyView === "workouts" ? (
            <>
              {renderWorkoutTrends()}
              <div style={{ borderTop:`1px solid ${C.hair}`, margin:"4px 0 0", paddingTop:8 }} />
              {renderWorkoutCalendar()}
              <div style={{ borderTop:`1px solid ${C.hair}`, margin:"8px 0 0", paddingTop:8 }} />
              <div style={{ fontSize:13, fontWeight:800, color:C.ink, letterSpacing:-0.2, margin:"8px 0 0" }}>All workouts</div>
              {renderWorkoutFeed()}
            </>
          ) : (
            <>
              <div style={S.sectionLabel}>Daily log</div>
              <div style={{ fontSize:11, color:C.textMuted, marginBottom:14, fontStyle:"italic", fontWeight:500 }}>Tap a day to edit or delete it.</div>
              <div style={S.card}>
              {Object.entries(data.logs).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,30).map(([date, log], i) => {
                const w = WORKOUT_TYPES.find(w => w.key===log.workout);
                const isEditing = editingDate === date;
                const isToday = date === today;
                return (
                  <div key={date} style={{ borderTop: i===0?"none":`1px solid ${C.border}` }}>
                    <div onClick={()=>setEditingDate(isEditing?null:date)} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 0", cursor:"pointer" }}>
                      <div style={{ fontSize:12, color: isEditing?C.accent:C.textMuted, fontWeight: isEditing?700:500 }}>
                        {formatDate(date,{weekday:"short",month:"short",day:"numeric"})}
                        {isToday && <span style={{ marginLeft:6, fontSize:9, color:C.accent, letterSpacing:1, fontWeight:700 }}>TODAY</span>}
                      </div>
                      <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                        {(data.customHabits||[]).map(h => (
                          <span key={h.key} style={{ fontSize:16, opacity: log[h.key]?1:0.15 }}>{h.emoji}</span>
                        ))}
                        <span style={{ fontSize:16, opacity: w?1:0.15 }}>{w?w.emoji:"🏋️"}</span>
                        <span style={{ fontSize:11, color:C.textMuted, marginLeft:4 }}>{isEditing?"▲":"▼"}</span>
                      </div>
                    </div>
                    {isEditing && renderHistoryEditor(date, log)}
                  </div>
                );
              })}
              {Object.keys(data.logs).length === 0 && (
                <div style={{ color:C.textMuted, fontSize:13, textAlign:"center", padding:"20px 0" }}>No days logged yet.</div>
              )}
              </div>
            </>
          )}
        </div>
      );


      // ─── TAB: SETTINGS ──────────────────────────────────────────────────
      const renderSettingsHabits = () => (
        <SectionDivider>
          <div style={S.sectionLabel}>Habits</div>

          <div style={S.card}>
            <div style={S.smallLabel}>Built-in</div>
            {BUILTIN_HABITS.map((h, i) => {
              const hidden = hiddenBuiltins.includes(h.key);
              return (
                <div key={h.key} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 0", borderTop: i===0?"none":`1px solid ${C.border}`, opacity: hidden?0.5:1 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                    <span style={{ fontSize:18 }}>{h.emoji}</span>
                    <span style={{ fontSize:14, color:C.text, textDecoration: hidden?"line-through":"none", fontWeight:500 }}>{h.label}</span>
                  </div>
                  <button onClick={()=>toggleBuiltin(h.key)} style={{
                    background: hidden?`${C.accent}`:"#ffffff",
                    border: hidden?"none":`1px solid ${C.border}`,
                    borderRadius:8, color: hidden?"#fff":C.textMuted,
                    fontSize:11, fontWeight:700, letterSpacing:0.3, padding:"5px 12px", cursor:"pointer", fontFamily:"Inter,sans-serif",
                    boxShadow:"none",
                  }}>{hidden ? "RESTORE" : "HIDE"}</button>
                </div>
              );
            })}
            <div style={{ fontSize:10, color:C.textMuted, marginTop:10, fontStyle:"italic", lineHeight:1.5 }}>Hiding a built-in habit removes it from new days. Days where you already logged it keep their data.</div>
          </div>

          <div style={S.card}>
            <div style={S.smallLabel}>Custom</div>
            <div style={{ display:"flex", gap:8, marginBottom:10 }}>
              <input type="text" value={newHabitEmoji} onChange={e=>setNewHabitEmoji(e.target.value)} maxLength="4" placeholder="🙂"
                style={{ width:54, textAlign:"center", background:"#ffffff", border:`1px solid ${C.border}`, borderRadius:10, fontSize:20, padding:"8px 0", fontFamily:"Inter,sans-serif" }} />
              <input type="text" value={newHabitName} onChange={e=>setNewHabitName(e.target.value)} placeholder="New habit name…"
                onKeyDown={e=>{ if(e.key==="Enter") addCustomHabit(); }}
                style={{ ...S.input, flex:1 }} />
              <button onClick={addCustomHabit} style={S.primaryBtn}>ADD</button>
            </div>
            <EmojiPalette selected={newHabitEmoji} onSelect={setNewHabitEmoji} />
            <div style={{ fontSize:10, color:C.textMuted, marginBottom:14, fontStyle:"italic", lineHeight:1.5 }}>Pick from above or type any emoji in the box. Tap an existing habit's emoji to change it.</div>

            {(data.customHabits||[]).length === 0 && (
              <div style={{ color:C.textMuted, fontSize:12, textAlign:"center", padding:"8px 0" }}>No custom habits yet. Type a name above to add one.</div>
            )}
            {(data.customHabits||[]).map(h => {
              const isEditing = editingEmojiFor === h.key;
              return (
                <div key={h.key} style={{ borderTop:`1px solid ${C.border}` }}>
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 0" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                      <span onClick={()=>setEditingEmojiFor(isEditing?null:h.key)} style={{
                        fontSize:22, cursor:"pointer", padding:"2px 8px", borderRadius:8,
                        background: isEditing?"#ffffff":"none",
                        border: `1px solid ${isEditing?C.border:"transparent"}`,
                      }}>{h.emoji}</span>
                      <input type="text" defaultValue={h.label} key={"name-"+h.key+"-"+h.label}
                        onKeyDown={e=>{ if(e.key==="Enter") e.target.blur(); }}
                        onFocus={e=>{ e.target.style.borderBottom=`1px solid ${C.border}`; }}
                        onBlur={e=>{ e.target.style.borderBottom="1px solid transparent"; renameHabit(h.key, e.target.value); }}
                        style={{ fontSize:14, color:C.text, fontWeight:500, background:"none", border:"none", borderBottom:`1px solid transparent`, padding:"3px 2px", fontFamily:"Inter,sans-serif", minWidth:80, maxWidth:160 }} />
                    </div>
                    <button onClick={()=>deleteCustomHabit(h.key)} style={{ background:"#ffffff", border:`1px solid ${C.red}`, borderRadius:8, color:C.red, fontSize:11, fontWeight:700, letterSpacing:0.3, padding:"5px 12px", cursor:"pointer", fontFamily:"Inter,sans-serif" }}>DELETE</button>
                  </div>
                  {isEditing && (
                    <div style={{ display:"flex", flexWrap:"wrap", gap:6, padding:"8px 0 12px" }}>
                      <input type="text" defaultValue={h.emoji}
                        onBlur={e=>{ updateHabitEmoji(h.key, (e.target.value||"").trim()); setEditingEmojiFor(null); }}
                        maxLength="4" placeholder="🙂"
                        style={{ width:54, textAlign:"center", background:"#ffffff", border:`1px solid ${C.border}`, borderRadius:10, fontSize:18, padding:"6px 0", fontFamily:"Inter,sans-serif" }} />
                      <button onClick={()=>{ updateHabitEmoji(h.key, ""); setEditingEmojiFor(null); }} style={{
                        height:34, padding:"0 12px", fontSize:12, fontWeight:700, borderRadius:8,
                        background: !h.emoji ? `${C.accent}` : "#ffffff",
                        border: !h.emoji ? "none" : `1px solid ${C.border}`,
                        color: !h.emoji ? "#fff" : C.textMuted,
                        cursor:"pointer", fontFamily:"Inter,sans-serif",
                      }}>None</button>
                      {EMOJI_PRESETS.map(e => (
                        <button key={e} onClick={()=>{ updateHabitEmoji(h.key, e); setEditingEmojiFor(null); }} style={{
                          width:34, height:34, fontSize:18, borderRadius:8,
                          background: h.emoji===e?`${C.accent}`:"#ffffff",
                          border: h.emoji===e?"none":`1px solid ${C.border}`,
                          cursor:"pointer", fontFamily:"Inter,sans-serif",
                          boxShadow:"none",
                        }}>{e}</button>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </SectionDivider>
      );

      const renderSettingsHabitOrder = () => (
        <SectionDivider>
          <div style={S.sectionLabel}>Habit order</div>
          <div style={S.card}>
            <div style={{ fontSize:12, color:C.textMuted, marginBottom:12, lineHeight:1.5, fontWeight:500 }}>Tap ▲▼ to reorder how habits appear on the Day tab.</div>
            {allActiveHabits.map((h, i) => {
              const btnStyle = disabled => ({
                width:32, height:32, borderRadius:10,
                background: "#ffffff",
                border: "none",
                color: disabled?C.mutedGray:C.text,
                fontSize:14, cursor: disabled?"default":"pointer",
                fontFamily:"Inter,sans-serif",
                opacity: disabled?0.4:1,
                boxShadow:"none",
              });
              return (
                <div key={h.key} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 0", borderTop: i===0?"none":`1px solid ${C.border}` }}>
                  <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                    <span style={{ fontSize:18 }}>{h.emoji}</span>
                    <span style={{ fontSize:14, color:C.text, fontWeight:500 }}>{h.label}</span>
                  </div>
                  <div style={{ display:"flex", gap:6 }}>
                    <button onClick={()=>moveHabit(h.key,-1)} disabled={i===0} style={btnStyle(i===0)}>▲</button>
                    <button onClick={()=>moveHabit(h.key,1)} disabled={i===allActiveHabits.length-1} style={btnStyle(i===allActiveHabits.length-1)}>▼</button>
                  </div>
                </div>
              );
            })}
          </div>
        </SectionDivider>
      );

      const renderSettingsTab = () => {
        const rt = data.restTimer || DEFAULT_DATA.restTimer;
        const SettingToggle = ({ label, sub, on, onClick }) => (
          <div style={{ display:"flex", alignItems:"center", gap:12, padding:"14px 0", borderBottom:`1px solid ${C.hair}` }}>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:15, fontWeight:600, color:C.text, letterSpacing:-0.2 }}>{label}</div>
              {sub && <div style={{ fontSize:12, color:C.mutedGray, fontWeight:500, marginTop:2 }}>{sub}</div>}
            </div>
            <div onClick={onClick} style={{
              width:46, height:28, borderRadius:14, background: on?C.accentBright:C.border, flexShrink:0,
              position:"relative", cursor:"pointer", transition:"background 0.2s ease",
            }}>
              <div style={{ position:"absolute", top:3, left: on?21:3, width:22, height:22, borderRadius:"50%", background:"#fff", transition:"left 0.2s ease" }} />
            </div>
          </div>
        );
        return (
        <div style={S.bodyPad}>
          <div style={S.sectionLabel}>Profile</div>
          <div style={{ display:"flex", alignItems:"center", gap:12, padding:"14px 0 18px", borderBottom:`1px solid ${C.hair}`, marginBottom:6 }}>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:15, fontWeight:600, color:C.text, letterSpacing:-0.2 }}>Your name</div>
              <div style={{ fontSize:12, color:C.mutedGray, fontWeight:500, marginTop:2 }}>Shown in your greeting</div>
            </div>
            <input type="text" value={data.userName||""} placeholder={(user?.displayName||"").split(" ")[0] || "Name"}
              onChange={e=>update({ userName: e.target.value })}
              style={{ width:130, textAlign:"right", background:C.fieldBg, border:"none", borderRadius:8, padding:"9px 12px", fontSize:14, fontWeight:600, color:C.text, fontFamily:"Inter,sans-serif", outline:"none" }} />
          </div>

          {/* Habits — most-used: manage what you track */}
          {renderSettingsHabits()}
          {renderSettingsHabitOrder()}

          {/* Workout — rest timer settings live here, clearly scoped to workouts */}
          <SectionDivider>
          <div style={S.sectionLabel}>Workout · Rest timer</div>
          <SettingToggle label="Prompt after each set" sub="Show rest options when you check a set" on={rt.promptOnCheck} onClick={()=>updateRestTimer({ promptOnCheck: !rt.promptOnCheck })} />
          <div style={{ display:"flex", alignItems:"center", gap:12, padding:"14px 0", borderBottom:`1px solid ${C.hair}` }}>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:15, fontWeight:600, color:C.text, letterSpacing:-0.2 }}>Default rest</div>
              <div style={{ fontSize:12, color:C.mutedGray, fontWeight:500, marginTop:2 }}>Used by the timer button & highlighted preset</div>
            </div>
            <div style={{ display:"flex", gap:6 }}>
              {REST_PRESETS.map(sec => (
                <button key={sec} onClick={()=>updateRestTimer({ defaultSec: sec })} style={{
                  background: sec===rt.defaultSec?C.accent:C.fieldBg, border:"none", borderRadius:8,
                  color: sec===rt.defaultSec?"#fff":C.text, fontSize:12, fontWeight:700, padding:"7px 9px", cursor:"pointer", fontFamily:"Inter,sans-serif",
                }}>{fmtClock(sec)}</button>
              ))}
            </div>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:12, padding:"14px 0", borderBottom:`1px solid ${C.hair}` }}>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:15, fontWeight:600, color:C.text, letterSpacing:-0.2 }}>Custom rest buttons</div>
              <div style={{ fontSize:12, color:C.mutedGray, fontWeight:500, marginTop:2 }}>Up to 2 extra presets, in seconds (0 = off)</div>
            </div>
            <div style={{ display:"flex", gap:6 }}>
              {[0,1].map(slot => {
                const val = (rt.custom||[])[slot] || 0;
                return (
                  <input key={slot} type="number" min="0" max="900" value={val || ""} placeholder="–"
                    onChange={e=>{
                      const next = [ ...(rt.custom||[]) ];
                      while (next.length < 2) next.push(0);
                      next[slot] = parseInt(e.target.value) || 0;
                      updateRestTimer({ custom: next });
                    }}
                    style={{ width:56, textAlign:"center", background:C.fieldBg, border:"none", borderRadius:8, padding:"8px 4px", fontSize:14, fontWeight:700, color:C.text, fontFamily:"Inter,sans-serif", outline:"none" }} />
                );
              })}
            </div>
          </div>
          <SettingToggle label="Sound alert" sub="Beep when rest ends" on={rt.sound} onClick={()=>updateRestTimer({ sound: !rt.sound })} />
          <SettingToggle label="Vibrate" sub="Not supported on iPhone — Android only" on={rt.vibrate} onClick={()=>updateRestTimer({ vibrate: !rt.vibrate })} />
          <SettingToggle label="Visual pulse" sub="Flash the timer bar at zero" on={rt.visual} onClick={()=>updateRestTimer({ visual: !rt.visual })} />
          </SectionDivider>

          <SavedToast show={saved} />

          {(() => {
            // Linked accounts section
            const providers = window.__firebase ? window.__firebase.getLinkedProviders() : [];
            const hasGoogle = providers.includes("google.com");
            const hasEmail = providers.includes("password");
            const _ = linkedRefresh; // force re-read on changes

            const linkEmailAccount = async () => {
              setLinkError(""); setLinkSuccess(""); setLinkBusy(true);
              const r = await window.__firebase.linkEmailToCurrentUser(linkEmail.trim(), linkPassword);
              setLinkBusy(false);
              if (r.ok) {
                setLinkSuccess(`Email login linked! You can now sign in with ${linkEmail.trim()} or with Google.`);
                setLinkEmail(""); setLinkPassword("");
                setLinkPanelOpen(false);
                setLinkedRefresh(x => x+1);
              } else {
                setLinkError(r.error);
              }
            };

            const linkGoogleAccount = async () => {
              setLinkError(""); setLinkSuccess(""); setLinkBusy(true);
              const r = await window.__firebase.linkGoogleToCurrentUser();
              setLinkBusy(false);
              if (r.ok) {
                setLinkSuccess("Google login linked! You can now sign in either way.");
                setLinkedRefresh(x => x+1);
              } else {
                setLinkError(r.error);
              }
            };

            const unlinkProvider = async (pid, label) => {
              if (!window.confirm(`Remove ${label} login? You'll only be able to sign in with your other method.`)) return;
              setLinkError(""); setLinkSuccess("");
              const r = await window.__firebase.unlinkProvider(pid);
              if (r.ok) {
                setLinkSuccess(`${label} login removed.`);
                setLinkedRefresh(x => x+1);
              } else {
                setLinkError(r.error);
              }
            };

            return (
              <SectionDivider>
                <div style={S.sectionLabel}>Account · Sign-in methods</div>
                <div style={S.card}>
                  <div style={{ fontSize:12, color:C.textMuted, marginBottom:14, lineHeight:1.5, fontWeight:500 }}>
                    Add a second way to sign in so you can access this same data even if one login stops working. Methods you link here all open this same account.
                  </div>

                  {/* Current account email */}
                  <div style={{ fontSize:11, color:C.mutedGray, marginBottom:10, fontWeight:600, letterSpacing:0.3 }}>
                    Signed in as <span style={{color:C.text, fontWeight:700}}>{user?.email || "(no email)"}</span>
                  </div>

                  {/* Google row */}
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 0", borderTop:`1px solid ${C.border}` }}>
                    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                      <div>
                        <div style={{ fontSize:14, color:C.text, fontWeight:600 }}>Google</div>
                        <div style={{ fontSize:10, color:C.textMuted, fontWeight:500 }}>{hasGoogle ? "Linked" : "Not linked"}</div>
                      </div>
                    </div>
                    {hasGoogle ? (
                      <button onClick={()=>unlinkProvider("google.com","Google")} disabled={linkBusy} style={{ background:"#ffffff", border:`1px solid ${C.border}`, borderRadius:8, color:C.textMuted, fontSize:11, fontWeight:700, letterSpacing:0.3, padding:"5px 12px", cursor:"pointer", fontFamily:"Inter,sans-serif" }}>UNLINK</button>
                    ) : (
                      <button onClick={linkGoogleAccount} disabled={linkBusy} style={{ background:`${C.accent}`, border:"none", borderRadius:8, color:"#fff", fontSize:11, fontWeight:700, letterSpacing:0.3, padding:"5px 12px", cursor:"pointer", fontFamily:"Inter,sans-serif" }}>LINK</button>
                    )}
                  </div>

                  {/* Email row */}
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 0", borderTop:`1px solid ${C.border}` }}>
                    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                      <div style={{ width:18, height:18, display:"flex", alignItems:"center", justifyContent:"center" }}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="2.5" stroke={C.textMuted} strokeWidth="1.8" fill="none"/><path d="M2.5 6L12 13L21.5 6" stroke={C.textMuted} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
                      </div>
                      <div>
                        <div style={{ fontSize:14, color:C.text, fontWeight:600 }}>Email & Password</div>
                        <div style={{ fontSize:10, color:C.textMuted, fontWeight:500 }}>{hasEmail ? "Linked" : "Not linked"}</div>
                      </div>
                    </div>
                    {hasEmail ? (
                      <button onClick={()=>unlinkProvider("password","Email")} disabled={linkBusy} style={{ background:"#ffffff", border:`1px solid ${C.border}`, borderRadius:8, color:C.textMuted, fontSize:11, fontWeight:700, letterSpacing:0.3, padding:"5px 12px", cursor:"pointer", fontFamily:"Inter,sans-serif" }}>UNLINK</button>
                    ) : (
                      <button onClick={()=>{ setLinkPanelOpen(!linkPanelOpen); setLinkError(""); setLinkSuccess(""); }} disabled={linkBusy} style={{ background:`${C.accent}`, border:"none", borderRadius:8, color:"#fff", fontSize:11, fontWeight:700, letterSpacing:0.3, padding:"5px 12px", cursor:"pointer", fontFamily:"Inter,sans-serif" }}>{linkPanelOpen ? "CANCEL" : "LINK"}</button>
                    )}
                  </div>

                  {/* Email link panel */}
                  {linkPanelOpen && !hasEmail && (
                    <div style={{ marginTop:12, padding:12, background:"#ffffff", borderRadius:12, border:`1px solid ${C.border}` }}>
                      <div style={{ fontSize:11, color:C.textMuted, marginBottom:10, lineHeight:1.5, fontWeight:500 }}>
                        Pick an email + password for this account. Use the same email as your Google account if you want, or a different one — either works. You'll be able to sign in with either method.
                      </div>
                      <input type="email" placeholder="Email" autoComplete="email" autoCapitalize="off"
                        value={linkEmail} onChange={e=>setLinkEmail(e.target.value)}
                        style={{ width:"100%", background:"#ffffff", border:`1px solid ${C.border}`, borderRadius:10, padding:"10px 12px", fontSize:13, color:C.text, fontFamily:"Inter,sans-serif", marginBottom:8, outline:"none" }}/>
                      <input type="password" placeholder="Password (min 6 characters)" autoComplete="new-password"
                        value={linkPassword} onChange={e=>setLinkPassword(e.target.value)}
                        onKeyDown={e=>{ if (e.key==="Enter" && linkEmail && linkPassword.length>=6) linkEmailAccount(); }}
                        style={{ width:"100%", background:"#ffffff", border:`1px solid ${C.border}`, borderRadius:10, padding:"10px 12px", fontSize:13, color:C.text, fontFamily:"Inter,sans-serif", marginBottom:10, outline:"none" }}/>
                      <button onClick={linkEmailAccount} disabled={linkBusy || !linkEmail || linkPassword.length<6} style={{ width:"100%", padding:"11px", borderRadius:10, background:`${C.accent}`, border:"none", color:"#fff", fontSize:12, fontWeight:700, letterSpacing:0.5, cursor:(linkBusy || !linkEmail || linkPassword.length<6)?"not-allowed":"pointer", opacity:(linkBusy || !linkEmail || linkPassword.length<6)?0.5:1, fontFamily:"Inter,sans-serif" }}>
                        {linkBusy ? "LINKING…" : "LINK EMAIL TO THIS ACCOUNT"}
                      </button>
                    </div>
                  )}

                  {linkError && <div style={{ marginTop:10, fontSize:11, color:C.red, fontWeight:500 }}>{linkError}</div>}
                  {linkSuccess && <div style={{ marginTop:10, fontSize:11, color:C.greenText, fontWeight:600 }}>{linkSuccess}</div>}
                </div>
              </SectionDivider>
            );
          })()}

          <SectionDivider>
            <div style={S.sectionLabel}>Data · Export</div>
            <div style={S.card}>
              <div style={{ fontSize:13, color:C.textMuted, marginBottom:12, lineHeight:1.5, fontWeight:500 }}>Download everything as an Excel workbook with 5 sheets: Summary, Daily Logs, Workout Sets, Workout Sessions, and Todos.</div>
              <button onClick={exportCSV} style={{ width:"100%", padding:"14px", borderRadius:12, background:`${C.accent}`, border:"none", color:"#fff", fontSize:13, fontWeight:700, cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:1 }}>
                📊 EXPORT TO EXCEL
              </button>
            </div>
          </SectionDivider>

          <SectionDivider>
            <div style={S.sectionLabel}>Data · Danger zone</div>
            <button onClick={resetAllData} style={S.dangerBtn}>Reset all data</button>
          </SectionDivider>
        </div>
        );
      };

      // ─── Root render ────────────────────────────────────────────────────
      return (
        <div style={{ fontFamily:"Inter,sans-serif", minHeight:"100vh", color:C.text, maxWidth:430, margin:"0 auto", background:"#fdfdfc", paddingBottom:"calc(96px + env(safe-area-inset-bottom, 0px))" }}>
          {renderHeader()}
          {activeTab === "day" && renderDayHero()}
          {activeTab === "day"      && renderDayTab()}
          {activeTab === "todo"     && renderTodoTab()}
          {activeTab === "workout"  && renderWorkoutTab()}
          {activeTab === "year"     && renderYearTab()}
          {activeTab === "history"  && renderHistoryTab()}
          {activeTab === "settings" && renderSettingsTab()}
          {renderRestBar()}
          {renderTabs()}
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props){ super(props); this.state = { err: null }; }
      static getDerivedStateFromError(err){ return { err }; }
      componentDidCatch(err, info){ this._info = info; }
      render(){
        if (this.state.err) {
          const e = this.state.err;
          return React.createElement("div", { style:{ fontFamily:"Inter, sans-serif", padding:"40px 24px", textAlign:"center", maxWidth:430, margin:"0 auto", color:"#15231a" } },
            React.createElement("div", { style:{ fontSize:32, marginBottom:12 } }, "⚠️"),
            React.createElement("div", { style:{ fontSize:18, fontWeight:800, marginBottom:8, letterSpacing:-0.3 } }, "Something went wrong"),
            React.createElement("div", { style:{ fontSize:14, color:"#5e6e62", marginBottom:20, lineHeight:1.5 } }, "The app hit an unexpected error. Your data is safe. Try reloading."),
            React.createElement("button", { onClick:()=>location.reload(), style:{ background:"#4a8f2f", color:"#fff", border:"none", borderRadius:10, padding:"12px 24px", fontSize:14, fontWeight:700, cursor:"pointer", fontFamily:"Inter, sans-serif" } }, "Reload"),
            React.createElement("button", { onClick:()=>{ try{ localStorage.removeItem("tef_tracker_v2"); }catch(e){} location.reload(); }, style:{ display:"block", margin:"14px auto 0", background:"none", color:"#8a978d", border:"none", fontSize:12, textDecoration:"underline", cursor:"pointer", fontFamily:"Inter, sans-serif" } }, "Reset local data & start fresh"),
            React.createElement("details", { style:{ marginTop:24, textAlign:"left" } },
              React.createElement("summary", { style:{ fontSize:11, color:"#8a978d", cursor:"pointer" } }, "Technical details"),
              React.createElement("pre", { style:{ fontSize:10, color:"#8a978d", whiteSpace:"pre-wrap", marginTop:8, fontFamily:"monospace" } }, (e && e.stack ? e.stack : String(e)))
            )
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.render(
      React.createElement(ErrorBoundary, null, React.createElement(App)),
      document.getElementById("root")
    );
  </script>
</body>
</html>
