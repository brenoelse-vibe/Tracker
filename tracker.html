                  <button onClick={()=>{ setLoginMode("signin"); setLoginError(""); setLoginInfo(""); }} style={ghostBtn}>← Back to sign in</button>
                </div>
              </div>
            )}
          </div>
        );
      }

      // ─── Header + Tabs ──────────────────────────────────────────────────
      const renderHeader = () => (
        <div style={{ padding:"20px 18px 12px" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ width:26, height:26, background:C.ink, borderRadius:7, color:"#fff", display:"inline-flex", alignItems:"center", justifyContent:"center", fontFamily:"'Inter',sans-serif", fontWeight:800, fontSize:13, letterSpacing:-0.5 }}>B</span>
              <span style={{ fontSize:14, fontWeight:700, color:C.ink, letterSpacing:-0.3 }}>tracker</span>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ display:"inline-flex", alignItems:"center", gap:5, background: syncing?"#fdf0d4":C.accentTint, color: syncing?"#8a5a0d":C.accentDeep, padding:"4px 9px", borderRadius:6, fontSize:10, fontWeight:600, letterSpacing:0.3 }}>
                <span style={{ width:5, height:5, background: syncing?"#e0a020":C.accent, borderRadius:"50%" }}/>
                {syncing ? "SYNCING" : "SYNCED"}
              </span>
              <span onClick={()=>window.__firebase.signOut()} style={{ fontSize:10, color:C.textMuted, cursor:"pointer", textDecoration:"underline", fontWeight:500 }}>Sign out</span>
            </div>
          </div>
        </div>
      );

      const tabStyle = active => ({
        flex:1, padding:"6px 4px 4px", background:"none", border:"none",
        color: active?C.accentDeep:C.mutedGray,
        cursor:"pointer", fontFamily:"Inter,sans-serif",
        display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:2,
        position:"relative",
      });

      // Floating rest countdown — pinned just above the bottom nav.
      const renderRestBar = () => {
        if (!restEndAt && !restDone) return null;
        const remaining = restRemaining;
        const progress = restDuration > 0 ? Math.max(0, Math.min(1, remaining/restDuration)) : 0;
        return (
          <div style={{
            position:"fixed", left:10, right:10, zIndex:101,
            bottom:"calc(78px + env(safe-area-inset-bottom, 0px))",
            maxWidth:410, margin:"0 auto",
            display:"flex", alignItems:"center", gap:12,
            background: restDone ? C.accentBright : C.ink,
            borderRadius:14, padding:"12px 14px",
            transition:"background 0.3s ease",
          }}>
            {restDone ? (
              <div style={{ flex:1, color:"#fff", fontSize:15, fontWeight:800, letterSpacing:-0.3 }}>Rest done 💪</div>
            ) : (
              <>
                <div style={{ minWidth:54 }}>
                  <div style={{ fontSize:22, fontWeight:800, color:"#fff", letterSpacing:-0.5, fontVariantNumeric:"tabular-nums", lineHeight:1 }}>{fmtClock(remaining)}</div>
                  <div style={{ fontSize:10, color:"rgba(255,255,255,0.6)", fontWeight:600, marginTop:2 }}>Rest</div>
                </div>
                <div style={{ flex:1, height:4, background:"rgba(255,255,255,0.18)", borderRadius:2, overflow:"hidden" }}>
                  <div style={{ height:"100%", width:`${progress*100}%`, background:C.accentBright, borderRadius:2, transition:"width 0.25s linear" }} />
                </div>
                <button onClick={()=>addRest(15)} style={{ background:"rgba(255,255,255,0.14)", border:"none", color:"#fff", fontSize:11, fontWeight:700, borderRadius:8, padding:"7px 10px", cursor:"pointer", fontFamily:"Inter,sans-serif" }}>+15s</button>
                <button onClick={skipRest} style={{ background:"rgba(255,255,255,0.14)", border:"none", color:"#fff", fontSize:11, fontWeight:700, borderRadius:8, padding:"7px 10px", cursor:"pointer", fontFamily:"Inter,sans-serif" }}>Skip</button>
              </>
            )}
          </div>
        );
      };

      const renderTabs = () => (
        <div style={{
          position:"fixed", bottom:0, left:0, right:0, zIndex:100,
          display:"flex", justifyContent:"center",
          pointerEvents:"none",
          padding:"0 10px",
          paddingBottom:"calc(10px + env(safe-area-inset-bottom, 0px))",
        }}>
          <div style={{
            width:"100%", maxWidth:430,
            background:C.surface,
            border:`1px solid ${C.border}`,
            borderRadius:18,
            pointerEvents:"auto",
          }}>
            <div style={{ display:"flex", padding:"8px 2px 9px" }}>
              {TABS.map(t => {
                const active = activeTab === t.key;
                const color = active ? C.accentDeep : C.mutedGray;
                return (
                  <button key={t.key} onClick={()=>setActiveTab(t.key)} style={tabStyle(active)}>
                    <div style={{ height:22, display:"flex", alignItems:"center", justifyContent:"center" }}>
                      <TabIcon name={t.key} active={active} color={color} />
                    </div>
                    <div style={{ fontSize:9, fontWeight: active?800:600, letterSpacing:0.1, lineHeight:1, marginTop:3, color }}>{t.label}</div>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );


      // ─── TAB: DAY ───────────────────────────────────────────────────────
      const renderWorkoutHabitCard = () => {
        const on = !!todayLog.workout;
        return (
        <div key="workout">
          <div style={{
            display:"grid", gridTemplateColumns:"30px 1fr auto auto", alignItems:"center", gap:15,
            padding: on ? "16px 0 16px 18px" : "16px 0",
            marginLeft: on ? -22 : 0,
            borderLeft: on ? `4px solid ${C.accentBright}` : "none",
            borderBottom:`1px solid ${C.hair}`,
          }}>
            <div style={{ fontSize:23, textAlign:"center" }}>🏋️</div>
            <div style={{ minWidth:0 }}>
              <div style={{ color:C.text, fontSize:17, fontWeight: on?700:600, letterSpacing:-0.3 }}>Workout</div>
              <div style={{ color:C.mutedGray, fontSize:13, marginTop:2, fontWeight:500 }}>
                {selectedWorkout ? `${selectedWorkout.emoji} ${selectedWorkout.label}` : "Tap to log"}
              </div>
            </div>
            <button onClick={()=>setShowWorkoutPicker(!showWorkoutPicker)} style={on ? S.pillBtnOn : S.pillBtn}>
              {on ? "CHANGE" : "LOG"}
            </button>
            <div style={{ width:0 }} />
          </div>
          {showWorkoutPicker && (
            <div style={{ padding:"4px 0 14px", display:"flex", gap:8, flexWrap:"wrap" }}>
              {WORKOUT_TYPES.map(w => {
                const active = todayLog.workout === w.key;
                return (
                  <button key={w.key} onClick={()=>selectWorkout(w.key)} style={{
                    flex:"1 1 calc(33% - 8px)", padding:"10px 6px", borderRadius:10,
                    background: active?C.accent:C.fieldBg,
                    border: "none",
                    color: active?"#fff":C.text,
                    fontSize:12, cursor:"pointer", fontFamily:"Inter,sans-serif", textAlign:"center", fontWeight:600,
                  }}>
                    <div style={{ fontSize:20 }}>{w.emoji}</div>
                    <div style={{ marginTop:4, fontWeight:700 }}>{w.label}</div>
                  </button>
                );
              })}
            </div>
          )}
        </div>
        );
      };

      const renderDayHero = () => {
        // Today completion ring
        const totalToday = allActiveHabits.length;
        const doneToday = allActiveHabits.filter(h => !!(data.logs[today]||{})[h.key]).length;
        const pctToday = totalToday > 0 ? Math.round((doneToday/totalToday)*100) : 0;

        // Last workout across all sessions (flattened), newest first.
        const allSessionsFlat = [];
        Object.entries(data.workoutSessions||{}).forEach(([d, arr]) => {
          (arr||[]).forEach(s => {
            if ((s.exercises||[]).some(e => e.done || (e.sets||[]).length > 0) || d === today) {
              allSessionsFlat.push({ date: d, type: s.type, startedAt: s.startedAt||0 });
            }
          });
        });
        allSessionsFlat.sort((a,b) => b.date.localeCompare(a.date) || (b.startedAt - a.startedAt));
        const lastWorkout = allSessionsFlat[0] ? {
          type: allSessionsFlat[0].type,
          date: allSessionsFlat[0].date,
          isToday: allSessionsFlat[0].date === today,
        } : null;
        const lastWorkoutType = lastWorkout ? WORKOUT_TYPES.find(w => w.key===lastWorkout.type) : null;
        const lastWorkoutLabel = lastWorkout ? (() => {
          if (lastWorkout.isToday) return "today";
          const d = new Date(lastWorkout.date+"T12:00:00");
          const t = new Date(today+"T12:00:00");
          const diff = Math.round((t-d)/86400000);
          if (diff === 1) return "yesterday";
          if (diff < 7) return `${diff}d ago`;
          return formatDate(lastWorkout.date, {month:"short",day:"numeric"});
        })() : null;

        // Year time week number
        const todayWeek = getISOWeek(new Date());
        const hr = new Date().getHours();
        const greeting = hr < 12 ? "Good morning," : hr < 18 ? "Good afternoon," : "Good evening,";

        // date scrubber bits
        const goRel = delta => { const d = new Date(viewDate+"T12:00:00"); d.setDate(d.getDate()+delta); setViewDate(localDateKey(d)); };
        const isToday = viewDate === today;
        const dayDiff = (() => { const d = new Date(viewDate+"T12:00:00"); const t = new Date(today+"T12:00:00"); return Math.round((t-d)/86400000); })();
        const scrubLabel = isToday ? "Today" : (dayDiff===1 ? "Yesterday" : formatDate(viewDate, {month:"short",day:"numeric"}));

        const StatCol = ({ n, unit, label }) => (
          <div>
            <div style={{ fontSize:24, fontWeight:800, letterSpacing:-1, lineHeight:1, color:C.ink }}>
              {n}{unit && <span style={{ fontSize:13, color:C.mutedGray, fontWeight:700 }}>{unit}</span>}
            </div>
            <div style={{ fontSize:11, color:C.textMuted, fontWeight:600, marginTop:6 }}>{label}</div>
          </div>
        );

        return (
          <div style={{ padding:"2px 20px 0" }}>
            {/* greeting + date scrubber */}
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", padding:"18px 0 6px" }}>
              <div>
                <div style={{ fontSize:13, color:C.textMuted, fontWeight:500, marginBottom:2 }}>{greeting}</div>
                <div style={{ fontSize:30, fontWeight:800, letterSpacing:-1.2, lineHeight:1, color:C.ink }}>{(data.userName||"").trim() || (user?.displayName||"").split(" ")[0] || "there"}.</div>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <button onClick={()=>goRel(-1)} style={{ background:"none", border:"none", color:C.mutedGray, cursor:"pointer", fontSize:18, padding:0, lineHeight:1 }}>‹</button>
                <span onClick={()=>setViewDate(today)} style={{ fontSize:12, fontWeight:600, color:C.textMuted, cursor: isToday?"default":"pointer", minWidth:54, textAlign:"center" }}>{scrubLabel}</span>
                <button onClick={()=>{ if (viewDate<today) goRel(1); }} style={{ background:"none", border:"none", color:C.mutedGray, cursor:"pointer", fontSize:18, padding:0, lineHeight:1, opacity: viewDate>=today?0.35:1 }}>›</button>
              </div>
            </div>

            {/* stat grid */}
            <div style={{ display:"grid", gridTemplateColumns:"repeat(3, 1fr)", padding:"22px 0 18px", borderBottom:`1px solid ${C.hair}` }}>
              <StatCol n={doneToday} unit={`/${totalToday}`} label="Habits done" />
              <StatCol n={streak} label="Day streak" />
              <StatCol n={pctToday} unit="%" label="Today" />
            </div>

            {/* meta line — aligned to same 3-col grid */}
            <div style={{ display:"grid", gridTemplateColumns:"repeat(3, 1fr)", padding:"14px 0 0", fontSize:12, color:C.textMuted, fontWeight:500 }}>
              <span style={{ whiteSpace:"nowrap" }}>Day <strong style={{color:C.ink, fontWeight:700}}>{dayCount}</strong> · Wk <strong style={{color:C.ink, fontWeight:700}}>{todayWeek}</strong></span>
              <span style={{ gridColumn:3, textAlign:"right", whiteSpace:"nowrap" }}>Last: <strong style={{color:C.ink, fontWeight:700}}>{lastWorkout ? `${lastWorkoutType?.emoji||""} ${lastWorkoutType?.label||lastWorkout.type}` : "—"}</strong></span>
            </div>
          </div>
        );
      };

      // ─── Gap diagram ────────────────────────────────────────────────────
      // Renders a radar-style polygon: each habit is an axis at an equal angle.
      // Held habits push the actual shape to the outer (ideal) radius;
      // missed habits pull that vertex toward ~30% of the radius, producing
      // a visible "gap" segment from the actual vertex out to the ideal.
      const renderGapDiagram = () => {
        const axes = allActiveHabits.map(h => ({
          key: h.key, label: h.label,
          held: !!todayLog[h.key],
        }));
        const n = axes.length;
        if (n < 3) return null; // a polygon needs three points; below that we just show the habits.

        // Wide viewBox so left/right axis labels never clip.
        const W = 360, H = 300;
        const cx = W/2, cy = 150;
        const R = 92;                 // ideal radius (outer)
        const rMiss = R * 0.34;       // where a missed apex lands
        const heldCount = axes.filter(a => a.held).length;
        const closedPct = Math.round((heldCount / n) * 100);
        const allHeld = heldCount === n;
        const noneHeld = heldCount === 0;

        // start at 12 o'clock and go clockwise
        const angleFor = i => -Math.PI/2 + (i * 2*Math.PI / n);
        const pt = (i, r) => ({ x: cx + r*Math.cos(angleFor(i)), y: cy + r*Math.sin(angleFor(i)) });
        const idealPts = axes.map((_,i) => pt(i, R));
        const actualPts = axes.map((a,i) => pt(i, a.held ? R : rMiss));
        const poly = pts => pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");

        // Axis label sits centered horizontally on its vertex; above vertices in the
        // top half, below those in the bottom half. No side-anchoring → nothing clips.
        const PAD = 6;
        const labelFor = (i) => {
          const v = idealPts[i];
          const isTop = v.y < cy - 1;
          const isSide = Math.abs(v.y - cy) <= 1;
          const y = isTop ? v.y - 14 : (isSide ? v.y - 14 : v.y + 20);
          let x = Math.max(PAD + 30, Math.min(W - PAD - 30, v.x));
          return { x, y, anchor: "middle" };
        };

        return (
          <div style={{ background:"#f5efe4", borderRadius:14, padding:"18px 10px 12px", margin:"14px 0 6px" }}>
            <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="auto" style={{ display:"block", overflow:"visible" }}>
              {/* faint reference ring */}
              <circle cx={cx} cy={cy} r={R*0.5} fill="none" stroke="#e7dccb" strokeWidth="1" strokeDasharray="1 3"/>
              {/* faint cross axes */}
              <line x1={cx} y1={cy-R} x2={cx} y2={cy+R} stroke="#e3d9c6" strokeWidth="1"/>
              <line x1={cx-R} y1={cy} x2={cx+R} y2={cy} stroke="#e3d9c6" strokeWidth="1"/>

              {/* IDEAL — dashed brass, only while there's a gap */}
              {!allHeld && (
                <polygon points={poly(idealPts)} fill="none" stroke="#c9a880" strokeWidth="1.3" strokeDasharray="3 5" opacity="0.75"/>
              )}

              {/* ACTUAL filled shape — hidden when nothing is held (no sad blob) */}
              {!noneHeld && (
                <polygon points={poly(actualPts)} fill={C.accentBright} fillOpacity="0.18" stroke={C.accentDeep} strokeWidth="2.2" strokeLinejoin="round"/>
              )}

              {/* dashed gap segments on missed axes (no per-segment %, the header says it) */}
              {!noneHeld && axes.map((a, i) => a.held ? null : (
                <line key={"gap-"+i} x1={actualPts[i].x} y1={actualPts[i].y} x2={idealPts[i].x} y2={idealPts[i].y}
                      stroke="#c9a880" strokeWidth="1.3" strokeDasharray="2 4"/>
              ))}

              {/* vertex markers: solid green = held, open brass ring = missed */}
              {axes.map((a, i) => a.held ? (
                <circle key={"v-"+i} cx={actualPts[i].x} cy={actualPts[i].y} r="6" fill={C.accentDeep}/>
              ) : (
                <circle key={"v-"+i} cx={idealPts[i].x} cy={idealPts[i].y} r="4.5" fill="none" stroke="#c9a880" strokeWidth="1.4"/>
              ))}

              {/* axis labels */}
              {axes.map((a, i) => {
                const l = labelFor(i);
                return (
                  <text key={"lab-"+i} x={l.x} y={l.y} textAnchor={l.anchor} dominantBaseline="middle"
                        style={{ fontFamily:"Inter, sans-serif", fontSize:"12px", fontWeight:500, fill: a.held ? C.accentDeep : "#6b6357", letterSpacing:"0.1px" }}>
                    {a.label}
                  </text>
                );
              })}
            </svg>

            {/* closed % — calm header above the shape, no "CLOSED" label */}
            <div style={{ textAlign:"center", marginTop:2 }}>
              <span style={{ fontFamily:"Georgia, 'Times New Roman', serif", fontWeight:600, fontSize:30, color:C.accentDeep }}>
                {closedPct}<span style={{ fontSize:15, color:"#a99f8e", fontWeight:500 }}>%</span>
              </span>
            </div>
          </div>
        );
      };

      const renderDayTab = () => {
        return (
          <div style={{ padding:"0 20px 16px" }}>
            {renderGapDiagram()}
            <div style={{ fontSize:12, fontWeight:700, color:C.ink, margin:"22px 0 0", letterSpacing:-0.2 }}>Habits</div>

            {allActiveHabits.map(h => {
              if (h.key === "workout") return renderWorkoutHabitCard();
              return (
                <HabitCard key={h.key}
                  active={!!todayLog[h.key]}
                  emoji={h.emoji}
                  label={h.label}
                  sublabel={h.isBuiltin && h.sublabelFn ? h.sublabelFn(data) : ""}
                  onToggle={() => toggleHabit(h.key)}
                  stepper={null} />
              );
            })}

            <button onClick={()=>setActiveTab("settings")} style={{
              display:"flex", alignItems:"center", gap:10, width:"100%", marginTop:14,
              padding:"14px 16px", borderRadius:12, background:"none",
              border:`1.5px dashed ${C.border}`, cursor:"pointer", fontFamily:"Inter,sans-serif",
              color:C.textMuted, fontSize:14, fontWeight:600,
            }}>
              <span style={{ fontSize:18, color:C.accent, fontWeight:700, lineHeight:1 }}>+</span>
              {(data.customHabits||[]).length === 0 ? "Add your first habit" : "Add a habit"}
            </button>

            <SavedToast show={saved} />
          </div>
        );
      };


      // ─── EXERCISE PROGRESS CHART ────────────────────────────────────────
      // Build per-session history for one exercise across all logged sessions.
      // Returns [{ date, volume, e1rm, top, sets:[{weight,reps}] }] sorted oldest→newest.
      const getExerciseHistory = (exName) => {
        const out = [];
        Object.entries(data.workoutSessions || {}).forEach(([date, arr]) => {
          (arr || []).forEach(sess => {
            (sess.exercises || []).forEach(e => {
              if (e.name !== exName) return;
              const sets = (e.sets || []).filter(st => (st.weight || 0) > 0 || (st.reps || 0) > 0);
              if (sets.length === 0) return;
              const volume = sets.reduce((a, st) => a + (st.weight || 0) * (st.reps || 0), 0);
              const top = sets.reduce((a, st) => Math.max(a, st.weight || 0), 0);
              const e1rm = Math.round(sets.reduce((a, st) => {
                const est = (st.weight || 0) * (1 + (st.reps || 0) / 30);
                return Math.max(a, est);
              }, 0));
              out.push({ date, volume, top, e1rm, sets, startedAt: sess.startedAt||0 });
            });
          });
        });
        return out.sort((a, b) => a.date.localeCompare(b.date) || (a.startedAt - b.startedAt));
      };

      const METRIC_DEFS = {
        volume: { label: "Volume",  unit: "lb", pick: h => h.volume, fmt: v => v >= 1000 ? (v/1000).toFixed(1)+"k" : Math.round(v) },
        e1rm:   { label: "Est. 1RM", unit: "lb", pick: h => h.e1rm,  fmt: v => Math.round(v) },
        top:    { label: "Top set",  unit: "lb", pick: h => h.top,   fmt: v => Math.round(v) },
      };

      const ExerciseChart = ({ exName }) => {
        const history = getExerciseHistory(exName);
        const def = METRIC_DEFS[chartMetric];

        const TabRow = (
          <div style={{ display:"flex", gap:3, padding:2, background:C.fieldBg, borderRadius:9, marginBottom:12 }}>
            {Object.entries(METRIC_DEFS).map(([key, m]) => {
              const on = chartMetric === key;
              return (
                <button key={key} onClick={()=>setChartMetric(key)} style={{
                  flex:1, background: on?C.surface:"none", border:"none", borderRadius:7,
                  padding:"6px 4px", fontSize:10, fontWeight:700, letterSpacing:0.2,
                  color: on?C.ink:C.textMuted, cursor:"pointer", fontFamily:"Inter,sans-serif",
                }}>{m.label}</button>
              );
            })}
          </div>
        );

        if (history.length < 2) {
          return (
            <div style={{ marginTop:12, paddingTop:14, borderTop:`1px solid ${C.border}` }}>
              <div style={S.smallLabel}>Progress · {def.label}</div>
              {TabRow}
              <div style={{ padding:"24px 12px", textAlign:"center", color:C.mutedGray, fontSize:12, fontWeight:600 }}>
                {history.length === 0 ? "No history yet — log a few sessions." : "Log one more session to see a trend."}
              </div>
            </div>
          );
        }

        const vals = history.map(def.pick);
        const maxV = Math.max(...vals), minV = Math.min(...vals);
        const span = maxV - minV || 1;
        const W = 400, H = 120, padTop = 14, padBot = 16;
        const plotH = H - padTop - padBot;
        const x = i => history.length === 1 ? W/2 : (i/(history.length-1)) * (W - 20) + 10;
        const y = v => padTop + plotH * (1 - (v - minV)/span);
        const pts = history.map((h,i) => `${x(i)},${y(def.pick(h))}`).join(" ");
        const areaPts = `${pts} ${x(history.length-1)},${H-padBot} ${x(0)},${H-padBot}`;

        const latest = def.pick(history[history.length-1]);
        const first = def.pick(history[0]);
        const gain = latest - first;
        const gainPct = first > 0 ? Math.round((gain/first)*100) : 0;

        return (
          <div style={{ marginTop:12, paddingTop:14, borderTop:`1px solid ${C.border}` }}>
            <div style={S.smallLabel}>Progress · {history.length} sessions</div>
            {TabRow}
            <div style={{ height:H, margin:"0 -4px 12px" }}>
              <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{ overflow:"visible" }}>
                {[0,0.5,1].map(f => (
                  <line key={f} x1="0" y1={padTop+plotH*f} x2={W} y2={padTop+plotH*f}
                    stroke={C.border} strokeDasharray="2,3" />
                ))}
                <defs>
                  <linearGradient id="exArea" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor={C.accent} stopOpacity="0.28"/>
                    <stop offset="100%" stopColor={C.accent} stopOpacity="0"/>
                  </linearGradient>
                </defs>
                <polygon points={areaPts} fill="url(#exArea)" />
                <polyline points={pts} fill="none" stroke={C.accent} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
                {history.map((h,i) => (
                  <circle key={i} cx={x(i)} cy={y(def.pick(h))} r={i===history.length-1?4:2.6}
                    fill={i===history.length-1?C.accent:C.surface} stroke={C.accent} strokeWidth="2"/>
                ))}
              </svg>
            </div>
            <div style={{ display:"flex", gap:8, paddingTop:10, borderTop:`1px solid ${C.border}` }}>
              {[
                { num: def.fmt(latest), label: `Last (${def.unit})` },
                { num: (gain>=0?"+":"") + (chartMetric==="volume" ? gainPct+"%" : def.fmt(gain)), label: "Change" },
                { num: history.length, label: "Sessions" },
              ].map((s,i) => (
                <div key={i} style={{ flex:1, textAlign:"center" }}>
                  <div style={{ fontSize:15, fontWeight:800, color:C.accentDeep, letterSpacing:-0.5, lineHeight:1 }}>{s.num}</div>
                  <div style={{ fontSize:8, color:C.textMuted, fontWeight:800, letterSpacing:0.5, textTransform:"uppercase", marginTop:4 }}>{s.label}</div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      // ─── TAB: WORKOUT ───────────────────────────────────────────────────
      const renderSetRow = (exId, exName, st, idx) => {
        const prev = getPreviousSet(exName, idx);
        const inputStyle = filled => ({
          width:"100%", background:"transparent", border:"none",
          borderBottom: `2px solid ${filled ? C.accentBright : C.border}`, borderRadius:0,
          padding:"7px 2px", fontSize:15, fontWeight:700, textAlign:"center",
          fontFamily:"Inter,sans-serif", color: filled?C.accentDeep:C.text, outline:"none",
          MozAppearance:"textfield",
        });
        const hasW = (st.weight||0) > 0, hasR = (st.reps||0) > 0;
        const hasRest = typeof st.rest === "number";
        return (
          <SwipeRow key={idx} onDelete={()=>removeSet(exId,idx)}>
            <div style={{ display:"grid", gridTemplateColumns:"26px 1fr 56px 50px 30px", gap:8, alignItems:"center", padding:"8px 0" }}>
              <div style={{ fontSize:14, fontWeight:800, textAlign:"center", color: st.done?C.accentDeep:C.text, letterSpacing:-0.3 }}>{idx+1}</div>
              <div style={{ minWidth:0, paddingLeft:2 }}>
                <div style={{ fontSize:12, color:C.mutedGray, fontWeight:500 }}>
                  {prev ? <span><strong style={{color:C.textMuted, fontWeight:700}}>{prev.weight||0}</strong> × <strong style={{color:C.textMuted, fontWeight:700}}>{prev.reps||0}</strong></span> : <span style={{ fontStyle:"italic" }}>—</span>}
                </div>
                <button onClick={()=>setSetPromptFor(`${exId}:${idx}`)} style={{
                  marginTop:3, display:"inline-flex", alignItems:"center", gap:3, background:"none", border:"none", padding:0, cursor:"pointer",
                  fontSize:11, fontWeight:700, color: hasRest ? C.accentDeep : C.mutedGray, fontFamily:"Inter,sans-serif",
                }}>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="8" stroke="currentColor" strokeWidth="2.2"/><path d="M12 9.5V13l2.4 1.4" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/><path d="M9.5 2.5h5" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/></svg>
                  {hasRest ? (st.rest === 0 ? "No rest" : fmtClock(st.rest)) : "Rest"}
                </button>
              </div>
              <input type="number" step="0.5" value={hasW?st.weight:""} placeholder="—" className="set-field"
                onChange={e=>setSetValue(exId,idx,"weight",parseFloat(e.target.value)||0)}
                style={inputStyle(hasW && st.done)} />
              <input type="number" step="1" value={hasR?st.reps:""} placeholder="—" className="set-field"
                onChange={e=>setSetValue(exId,idx,"reps",parseFloat(e.target.value)||0)}
                style={inputStyle(hasR && st.done)} />
              <div style={{ display:"flex", justifyContent:"center" }}>
                <div onClick={()=>toggleSetDone(exId,idx)} style={{
                  width:26, height:26, borderRadius:8,
                  background: st.done?C.accentBright:"transparent",
                  border: st.done?`2px solid ${C.accentBright}`:`2px solid ${C.border}`,
                  display:"flex", alignItems:"center", justifyContent:"center",
                  fontSize:12, color:"#fff", fontWeight:800, cursor:"pointer",
                }}>{st.done?"✓":""}</div>
              </div>
            </div>
          </SwipeRow>
        );
      };

      // Inline rest-preset chooser, shown right after a set is checked.
      const renderRestPrompt = (exId, idx, exName) => {
        if (setPromptFor !== `${exId}:${idx}`) return null;
        const cfg = data.restTimer || DEFAULT_DATA.restTimer;
        const presets = [...REST_PRESETS, ...((cfg.custom||[]).filter(n => n > 0))];
        const prevSet = getPreviousSet(exName, idx);
        const prevRest = prevSet && typeof prevSet.rest === "number" ? prevSet.rest : null;

        const Btn = ({ sec, isZero }) => {
          const isDefault = !isZero && sec === cfg.defaultSec;
          const isPrev = prevRest !== null && sec === prevRest;
          return (
            <button onClick={()=>chooseRest(exId, idx, sec)} title={isZero?"No rest (logs 0s)":undefined} style={{
              position:"relative",
              background: isDefault ? C.accentTint : C.fieldBg,
              border: isPrev ? `1.5px solid ${C.accentBright}` : "1.5px solid transparent",
              borderRadius:10, padding:"10px 18px", fontSize:14, fontWeight:800, minWidth:64,
              color: isZero ? C.mutedGray : (isDefault ? C.accentDeep : C.text),
              cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:-0.3,
            }}>
              {isZero ? "0" : fmtClock(sec)}
              {isPrev && <span style={{ position:"absolute", top:-5, right:-5, width:15, height:15, borderRadius:"50%", background:C.accentBright, color:"#fff", fontSize:8, fontWeight:800, display:"flex", alignItems:"center", justifyContent:"center", border:`1.5px solid ${C.surface}` }} title="Last time's rest">↺</span>}
            </button>
          );
        };

        // Build a centered pyramid: timed presets sorted largest→smallest fill rows that
        // taper downward; the "0" (no-rest) button is always the single bottom tip.
        const sorted = [...presets].sort((a,b)=>b-a);
        let rows = [];
        if (sorted.length <= 4 && sorted.length > 0) {
          rows = [sorted];                 // single centered row for few presets
        } else {
          let start = 0, w = Math.ceil(sorted.length/2) ; // top row a touch wider
          // step down by one each row
          while (start < sorted.length) {
            const take = Math.min(w, sorted.length - start);
            rows.push(sorted.slice(start, start+take));
            start += take; w = Math.max(1, take - 1);
          }
        }

        return (
          <div style={{ padding:"6px 0 14px" }}>
            <div style={{ fontSize:11, fontWeight:800, letterSpacing:0.4, textTransform:"uppercase", color:C.mutedGray, textAlign:"center", marginBottom:10 }}>Rest</div>
            <div style={{ display:"flex", flexDirection:"column", gap:8, alignItems:"center" }}>
              {rows.map((row,ri) => (
                <div key={ri} style={{ display:"flex", gap:8, justifyContent:"center" }}>
                  {row.map(sec => <Btn key={sec} sec={sec} />)}
                </div>
              ))}
              <Btn sec={0} isZero />
            </div>
          </div>
        );
      };

      const renderExerciseCard = (ex, exIdx) => {
        const isRenaming = editingExercise && editingExercise.id === ex.id;
        const total = activeSession.exercises.length;
        const typeLabel = WORKOUT_TYPES.find(t=>t.key===activeSession.type)?.label || activeSession.type;
        const chartOpen = chartExpandedFor === ex.name;

        // Trend: change in top-set weight between the two most recent prior sessions.
        // Only meaningful for weighted lifts with ≥2 sessions and an actual change.
        const hist = getExerciseHistory(ex.name).filter(h => h.date < today);
        let trend = null;
        if (hist.length >= 2) {
          const delta = hist[hist.length-1].top - hist[hist.length-2].top;
          if (delta !== 0) trend = delta;
        }

        return (
          <div key={ex.id} style={{ padding:"18px 0", borderBottom:`1px solid ${C.hair}` }}>
            {/* header: name on left, reorder + chart on right (vertically centered) */}
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14, gap:10 }}>
              <div style={{ minWidth:0, flex:1 }}>
                {isRenaming ? (
                  <input type="text" defaultValue={ex.name} autoFocus
                    onBlur={e=>{ renameExercise(activeSession.type, ex.name, e.target.value); setEditingExercise(null); }}
                    onKeyDown={e=>{ if(e.key==="Enter") e.target.blur(); if(e.key==="Escape") setEditingExercise(null); }}
                    style={{ width:"100%", background:C.fieldBg, border:`1px solid ${C.accentBright}`, borderRadius:8, padding:"6px 10px", fontSize:16, fontWeight:700, color:C.text, fontFamily:"Inter,sans-serif" }} />
                ) : (
                  <div onClick={()=>setEditingExercise({ id: ex.id })}
                    style={{ fontSize:16, fontWeight:700, color:C.text, cursor:"pointer", letterSpacing:-0.3 }}>{ex.name}</div>
                )}
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:8, flexShrink:0 }}>
                {trend !== null && (
                  <span style={{ fontSize:13, fontWeight:700, color: trend>0?C.accentDeep:C.red, display:"inline-flex", alignItems:"center", gap:2 }}>
                    {trend>0?"↑":"↓"}{trend>0?"+":""}{trend}
                  </span>
                )}
                <ReorderArrows
                  onUp={()=>moveExercise(ex.id,-1)}
                  onDown={()=>moveExercise(ex.id,1)}
                  canUp={exIdx>0}
                  canDown={exIdx<total-1} />
                <button onClick={()=>startRest((data.restTimer||DEFAULT_DATA.restTimer).defaultSec)} title="Start rest timer"
                  style={{ width:30, height:30, borderRadius:9, background:C.fieldBg, border:"none", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", padding:0 }}>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="13" r="8" stroke={C.accentDeep} strokeWidth="2"/>
                    <path d="M12 9.5V13l2.4 1.4" stroke={C.accentDeep} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                    <path d="M9.5 2.5h5" stroke={C.accentDeep} strokeWidth="2" strokeLinecap="round"/>
                  </svg>
                </button>
                <button onClick={()=>setChartExpandedFor(chartOpen ? null : ex.name)} title="Progress chart"
                  style={{ width:30, height:30, borderRadius:9, background: chartOpen?C.accentBright:C.fieldBg, border:"none", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", padding:0 }}>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                    <rect x="4" y="13" width="3.4" height="7" rx="1.3" fill={chartOpen?"#fff":C.accentDeep}/>
                    <rect x="10.3" y="9" width="3.4" height="11" rx="1.3" fill={chartOpen?"#fff":C.accentDeep}/>
                    <rect x="16.6" y="5" width="3.4" height="15" rx="1.3" fill={chartOpen?"#fff":C.accentDeep}/>
                  </svg>
                </button>
                <button onClick={()=>{ if (window.confirm(`Remove "${ex.name}" from this workout? Other sessions are unaffected.`)) removeExerciseFromSession(ex.id); }} title="Remove from this workout"
                  style={{ width:30, height:30, borderRadius:9, background:C.fieldBg, border:"none", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", padding:0, color:C.mutedGray, fontSize:18, lineHeight:1, fontFamily:"Inter,sans-serif" }}>×</button>
              </div>
            </div>

            {/* Running stopwatch — pink-toned count-up timer for the Running exercise */}
            {ex.name.trim().toLowerCase() === "running" && (() => {
              const isRunning = runExId === ex.id && runStartAt;
              const completedRuns = (ex.sets||[]).filter(s => s.duration > 0);
              return (
                <div style={{ marginBottom:14 }}>
                  {isRunning ? (
                    <div style={{ background:C.pinkTint, borderRadius:14, padding:"18px 16px", textAlign:"center" }}>
                      <div style={{ fontSize:42, fontWeight:800, color:C.pinkDeep, letterSpacing:-1, fontVariantNumeric:"tabular-nums", lineHeight:1 }}>{fmtStopwatch(runElapsed)}</div>
                      <div style={{ fontSize:11, fontWeight:700, letterSpacing:1, textTransform:"uppercase", color:C.pink, marginTop:6 }}>Running</div>
                      <div style={{ display:"flex", gap:8, marginTop:14, justifyContent:"center" }}>
                        <button onClick={stopRun} style={{ flex:1, maxWidth:160, padding:"12px", borderRadius:11, background:C.pink, border:"none", color:"#fff", fontSize:14, fontWeight:700, cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.3 }}>Stop & save</button>
                        <button onClick={cancelRun} style={{ padding:"12px 16px", borderRadius:11, background:"#fff", border:`1px solid ${C.pink}`, color:C.pinkDeep, fontSize:14, fontWeight:700, cursor:"pointer", fontFamily:"Inter,sans-serif" }}>Cancel</button>
                      </div>
                    </div>
                  ) : (
                    <button onClick={()=>startRun(ex.id)} disabled={!!runStartAt} style={{
                      display:"flex", alignItems:"center", justifyContent:"center", gap:10, width:"100%",
                      padding:"14px", borderRadius:12, background: runStartAt ? C.fieldBg : C.pink, border:"none",
                      color: runStartAt ? C.mutedGray : "#fff", fontSize:15, fontWeight:700, cursor: runStartAt?"not-allowed":"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.3,
                    }}>
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="9" stroke={runStartAt?C.mutedGray:"#fff"} strokeWidth="2"/>
                        <path d="M10 8.5l6 3.5-6 3.5z" fill={runStartAt?C.mutedGray:"#fff"}/>
                      </svg>
                      Start running
                    </button>
                  )}
                  {completedRuns.length > 0 && !isRunning && (
                    <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginTop:10 }}>
                      {completedRuns.map((s,i) => (
                        <span key={i} style={{ fontSize:12, fontWeight:700, color:C.pinkDeep, background:C.pinkTint, borderRadius:8, padding:"5px 10px", fontVariantNumeric:"tabular-nums" }}>
                          🏃 {fmtStopwatch(s.duration)}
                        </span>
                      ))}
                    </div>
                  )}
                </div>
              );
            })()}

            {/* table */}
            {ex.sets.filter(s => !(s.duration > 0)).length > 0 && (
              <>
                <div style={{ display:"grid", gridTemplateColumns:"26px 1fr 56px 50px 30px", gap:8, padding:"0 0 8px", fontSize:10, letterSpacing:0.4, textTransform:"uppercase", fontWeight:700, color:C.mutedGray, borderBottom:`1px solid ${C.hair}` }}>
                  <span style={{ textAlign:"center" }}>Set</span>
                  <span style={{ paddingLeft:2 }}>Previous</span>
                  <span style={{ textAlign:"center" }}>Lb</span>
                  <span style={{ textAlign:"center" }}>Reps</span>
                  <span style={{ textAlign:"center" }}>✓</span>
                </div>
                {ex.sets.map((st, idx) => (
                  (st.duration > 0) ? null : (
                  <React.Fragment key={idx}>
                    {renderSetRow(ex.id, ex.name, st, idx)}
                    {renderRestPrompt(ex.id, idx, ex.name)}
                  </React.Fragment>
                  )
                ))}
              </>
            )}

            <button onClick={()=>addSet(ex.id)}
              style={{ background:"none", border:"none", color:C.accentDeep, fontSize:13, fontWeight:700, cursor:"pointer", fontFamily:"Inter,sans-serif", padding:"12px 0 0" }}>+ Add set</button>

            <textarea value={ex.notes||""} onChange={e=>updateExerciseNotes(ex.id, e.target.value)} placeholder="Add a note…" rows="1"
              style={{ width:"100%", marginTop:6, fontSize:13, color:C.textMuted, padding:(ex.notes||"").trim() ? "6px 0 6px 12px" : "6px 0", background:"transparent", border:"none", borderLeft:(ex.notes||"").trim() ? `3px solid ${C.accentBright}` : "none", fontFamily:"Inter,sans-serif", resize:"none", lineHeight:1.4, outline:"none" }} />

            {chartOpen && <ExerciseChart exName={ex.name} />}
          </div>
        );
      };

      const renderWorkoutSession = () => {
        const sess = activeSession;
        const w = WORKOUT_TYPES.find(t => t.key===sess.type);
        const doneCount = (sess.exercises||[]).filter(e => e.done).length;
        const totalCount = (sess.exercises||[]).length;
        const hiddenForType = (data.hiddenPresets||{})[sess.type] || [];
        const timeStr = sess.startedAt ? new Date(sess.startedAt).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}) : null;

        return (
          <>
            <button onClick={()=>setActiveSessionId(null)}
              style={{ display:"flex", alignItems:"center", gap:6, background:"none", border:"none", padding:"0 0 12px", cursor:"pointer", fontFamily:"Inter,sans-serif", color:C.accentDeep, fontSize:13, fontWeight:700 }}>
              <span style={{ fontSize:16, lineHeight:1 }}>‹</span> All workouts
            </button>
            <div style={{ display:"flex", alignItems:"center", gap:12, background:C.ink, borderRadius:16, padding:14, marginBottom:10 }}>
              <div style={{
                width:42, height:42, borderRadius:11,
                background:"rgba(255,255,255,0.12)",
                display:"flex", alignItems:"center", justifyContent:"center",
                fontSize:22, flexShrink:0,
              }}>{w?w.emoji:"🏋️"}</div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:16, fontWeight:800, color:"#fff", letterSpacing:-0.3 }}>{w?w.label:"Workout"}</div>
                <div style={{ fontSize:11, color:"rgba(255,255,255,0.6)", marginTop:1, fontWeight:500 }}>{timeStr ? timeStr+" · " : ""}{doneCount} of {totalCount} done</div>
              </div>
              <button onClick={()=>{ if(window.confirm("Delete this workout session? Its sets will be lost.")) deleteSession(today, sess.id); }}
                style={{ background:"rgba(255,255,255,0.12)", border:"none", borderRadius:9, color:"#fff", fontSize:10, padding:"7px 11px", letterSpacing:0.4, fontFamily:"Inter,sans-serif", cursor:"pointer", fontWeight:700 }}>DELETE</button>
            </div>

            {TIMED_TYPES[sess.type] ? renderTimedSession(sess) : (
            <>
            {sess.exercises.map((ex, exIdx) => renderExerciseCard(ex, exIdx))}

            {sess.exercises.length === 0 && (
              <div style={{ textAlign:"center", color:C.mutedGray, fontSize:13, fontWeight:500, padding:"24px 0 8px", lineHeight:1.5 }}>
                No exercises yet.<br/>Add one below — it'll carry forward to future {WORKOUT_TYPES.find(t=>t.key===sess.type)?.label || ""} workouts.
              </div>
            )}

            <div style={{ display:"flex", gap:8, margin:"16px 0 12px" }}>
              <input type="text" value={newExerciseName} onChange={e=>setNewExerciseName(e.target.value)} placeholder="Add custom exercise…"
                onKeyDown={e=>{ if(e.key==="Enter") { addCustomExercise(sess.type, newExerciseName); setNewExerciseName(""); } }}
                style={{ flex:1, background:C.fieldBg, border:"none", borderRadius:10, padding:"12px 14px", fontSize:13, color:C.text, fontFamily:"Inter,sans-serif", fontWeight:500 }} />
              <button onClick={()=>{ addCustomExercise(sess.type, newExerciseName); setNewExerciseName(""); }}
                style={{ background:C.accent, border:"none", borderRadius:10, color:"#fff", fontSize:12, fontWeight:700, padding:"0 18px", cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.4 }}>ADD</button>
            </div>

            {hiddenForType.length > 0 && (
              <div style={{ ...S.card, marginTop:4 }}>
                <div style={S.smallLabel}>Deleted exercises</div>
                {hiddenForType.map(h => (
                  <div key={h} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"6px 0", borderTop:`1px solid ${C.border}` }}>
                    <span style={{ fontSize:11, color:C.textMuted, textDecoration:"line-through" }}>{h}</span>
                    <button onClick={()=>restorePreset(sess.type, h)} style={{ background:"#ffffff", border:`1px solid ${C.accent}`, borderRadius:8, color:C.accent, fontSize:10, padding:"4px 10px", cursor:"pointer", fontFamily:"Inter,sans-serif", fontWeight:700, letterSpacing:0.4 }}>RESTORE</button>
                  </div>
                ))}
              </div>
            )}
            </>
            )}

            <SavedToast show={saved} />
          </>
        );
      };

      // Timed session UI: stopwatch (running) or manual duration entry (swimming/cycling).
      const renderTimedSession = sess => {
        const mode = TIMED_TYPES[sess.type];
        const w = WORKOUT_TYPES.find(t => t.key === sess.type);
        const bouts = (sess.exercises||[]).flatMap(e => (e.sets||[]).filter(s => s.duration > 0).map(s => ({ boutId:e.id, secs:s.duration })));
        const totalSecs = bouts.reduce((a,b) => a + b.secs, 0);
        const isRunning = runExId === SESSION_RUN_ID && runStartAt;

        return (
          <>
            {mode === "stopwatch" ? (
              isRunning ? (
                <div style={{ background:C.pinkTint, borderRadius:16, padding:"28px 16px", textAlign:"center", marginBottom:14 }}>
                  <div style={{ fontSize:54, fontWeight:800, color:C.pinkDeep, letterSpacing:-1.5, fontVariantNumeric:"tabular-nums", lineHeight:1 }}>{fmtStopwatch(runElapsed)}</div>
                  <div style={{ fontSize:12, fontWeight:700, letterSpacing:1.5, textTransform:"uppercase", color:C.pink, marginTop:8 }}>{w?w.label:"Running"}</div>
                  <div style={{ display:"flex", gap:8, marginTop:18, justifyContent:"center" }}>
                    <button onClick={stopSessionRun} style={{ flex:1, maxWidth:180, padding:"14px", borderRadius:12, background:C.pink, border:"none", color:"#fff", fontSize:15, fontWeight:700, cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.3 }}>Stop &amp; save</button>
                    <button onClick={cancelRun} style={{ padding:"14px 18px", borderRadius:12, background:"#fff", border:`1px solid ${C.pink}`, color:C.pinkDeep, fontSize:15, fontWeight:700, cursor:"pointer", fontFamily:"Inter,sans-serif" }}>Cancel</button>
                  </div>
                </div>
              ) : (
                <button onClick={startSessionRun} disabled={!!runStartAt} style={{
                  display:"flex", alignItems:"center", justifyContent:"center", gap:10, width:"100%",
                  padding:"18px", borderRadius:14, background: runStartAt ? C.fieldBg : C.pink, border:"none",
                  color: runStartAt ? C.mutedGray : "#fff", fontSize:16, fontWeight:700, cursor: runStartAt?"not-allowed":"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.3, marginBottom:14,
                }}>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="9" stroke={runStartAt?C.mutedGray:"#fff"} strokeWidth="2"/>
                    <path d="M10 8.5l6 3.5-6 3.5z" fill={runStartAt?C.mutedGray:"#fff"}/>
                  </svg>
                  Start {w?w.label.toLowerCase():"running"}
                </button>
              )
            ) : (
              <div style={{ background:C.pinkTint, borderRadius:16, padding:"18px 16px", marginBottom:14 }}>
                <div style={{ fontSize:12, fontWeight:700, letterSpacing:1, textTransform:"uppercase", color:C.pink, marginBottom:10, textAlign:"center" }}>Log {w?w.label.toLowerCase():"session"} time</div>
                <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                  <input type="number" min="1" max="600" value={durationInput} onChange={e=>setDurationInput(e.target.value)} placeholder="Minutes"
                    style={{ flex:1, textAlign:"center", background:"#fff", border:`1px solid ${C.pink}`, borderRadius:11, padding:"14px", fontSize:20, fontWeight:800, color:C.pinkDeep, fontFamily:"Inter,sans-serif", outline:"none" }} />
                  <button onClick={()=>{ const m=parseInt(durationInput); if(m>0){ logSessionBout(m*60); setDurationInput(""); } }}
                    style={{ padding:"14px 20px", borderRadius:11, background:C.pink, border:"none", color:"#fff", fontSize:15, fontWeight:700, cursor:"pointer", fontFamily:"Inter,sans-serif" }}>Log</button>
                </div>
              </div>
            )}

            {bouts.length > 0 && (
              <div style={{ marginBottom:8 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:8 }}>
                  <span style={{ fontSize:12, fontWeight:800, color:C.ink, letterSpacing:-0.2 }}>This session</span>
                  <span style={{ fontSize:12, fontWeight:700, color:C.pinkDeep }}>{fmtDuration(totalSecs)} total</span>
                </div>
                {bouts.map((b,i) => (
                  <div key={i} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"11px 0", borderBottom:`1px solid ${C.hair}` }}>
                    <span style={{ fontSize:14, fontWeight:700, color:C.text }}>{w?w.emoji:"⏱️"} {mode==="stopwatch" ? fmtStopwatch(b.secs) : fmtDuration(b.secs)}</span>
                    <button onClick={()=>deleteSessionBout(b.boutId)} style={{ background:"none", border:"none", color:C.mutedGray, fontSize:18, cursor:"pointer", fontFamily:"Inter,sans-serif", lineHeight:1, padding:"0 4px" }}>×</button>
                  </div>
                ))}
              </div>
            )}
          </>
        );
      };

      const renderWorkoutPicker = () => {
        return (
          <>
            <button onClick={()=>setForcePicker(false)} style={{ display:"flex", alignItems:"center", gap:6, background:"none", border:"none", padding:"0 0 12px", cursor:"pointer", fontFamily:"Inter,sans-serif", color:C.accentDeep, fontSize:13, fontWeight:700 }}>
              <span style={{ fontSize:16, lineHeight:1 }}>‹</span> All workouts
            </button>
            <div style={{ fontSize:15, fontWeight:800, color:C.ink, letterSpacing:-0.3, margin:"0 0 14px" }}>Start a workout</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:20 }}>
              {WORKOUT_TYPES.map(w => {
                const count = getExercisesForType(data, w.key).length;
                return (
                  <button key={w.key} onClick={()=>{ startSession(w.key); setForcePicker(false); }} style={{
                    ...S.card, marginBottom:0, padding:"18px 12px", textAlign:"center", cursor:"pointer", fontFamily:"Inter,sans-serif",
                  }}>
                    <div style={{ fontSize:32, lineHeight:1, marginBottom:8 }}>{w.emoji}</div>
                    <div style={{ fontSize:14, fontWeight:700, color:C.text, letterSpacing:-0.2 }}>{w.label}</div>
                    <div style={{ fontSize:10, color:C.textMuted, marginTop:3, fontWeight:500 }}>{count} exercises</div>
                  </button>
                );
              })}
            </div>

            {/* EXERCISE LIBRARY */}
            <div style={S.card}>
              <div onClick={()=>setLibraryExpanded(!libraryExpanded)} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer" }}>
                <div style={{ fontFamily:"'Inter',sans-serif", fontSize:15, fontWeight:600, letterSpacing:-0.3 }}>Exercise library</div>
                <span style={{ fontSize:11, color:C.textMuted, fontWeight:600 }}>{libraryExpanded?"▲":"▼"}</span>
              </div>
              {!libraryExpanded && (
                <div style={{ fontSize:11, color:C.textMuted, marginTop:6, fontWeight:500 }}>Manage all exercises across workout types</div>
              )}
              {libraryExpanded && (
                <div style={{ marginTop:14 }}>
                  {WORKOUT_TYPES.filter(t => t.key !== "mix").map(t => {
                    const visible = getExercisesForType(data, t.key);
                    const hidden = (data.hiddenPresets||{})[t.key] || [];
                    const customs = new Set((data.customExercises||{})[t.key] || []);
                    const presetSet = new Set(EXERCISE_PRESETS[t.key] || []);
                    const renames = (data.renamedPresets||{})[t.key] || {};
                    const renamedFromMap = {};
                    Object.entries(renames).forEach(([orig, newName]) => { renamedFromMap[newName] = orig; });
                    const newName = libraryNewByType[t.key] || "";
                    return (
                      <div key={t.key} style={{ marginBottom:18 }}>
                        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
                          <span style={{ fontSize:16 }}>{t.emoji}</span>
                          <span style={{ fontSize:12, fontWeight:700, color:C.text, letterSpacing:0.2 }}>{t.label}</span>
                          <span style={{ fontSize:10, color:C.textMuted, fontWeight:500 }}>· {visible.length} exercises</span>
                        </div>
                        {visible.length === 0 && (
                          <div style={{ fontSize:11, color:C.textMuted, fontStyle:"italic", padding:"4px 0" }}>No exercises in this type.</div>
                        )}
                        {visible.map(name => {
                          const isCustom = customs.has(name);
                          const originalName = renamedFromMap[name];
                          const isRenamedPreset = !!originalName;
                          return (
                            <div key={name} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"7px 10px", marginBottom:4, background:"#ffffff", borderRadius:10 }}>
                              <div style={{ display:"flex", alignItems:"center", gap:6, minWidth:0 }}>
                                <span style={{ fontSize:12, color:C.text, fontWeight:500 }}>{name}</span>
                                {isCustom && <span style={{ fontSize:8, color:C.accent, fontWeight:700, letterSpacing:1 }}>CUSTOM</span>}
                                {isRenamedPreset && <span style={{ fontSize:9, color:C.textMuted, fontStyle:"italic" }}>(was {originalName})</span>}
                              </div>
                              <button onClick={()=>{
                                const target = isRenamedPreset ? originalName : name;
                                if (window.confirm(`Delete "${name}" from ${t.label}? Past sessions are unaffected.`)) deleteExercise(t.key, target);
                              }} style={{ width:22, height:22, borderRadius:6, background:"#ffffff", border:`1px solid ${C.border}`, color:C.textMuted, fontSize:13, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, fontFamily:"Inter,sans-serif", lineHeight:1, padding:0 }}>×</button>
                            </div>
                          );
                        })}
                        {hidden.length > 0 && (
                          <div style={{ marginTop:6 }}>
                            <div style={{ fontSize:9, color:C.textMuted, textTransform:"uppercase", letterSpacing:1, fontWeight:700, marginBottom:4 }}>Deleted</div>
                            {hidden.map(h => (
                              <div key={h} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"6px 10px", marginBottom:4 }}>
                                <span style={{ fontSize:11, color:C.textMuted, textDecoration:"line-through" }}>{h}</span>
                                <button onClick={()=>restorePreset(t.key, h)} style={{ background:"#ffffff", border:`1px solid ${C.accent}`, borderRadius:8, color:C.accent, fontSize:9, padding:"3px 8px", cursor:"pointer", fontFamily:"Inter,sans-serif", fontWeight:700, letterSpacing:0.4 }}>RESTORE</button>
                              </div>
                            ))}
                          </div>
                        )}
                        <div style={{ display:"flex", gap:6, marginTop:6 }}>
                          <input type="text" value={newName} onChange={e=>setLibraryNewByType({ ...libraryNewByType, [t.key]: e.target.value })} placeholder={`Add to ${t.label}…`}
                            onKeyDown={e=>{ if(e.key==="Enter" && newName.trim()) { addCustomExercise(t.key, newName); setLibraryNewByType({ ...libraryNewByType, [t.key]: "" }); } }}
                            style={{ flex:1, background:"#ffffff", border:`1px dashed ${C.border}`, borderRadius:10, padding:"7px 10px", fontSize:11, color:C.text, fontFamily:"Inter,sans-serif" }} />
                          <button onClick={()=>{ if(newName.trim()) { addCustomExercise(t.key, newName); setLibraryNewByType({ ...libraryNewByType, [t.key]: "" }); } }}
                            style={{ background:"#ffffff", border:`1px solid ${C.accent}`, borderRadius:10, color:C.accent, fontSize:10, fontWeight:700, padding:"0 12px", cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.4 }}>ADD</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </>
        );
      };

      // ─── TAB: TODO ──────────────────────────────────────────────────────
      const renderTodoCard = (t, opts={}) => {
        const isOverdue = todoBucket(t.dueDate) === "overdue" && !t.done;
        const isExpanded = todoExpandedId === t.id;

        if (isExpanded) {
          return renderTodoExpanded(t, isOverdue);
        }

        const dateLabel = formatTodoDate(t.dueDate);
        const accentEdge = t.done ? C.accentBright : (isOverdue ? C.red : null);

        return (
          <div key={t.id} onClick={()=>setTodoExpandedId(t.id)} style={{
            display:"flex", alignItems:"center", gap:14, cursor:"pointer",
            padding: accentEdge ? "16px 0 16px 18px" : "16px 0",
            marginLeft: accentEdge ? -22 : 0,
            borderLeft: accentEdge ? `4px solid ${accentEdge}` : "none",
            borderBottom:`1px solid ${C.hair}`,
          }}>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{
                fontSize:17, fontWeight: t.done?700:600, letterSpacing:-0.3,
                color: t.done?C.textMuted:C.text,
                textDecoration: t.done?"line-through":"none",
                textDecorationColor: t.done?C.mutedGray:"transparent",
              }}>{t.title}</div>
              {(t.priority || dateLabel) && (
                <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:4 }}>
                  {t.priority && !t.done && (
                    <span style={{ width:7, height:7, borderRadius:2, background: PRIORITY_COLORS[t.priority] }}/>
                  )}
                  {dateLabel && !t.done && (
                    <span style={{ fontSize:13, fontWeight: isOverdue?700:500, color: isOverdue?C.red:C.mutedGray }}>{dateLabel}</span>
                  )}
                  {t.done && t.doneAt && (
                    <span style={{ fontSize:13, fontWeight:600, color:C.accentDeep }}>
                      Done · {t.doneAt === today ? "today" : formatDate(t.doneAt,{month:"short",day:"numeric"})}
                    </span>
                  )}
                </div>
              )}
            </div>
            <div onClick={e=>{ e.stopPropagation(); toggleTodo(t.id); }}>
              <Toggle on={t.done} onClick={()=>toggleTodo(t.id)} />
            </div>
          </div>
        );
      };

      const renderTodoExpanded = (t, isOverdue) => {
        const isEditingTitle = todoEditing && todoEditing.id === t.id && todoEditing.field === "title";
        const isEditingDate = todoEditing && todoEditing.id === t.id && todoEditing.field === "date";
        const isEditingPriority = todoEditing && todoEditing.id === t.id && todoEditing.field === "priority";
        const isEditingNotes = todoEditing && todoEditing.id === t.id && todoEditing.field === "notes";

        return (
          <div key={t.id} style={{
            background:C.surface,
            borderRadius:14,
            padding:16,
            border:`1px solid ${C.border}`,
            borderLeft: t.done ? `4px solid ${C.accentBright}` : isOverdue ? `4px solid ${C.red}` : `1px solid ${C.border}`,
          }}>
            <div style={{ display:"flex", alignItems:"flex-start", gap:14, marginBottom:14 }}>
              <div style={{ flex:1 }}>
                {isEditingTitle ? (
                  <input type="text" defaultValue={t.title} autoFocus
                    onBlur={e=>{ const v = e.target.value.trim(); if (v) updateTodo(t.id,{title:v}); setTodoEditing(null); }}
                    onKeyDown={e=>{ if (e.key==="Enter") e.target.blur(); if (e.key==="Escape") setTodoEditing(null); }}
                    style={{ width:"100%", background:"#ffffff", border:`1px solid ${C.accent}`, borderRadius:10, padding:"8px 10px", fontSize:16, fontWeight:600, color:C.text, fontFamily:"Inter,sans-serif", letterSpacing:-0.2 }} />
                ) : (
                  <div onClick={()=>setTodoEditing({id:t.id, field:"title"})} style={{
                    fontSize:16, fontWeight:600, letterSpacing:-0.2, lineHeight:1.35,
                    color: t.done?C.greenText:C.text,
                    cursor:"pointer",
                  }}>{t.title}</div>
                )}
              </div>
              <Toggle on={t.done} onClick={()=>toggleTodo(t.id)} />
            </div>

            {/* DATE ROW */}
            <div style={{ borderTop:`1px solid rgba(140,126,106,0.12)`, padding:"10px 0" }}>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ fontSize:10, letterSpacing:1, textTransform:"uppercase", color:C.mutedGray, fontWeight:700, minWidth:70 }}>Due</span>
                {isEditingDate ? (
                  <input type="date" defaultValue={t.dueDate || ""} autoFocus
                    onBlur={e=>{ updateTodo(t.id,{dueDate: e.target.value || null}); setTodoEditing(null); }}
                    onChange={e=>{ updateTodo(t.id,{dueDate: e.target.value || null}); setTodoEditing(null); }}
                    style={{ flex:1, background:"#ffffff", border:`1px solid ${C.accent}`, borderRadius:8, padding:"6px 10px", fontSize:13, color:C.text, fontFamily:"Inter,sans-serif" }} />
                ) : (
                  <div onClick={()=>setTodoEditing({id:t.id, field:"date"})} style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer" }}>
                    <span style={{ fontSize:13, fontWeight:600, color: isOverdue?C.accent:C.text }}>
                      {t.dueDate ? formatTodoDate(t.dueDate) : <span style={{color:"#b8aa92", fontWeight:500, fontStyle:"italic"}}>No due date</span>}
                    </span>
                    <span style={{ color:"#b8aa92", fontSize:14 }}>›</span>
                  </div>
                )}
              </div>
            </div>

            {/* PRIORITY ROW */}
            <div style={{ borderTop:`1px solid rgba(140,126,106,0.12)`, padding:"10px 0" }}>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ fontSize:10, letterSpacing:1, textTransform:"uppercase", color:C.mutedGray, fontWeight:700, minWidth:70 }}>Priority</span>
                {isEditingPriority ? (
                  <div style={{ flex:1, display:"flex", gap:6 }}>
                    {["high","med","low"].map(p => (
                      <button key={p} onClick={()=>{ updateTodo(t.id,{priority:p}); setTodoEditing(null); }} style={{
                        flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:5,
                        background: t.priority===p ? "#fbe9e8" : "#ffffff",
                        border:`1px solid ${t.priority===p?"#f0b3b0":"#e7eae3"}`,
                        borderRadius:8, padding:"6px 8px", fontSize:11, fontWeight:600,
                        color: t.priority===p?C.accent:C.textMuted,
                        cursor:"pointer", fontFamily:"Inter,sans-serif",
                      }}>
                        <span style={{ width:6, height:6, borderRadius:"50%", background:PRIORITY_COLORS[p] }}/>
                        {PRIORITY_LABELS[p]}
                      </button>
                    ))}
                    {t.priority && (
                      <button onClick={()=>{ updateTodo(t.id,{priority:null}); setTodoEditing(null); }} style={{ background:"none", border:"none", color:C.textMuted, fontSize:11, cursor:"pointer", padding:"0 4px" }}>×</button>
                    )}
                  </div>
                ) : (
                  <div onClick={()=>setTodoEditing({id:t.id, field:"priority"})} style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer" }}>
                    <span style={{ fontSize:13, fontWeight:600, color:C.text, display:"flex", alignItems:"center", gap:6 }}>
                      {t.priority ? (
                        <>
                          <span style={{ width:6, height:6, borderRadius:"50%", background:PRIORITY_COLORS[t.priority] }}/>
                          {PRIORITY_LABELS[t.priority]}
                        </>
                      ) : <span style={{color:"#b8aa92", fontWeight:500, fontStyle:"italic"}}>None</span>}
                    </span>
                    <span style={{ color:"#b8aa92", fontSize:14 }}>›</span>
                  </div>
                )}
              </div>
            </div>

            {/* NOTES ROW */}
            <div style={{ borderTop:`1px solid rgba(140,126,106,0.12)`, padding:"10px 0" }}>
              <div style={{ display:"flex", alignItems:"flex-start", gap:10 }}>
                <span style={{ fontSize:10, letterSpacing:1, textTransform:"uppercase", color:C.mutedGray, fontWeight:700, minWidth:70, paddingTop:2 }}>Notes</span>
                {isEditingNotes ? (
                  <textarea defaultValue={t.notes||""} autoFocus rows="2"
                    onBlur={e=>{ updateTodo(t.id,{notes: e.target.value}); setTodoEditing(null); }}
                    style={{ flex:1, background:"#ffffff", border:`1px solid ${C.accent}`, borderRadius:8, padding:"6px 10px", fontSize:13, color:C.text, fontFamily:"Inter,sans-serif", resize:"vertical", minHeight:42 }} />
                ) : (
                  <div onClick={()=>setTodoEditing({id:t.id, field:"notes"})} style={{ flex:1, display:"flex", alignItems:"flex-start", justifyContent:"space-between", cursor:"pointer", gap:8 }}>
                    <span style={{ fontSize:13, fontWeight:t.notes?500:500, color: t.notes?C.text:"#b8aa92", fontStyle: t.notes?"normal":"italic", lineHeight:1.4, flex:1 }}>
                      {t.notes || "Add a note…"}
                    </span>
                    <span style={{ color:"#b8aa92", fontSize:14 }}>›</span>
                  </div>
                )}
              </div>
            </div>

            {/* ACTIONS */}
            <div style={{ display:"flex", gap:8, marginTop:6, paddingTop:12, borderTop:`1px solid rgba(140,126,106,0.12)` }}>
              <button onClick={()=>setTodoExpandedId(null)} style={{
                flex:1, background:"#ffffff", border:`1px solid #e7eae3`,
                borderRadius:10, padding:10, fontSize:12, fontWeight:600, color:C.textMuted,
                cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.3,
              }}>CLOSE</button>
              <button onClick={()=>{ if (window.confirm(`Delete "${t.title}"?`)) deleteTodo(t.id); }} style={{
                flex:1, background:"rgba(204,68,68,0.05)", border:`1px solid rgba(204,68,68,0.3)`,
                borderRadius:10, padding:10, fontSize:12, fontWeight:600, color:C.red,
                cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.3,
                display:"flex", alignItems:"center", justifyContent:"center", gap:6,
              }}>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                DELETE
              </button>
            </div>
          </div>
        );
      };

      const renderTodoGroup = (label, todos, options={}) => {
        if (todos.length === 0) return null;
        const isToday = options.isToday;
        const dateSubtitle = options.dateSubtitle;
        return (
          <div key={label} style={{ marginBottom:10 }}>
            <div style={{ display:"flex", alignItems:"baseline", gap:10, margin:"18px 0 2px" }}>
              <span style={{ fontSize:13, fontWeight:700, letterSpacing:-0.2, color: isToday?C.accentDeep:C.textMuted }}>{label}</span>
              <span style={{ fontSize:12, fontWeight:600, color:C.mutedGray }}>{todos.length}</span>
              {dateSubtitle && (
                <span style={{ fontSize:12, fontWeight:500, color:C.mutedGray, marginLeft:"auto" }}>{dateSubtitle}</span>
              )}
            </div>
            <div>
              {todos.map(t => renderTodoCard(t))}
            </div>
          </div>
        );
      };

      const renderAddSheet = () => {
        if (!todoSheetOpen) return null;
        const hasTitle = (todoDraft.title||"").trim().length > 0;
        const dueLabel = todoDraft.dueDate ? formatTodoDate(todoDraft.dueDate) : null;
        return (
          <>
            <div onClick={()=>{ setTodoSheetOpen(false); setTodoDateOpen(false); setTodoPriorityOpen(false); }}
              style={{ position:"fixed", inset:0, background:"rgba(13,19,12,0.28)", zIndex:99, pointerEvents:"auto" }}/>
            <div style={{
              position:"fixed",
              bottom: "calc(84px + env(safe-area-inset-bottom, 0px))",
              left:12, right:12, maxWidth: 406, margin:"0 auto",
              zIndex:101,
              background:"rgba(255, 252, 246, 0.97)",
              
              borderRadius:22,
              padding:"18px 18px 14px",
              boxShadow:"none",
            }}>
              <input type="text" value={todoDraft.title} autoFocus
                onChange={e=>setTodoDraft({...todoDraft, title: e.target.value})}
                onKeyDown={e=>{ if (e.key==="Enter") addTodo(); if (e.key==="Escape") setTodoSheetOpen(false); }}
                placeholder="What needs doing?"
                style={{ width:"100%", background:"transparent", border:"none", outline:"none", fontSize:17, color:C.text, fontFamily:"Inter,sans-serif", fontWeight:600, letterSpacing:-0.2, padding:"4px 0 12px" }} />

              <div style={{ height:1, background:"rgba(140,126,106,0.15)", margin:"0 -4px 12px" }}/>

              {/* Date sub-picker */}
              {todoDateOpen && (
                <div style={{ marginBottom:10, padding:"10px", background:"#ffffff", borderRadius:12, border:`1px solid #e7eae3` }}>
                  <div style={{ display:"flex", gap:6, marginBottom:8, flexWrap:"wrap" }}>
                    <button onClick={()=>{ setTodoDraft({...todoDraft, dueDate: today}); setTodoDateOpen(false); }} style={chipStyle(todoDraft.dueDate===today)}>Today</button>
                    {(() => {
                      const tm = new Date(today+"T12:00:00"); tm.setDate(tm.getDate()+1);
                      const k = localDateKey(tm);
                      return <button onClick={()=>{ setTodoDraft({...todoDraft, dueDate: k}); setTodoDateOpen(false); }} style={chipStyle(todoDraft.dueDate===k)}>Tomorrow</button>;
                    })()}
                    {(() => {
                      const w = new Date(today+"T12:00:00"); w.setDate(w.getDate()+7);
                      const k = localDateKey(w);
                      return <button onClick={()=>{ setTodoDraft({...todoDraft, dueDate: k}); setTodoDateOpen(false); }} style={chipStyle(todoDraft.dueDate===k)}>In a week</button>;
                    })()}
                  </div>
                  <input type="date" value={todoDraft.dueDate||""}
                    onChange={e=>{ setTodoDraft({...todoDraft, dueDate: e.target.value || ""}); }}
                    style={{ width:"100%", background:"#ffffff", border:`1px solid #e7eae3`, borderRadius:8, padding:"7px 10px", fontSize:13, color:C.text, fontFamily:"Inter,sans-serif" }} />
                  {todoDraft.dueDate && (
                    <button onClick={()=>setTodoDraft({...todoDraft, dueDate:""})} style={{ marginTop:6, background:"none", border:"none", color:C.textMuted, fontSize:11, cursor:"pointer", fontFamily:"Inter,sans-serif" }}>Clear</button>
                  )}
                </div>
              )}

              {/* Priority sub-picker */}
              {todoPriorityOpen && (
                <div style={{ marginBottom:10, padding:"10px", background:"#ffffff", borderRadius:12, border:`1px solid #e7eae3` }}>
                  <div style={{ display:"flex", gap:6 }}>
                    {["high","med","low"].map(p => (
                      <button key={p} onClick={()=>{ setTodoDraft({...todoDraft, priority:p}); setTodoPriorityOpen(false); }} style={{
                        flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:5,
                        background: todoDraft.priority===p ? "#fbe9e8" : "#ffffff",
                        border:`1px solid ${todoDraft.priority===p?"#f0b3b0":"#e7eae3"}`,
                        borderRadius:8, padding:"7px 8px", fontSize:11, fontWeight:600,
                        color: todoDraft.priority===p?C.accent:C.textMuted,
                        cursor:"pointer", fontFamily:"Inter,sans-serif",
                      }}>
                        <span style={{ width:6, height:6, borderRadius:"50%", background:PRIORITY_COLORS[p] }}/>
                        {PRIORITY_LABELS[p]}
                      </button>
                    ))}
                  </div>
                  {todoDraft.priority && (
                    <button onClick={()=>setTodoDraft({...todoDraft, priority:""})} style={{ marginTop:6, background:"none", border:"none", color:C.textMuted, fontSize:11, cursor:"pointer", fontFamily:"Inter,sans-serif" }}>Clear</button>
                  )}
                </div>
              )}

              {/* TOOLS ROW */}
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:8 }}>
                <div style={{ display:"flex", gap:6 }}>
                  <button onClick={()=>{ setTodoDateOpen(!todoDateOpen); setTodoPriorityOpen(false); }} style={chipStyle(!!todoDraft.dueDate)}>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
                      <rect x="3" y="5" width="18" height="16" rx="2.5" stroke="currentColor" strokeWidth="1.8" fill="none"/>
                      <path d="M3 10h18" stroke="currentColor" strokeWidth="1.8"/>
                      <path d="M8 2v4M16 2v4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
                    </svg>
                    {dueLabel || "Due date"}
                  </button>
                  <button onClick={()=>{ setTodoPriorityOpen(!todoPriorityOpen); setTodoDateOpen(false); }} style={chipStyle(!!todoDraft.priority)}>
                    <span style={{ width:6, height:6, borderRadius:"50%", background: todoDraft.priority ? PRIORITY_COLORS[todoDraft.priority] : PRIORITY_COLORS.low }}/>
                    {todoDraft.priority ? PRIORITY_LABELS[todoDraft.priority] : "Priority"}
                  </button>
                </div>
                <div style={{ display:"flex", gap:6 }}>
                  <button onClick={()=>{ setTodoSheetOpen(false); setTodoDraft({title:"",dueDate:"",priority:""}); setTodoDateOpen(false); setTodoPriorityOpen(false); }}
                    style={{ background:"none", border:"none", color:C.textMuted, fontSize:12, fontWeight:600, padding:"7px 10px", cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.2 }}>Cancel</button>
                  <button onClick={addTodo} disabled={!hasTitle} style={{
                    width:34, height:34, borderRadius:"50%",
                    background: hasTitle ? `${C.accent}` : "rgba(140,126,106,0.25)",
                    border:"none", color:"#fff", cursor: hasTitle?"pointer":"not-allowed",
                    display:"flex", alignItems:"center", justifyContent:"center",
                    boxShadow:"none",
                  }}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  </button>
                </div>
              </div>
            </div>
          </>
        );
      };

      const chipStyle = active => ({
        display:"inline-flex", alignItems:"center", gap:5,
        background: active?"#fbe9e8":"#ffffff",
        border:`1px solid ${active?"#f0b3b0":"#e7eae3"}`,
        borderRadius:100, padding:"6px 11px 6px 9px",
        fontSize:11, fontWeight:600,
        color: active?C.accent:C.textMuted,
        cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.1,
      });

      const renderTodoTab = () => {
        const allTodos = data.todos || [];
        const active = allTodos.filter(t => !t.done);
        const completed = allTodos.filter(t => t.done).sort((a,b) => (b.doneAt||"").localeCompare(a.doneAt||""));

        // Bucket active
        const tomorrowKey = (() => { const t = new Date(today+"T12:00:00"); t.setDate(t.getDate()+1); return localDateKey(t); })();
        const todayList = active.filter(t => {
          const b = todoBucket(t.dueDate);
          return b === "today" || b === "overdue";
        }).sort((a,b) => {
          // overdue first, then by priority, then by date
