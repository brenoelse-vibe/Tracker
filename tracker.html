<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tracker" />
  <meta name="color-scheme" content="light" />
  <title>Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      background-attachment: fixed;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      color: #15231a;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }
    input:focus { outline: 2px solid #7ac943; }
    input.set-field:focus { outline: none; border-bottom-color: #7ac943 !important; }
    input.set-field::placeholder { color: #c2ccc4; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    ::-webkit-scrollbar { display: none; }

<body>
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
      createUserWithEmailAndPassword, signInWithEmailAndPassword,
      EmailAuthProvider, linkWithCredential, linkWithPopup, unlink,
      sendPasswordResetEmail, reauthenticateWithCredential, reauthenticateWithPopup,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAxyUfbjCJqBihgqt27I3r8NEnDzBv0870",
      authDomain: "tracker-2e97e.firebaseapp.com",
      projectId: "tracker-2e97e",
      storageBucket: "tracker-2e97e.firebasestorage.app",
      messagingSenderId: "415883101548",
      appId: "1:415883101548:web:2fe1b2d516d0b8713adf49"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const friendlyError = (e) => {
      const code = e?.code || "";
      if (code === "auth/email-already-in-use") return "An account already exists for that email. Try signing in instead.";
      if (code === "auth/invalid-email")        return "That doesn't look like a valid email.";
      if (code === "auth/weak-password")        return "Password is too weak. Use at least 6 characters.";
      if (code === "auth/user-not-found")       return "No account exists for that email. Tap 'Create account' to sign up.";
      if (code === "auth/wrong-password")       return "Wrong password. Try again or reset your password.";
      if (code === "auth/invalid-credential")   return "Wrong email or password. Try again or reset your password.";
      if (code === "auth/too-many-requests")    return "Too many attempts. Wait a moment and try again.";
      if (code === "auth/popup-closed-by-user") return null; // user cancelled, silent
      if (code === "auth/credential-already-in-use") return "That account is already linked to a different user.";
      if (code === "auth/provider-already-linked") return "That sign-in method is already linked to your account.";
      if (code === "auth/requires-recent-login") return "For security, please sign out and sign back in before doing this.";
      return e?.message || "Something went wrong. Please try again.";
    };

    window.__firebase = {
      signIn: () => signInWithPopup(auth, provider).catch(e => {
        const msg = friendlyError(e);
        if (msg) alert(msg);
      }),
      signInWithEmail: async (email, password) => {
        try {
          await signInWithEmailAndPassword(auth, email, password);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: friendlyError(e) };
        }
      },
      createWithEmail: async (email, password) => {
        try {
          await createUserWithEmailAndPassword(auth, email, password);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: friendlyError(e) };
        }
      },
      sendPasswordReset: async (email) => {
        try {
          await sendPasswordResetEmail(auth, email);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: friendlyError(e) };
        }
      },
      linkEmailToCurrentUser: async (email, password) => {
        try {
          const u = auth.currentUser;
          if (!u) return { ok: false, error: "Not signed in." };
          const cred = EmailAuthProvider.credential(email, password);
          await linkWithCredential(u, cred);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: friendlyError(e) };
        }
      },
      linkGoogleToCurrentUser: async () => {
        try {
          const u = auth.currentUser;
          if (!u) return { ok: false, error: "Not signed in." };
          await linkWithPopup(u, provider);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: friendlyError(e) };
        }
      },
      unlinkProvider: async (providerId) => {
        try {
          const u = auth.currentUser;
          if (!u) return { ok: false, error: "Not signed in." };
          if ((u.providerData || []).length <= 1) {
            return { ok: false, error: "You need at least one sign-in method. Link another method before removing this one." };
          }
          await unlink(u, providerId);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: friendlyError(e) };
        }
      },
      getLinkedProviders: () => {
        const u = auth.currentUser;
        if (!u) return [];
        return (u.providerData || []).map(p => p.providerId);
      },
      signOut: () => signOut(auth),
      onAuthStateChanged: (cb) => onAuthStateChanged(auth, cb),
      saveData: async (uid, data) => {
        await setDoc(doc(db, "users", uid), data);
        try { localStorage.setItem("tef_tracker_v2", JSON.stringify(data)); } catch(e) {}
      },
      loadData: async (uid) => {
        try {
          const snap = await getDoc(doc(db, "users", uid));
          if (snap.exists()) return snap.data();
        } catch(e) {}
        try {
          const local = localStorage.getItem("tef_tracker_v2");
          if (local) return JSON.parse(local);
        } catch(e) {}
        return null;
      }
    };
    window.dispatchEvent(new Event("firebaseReady"));
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ═══ CONSTANTS ═══════════════════════════════════════════════════════════
    const STORAGE_KEY = "tef_tracker_v2";

    // ═══ MODERN FLAT · FOREST PALETTE ═══════════════════════════════════════
    // Minimal + lime. Vivid fill, darker greens for legible text on white.
    const C = {
      bg:"#ffffff",                 // pure white app surface
      bgGradTop:"#ffffff",
      surface:"#ffffff",            // flat white cards
      card:"#ffffff", cardActive:"#eef7e4",
      border:"#e8ece6", borderActive:"#cfe8b3",
      ink:"#15231a",                // near-black primary text
      text:"#15231a",
      textMuted:"#5e6e62",          // darker muted sage-gray
      mutedGray:"#8a978d",          // darker light gray (labels, placeholders)
      hair:"#eef2ec",               // hairline divider
      fieldBg:"#f1f6ef",            // input background
      accentBright:"#7ac943",       // vivid lime — fills, checks, active dots
      accent:"#4a8f2f",             // darker green — text/buttons on white
      accentDeep:"#3c7a26",         // darkest — small text legibility
      accentTint:"#eef7e4",         // pale lime tint (done bg)
      accentFieldBg:"#dbefc4",      // filled-input lime
      // legacy aliases kept so existing references resolve cleanly:
      accentLight:"#7ac943",
      green:"#7ac943", greenDark:"#4a8f2f", greenText:"#3c7a26",
      red:"#d4453f",
      pink:"#ec4899", pinkDeep:"#be185d", pinkTint:"#fce7f3",
      workoutOnly:"#4a8f2f",
    };
    const HEAT = { 0:"#eef2ec", 1:"#d6eebc", 2:"#aadd76", 3:"#7ac943", 4:"#4a8f2f", future:"#ffffff" };
    const MONTH_LABELS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    const BUILTIN_HABITS = [
      { key:"workout", emoji:"🏋️", label:"Workout", sublabelFn:()=>"Gym, cardio, recovery…" },
    ];

    const EMOJI_PRESETS = ["📌","📚","✍️","💪","🧘","🏃","🚴","🥗","💧","☕","🌱","💊","🧠","💤","🎵","🎨","💼","💰","🙏","❤️","🌅","📖"];

    const WORKOUT_TYPES = [
      { key:"push",     label:"Push",     emoji:"👋" },
      { key:"pull",     label:"Pull",     emoji:"💪" },
      { key:"legs",     label:"Legs",     emoji:"🏋️‍♂️" },
      { key:"upper",    label:"Upper",    emoji:"⬆️" },
      { key:"lower",    label:"Lower",    emoji:"⬇️" },
      { key:"running",  label:"Running",  emoji:"🏃", timed:"stopwatch" },
      { key:"swimming", label:"Swimming", emoji:"🏊‍♂️", timed:"duration" },
      { key:"cycling",  label:"Cycling",  emoji:"🚴", timed:"duration" },
      { key:"recovery", label:"Recovery", emoji:"🧘" },
      { key:"mix",      label:"Mix",      emoji:"✖️" },
    ];
    // Types whose session is a simple time log (no sets/reps). "stopwatch" = live count-up timer; "duration" = manual minutes entry.
    const TIMED_TYPES = { running:"stopwatch", swimming:"duration", cycling:"duration" };

    const EXERCISE_PRESETS = {
      push:    ["Bench Press","Overhead Press","Incline Dumbbell Press","Push-ups","Tricep Pushdown","Lateral Raise","Dips","Chest Fly"],
      pull:    ["Pull-ups","Barbell Row","Lat Pulldown","Seated Cable Row","Face Pull","Bicep Curl","Hammer Curl","Reverse Fly"],
      legs:    ["Back Squat","Romanian Deadlift","Leg Press","Walking Lunge","Leg Curl","Leg Extension","Calf Raise","Hip Thrust","Bulgarian Split Squat"],
      upper:   ["Bench Press","Overhead Press","Pull-ups","Barbell Row","Dumbbell Curl","Tricep Extension"],
      lower:   ["Back Squat","Deadlift","Leg Press","Walking Lunge","Calf Raise","Hip Thrust"],
      running: [],
      swimming:[],
      cycling: [],
      recovery:["Foam Rolling","Stretching","Yoga","Walk","Mobility Drills"],
      mix:     [],
    };

    // ─── ICONS ───────────────────────────────────────────────────────────
    // Geometric minimal set. Pure shapes, no literal pictographs.
    // 24x24 viewBox. Color (green when active, muted gray when not) passed in.
    const TabIcon = ({ name, active, color }) => {
      const c = color;
      const common = { width:22, height:22, viewBox:"0 0 24 24", fill:"none", xmlns:"http://www.w3.org/2000/svg" };

      if (name === "day") {
        return (
          <svg {...common}>
            <circle cx="12" cy="12" r="8" stroke={c} strokeWidth="2"/>
            <circle cx="12" cy="12" r="3" fill={c}/>
          </svg>
        );
      }
      if (name === "todo") {
        return (
          <svg {...common}>
            <rect x="4.5" y="4.5" width="15" height="15" rx="4.5" stroke={c} strokeWidth="2"/>
            <path d="M8.5 12l2.2 2.2 4.6-4.7" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        );
      }
      if (name === "workout") {
        return (
          <svg {...common}>
            <rect x="2.5" y="9.5" width="3" height="5" rx="1.2" fill={c}/>
            <rect x="18.5" y="9.5" width="3" height="5" rx="1.2" fill={c}/>
            <rect x="6.5" y="10.7" width="11" height="2.6" rx="1.3" fill={c}/>
          </svg>
        );
      }
      if (name === "year") {
        return (
          <svg {...common}>
            <rect x="4" y="4" width="16" height="16" rx="4.5" stroke={c} strokeWidth="2"/>
            <circle cx="8.5" cy="8.5" r="1.3" fill={c}/>
            <circle cx="12.5" cy="8.5" r="1.3" fill={c}/>
            <circle cx="8.5" cy="12.5" r="1.3" fill={c}/>
            <circle cx="15.5" cy="12.5" r="1.3" fill={c}/>
          </svg>
        );
      }
      if (name === "history") {
        return (
          <svg {...common}>
            <circle cx="12" cy="12" r="8" stroke={c} strokeWidth="2"/>
            <path d="M12 8v4l2.5 1.5" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        );
      }
      if (name === "settings") {
        return (
          <svg {...common}>
            <circle cx="12" cy="12" r="3" stroke={c} strokeWidth="2"/>
            <path d="M12 3v2.5M12 18.5V21M21 12h-2.5M5.5 12H3M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8M18.4 18.4l-1.8-1.8M7.4 7.4L5.6 5.6" stroke={c} strokeWidth="2" strokeLinecap="round"/>
          </svg>
        );
      }
      return null;
    };

    const TABS = [
      { key:"day",      label:"Day" },
      { key:"todo",     label:"Todo" },
      { key:"workout",  label:"Workout" },
      { key:"year",     label:"Year" },
      { key:"history",  label:"History" },
      { key:"settings", label:"Settings" },
    ];

    const DEFAULT_DATA = {
      startDate: "", logs: {},
      customHabits: [], hiddenBuiltins: [], habitOrder: [],
      workoutSessions: {}, customExercises: {}, exerciseOrder: {},
      hiddenPresets: {}, renamedPresets: {},
      todos: [],
      restTimer: { promptOnCheck: true, defaultSec: 90, sound: true, vibrate: true, visual: true, custom: [] },
      userName: "",
    };
    const REST_PRESETS = [30, 90, 120, 180]; // 0:30 / 1:30 / 2:00 / 3:00
    const fmtClock = s => `${Math.floor(s/60)}:${String(Math.max(0,s%60)).padStart(2,"0")}`;

    // ═══ SHARED STYLES (modern flat) ═════════════════════════════════════════
    const S = {
      card:        { background:C.surface, borderRadius:14, padding:16, border:`1px solid ${C.border}`, marginBottom:10 },
      cardActive:  { background:C.accentTint, borderRadius:14, padding:16, border:`1px solid ${C.borderActive}`, marginBottom:10 },
      sectionLabel:{ fontSize:10, letterSpacing:0.6, color:C.textMuted, textTransform:"uppercase", marginBottom:14, fontWeight:800 },
      smallLabel:  { fontSize:10, color:C.textMuted, textTransform:"uppercase", letterSpacing:0.6, marginBottom:10, fontWeight:800 },
      pillBtn:     { background:C.fieldBg, border:"none", borderRadius:8, color:C.textMuted, fontSize:11, fontWeight:700, padding:"7px 14px", cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.2 },
      pillBtnOn:   { background:C.accent, border:"none", borderRadius:8, color:"#fff", fontSize:11, fontWeight:700, padding:"7px 14px", cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.2 },
      input:       { background:C.fieldBg, border:`1px solid ${C.border}`, borderRadius:8, color:C.text, fontSize:14, padding:"10px 12px", fontFamily:"Inter,sans-serif" },
      primaryBtn:  { background:C.accent, border:"none", borderRadius:10, color:"#fff", fontSize:13, fontWeight:700, padding:"10px 16px", cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.2 },
      dangerBtn:   { width:"100%", padding:"14px", borderRadius:12, background:C.surface, border:`1px solid ${C.red}`, color:C.red, fontSize:14, fontWeight:600, cursor:"pointer", fontFamily:"Inter,sans-serif" },
      bodyPad:     { padding:"20px 16px" },
      serif:       { fontFamily:"'Inter', sans-serif" },  // serif retired; alias keeps refs working
    };

    // ═══ PURE HELPERS ════════════════════════════════════════════════════════
    const localDateKey = d => {
      const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${day}`;
    };
    const formatDate = (key, opts) => new Date(key+"T12:00:00").toLocaleDateString("en-US", opts);
    const getISOWeek = date => {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    };
    const pct = (cur, tgt) => Math.min(100, Math.round((cur/tgt)*100));
    const blankLog = () => ({ workout:null });
    const hasAnyHabit = (log, customs) => !!log && (
      log.workout || (customs||[]).some(h => log[h.key])
    );

    // ─── Migration: workoutSessions[date] from single {type,exercises} to an
    // array of sessions [{id,type,exercises,startedAt,endedAt}]. Idempotent.
    let _sidCounter = 0;
    const makeSessionId = () => `s_${Date.now().toString(36)}_${(_sidCounter++).toString(36)}`;
    const asArray = v => Array.isArray(v) ? v : [];
    const asObject = v => (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
    const migrateData = raw => {
      if (!raw || typeof raw !== "object") return { ...DEFAULT_DATA };

      // workoutSessions → object of arrays of well-formed sessions
      const wsRaw = asObject(raw.workoutSessions);
      const migrated = {};
      Object.keys(wsRaw).forEach(date => {
        const v = wsRaw[date];
        const sanitizeSession = s => ({
          id: (s && s.id) || makeSessionId(),
          type: ((s && s.type) === "cardio") ? "running" : ((s && s.type) || "mix"),
          exercises: asArray(s && s.exercises).filter(e => e && typeof e === "object").map(e => ({
            id: e.id || `ex_${Math.random().toString(36).slice(2,8)}`,
            name: typeof e.name === "string" ? e.name : "Exercise",
            sets: asArray(e.sets).filter(st => st && typeof st === "object"),
            notes: typeof e.notes === "string" ? e.notes : "",
            done: !!e.done,
          })),
          startedAt: (s && s.startedAt) || null,
          endedAt: (s && s.endedAt) || null,
        });
        if (Array.isArray(v)) {
          const arr = v.filter(s => s && typeof s === "object").map(sanitizeSession);
          if (arr.length) migrated[date] = arr;
        } else if (v && typeof v === "object") {
          migrated[date] = [sanitizeSession(v)];
        }
      });

      // logs → object of well-formed log entries (each must be a plain object)
      const logsRaw = asObject(raw.logs);
      const logs = {};
      Object.keys(logsRaw).forEach(date => {
        const l = logsRaw[date];
        if (l && typeof l === "object" && !Array.isArray(l)) {
          const clean = { workout: typeof l.workout === "string" ? l.workout : null };
          // preserve any custom-habit boolean flags
          Object.keys(l).forEach(k => { if (k !== "workout" && typeof l[k] === "boolean") clean[k] = l[k]; });
          logs[date] = clean;
        }
      });

      // customHabits → array of well-formed habit defs
      const customHabits = asArray(raw.customHabits)
        .filter(h => h && typeof h === "object" && typeof h.key === "string")
        .map(h => ({ key: h.key, emoji: typeof h.emoji === "string" ? h.emoji : "", label: typeof h.label === "string" ? h.label : "Habit" }));

      // todos → array of well-formed todos
      const todos = asArray(raw.todos)
        .filter(t => t && typeof t === "object")
        .map(t => ({
          id: t.id || `todo_${Math.random().toString(36).slice(2,8)}`,
          title: typeof t.title === "string" ? t.title : "",
          done: !!t.done, doneAt: t.doneAt || null,
          createdAt: t.createdAt || Date.now(),
          dueDate: t.dueDate || null, priority: t.priority || null,
          notes: typeof t.notes === "string" ? t.notes : "",
        }));

      return {
        ...DEFAULT_DATA,
        ...raw,
        startDate: typeof raw.startDate === "string" && raw.startDate ? raw.startDate : DEFAULT_DATA.startDate,
        userName: typeof raw.userName === "string" ? raw.userName : "",
        workoutSessions: migrated,
        logs,
        customHabits,
        hiddenBuiltins: asArray(raw.hiddenBuiltins).filter(x => typeof x === "string"),
        habitOrder: asArray(raw.habitOrder).filter(x => typeof x === "string"),
        customExercises: asObject(raw.customExercises),
        exerciseOrder: asObject(raw.exerciseOrder),
        hiddenPresets: asObject(raw.hiddenPresets),
        renamedPresets: asObject(raw.renamedPresets),
        todos,
        restTimer: { ...DEFAULT_DATA.restTimer, ...asObject(raw.restTimer), custom: asArray(raw.restTimer && raw.restTimer.custom).filter(n => typeof n === "number") },
      };
    };

    function getExercisesForType(data, typeKey) {
      if (typeKey === "mix") {
        // Mix = union of all exercises across all other types
        const mixHidden = new Set((data.hiddenPresets||{}).mix || []);
        const seen = new Set();
        const all = [];
        ["push","pull","legs","upper","lower","running","swimming","cycling","recovery"].forEach(t => {
          getExercisesForType(data, t).forEach(name => {
            if (!seen.has(name) && !mixHidden.has(name)) { seen.add(name); all.push(name); }
          });
        });
        // include any mix-specific custom exercises too
        const mixCustoms = (data.customExercises||{}).mix || [];
        mixCustoms.forEach(name => { if (!seen.has(name) && !mixHidden.has(name)) { seen.add(name); all.push(name); } });
        // apply mix-specific reorder if present
        const order = (data.exerciseOrder||{}).mix || [];
        if (!order.length) return all;
        const sorted = order.filter(n => seen.has(n));
        const remaining = all.filter(n => !order.includes(n));
        return [...sorted, ...remaining];
      }
      const hidden = (data.hiddenPresets||{})[typeKey] || [];
      const renames = (data.renamedPresets||{})[typeKey] || {};
      const presets = (EXERCISE_PRESETS[typeKey]||[]).filter(n => !hidden.includes(n)).map(n => renames[n] || n);
      const customs = (data.customExercises||{})[typeKey] || [];
      const all = [...presets, ...customs];
      const order = (data.exerciseOrder||{})[typeKey] || [];
      if (!order.length) return all;
      const sorted = order.filter(n => all.includes(n));
      const remaining = all.filter(n => !order.includes(n));
      return [...sorted, ...remaining];
    }

    // ═══ REUSABLE COMPONENTS ═════════════════════════════════════════════════

    // Rounded-square check (rectangular to match bento language)
    function Toggle({ on, onClick, size=28 }) {
      return (
        <div onClick={onClick} style={{
          width:size, height:size, borderRadius:9,
          background: on ? C.accentBright : "transparent",
          border: on ? `2px solid ${C.accentBright}` : `2px solid ${C.border}`,
          boxShadow: "none",
          display:"flex", alignItems:"center", justifyContent:"center",

    // Swipe-to-delete row. Drag left (touch or mouse) to reveal a delete button;
    // tap it to confirm. Works reliably in mobile Safari (no native slider needed).
    function SwipeRow({ onDelete, children }) {
      const [dx, setDx] = useState(0);          // current translate
      const [open, setOpen] = useState(false);  // delete revealed
      const startX = useRef(null);
      const startY = useRef(null);
      const axis = useRef(null);                // null | "h" | "v" — locked after first decisive move
      const moved = useRef(false);
      const REVEAL = 72;
      const ENGAGE = 26;                        // px of horizontal travel before the row follows the finger
      const LOCK = 12;                          // px before we decide scroll vs swipe
      const RESIST = 0.28;                      // row moves at 28% of finger travel — very heavy
      const OPEN_AT = REVEAL * 0.62;            // how far the row must travel to lock open

      const begin = (x, y) => { startX.current = x; startY.current = y; axis.current = null; moved.current = false; };
      const move = (x, y) => {
        if (startX.current === null) return;
        const adx = Math.abs(x - startX.current);
        const ady = Math.abs(y - startY.current);
        // Decide intent once movement is decisive: if mostly vertical, lock to scroll and bail.
        if (axis.current === null && (adx > LOCK || ady > LOCK)) {
          axis.current = adx > ady * 1.6 ? "h" : "v";
        }
        if (axis.current !== "h") return;       // vertical scroll — leave the row alone
        moved.current = true;
        // subtract the engage dead-zone, then apply resistance so the row lags the finger
        const raw = x - startX.current + (open ? -REVEAL/RESIST : 0);
        const past = raw < 0 ? Math.min(0, raw + ENGAGE) : Math.max(0, raw - ENGAGE);
        setDx(Math.max(-REVEAL, Math.min(0, past * RESIST)));
      };
      const end = () => {
        if (startX.current === null) return;
        startX.current = null; startY.current = null;
        if (axis.current !== "h") { axis.current = null; return; }
        axis.current = null;
        const shouldOpen = dx < -OPEN_AT;
        setOpen(shouldOpen);
        setDx(shouldOpen ? -REVEAL : 0);
      };

      return (
        <div style={{ position:"relative", overflow:"hidden" }}>
          {/* delete action behind the row */}
          <div style={{ position:"absolute", top:0, right:0, bottom:0, width:REVEAL, display:"flex", alignItems:"center", justifyContent:"center", background:C.red, borderRadius:8 }}>
            <button onClick={()=>{ setOpen(false); setDx(0); onDelete(); }}
              style={{ background:"none", border:"none", color:"#fff", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", width:"100%", height:"100%", padding:0 }}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </button>
          </div>
          {/* foreground row */}
          <div
            onTouchStart={e=>begin(e.touches[0].clientX, e.touches[0].clientY)}
            onTouchMove={e=>move(e.touches[0].clientX, e.touches[0].clientY)}
            onTouchEnd={end}
            onClickCapture={e=>{ if (moved.current) { e.stopPropagation(); e.preventDefault(); moved.current=false; } }}
            style={{ background:C.bg, transform:`translateX(${dx}px)`, transition: startX.current===null?"transform 0.2s ease":"none", position:"relative", zIndex:1 }}>
            {children}
          </div>
        </div>
      );
    }

    function ReorderArrows({ onUp, onDown, canUp, canDown }) {

    // ═══ MAIN APP ════════════════════════════════════════════════════════════
    function App() {
      // Auth
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [syncing, setSyncing] = useState(false);
      const [loginMode, setLoginMode] = useState("choose"); // "choose" | "signin" | "create" | "reset"
      const [loginEmail, setLoginEmail] = useState("");
      const [loginPassword, setLoginPassword] = useState("");

      const [loginInfo, setLoginInfo] = useState("");
      const [linkPanelOpen, setLinkPanelOpen] = useState(false);
      const [linkEmail, setLinkEmail] = useState("");
      const [linkPassword, setLinkPassword] = useState("");
      const [linkBusy, setLinkBusy] = useState(false);
      const [linkError, setLinkError] = useState("");
      const [linkSuccess, setLinkSuccess] = useState("");
      const [linkedRefresh, setLinkedRefresh] = useState(0);

      // Core
      const [data, setData] = useState({ ...DEFAULT_DATA, startDate: localDateKey(new Date()) });
      const [activeTab, setActiveTab] = useState("day");
      const [viewDate, setViewDate] = useState(localDateKey(new Date()));
      const [todayLog, setTodayLog] = useState(blankLog());
      const [saved, setSaved] = useState(false);

      // UI flags
      const [showWorkoutPicker, setShowWorkoutPicker] = useState(false);
      const [editingDate, setEditingDate] = useState(null);
      const [newHabitName, setNewHabitName] = useState("");
      const [newHabitEmoji, setNewHabitEmoji] = useState("");
      const [editingEmojiFor, setEditingEmojiFor] = useState(null);
      const [newExerciseName, setNewExerciseName] = useState("");
      const [editingExercise, setEditingExercise] = useState(null);
      const [historyView, setHistoryView] = useState("workouts"); // workouts | daily
      const [expandedFeedId, setExpandedFeedId] = useState(null);
      const [calMonthOffset, setCalMonthOffset] = useState(0); // 0 = current month, -1 = last month, etc.
      const [libraryExpanded, setLibraryExpanded] = useState(false);
      const [libraryNewByType, setLibraryNewByType] = useState({});
      const [chartExpandedFor, setChartExpandedFor] = useState(null); // exercise name
      const [chartMetric, setChartMetric] = useState("volume"); // volume | e1rm | top
      const [forcePicker, setForcePicker] = useState(false); // "back" to picker/breakdown even with a session
      const [activeSessionId, setActiveSessionId] = useState(null); // which of a day's sessions is open for editing
      // Rest timer: endAt is an absolute epoch ms (survives lock/app-switch); duration for the progress bar.
      const [restEndAt, setRestEndAt] = useState(null);
      const [restDuration, setRestDuration] = useState(0);
      const [restNow, setRestNow] = useState(Date.now());
      const [restDone, setRestDone] = useState(false);   // briefly true when it hits zero (for pulse)
      const [setPromptFor, setSetPromptFor] = useState(null); // "exId:idx" whose preset chooser is open
      // Run timer (count-UP stopwatch for cardio). runStartAt = absolute epoch ms when started; null = stopped.
      const [runExId, setRunExId] = useState(null);       // which exercise's run timer is active
      const [runStartAt, setRunStartAt] = useState(null); // epoch ms the run began
      const [runNow, setRunNow] = useState(Date.now());   // ticking clock
      const [durationInput, setDurationInput] = useState(""); // manual minutes entry for swimming/cycling

      // Todo tab state
      const [todoSheetOpen, setTodoSheetOpen] = useState(false);
      const [todoDraft, setTodoDraft] = useState({ title: "", dueDate: "", priority: "" });
      const [todoDateOpen, setTodoDateOpen] = useState(false);
      const [todoPriorityOpen, setTodoPriorityOpen] = useState(false);
      const [todoSwipedId, setTodoSwipedId] = useState(null);
      const [todoExpandedId, setTodoExpandedId] = useState(null);
      const [showAllCompleted, setShowAllCompleted] = useState(false);
      const [todoEditing, setTodoEditing] = useState(null); // {id, field: 'title'|'date'|'priority'|'notes'}

      const yearScrollRef = useRef(null);
      const today = localDateKey(new Date());

      // ─── Centralized data update ────────────────────────────────────────
      const update = useCallback(patch => {
        setData(prev => {
          const next = typeof patch === "function" ? patch(prev) : { ...prev, ...patch };
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch(e) {}
          if (user && window.__firebase) window.__firebase.saveData(user.uid, next);
          setSaved(true);
          setTimeout(() => setSaved(false), 1500);
          return next;
        });
      }, [user]);

      // ─── Auth ───────────────────────────────────────────────────────────
      useEffect(() => {
        let settled = false;
        const finish = () => { if (!settled) { settled = true; setAuthLoading(false); } };

        // Fallback: if Firebase never initializes (script blocked, offline, slow),
        // give up after 5s, load whatever is in localStorage, and show the app anyway.
        const fallbackTimer = setTimeout(() => {
          if (settled) return;
          try {
            const local = localStorage.getItem(STORAGE_KEY);
            if (local) {
              const migrated = migrateData({ ...DEFAULT_DATA, ...JSON.parse(local) });
              setData(migrated);
              const tl = migrated.logs && migrated.logs[today];
              if (tl) setTodayLog(tl);
            }
          } catch (e) { console.error("Local fallback error:", e); }
          finish();
        }, 5000);

        const wait = () => {
          if (!window.__firebase) {
            window.addEventListener("firebaseReady", wait, { once:true });
            return;
          }
          window.__firebase.onAuthStateChanged(async u => {
            try {
              setUser(u);
              if (u) {
                setSyncing(true);
                const loaded = await window.__firebase.loadData(u.uid);
                if (loaded) {
                  const migrated = migrateData({ ...DEFAULT_DATA, ...loaded });
                  setData(migrated);
                  const tl = migrated.logs && migrated.logs[today];
                  if (tl) setTodayLog(tl);
                }
                setSyncing(false);
              }
              clearTimeout(fallbackTimer);
              finish();
            } catch (err) {
              console.error("Load error:", err);
              setSyncing(false);
              clearTimeout(fallbackTimer);
              finish();
            }
          });
        };
        wait();
        return () => clearTimeout(fallbackTimer);
      }, [today]);

      // ─── Sync local todayLog when viewDate changes ──────────────────────
      useEffect(() => {
        const existing = data.logs[viewDate];
        setTodayLog(existing ? { ...existing } : { ...blankLog() });
        setShowWorkoutPicker(false);
      }, [viewDate, data.logs]);

      // ─── Year tab auto-scroll ───────────────────────────────────────────
      useEffect(() => {
        if (activeTab !== "year") return;
        let cancelled = false;
        const doScroll = () => {
          if (cancelled) return;
          const container = yearScrollRef.current;
          if (!container) return;
          const todayCol = container.querySelector('[data-today="1"]');
          if (!todayCol) { requestAnimationFrame(doScroll); return; }
          const cRect = container.getBoundingClientRect();
          const tRect = todayCol.getBoundingClientRect();
          const todayPos = container.scrollLeft + (tRect.left - cRect.left);
          container.scrollLeft = Math.max(0, todayPos - 22 - 38);
        };
        requestAnimationFrame(() => requestAnimationFrame(doScroll));
        return () => { cancelled = true; };
      }, [activeTab]);

      // ─── Rest timer ─────────────────────────────────────────────────────
      // Tick once per second while a timer is running; uses absolute endAt so it
      // stays accurate across screen-lock / app-switch.
      useEffect(() => {
        if (!restEndAt) return;
        const id = setInterval(() => setRestNow(Date.now()), 250);
        return () => clearInterval(id);
      }, [restEndAt]);

      const restRemaining = restEndAt ? Math.max(0, Math.round((restEndAt - restNow)/1000)) : 0;

      const fireRestAlert = () => {
        const cfg = data.restTimer || DEFAULT_DATA.restTimer;
        if (cfg.vibrate && navigator.vibrate) { try { navigator.vibrate([200,100,200]); } catch(e){} }
        if (cfg.sound) {
          try {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            const ac = new Ctx();
            [0, 0.25].forEach(t => {
              const o = ac.createOscillator(), g = ac.createGain();
              o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
              g.gain.setValueAtTime(0.0001, ac.currentTime + t);
              g.gain.exponentialRampToValueAtTime(0.4, ac.currentTime + t + 0.02);
              g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.2);
              o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.22);
            });
          } catch(e) {}
        }
      };

      // Detect the moment the timer crosses zero.
      useEffect(() => {
        if (restEndAt && restRemaining === 0) {
          fireRestAlert();
          setRestEndAt(null);
          const cfg = data.restTimer || DEFAULT_DATA.restTimer;
          if (cfg.visual) {
            setRestDone(true);
            const t = setTimeout(() => setRestDone(false), 2500);
            return () => clearTimeout(t);
          }
        }
      }, [restRemaining, restEndAt]);

      const startRest = sec => { setRestDone(false); setRestDuration(sec); setRestEndAt(Date.now() + sec*1000); setSetPromptFor(null); };
      const addRest   = sec => { if (restEndAt) { setRestEndAt(restEndAt + sec*1000); setRestDuration(d => d + sec); } };
      // Record rest seconds on a specific set, then (if >0) start the countdown.
      const chooseRest = (exId, idx, sec) => {
        mapExercises(e => e.id===exId
          ? { ...e, sets: e.sets.map((st,i) => i===idx ? { ...st, rest: sec } : st) }
          : e);
        setSetPromptFor(null);
        if (sec > 0) startRest(sec); else setRestDone(false);
      };
      const skipRest  = () => { setRestEndAt(null); setRestDone(false); };

      // ─── Run timer (count-up stopwatch) ─────────────────────────────────
      useEffect(() => {
        if (!runStartAt) return;
        const id = setInterval(() => setRunNow(Date.now()), 250);
        return () => clearInterval(id);
      }, [runStartAt]);

      const runElapsed = runStartAt ? Math.max(0, Math.floor((runNow - runStartAt)/1000)) : 0;

      const startRun = exId => { setRunExId(exId); setRunNow(Date.now()); setRunStartAt(Date.now()); };
      const stopRun = () => {
        const secs = runElapsed;
        if (runExId && secs > 0) {
          // Record the run as a set: store seconds in a `duration` field on a new/first set.
          mapExercises(e => {
            if (e.id !== runExId) return e;
            const sets = [ ...(e.sets||[]), { duration: secs, weight:0, reps:0, done:true } ];
            return { ...e, sets, done:true };
          });
        }
        setRunStartAt(null); setRunExId(null);
      };
      const cancelRun = () => { setRunStartAt(null); setRunExId(null); };
      const fmtStopwatch = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
      const fmtDuration = s => {
        const m = Math.round(s/60);
        if (m < 60) return `${m} min`;
        const h = Math.floor(m/60), rm = m%60;
        return rm ? `${h}h ${rm}m` : `${h}h`;
      };

      // ─── Timed-session helpers (Running / Swimming / Cycling) ───────────
      // Each bout is stored as one entry in the session's exercises array:
      //   { id, name:<type label>, sets:[{ duration: seconds, done:true }], done:true }
      const SESSION_RUN_ID = "__session_timer__";
      const logSessionBout = seconds => {
        if (!activeSession || seconds <= 0) return;
        const w = WORKOUT_TYPES.find(t => t.key === activeSession.type);
        const entry = { id:`bout_${Date.now()}`, name:(w?w.label:"Session"), sets:[{ duration: seconds, done:true }], notes:"", done:true };
        const next = todaySessions.map(s => s.id===activeSession.id ? { ...s, exercises:[...(s.exercises||[]), entry] } : s);
        writeSessions(today, next);
      };
      const deleteSessionBout = boutId => {
        if (!activeSession) return;
        const next = todaySessions.map(s => s.id===activeSession.id ? { ...s, exercises:(s.exercises||[]).filter(e => e.id!==boutId) } : s);
        writeSessions(today, next);
      };
      // Session-level stopwatch (for Running) — reuses run timer state with a sentinel id.
      const startSessionRun = () => { setRunExId(SESSION_RUN_ID); setRunNow(Date.now()); setRunStartAt(Date.now()); };
      const stopSessionRun = () => { const secs = runElapsed; if (secs > 0) logSessionBout(secs); setRunStartAt(null); setRunExId(null); };


      const hiddenBuiltins = asArray(data.hiddenBuiltins);
      const activeBuiltins = BUILTIN_HABITS.filter(h => !hiddenBuiltins.includes(h.key));

      const allActiveHabits = useMemo(() => {
        const items = [
          ...activeBuiltins.map(h => ({ ...h, isBuiltin:true })),
          ...asArray(data.customHabits).map(h => ({ ...h, isBuiltin:false })),
        ];
        const order = asArray(data.habitOrder);
        if (!order.length) return items;
        const sorted = order.map(k => items.find(h => h.key===k)).filter(Boolean);
        const remaining = items.filter(h => !order.includes(h.key));
        return [...sorted, ...remaining];
      }, [data.hiddenBuiltins, data.customHabits, data.habitOrder]);

      const streak = useMemo(() => {
        let count = 0;
        const d = new Date();
        while (true) {
          const log = data.logs[localDateKey(d)];
          if (!hasAnyHabit(log, data.customHabits)) break;
          count++;
          d.setDate(d.getDate()-1);
        }
        return count;
      }, [data.logs, data.customHabits]);

      const dayCount = useMemo(() => {
        // Day of year: Jan 1 = 1, Dec 31 = 365 (or 366 in leap year)
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 1);
        return Math.floor((now - start) / 86400000) + 1;
      }, []);

      // ─── Workout session accessors (array model) ────────────────────────
      const sessionsOn = date => (data.workoutSessions||{})[date] || [];
      const todaySessions = sessionsOn(today);
      // The session currently open for editing (defaults to the most recent today).
      const activeSession = activeSessionId
        ? todaySessions.find(s => s.id === activeSessionId) || null
        : null;
      const selectedWorkout = activeSession ? WORKOUT_TYPES.find(w => w.key === activeSession.type) : null;

      // ─── Action: habits ─────────────────────────────────────────────────
      const toggleHabit = key => {
        const newLog = { ...todayLog, [key]: !todayLog[key] };
        setTodayLog(newLog);
        update({ logs: { ...data.logs, [viewDate]: newLog } });
      };

      const selectWorkout = type => {
        const newLog = { ...todayLog, workout: todayLog.workout===type ? null : type };
        setTodayLog(newLog);
        update({ logs: { ...data.logs, [viewDate]: newLog } });
        setShowWorkoutPicker(false);
      };

      const updateRestTimer = patch => update({ restTimer: { ...(data.restTimer||DEFAULT_DATA.restTimer), ...patch } });

      const addCustomHabit = () => {
        const name = newHabitName.trim();
        if (!name) return;
        const key = "custom_" + name.toLowerCase().replace(/[^a-z0-9]/g,"_") + "_" + Date.now().toString(36);
        update({ customHabits: [...(data.customHabits||[]), { key, label:name, emoji: (newHabitEmoji||"").trim() }] });
        setNewHabitName("");
        setNewHabitEmoji("");
      };

      const updateHabitEmoji = (key, emoji) =>
        update({ customHabits: (data.customHabits||[]).map(h => h.key===key ? { ...h, emoji } : h) });

      const deleteCustomHabit = key => {
        if (!window.confirm("Delete this habit? It will be removed from all logged days.")) return;
        const newLogs = { ...data.logs };
        Object.keys(newLogs).forEach(d => {
          if (newLogs[d][key] !== undefined) {
            newLogs[d] = { ...newLogs[d] };
            delete newLogs[d][key];
          }
        });
        update({
          customHabits: (data.customHabits||[]).filter(h => h.key!==key),
          logs: newLogs,
        });
      };

      const toggleBuiltin = key => {
        const cur = data.hiddenBuiltins || [];
        update({ hiddenBuiltins: cur.includes(key) ? cur.filter(k=>k!==key) : [...cur, key] });
      };

      const moveHabit = (key, dir) => {
        const keys = allActiveHabits.map(h => h.key);
        const idx = keys.indexOf(key);
        const newIdx = idx + dir;
        if (idx<0 || newIdx<0 || newIdx>=keys.length) return;
        const newOrder = [...keys];
        [newOrder[idx], newOrder[newIdx]] = [newOrder[newIdx], newOrder[idx]];
        update({ habitOrder: newOrder });
      };

      // ─── Action: history ────────────────────────────────────────────────
      const toggleDayHabit = (date, habit) => {
        const cur = data.logs[date] || blankLog();
        const newLog = { ...cur, [habit]: !cur[habit] };
        update({ logs: { ...data.logs, [date]: newLog } });
        if (date === today) setTodayLog({ ...todayLog, ...newLog });
      };

      const setDayWorkout = (date, type) => {
        const cur = data.logs[date] || blankLog();
        const newLog = { ...cur, workout: cur.workout===type ? null : type };
        update({ logs: { ...data.logs, [date]: newLog } });
        if (date === today) setTodayLog({ ...todayLog, ...newLog });
      };

      const deleteDay = date => {
        const newLogs = { ...data.logs };
        delete newLogs[date];
        update({ logs: newLogs });
        if (date === today) setTodayLog(blankLog());
        setEditingDate(null);
      };


      // ─── Action: workout sessions (array model) ─────────────────────────
      // Single source of truth for writing a day's sessions. Also DERIVES the
      // habit log's workout flag from the sessions so the two never drift:
      //   ≥1 session  → logs[date].workout = most-recent session's type
      //   0 sessions  → logs[date].workout = null  (habit row unchecks)
      const writeSessions = (date, sessions) => {
        const nextWS = { ...(data.workoutSessions||{}) };
        if (sessions.length === 0) delete nextWS[date];
        else nextWS[date] = sessions;
        const curLog = data.logs[date] || blankLog();
        const derivedType = sessions.length ? sessions[sessions.length-1].type : null;
        const nextLog = { ...curLog, workout: derivedType };
        update({ workoutSessions: nextWS, logs: { ...data.logs, [date]: nextLog } });
        if (date === today) setTodayLog(prev => ({ ...prev, workout: derivedType }));
      };

      // Pre-fill an exercise list for a type from the most recent prior sets.
      const buildExercisesForType = typeKey => {
        const exNames = getExercisesForType(data, typeKey);
        const recentByName = {};
        Object.entries(data.workoutSessions||{})
          .sort((a,b) => b[0].localeCompare(a[0]))
          .forEach(([_, arr]) => {
            (arr||[]).forEach(sess => (sess.exercises||[]).forEach(e => {
              if (recentByName[e.name]) return;
              if ((e.sets||[]).length === 0) return;
              recentByName[e.name] = e.sets;
            }));
          });
        return exNames.map((name, i) => {
          const recent = recentByName[name];
          return {
            id: `${typeKey}_${i}_${name}_${Math.random().toString(36).slice(2,6)}`,
            name,
            sets: recent ? recent.map(s => ({ weight: s.weight||0, reps: s.reps||0 })) : [],
            notes: "",
            done: false,
          };
        });
      };

      // Start a NEW session for today (allows multiple per day). Returns its id.
      const startSession = typeKey => {
        const sess = {
          id: makeSessionId(),
          type: typeKey,
          exercises: buildExercisesForType(typeKey),
          startedAt: Date.now(),
          endedAt: null,
        };
        writeSessions(today, [...todaySessions, sess]);
        setActiveSessionId(sess.id);
        return sess.id;
      };

      const deleteSession = (date, sessionId) => {
        writeSessions(date, sessionsOn(date).filter(s => s.id !== sessionId));
        if (sessionId === activeSessionId) setActiveSessionId(null);
      };

      // Apply a fn to the active session's exercises array.
      const mapExercises = fn => {
        if (!activeSession) return;
        const next = todaySessions.map(s =>
          s.id === activeSession.id ? { ...s, exercises: s.exercises.map(fn) } : s);
        writeSessions(today, next);
      };

      // Remove an exercise from the CURRENT session only (library/presets unaffected).
      const removeExerciseFromSession = exId => {
        if (!activeSession) return;
        const next = todaySessions.map(s =>
          s.id === activeSession.id ? { ...s, exercises: s.exercises.filter(e => e.id !== exId) } : s);
        writeSessions(today, next);
      };

      const addSet = exId => mapExercises(e =>
        e.id===exId ? { ...e, sets: [...e.sets, { weight:0, reps:0 }] } : e);

      const removeSet = (exId, idx) => mapExercises(e => {
        if (e.id !== exId) return e;
        const sets = e.sets.filter((_,i) => i!==idx);
        const allDone = sets.length > 0 && sets.every(st => st.done);
        return { ...e, sets, done: allDone };
      });

      const setSetValue = (exId, idx, field, val) => mapExercises(e =>
        e.id===exId
          ? { ...e, sets: e.sets.map((st,i) => i===idx ? { ...st, [field]: val } : st) }
          : e);

      // Toggle a single set's done flag; exercise.done auto-syncs to "all sets done".
      const toggleSetDone = (exId, idx) => {
        let wasDone = false;
        const ex = activeSession && activeSession.exercises.find(e => e.id===exId);
        if (ex && ex.sets[idx]) wasDone = !!ex.sets[idx].done;
        mapExercises(e => {
          if (e.id !== exId) return e;
          const sets = e.sets.map((st,i) => i===idx ? { ...st, done: !st.done } : st);
          const allDone = sets.length > 0 && sets.every(st => st.done);
          return { ...e, sets, done: allDone };
        });
        const cfg = data.restTimer || DEFAULT_DATA.restTimer;
        if (!wasDone && cfg.promptOnCheck) setSetPromptFor(`${exId}:${idx}`);
      };

      // Most recent prior session's raw exercise object (unfiltered sets) for this exercise.
      // Scans across all days and all sessions, newest first, excluding the active session.
      const getPreviousExercise = exName => {
        const sessions = data.workoutSessions || {};
        const dates = Object.keys(sessions).sort(); // oldest→newest
        for (let i = dates.length - 1; i >= 0; i--) {
          const arr = sessions[dates[i]] || [];
          // within a day, later sessions are newer
          for (let j = arr.length - 1; j >= 0; j--) {
            if (activeSession && arr[j].id === activeSession.id) continue;
            const ex = (arr[j].exercises || []).find(e => e.name === exName && (e.sets||[]).length > 0);
            if (ex) return ex;
          }
        }
        return null;
      };

      // Look up the same set index from this exercise's most recent prior session.
      const getPreviousSet = (exName, idx) => {
        const ex = getPreviousExercise(exName);
        return ex && ex.sets[idx] ? ex.sets[idx] : null;
      };

      const updateExerciseNotes = (exId, notes) => mapExercises(e =>
        e.id===exId ? { ...e, notes } : e);

      const moveExercise = (exId, dir) => {
        if (!activeSession) return;
        const cur = activeSession;
        const idx = cur.exercises.findIndex(e => e.id===exId);
        const newIdx = idx + dir;
        if (idx<0 || newIdx<0 || newIdx>=cur.exercises.length) return;
        const arr = [...cur.exercises];
        [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
        const nextSessions = todaySessions.map(s => s.id===cur.id ? { ...s, exercises: arr } : s);
        update({
          exerciseOrder: { ...(data.exerciseOrder||{}), [cur.type]: arr.map(e => e.name) },
          workoutSessions: { ...(data.workoutSessions||{}), [today]: nextSessions },
        });
      };

      // Helper for exercise-library mutations: rewrite the active session's exercises if it matches typeKey.
      const sessionsWithActivePatched = (typeKey, exFn) => {
        if (!activeSession || activeSession.type !== typeKey) return null;
        return todaySessions.map(s => s.id===activeSession.id ? { ...s, exercises: exFn(s.exercises) } : s);
      };

      const addCustomExercise = (typeKey, name) => {
        const trimmed = name.trim();
        if (!trimmed) return;
        // Don't add a duplicate if it's already in the current session.
        if (activeSession && activeSession.type === typeKey &&
            (activeSession.exercises||[]).some(e => e.name.toLowerCase() === trimmed.toLowerCase())) return;
        const cur = (data.customExercises||{})[typeKey] || [];
        const isKnown = cur.includes(trimmed) || (EXERCISE_PRESETS[typeKey]||[]).includes(trimmed);
        // Only register it as a new custom library entry if it isn't already known.
        const patch = isKnown
          ? {}
          : { customExercises: { ...(data.customExercises||{}), [typeKey]: [...cur, trimmed] } };
        // Always add it to the active session (this is the part that was being skipped).
        const ns = sessionsWithActivePatched(typeKey, exs => [...exs, { id:`${typeKey}_ex_${Date.now()}`, name:trimmed, sets:[], notes:"", done:false }]);
        if (ns) patch.workoutSessions = { ...(data.workoutSessions||{}), [today]: ns };
        if (Object.keys(patch).length) update(patch);
      };

      const renameExercise = (typeKey, oldName, newName) => {
        const trimmed = newName.trim();
        if (!trimmed || trimmed === oldName) return;
        const presets = EXERCISE_PRESETS[typeKey] || [];
        const renames = (data.renamedPresets||{})[typeKey] || {};
        const customs = (data.customExercises||{})[typeKey] || [];
        const originalPreset = presets.find(p => (renames[p] || p) === oldName);
        const patch = {};
        if (originalPreset) {
          patch.renamedPresets = { ...(data.renamedPresets||{}), [typeKey]: { ...renames, [originalPreset]: trimmed } };
        } else {
          patch.customExercises = { ...(data.customExercises||{}), [typeKey]: customs.map(c => c===oldName ? trimmed : c) };
        }
        const order = (data.exerciseOrder||{})[typeKey] || [];
        if (order.includes(oldName)) {
          patch.exerciseOrder = { ...(data.exerciseOrder||{}), [typeKey]: order.map(o => o===oldName ? trimmed : o) };
        }
        const ns = sessionsWithActivePatched(typeKey, exs => exs.map(e => e.name===oldName ? { ...e, name:trimmed } : e));
        if (ns) patch.workoutSessions = { ...(data.workoutSessions||{}), [today]: ns };
        update(patch);
      };

      const deleteExercise = (typeKey, name) => {
        // Mix is a union view, not an owner — deleting from Mix only hides it from Mix.
        if (typeKey === "mix") {
          const mixHidden = (data.hiddenPresets||{}).mix || [];
          if (mixHidden.includes(name)) return; // already hidden
          const patch = {
            hiddenPresets: { ...(data.hiddenPresets||{}), mix: [...mixHidden, name] },
          };
          // also remove any mix-specific custom entry with same name
          const mixCustoms = (data.customExercises||{}).mix || [];
          if (mixCustoms.includes(name)) {
            patch.customExercises = { ...(data.customExercises||{}), mix: mixCustoms.filter(c => c!==name) };
          }
          const ns = sessionsWithActivePatched("mix", exs => exs.filter(e => e.name!==name));
          if (ns) patch.workoutSessions = { ...(data.workoutSessions||{}), [today]: ns };
          update(patch);
          return;
        }
        const presets = EXERCISE_PRESETS[typeKey] || [];
        const renames = (data.renamedPresets||{})[typeKey] || {};
        const customs = (data.customExercises||{})[typeKey] || [];
        const originalPreset = presets.find(p => (renames[p] || p) === name);
        const patch = {};
        if (originalPreset) {
          const hidden = (data.hiddenPresets||{})[typeKey] || [];
          patch.hiddenPresets = { ...(data.hiddenPresets||{}), [typeKey]: [...hidden, originalPreset] };
        } else {
          patch.customExercises = { ...(data.customExercises||{}), [typeKey]: customs.filter(c => c!==name) };
        }
        const order = (data.exerciseOrder||{})[typeKey] || [];
        if (order.includes(name)) {
          patch.exerciseOrder = { ...(data.exerciseOrder||{}), [typeKey]: order.filter(o => o!==name) };
        }
        const ns = sessionsWithActivePatched(typeKey, exs => exs.filter(e => e.name!==name));
        if (ns) patch.workoutSessions = { ...(data.workoutSessions||{}), [today]: ns };
        update(patch);
      };

      const restorePreset = (typeKey, originalName) => {
        const hidden = (data.hiddenPresets||{})[typeKey] || [];
        update({ hiddenPresets: { ...(data.hiddenPresets||{}), [typeKey]: hidden.filter(h => h!==originalName) } });
      };

      // ─── Action: todos ──────────────────────────────────────────────────
      const PRIORITY_LABELS = { high: "High", med: "Medium", low: "Low" };
      const PRIORITY_COLORS = { high: C.accent, med: "#e8b86a", low: "#a8b894" };

      const newTodoId = () => `t_${Date.now()}_${Math.floor(Math.random()*1000)}`;

      const addTodo = () => {
        const title = (todoDraft.title||"").trim();
        if (!title) return;
        const newTodo = {
          id: newTodoId(),
          title,
          dueDate: todoDraft.dueDate || today,  // default to today if not specified
          priority: todoDraft.priority || null,
          notes: "",
          done: false,
          doneAt: null,
          createdAt: today,
        };
        update({ todos: [...(data.todos||[]), newTodo] });
        setTodoDraft({ title: "", dueDate: "", priority: "" });
        setTodoSheetOpen(false);
        setTodoDateOpen(false);
        setTodoPriorityOpen(false);
      };

      const updateTodo = (id, patch) => {
        const todos = (data.todos||[]).map(t => t.id===id ? { ...t, ...patch } : t);
        update({ todos });
      };

      const toggleTodo = id => {
        const todos = (data.todos||[]).map(t => {
          if (t.id !== id) return t;
          const willBeDone = !t.done;
          return { ...t, done: willBeDone, doneAt: willBeDone ? today : null };
        });
        update({ todos });
      };

      const deleteTodo = id => {
        const todos = (data.todos||[]).filter(t => t.id !== id);
        update({ todos });
        setTodoSwipedId(null);
        setTodoExpandedId(null);
      };

      // Date helpers for grouping
      const todoBucket = (dueDate) => {
        if (!dueDate) return "nodate";
        if (dueDate < today) return "overdue";   // shown inside "today"
        if (dueDate === today) return "today";
        // tomorrow
        const t = new Date(today + "T12:00:00");
        const tomorrow = new Date(t); tomorrow.setDate(t.getDate()+1);
        const tomorrowKey = localDateKey(tomorrow);
        if (dueDate === tomorrowKey) return "tomorrow";
        return "later";
      };

      const formatTodoDate = (dueDate) => {
        if (!dueDate) return null;
        const bucket = todoBucket(dueDate);
        if (bucket === "today") return "Due today";
        if (bucket === "tomorrow") return "Tomorrow";
        if (bucket === "overdue") {
          const d = new Date(dueDate+"T12:00:00");
          const t = new Date(today+"T12:00:00");
          const days = Math.round((t-d)/86400000);
          return days === 1 ? "Overdue · 1 day" : `Overdue · ${days} days`;
        }
        return formatDate(dueDate, {weekday:"short", month:"short", day:"numeric"});
      };


      // ─── Export & Reset ─────────────────────────────────────────────────
      const exportCSV = () => {
        // Export full data as multi-sheet XLSX workbook.
        // Fallback to CSV if SheetJS didn't load.
        if (typeof XLSX === "undefined") {
          window.alert("Export library didn't load. Try refreshing the page and exporting again.");
          return;
        }

        const customs = data.customHabits || [];

        const dateFmt = (key) => {
          const d = new Date(key+"T12:00:00");
          return formatDate(key,{weekday:"short", year:"numeric", month:"short", day:"numeric"});
        };

        // ─── SHEET 1: Daily Logs ─────────────────────────────────────
        const dailyRows = [];
        const dailyHeader = [
          "Date", "Day of Week", "ISO Week",
          "Workout Type",
          ...customs.map(h => h.label),
          "Habits Logged", "Total Habits",
        ];
        dailyRows.push(dailyHeader);

        const allActiveCount = (() => {
          const hb = (data.hiddenBuiltins||[]);
          const workoutActive = hb.includes("workout") ? 0 : 1;
          return customs.length + workoutActive;
        })();

        Object.keys(data.logs).sort().forEach(d => {
          const l = data.logs[d] || {};
          const date = new Date(d+"T12:00:00");
          const dow = date.toLocaleDateString("en-US",{weekday:"long"});
          const wk = getISOWeek(date);
          const logged =
            (l.workout?1:0) +
            customs.reduce((sum,h)=>sum+(l[h.key]?1:0), 0);
          dailyRows.push([
            d, dow, wk,
            l.workout || "",
            ...customs.map(h => l[h.key] ? "Yes" : ""),
            logged, allActiveCount,
          ]);
        });

        // ─── SHEET 2: Workout Sets (exploded) ─────────────────────────
        const setsHeader = ["Date", "Day of Week", "Session #", "Workout Type", "Exercise", "Order", "Set #", "Weight (lb)", "Reps", "Rest (s)", "Set Done", "Exercise Done", "Notes"];
        const setsRows = [setsHeader];
        const sessions = data.workoutSessions || {};
        Object.keys(sessions).sort().forEach(d => {
          const arr = sessions[d] || [];
          const dow = new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"});
          arr.forEach((s, sIdx) => {
            const typeLabel = (WORKOUT_TYPES.find(t => t.key===s.type)||{}).label || s.type;
            (s.exercises||[]).forEach((ex, exIdx) => {
              if (!ex.sets || ex.sets.length === 0) {
                if (ex.done || ex.notes) {
                  setsRows.push([d, dow, sIdx+1, typeLabel, ex.name, exIdx+1, "", "", "", "", "", ex.done?"Yes":"", ex.notes||""]);
                }
              } else {
                ex.sets.forEach((set, setIdx) => {
                  setsRows.push([
                    d, dow, sIdx+1, typeLabel, ex.name, exIdx+1, setIdx+1,
                    set.weight || 0, set.reps || 0,
                    (set.rest ?? "") === "" ? "" : set.rest,
                    set.done ? "Yes" : "",
                    ex.done ? "Yes" : "",
                    setIdx === 0 ? (ex.notes||"") : "",
                  ]);
                });
              }
            });
          });
        });

        // ─── SHEET 3: Workout Sessions Summary ───────────────────────
        const sessSummaryHeader = ["Date", "Day of Week", "Session #", "Workout Type", "# Exercises", "# Exercises Done", "Total Sets", "Total Volume (lb)"];
        const sessSummaryRows = [sessSummaryHeader];
        Object.keys(sessions).sort().forEach(d => {
          const arr = sessions[d] || [];
          const dow = new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"});
          arr.forEach((s, sIdx) => {
            const typeLabel = (WORKOUT_TYPES.find(t => t.key===s.type)||{}).label || s.type;
            const doneCount = (s.exercises||[]).filter(e => e.done).length;
            const totalSets = (s.exercises||[]).reduce((acc,e) => acc + (e.sets||[]).length, 0);
            const volume = (s.exercises||[]).reduce((acc,e) =>
              acc + (e.sets||[]).reduce((sum,st) => sum + (st.weight||0)*(st.reps||0), 0), 0);
            sessSummaryRows.push([d, dow, sIdx+1, typeLabel, (s.exercises||[]).length, doneCount, totalSets, Math.round(volume)]);
          });
        });

        // ─── SHEET 4: Todos ──────────────────────────────────────────
        const todoHeader = ["ID", "Title", "Due Date", "Priority", "Status", "Completed Date", "Created Date", "Notes"];
        const todoRows = [todoHeader];
        const allTodos = (data.todos||[]).slice().sort((a,b) => (a.createdAt||"").localeCompare(b.createdAt||""));
        allTodos.forEach(t => {
          todoRows.push([
            t.id, t.title,
            t.dueDate || "",
            t.priority || "",
            t.done ? "Completed" : "Active",
            t.doneAt || "",
            t.createdAt || "",
            t.notes || "",
          ]);
        });

        // ─── SHEET 5: Summary ────────────────────────────────────────
        const summaryRows = [
          ["Export generated", new Date().toLocaleString()],
          ["User", user?.email || ""],
          [],
          ["Current streak (days)", streak],
          ["Day of year", dayCount],
          ["ISO week", getISOWeek(new Date())],
          [],
          ["Days logged", Object.keys(data.logs||{}).length],
          ["Workout sessions logged", Object.keys(data.workoutSessions||{}).length],
          ["Active todos", (data.todos||[]).filter(t=>!t.done).length],
          ["Completed todos", (data.todos||[]).filter(t=>t.done).length],
          ["Custom habits", customs.length],
        ];

        // Build workbook
        const wb = XLSX.utils.book_new();
        const addSheet = (name, rows) => {
          const ws = XLSX.utils.aoa_to_sheet(rows);
          // auto-size columns based on the longest cell per column
          const colWidths = [];
          rows.forEach(r => {
            r.forEach((cell, i) => {
              const len = String(cell ?? "").length;
              if (!colWidths[i] || len > colWidths[i]) colWidths[i] = len;
            });
          });
          ws["!cols"] = colWidths.map(w => ({ wch: Math.min(Math.max(w+2, 10), 40) }));
          XLSX.utils.book_append_sheet(wb, ws, name);
        };

        addSheet("Summary", summaryRows);
        addSheet("Daily Logs", dailyRows);
        addSheet("Workout Sets", setsRows);
        addSheet("Workout Sessions", sessSummaryRows);
        addSheet("Todos", todoRows);

        XLSX.writeFile(wb, `tracker-export-${today}.xlsx`);
      };

      const resetAllData = () => {
        if (!window.confirm("Reset ALL data? This cannot be undone.")) return;
        const fresh = { ...DEFAULT_DATA, startDate: today };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh)); } catch(e) {}
        if (user && window.__firebase) window.__firebase.saveData(user.uid, fresh);
        setData(fresh);
        setTodayLog(blankLog());
        setShowWorkoutPicker(false);
        setSaved(true);
        setTimeout(() => setSaved(false), 1500);
      };

      // ─── Year grid computation ──────────────────────────────────────────
      const yearGrid = useMemo(() => {
        const todayDate = new Date();
        const year = todayDate.getFullYear();
        const startDate = new Date(year, 0, 1);
        while (startDate.getDay() !== 0) startDate.setDate(startDate.getDate()-1);
        const endDate = new Date(todayDate.getFullYear(), todayDate.getMonth()+12, todayDate.getDate());
        const weeks = [];
        let current = [], cursor = new Date(startDate);
        while (cursor <= endDate || current.length > 0) {
          const dateKey = localDateKey(cursor);
          const log = data.logs[dateKey];
          const customCount = log ? (data.customHabits||[]).filter(h => log[h.key]).length : 0;
          const count = log
            ? (log.workout?1:0)+customCount
            : 0;
          const d = cursor.getDate(), m = cursor.getMonth();
          current.push({
            date: dateKey, count, month: m, day: d, year: cursor.getFullYear(),
            isFuture: cursor > todayDate,
            isToday: dateKey === today,
            hasHabit: log ? customCount>0 : false,
            hasWorkout: log ? !!log.workout : false,
            label: (d===1 && m===0) ? String(cursor.getFullYear()).slice(2) : ([1,10,20,30].includes(d) ? String(d) : ""),
          });
          if (current.length === 7) {
            const monday = new Date(current[1].date+"T12:00:00");
            weeks.push({ days: current, weekNum: getISOWeek(monday) });
            current = [];
          }
          cursor.setDate(cursor.getDate()+1);
          if (weeks.length > 120) break;
        }
        if (current.length > 0) {
          while (current.length < 7) current.push({ isFuture:true, count:0, label:"" });
          weeks.push({ days: current, weekNum: 0 });
        }
        return weeks;
      }, [data.logs, data.customHabits, today]);

      const heatColor = cell => {
        if (cell.isFuture) return HEAT.future;
        if (cell.hasWorkout && !cell.hasHabit) return C.workoutOnly;
        return HEAT[Math.min(cell.count, 4)] || HEAT[0];
      };

      const yearStats = useMemo(() => {
        const logs = Object.values(data.logs);
        return {
          active: logs.filter(l => hasAnyHabit(l, data.customHabits)).length,
          full: logs.filter(l => l.workout && (data.customHabits||[]).length > 0 && (data.customHabits||[]).every(h => l[h.key])).length,
          workouts: Object.values(data.workoutSessions||{}).reduce((a, arr) => a + (arr||[]).length, 0),
        };
      }, [data.logs, data.customHabits, data.workoutSessions]);

      const workoutCounts = useMemo(() => {
        const c = {};
        WORKOUT_TYPES.forEach(w => c[w.key] = 0);
        Object.values(data.workoutSessions||{}).forEach(arr => (arr||[]).forEach(s => { c[s.type] = (c[s.type]||0) + 1; }));
        return c;
      }, [data.workoutSessions]);


      // ─── Gates ──────────────────────────────────────────────────────────
      if (authLoading) return (
        <div style={{ display:"flex", alignItems:"center", justifyContent:"center", minHeight:"100vh", flexDirection:"column", gap:16 }}>
          <div style={{ fontSize:28 }}>📊</div>
          <div style={{ fontSize:13, color:C.textMuted, letterSpacing:2, textTransform:"uppercase", fontWeight:600 }}>Loading…</div>
        </div>
      );

      if (!user) {
        const inputStyle = {
          width: "100%",
          background: "#ffffff",
          border: `1px solid ${C.border}`,
          borderRadius: 12,
          padding: "12px 14px",
          fontSize: 15,
          color: C.text,
          fontFamily: "Inter,sans-serif",
          fontWeight: 500,
          outline: "none",
          marginBottom: 10,
        };
        const primaryBtn = {
          width: "100%",
          background: `${C.accent}`,
          border: "none", borderRadius: 12, padding: "13px 20px",
          color: "#fff", fontSize: 14, fontWeight: 700, letterSpacing: 0.4,
          cursor: "pointer", fontFamily: "Inter,sans-serif",
          boxShadow:"none",
        };
        const ghostBtn = {
          background: "none", border: "none", color: C.textMuted,
          fontSize: 12, fontWeight: 600, padding: "8px 4px", cursor: "pointer",
          fontFamily: "Inter,sans-serif", letterSpacing: 0.2,
        };

        const handleEmailSignIn = async () => {
          setLoginError(""); setLoginBusy(true);
          const r = await window.__firebase.signInWithEmail(loginEmail.trim(), loginPassword);
          setLoginBusy(false);
          if (!r.ok) setLoginError(r.error);
        };
        const handleCreate = async () => {
          setLoginError(""); setLoginBusy(true);
          const r = await window.__firebase.createWithEmail(loginEmail.trim(), loginPassword);
          setLoginBusy(false);
          if (!r.ok) setLoginError(r.error);
        };
        const handleReset = async () => {
          setLoginError(""); setLoginInfo(""); setLoginBusy(true);
          const r = await window.__firebase.sendPasswordReset(loginEmail.trim());
          setLoginBusy(false);
          if (!r.ok) setLoginError(r.error);
          else setLoginInfo("Check your inbox for a reset link.");
        };

        return (
          <div style={{ display:"flex", alignItems:"center", justifyContent:"center", minHeight:"100vh", flexDirection:"column", gap:20, padding:32, maxWidth:380, margin:"0 auto" }}>
            <div style={{ textAlign:"center" }}>
              <div style={{ width:42, height:42, background:`${C.accent}`, borderRadius:12, color:"#fff", display:"inline-flex", alignItems:"center", justifyContent:"center", fontFamily:"'Inter',sans-serif", fontWeight:700, fontSize:22, marginBottom:14 }}>B</div>
              <div style={{ fontFamily:"'Inter',sans-serif", fontSize:30, fontWeight:600, color:C.text, letterSpacing:-1 }}>Tracker</div>
              <div style={{ fontSize:13, color:C.textMuted, marginTop:8, fontWeight:500 }}>
                {loginMode === "choose" && "Sign in to sync your data across devices"}
                {loginMode === "signin" && "Sign in with your email"}
                {loginMode === "create" && "Create a new email account"}
                {loginMode === "reset"  && "Reset your password"}
              </div>
            </div>

            {/* CHOOSE: Google + email entry point */}
            {loginMode === "choose" && (
              <div style={{ width:"100%", display:"flex", flexDirection:"column", gap:10 }}>
                <button onClick={()=>window.__firebase.signIn()} style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:12, background:"#ffffff", border:"none", borderRadius:12, padding:"14px 24px", fontSize:15, color:C.text, fontWeight:600, cursor:"pointer", fontFamily:"Inter,sans-serif", boxShadow:"none" }}>
                  <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                  Continue with Google
                </button>
                <div style={{ display:"flex", alignItems:"center", gap:10, margin:"4px 0", color:C.mutedGray, fontSize:10, letterSpacing:2, textTransform:"uppercase", fontWeight:600 }}>
                  <div style={{ flex:1, height:1, background:"rgba(140,126,106,0.2)" }}/>
                  or
                  <div style={{ flex:1, height:1, background:"rgba(140,126,106,0.2)" }}/>
                </div>
                <button onClick={()=>{ setLoginMode("signin"); setLoginError(""); setLoginInfo(""); }} style={{ background:"#ffffff", border:`1px solid ${C.border}`, borderRadius:12, padding:"13px 20px", color:C.text, fontSize:14, fontWeight:600, cursor:"pointer", fontFamily:"Inter,sans-serif" }}>
                  Sign in with email
                </button>
              </div>
            )}

            {/* EMAIL SIGN-IN form */}
            {loginMode === "signin" && (
              <div style={{ width:"100%" }}>
                <input type="email" placeholder="Email" autoComplete="email" autoCapitalize="off"
                  value={loginEmail} onChange={e=>setLoginEmail(e.target.value)} style={inputStyle}/>
                <input type="password" placeholder="Password" autoComplete="current-password"
                  value={loginPassword} onChange={e=>setLoginPassword(e.target.value)}
                  onKeyDown={e=>{ if (e.key==="Enter") handleEmailSignIn(); }} style={inputStyle}/>
                {loginError && <div style={{ fontSize:11, color:C.red, marginBottom:10, fontWeight:500 }}>{loginError}</div>}
                <button onClick={handleEmailSignIn} disabled={loginBusy || !loginEmail || !loginPassword} style={{ ...primaryBtn, opacity: (loginBusy || !loginEmail || !loginPassword) ? 0.5 : 1, cursor: loginBusy ? "wait" : "pointer" }}>
                  {loginBusy ? "SIGNING IN…" : "SIGN IN"}
                </button>
                <div style={{ display:"flex", justifyContent:"space-between", marginTop:8 }}>
                  <button onClick={()=>{ setLoginMode("choose"); setLoginError(""); setLoginInfo(""); }} style={ghostBtn}>← Back</button>
                  <button onClick={()=>{ setLoginMode("reset"); setLoginError(""); setLoginInfo(""); }} style={ghostBtn}>Forgot password?</button>
                </div>
                <div style={{ textAlign:"center", marginTop:18, fontSize:11, color:C.textMuted }}>
                  Don't have an email account yet?{" "}
                  <span onClick={()=>{ setLoginMode("create"); setLoginError(""); setLoginInfo(""); }} style={{ color:C.accent, fontWeight:700, cursor:"pointer" }}>Create one</span>
                </div>
              </div>
            )}

            {/* CREATE form */}
            {loginMode === "create" && (
              <div style={{ width:"100%" }}>
                <div style={{ background:C.accentTint, border:`1px solid ${C.borderActive}`, borderRadius:10, padding:"10px 12px", marginBottom:14, fontSize:11, color:C.text, fontWeight:500, lineHeight:1.5 }}>
                  <strong style={{color:C.accent}}>Note:</strong> This creates a brand-new, empty account. If you want to add email login to your existing Google account, sign in with Google first and link email from Settings.
                </div>
                <input type="email" placeholder="Email" autoComplete="email" autoCapitalize="off"
                  value={loginEmail} onChange={e=>setLoginEmail(e.target.value)} style={inputStyle}/>
                <input type="password" placeholder="Password (min 6 characters)" autoComplete="new-password"
                  value={loginPassword} onChange={e=>setLoginPassword(e.target.value)}
                  onKeyDown={e=>{ if (e.key==="Enter") handleCreate(); }} style={inputStyle}/>
                {loginError && <div style={{ fontSize:11, color:C.red, marginBottom:10, fontWeight:500 }}>{loginError}</div>}
                <button onClick={handleCreate} disabled={loginBusy || !loginEmail || !loginPassword || loginPassword.length < 6} style={{ ...primaryBtn, opacity: (loginBusy || !loginEmail || !loginPassword || loginPassword.length<6) ? 0.5 : 1, cursor: loginBusy ? "wait" : "pointer" }}>
                  {loginBusy ? "CREATING…" : "CREATE ACCOUNT"}
                </button>
                <div style={{ marginTop:8 }}>
                  <button onClick={()=>{ setLoginMode("choose"); setLoginError(""); setLoginInfo(""); }} style={ghostBtn}>← Back</button>
                </div>
              </div>
            )}

            {/* RESET form */}
            {loginMode === "reset" && (
              <div style={{ width:"100%" }}>
                <div style={{ fontSize:12, color:C.textMuted, marginBottom:12, lineHeight:1.5 }}>Enter your email and we'll send you a link to reset your password.</div>
                <input type="email" placeholder="Email" autoComplete="email" autoCapitalize="off"
                  value={loginEmail} onChange={e=>setLoginEmail(e.target.value)} style={inputStyle}/>
                {loginError && <div style={{ fontSize:11, color:C.red, marginBottom:10, fontWeight:500 }}>{loginError}</div>}
                {loginInfo && <div style={{ fontSize:11, color:C.greenText, marginBottom:10, fontWeight:600 }}>{loginInfo}</div>}
                <button onClick={handleReset} disabled={loginBusy || !loginEmail} style={{ ...primaryBtn, opacity: (loginBusy || !loginEmail) ? 0.5 : 1, cursor: loginBusy ? "wait" : "pointer" }}>
                  {loginBusy ? "SENDING…" : "SEND RESET LINK"}
                </button>
                <div style={{ marginTop:8 }}>
