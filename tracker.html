                  onChange={e=>setSetValue(exId,idx,"reps",parseFloat(e.target.value)||0)}
                  style={{ ...numStyle, width:32 }} />
                <span style={unitStyle}>REPS</span>
              </div>
              <button onClick={()=>stepSet(exId,idx,"reps",1)} style={stepBtn(C.accent)}>+</button>
            </div>
            <button onClick={()=>removeSet(exId,idx)} style={{ width:20, height:20, background:"none", border:"none", color:C.textMuted, fontSize:14, cursor:"pointer", fontFamily:"Inter,sans-serif" }}>×</button>
          </div>
        );
      };

      const renderExerciseCard = (ex, exIdx) => {
        const isRenaming = editingExercise && editingExercise.id === ex.id;
        const total = todaySession.exercises.length;
        const typeLabel = WORKOUT_TYPES.find(t=>t.key===todaySession.type)?.label || todaySession.type;

        return (
          <div key={ex.id} style={ ex.done ? S.cardActive : S.card }>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12, gap:10 }}>
              <div style={{ flex:1, display:"flex", alignItems:"center", gap:8 }}>
                <ReorderArrows
                  onUp={()=>moveExercise(ex.id,-1)}
                  onDown={()=>moveExercise(ex.id,1)}
                  canUp={exIdx>0}
                  canDown={exIdx<total-1} />
                {isRenaming ? (
                  <input type="text" defaultValue={ex.name} autoFocus
                    onBlur={e=>{ renameExercise(todaySession.type, ex.name, e.target.value); setEditingExercise(null); }}
                    onKeyDown={e=>{ if(e.key==="Enter") e.target.blur(); if(e.key==="Escape") setEditingExercise(null); }}
                    style={{ flex:1, background:"#ffffff", border:`1px solid ${C.accent}`, borderRadius:8, padding:"6px 10px", fontSize:14, fontWeight:700, color:C.text, fontFamily:"Inter,sans-serif" }} />
                ) : (
                  <div onClick={()=>setEditingExercise({ id: ex.id })}
                    style={{ fontSize:14, fontWeight:700, color: ex.done?C.greenText:C.text, cursor:"pointer", flex:1, letterSpacing:-0.2 }}>
                    {ex.name}
                  </div>
                )}
              </div>
              <button onClick={()=>{
                  const msg = todaySession.type === "mix"
                    ? `Hide "${ex.name}" from Mix? It will stay in its original workout type.`
                    : `Remove "${ex.name}" from ${typeLabel}? Future sessions of this type won't include it.`;
                  if(window.confirm(msg)) deleteExercise(todaySession.type, ex.name);
                }}
                style={{ width:24, height:24, borderRadius:7, background:"#ffffff", border:`1px solid ${C.border}`, color:C.textMuted, fontSize:14, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, fontFamily:"Inter,sans-serif", lineHeight:1, padding:0 }}>×</button>
              <button onClick={()=>{ setChartExpandedFor(chartExpandedFor===ex.name ? null : ex.name); }}
                title="Progress chart"
                style={{ width:24, height:24, borderRadius:7, background: chartExpandedFor===ex.name ? C.accent : C.accentTint, border:"none", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, marginRight:14, padding:0 }}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                  <path d="M3 17l4-4 3 3 5-6 4 4" stroke={chartExpandedFor===ex.name ? "#fff" : C.accentDeep} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
                  <circle cx="18" cy="8" r="1.6" fill={chartExpandedFor===ex.name ? "#fff" : C.accentDeep}/>
                </svg>
              </button>
              <Toggle on={ex.done} onClick={()=>toggleExerciseDone(ex.id)} />
            </div>

            {ex.sets.length > 0 && (
              <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                {ex.sets.map((st, idx) => renderSetRow(ex.id, st, idx))}
              </div>
            )}

            <button onClick={()=>addSet(ex.id)}
              style={{ marginTop: ex.sets.length?8:0, background:"#ffffff", border:`1px dashed ${C.border}`, borderRadius:10, width:"100%", padding:8, fontSize:11, color:C.textMuted, letterSpacing:1, fontFamily:"Inter,sans-serif", cursor:"pointer", fontWeight:600 }}>+ ADD SET</button>

            <textarea value={ex.notes||""} onChange={e=>updateExerciseNotes(ex.id, e.target.value)} placeholder="Notes (optional)…" rows="1"
              style={{ width:"100%", marginTop:8, fontSize:11, color:C.text, fontStyle:"italic", padding:"8px 10px", background:"#ffffff", borderRadius:8, border:`1px solid ${C.border}`, borderLeftWidth:3, borderLeftColor:C.accent, fontFamily:"Inter,sans-serif", resize:"vertical", minHeight:32 }} />

            {chartExpandedFor === ex.name && <ExerciseChart exName={ex.name} />}
          </div>
        );
      };

      const renderWorkoutSession = () => {
        const w = WORKOUT_TYPES.find(t => t.key===todaySession.type);
        const doneCount = (todaySession.exercises||[]).filter(e => e.done).length;
        const totalCount = (todaySession.exercises||[]).length;
        const hiddenForType = (data.hiddenPresets||{})[todaySession.type] || [];

        return (
          <>
            <div style={{ ...S.cardActive, display:"flex", alignItems:"center", gap:12 }}>
              <div style={{
                width:52, height:52, borderRadius:15,
                background: C.accentTint,
                display:"flex", alignItems:"center", justifyContent:"center",
                fontSize:26, flexShrink:0,
                boxShadow:"none",
              }}>{w?w.emoji:"🏋️"}</div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontFamily:"'Inter',sans-serif", fontSize:18, fontWeight:600, color:C.greenText, letterSpacing:-0.3 }}>{w?w.label:"Workout"} Day</div>
                <div style={{ fontSize:11, color:C.green, marginTop:2, fontWeight:500 }}>{formatDate(today,{weekday:"long",month:"long",day:"numeric"})} · {doneCount} of {totalCount} done</div>
              </div>
              <button onClick={()=>{ if(window.confirm("Change workout type? Current sets and notes will be lost.")) clearSession(); }}
                style={{ background:"#ffffff", border:"none", borderRadius:8, color:C.textMuted, fontSize:10, padding:"7px 12px", letterSpacing:1, fontFamily:"Inter,sans-serif", cursor:"pointer", fontWeight:700, boxShadow:"none" }}>CHANGE</button>
            </div>

            {todaySession.exercises.map((ex, exIdx) => renderExerciseCard(ex, exIdx))}

            <div style={{ display:"flex", gap:8, marginBottom:12 }}>
              <input type="text" value={newExerciseName} onChange={e=>setNewExerciseName(e.target.value)} placeholder="Add custom exercise…"
                onKeyDown={e=>{ if(e.key==="Enter") { addCustomExercise(todaySession.type, newExerciseName); setNewExerciseName(""); } }}
                style={{ flex:1, background:"#ffffff", border:`1px dashed ${C.accent}`, borderRadius:14, padding:"12px 14px", fontSize:12, color:C.text, fontFamily:"Inter,sans-serif", letterSpacing:0.3, fontWeight:500 }} />
              <button onClick={()=>{ addCustomExercise(todaySession.type, newExerciseName); setNewExerciseName(""); }}
                style={{ background:`${C.accent}`, border:"none", borderRadius:14, color:"#fff", fontSize:12, fontWeight:700, padding:"0 18px", cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.5 }}>ADD</button>
            </div>

            {hiddenForType.length > 0 && (
              <div style={{ ...S.card, marginTop:4 }}>
                <div style={S.smallLabel}>Deleted exercises</div>
                {hiddenForType.map(h => (
                  <div key={h} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"6px 0", borderTop:`1px solid ${C.border}` }}>
                    <span style={{ fontSize:11, color:C.textMuted, textDecoration:"line-through" }}>{h}</span>
                    <button onClick={()=>restorePreset(todaySession.type, h)} style={{ background:"#ffffff", border:`1px solid ${C.accent}`, borderRadius:8, color:C.accent, fontSize:10, padding:"4px 10px", cursor:"pointer", fontFamily:"Inter,sans-serif", fontWeight:700, letterSpacing:0.4 }}>RESTORE</button>
                  </div>
                ))}
              </div>
            )}

            <SavedToast show={saved} />
          </>
        );
      };

      const renderWorkoutPicker = () => {
        const recent = Object.entries(data.workoutSessions||{})
          .filter(([d, s]) => {
            if (d === today) return false;
            // hide unlogged days (workout was toggled off on the Day tab)
            const dayLog = (data.logs||{})[d];
            if (!dayLog || !dayLog.workout) return false;
            // hide empty sessions: no done exercises and no logged sets
            const hasContent = (s.exercises||[]).some(e => e.done || (e.sets||[]).length > 0);
            return hasContent;
          })
          .sort((a,b) => b[0].localeCompare(a[0]))
          .slice(0,7);

        return (
          <>
            <div style={S.sectionLabel}>Pick today's workout</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:20 }}>
              {WORKOUT_TYPES.map(w => {
                const count = getExercisesForType(data, w.key).length;
                return (
                  <button key={w.key} onClick={()=>startSession(w.key)} style={{
                    ...S.card, marginBottom:0, padding:"18px 12px", textAlign:"center", cursor:"pointer", fontFamily:"Inter,sans-serif",
                  }}>
                    <div style={{ fontSize:32, lineHeight:1, marginBottom:8 }}>{w.emoji}</div>
                    <div style={{ fontSize:14, fontWeight:700, color:C.text, letterSpacing:-0.2 }}>{w.label}</div>
                    <div style={{ fontSize:10, color:C.textMuted, marginTop:3, fontWeight:500 }}>{count} exercises</div>
                  </button>
                );
              })}
            </div>

            {recent.length > 0 && (
              <div style={S.card}>
                <div style={{ fontFamily:"'Inter',sans-serif", fontSize:15, fontWeight:600, marginBottom:10, letterSpacing:-0.3 }}>Recent sessions</div>
                {recent.map(([d, s], i) => {
                  const w = WORKOUT_TYPES.find(t => t.key===s.type);
                  const doneCount = (s.exercises||[]).filter(e => e.done).length;
                  const totalSets = (s.exercises||[]).reduce((acc,e) => acc + (e.sets||[]).length, 0);
                  const isExp = expandedSession === d;
                  return (
                    <div key={d} style={{ borderTop: i===0?"none":`1px solid ${C.border}` }}>
                      <div onClick={()=>setExpandedSession(isExp?null:d)}
                        style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 0", fontSize:12, cursor:"pointer" }}>
                        <span style={{ color: isExp?C.accent:C.textMuted, fontWeight: isExp?700:500 }}>
                          {formatDate(d, {weekday:"short",month:"short",day:"numeric"})}
                        </span>
                        <span style={{ display:"flex", alignItems:"center", gap:8 }}>
                          <span style={{ fontWeight:700, color:C.text }}>
                            {w?w.emoji:""} {w?w.label:s.type} · {doneCount}/{(s.exercises||[]).length}
                          </span>
                          <span style={{ fontSize:10, color:C.textMuted }}>{isExp?"▲":"▼"}</span>
                        </span>
                      </div>
                      {isExp && (
                        <div style={{ padding:"4px 0 12px 0" }}>
                          {(s.exercises||[]).filter(e => (e.sets||[]).length>0 || e.done).length === 0 && (
                            <div style={{ fontSize:11, color:C.textMuted, fontStyle:"italic", padding:"4px 0" }}>No exercises logged for this session.</div>
                          )}
                          {(s.exercises||[]).filter(e => (e.sets||[]).length>0 || e.done).map(e => (
                            <div key={e.id} style={{ padding:"8px 12px", marginBottom:4, background:"#ffffff", borderRadius:10, boxShadow: e.done ? `inset 3px 0 0 ${C.green}, 0 1px 0 #ffffff inset` : "0 1px 0 #ffffff inset" }}>
                              <div style={{ fontSize:12, fontWeight:700, color: e.done?C.greenText:C.text, display:"flex", alignItems:"center", gap:6, letterSpacing:-0.2 }}>
                                {e.done && <span style={{ color:C.green }}>✓</span>}
                                <span>{e.name}</span>
                              </div>
                              {(e.sets||[]).length > 0 && (
                                <div style={{ fontSize:10, color:C.textMuted, marginTop:3, lineHeight:1.4, fontWeight:500 }}>
                                  {e.sets.map(st => `${st.weight||0}lb × ${st.reps||0}`).join("  ·  ")}
                                </div>
                              )}
                              {e.notes && (
                                <div style={{ fontSize:10, color:C.textMuted, marginTop:3, fontStyle:"italic" }}>{e.notes}</div>
                              )}
                            </div>
                          ))}
                          <div style={{ fontSize:10, color:C.textMuted, marginTop:6, textAlign:"right", letterSpacing:1 }}>{totalSets} total sets</div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}

            {/* EXERCISE LIBRARY */}
            <div style={S.card}>
              <div onClick={()=>setLibraryExpanded(!libraryExpanded)} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer" }}>
                <div style={{ fontFamily:"'Inter',sans-serif", fontSize:15, fontWeight:600, letterSpacing:-0.3 }}>Exercise library</div>
                <span style={{ fontSize:11, color:C.textMuted, fontWeight:600 }}>{libraryExpanded?"▲":"▼"}</span>
              </div>
              {!libraryExpanded && (
                <div style={{ fontSize:11, color:C.textMuted, marginTop:6, fontWeight:500 }}>Manage all exercises across workout types</div>
              )}
              {libraryExpanded && (
                <div style={{ marginTop:14 }}>
                  {WORKOUT_TYPES.filter(t => t.key !== "mix").map(t => {
                    const visible = getExercisesForType(data, t.key);
                    const hidden = (data.hiddenPresets||{})[t.key] || [];
                    const customs = new Set((data.customExercises||{})[t.key] || []);
                    const presetSet = new Set(EXERCISE_PRESETS[t.key] || []);
                    const renames = (data.renamedPresets||{})[t.key] || {};
                    const renamedFromMap = {};
                    Object.entries(renames).forEach(([orig, newName]) => { renamedFromMap[newName] = orig; });
                    const newName = libraryNewByType[t.key] || "";
                    return (
                      <div key={t.key} style={{ marginBottom:18 }}>
                        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
                          <span style={{ fontSize:16 }}>{t.emoji}</span>
                          <span style={{ fontSize:12, fontWeight:700, color:C.text, letterSpacing:0.2 }}>{t.label}</span>
                          <span style={{ fontSize:10, color:C.textMuted, fontWeight:500 }}>· {visible.length} exercises</span>
                        </div>
                        {visible.length === 0 && (
                          <div style={{ fontSize:11, color:C.textMuted, fontStyle:"italic", padding:"4px 0" }}>No exercises in this type.</div>
                        )}
                        {visible.map(name => {
                          const isCustom = customs.has(name);
                          const originalName = renamedFromMap[name];
                          const isRenamedPreset = !!originalName;
                          return (
                            <div key={name} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"7px 10px", marginBottom:4, background:"#ffffff", borderRadius:10, boxShadow:"0 1px 0 #ffffff inset" }}>
                              <div style={{ display:"flex", alignItems:"center", gap:6, minWidth:0 }}>
                                <span style={{ fontSize:12, color:C.text, fontWeight:500 }}>{name}</span>
                                {isCustom && <span style={{ fontSize:8, color:C.accent, fontWeight:700, letterSpacing:1 }}>CUSTOM</span>}
                                {isRenamedPreset && <span style={{ fontSize:9, color:C.textMuted, fontStyle:"italic" }}>(was {originalName})</span>}
                              </div>
                              <button onClick={()=>{
                                const target = isRenamedPreset ? originalName : name;
                                if (window.confirm(`Delete "${name}" from ${t.label}? Past sessions are unaffected.`)) deleteExercise(t.key, target);
                              }} style={{ width:22, height:22, borderRadius:6, background:"#ffffff", border:`1px solid ${C.border}`, color:C.textMuted, fontSize:13, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, fontFamily:"Inter,sans-serif", lineHeight:1, padding:0 }}>×</button>
                            </div>
                          );
                        })}
                        {hidden.length > 0 && (
                          <div style={{ marginTop:6 }}>
                            <div style={{ fontSize:9, color:C.textMuted, textTransform:"uppercase", letterSpacing:1, fontWeight:700, marginBottom:4 }}>Deleted</div>
                            {hidden.map(h => (
                              <div key={h} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"6px 10px", marginBottom:4 }}>
                                <span style={{ fontSize:11, color:C.textMuted, textDecoration:"line-through" }}>{h}</span>
                                <button onClick={()=>restorePreset(t.key, h)} style={{ background:"#ffffff", border:`1px solid ${C.accent}`, borderRadius:8, color:C.accent, fontSize:9, padding:"3px 8px", cursor:"pointer", fontFamily:"Inter,sans-serif", fontWeight:700, letterSpacing:0.4 }}>RESTORE</button>
                              </div>
                            ))}
                          </div>
                        )}
                        <div style={{ display:"flex", gap:6, marginTop:6 }}>
                          <input type="text" value={newName} onChange={e=>setLibraryNewByType({ ...libraryNewByType, [t.key]: e.target.value })} placeholder={`Add to ${t.label}…`}
                            onKeyDown={e=>{ if(e.key==="Enter" && newName.trim()) { addCustomExercise(t.key, newName); setLibraryNewByType({ ...libraryNewByType, [t.key]: "" }); } }}
                            style={{ flex:1, background:"#ffffff", border:`1px dashed ${C.border}`, borderRadius:10, padding:"7px 10px", fontSize:11, color:C.text, fontFamily:"Inter,sans-serif" }} />
                          <button onClick={()=>{ if(newName.trim()) { addCustomExercise(t.key, newName); setLibraryNewByType({ ...libraryNewByType, [t.key]: "" }); } }}
                            style={{ background:"#ffffff", border:`1px solid ${C.accent}`, borderRadius:10, color:C.accent, fontSize:10, fontWeight:700, padding:"0 12px", cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.4 }}>ADD</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </>
        );
      };

      // ─── TAB: TODO ──────────────────────────────────────────────────────
      const renderTodoCard = (t, opts={}) => {
        const isOverdue = todoBucket(t.dueDate) === "overdue" && !t.done;
        const isExpanded = todoExpandedId === t.id;

        if (isExpanded) {
          return renderTodoExpanded(t, isOverdue);
        }

        const baseCard = {
          background:"#ffffff",
          borderRadius:18,
          padding:"14px 16px",
          boxShadow:"none",
        };
        const overdueShadow = "inset 4px 0 0 #d4453f";
        const doneShadow = "0 1px 0 rgba(255,255,255,1) inset, inset 5px 0 0 #5fa85f, 0 1px 2px rgba(74,140,74,0.08), 0 8px 20px -12px rgba(74,140,74,0.18)";

        const dateLabel = formatTodoDate(t.dueDate);
        const cardStyle = {
          ...baseCard,
          background: t.done ? "#ffffff" : baseCard.background,
          boxShadow: t.done ? doneShadow : (isOverdue ? overdueShadow : baseCard.boxShadow),
          display:"flex", alignItems:"center", gap:14,
          cursor:"pointer",
        };

        return (
          <div key={t.id} onClick={()=>setTodoExpandedId(t.id)} style={cardStyle}>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{
                fontSize:15, fontWeight:600, letterSpacing:-0.2,
                color: t.done?C.greenText:C.text,
                textDecoration: t.done?"line-through":"none",
                textDecorationColor: t.done?"rgba(45,110,45,0.5)":"none",
              }}>{t.title}</div>
              {(t.priority || dateLabel) && (
                <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:4 }}>
                  {t.priority && (
                    <span style={{
                      width:6, height:6, borderRadius:"50%",
                      background: PRIORITY_COLORS[t.priority],
                    }}/>
                  )}
                  {dateLabel && !t.done && (
                    <span style={{
                      fontSize:11, fontWeight: isOverdue?700:500,
                      color: isOverdue?C.accent:C.textMuted,
                    }}>{dateLabel}</span>
                  )}
                  {t.done && t.doneAt && (
                    <span style={{ fontSize:11, fontWeight:600, color:C.green }}>
                      Done · {t.doneAt === today ? "today" : formatDate(t.doneAt,{month:"short",day:"numeric"})}
                    </span>
                  )}
                </div>
              )}
            </div>
            <div onClick={e=>{ e.stopPropagation(); toggleTodo(t.id); }}>
              <Toggle on={t.done} onClick={()=>toggleTodo(t.id)} />
            </div>
          </div>
        );
      };

      const renderTodoExpanded = (t, isOverdue) => {
        const isEditingTitle = todoEditing && todoEditing.id === t.id && todoEditing.field === "title";
        const isEditingDate = todoEditing && todoEditing.id === t.id && todoEditing.field === "date";
        const isEditingPriority = todoEditing && todoEditing.id === t.id && todoEditing.field === "priority";
        const isEditingNotes = todoEditing && todoEditing.id === t.id && todoEditing.field === "notes";

        return (
          <div key={t.id} style={{
            background:"#ffffff",
            borderRadius:18,
            padding:16,
            boxShadow: t.done
              ? "0 1px 0 rgba(255,255,255,1) inset, inset 5px 0 0 #5fa85f, 0 2px 4px rgba(74,140,74,0.08), 0 12px 28px -8px rgba(74,140,74,0.18)"
              : isOverdue
              ? "inset 4px 0 0 #d4453f"
              : "none",
          }}>
            <div style={{ display:"flex", alignItems:"flex-start", gap:14, marginBottom:14 }}>
              <div style={{ flex:1 }}>
                {isEditingTitle ? (
                  <input type="text" defaultValue={t.title} autoFocus
                    onBlur={e=>{ const v = e.target.value.trim(); if (v) updateTodo(t.id,{title:v}); setTodoEditing(null); }}
                    onKeyDown={e=>{ if (e.key==="Enter") e.target.blur(); if (e.key==="Escape") setTodoEditing(null); }}
                    style={{ width:"100%", background:"#ffffff", border:`1px solid ${C.accent}`, borderRadius:10, padding:"8px 10px", fontSize:16, fontWeight:600, color:C.text, fontFamily:"Inter,sans-serif", letterSpacing:-0.2 }} />
                ) : (
                  <div onClick={()=>setTodoEditing({id:t.id, field:"title"})} style={{
                    fontSize:16, fontWeight:600, letterSpacing:-0.2, lineHeight:1.35,
                    color: t.done?C.greenText:C.text,
                    cursor:"pointer",
                  }}>{t.title}</div>
                )}
              </div>
              <Toggle on={t.done} onClick={()=>toggleTodo(t.id)} />
            </div>

            {/* DATE ROW */}
            <div style={{ borderTop:`1px solid rgba(140,126,106,0.12)`, padding:"10px 0" }}>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ fontSize:10, letterSpacing:1, textTransform:"uppercase", color:C.mutedGray, fontWeight:700, minWidth:70 }}>Due</span>
                {isEditingDate ? (
                  <input type="date" defaultValue={t.dueDate || ""} autoFocus
                    onBlur={e=>{ updateTodo(t.id,{dueDate: e.target.value || null}); setTodoEditing(null); }}
                    onChange={e=>{ updateTodo(t.id,{dueDate: e.target.value || null}); setTodoEditing(null); }}
                    style={{ flex:1, background:"#ffffff", border:`1px solid ${C.accent}`, borderRadius:8, padding:"6px 10px", fontSize:13, color:C.text, fontFamily:"Inter,sans-serif" }} />
                ) : (
                  <div onClick={()=>setTodoEditing({id:t.id, field:"date"})} style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer" }}>
                    <span style={{ fontSize:13, fontWeight:600, color: isOverdue?C.accent:C.text }}>
                      {t.dueDate ? formatTodoDate(t.dueDate) : <span style={{color:"#b8aa92", fontWeight:500, fontStyle:"italic"}}>No due date</span>}
                    </span>
                    <span style={{ color:"#b8aa92", fontSize:14 }}>›</span>
                  </div>
                )}
              </div>
            </div>

            {/* PRIORITY ROW */}
            <div style={{ borderTop:`1px solid rgba(140,126,106,0.12)`, padding:"10px 0" }}>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ fontSize:10, letterSpacing:1, textTransform:"uppercase", color:C.mutedGray, fontWeight:700, minWidth:70 }}>Priority</span>
                {isEditingPriority ? (
                  <div style={{ flex:1, display:"flex", gap:6 }}>
                    {["high","med","low"].map(p => (
                      <button key={p} onClick={()=>{ updateTodo(t.id,{priority:p}); setTodoEditing(null); }} style={{
                        flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:5,
                        background: t.priority===p ? "#fbe9e8" : "#ffffff",
                        border:`1px solid ${t.priority===p?"#f0b3b0":"#e7eae3"}`,
                        borderRadius:8, padding:"6px 8px", fontSize:11, fontWeight:600,
                        color: t.priority===p?C.accent:C.textMuted,
                        cursor:"pointer", fontFamily:"Inter,sans-serif",
                      }}>
                        <span style={{ width:6, height:6, borderRadius:"50%", background:PRIORITY_COLORS[p] }}/>
                        {PRIORITY_LABELS[p]}
                      </button>
                    ))}
                    {t.priority && (
                      <button onClick={()=>{ updateTodo(t.id,{priority:null}); setTodoEditing(null); }} style={{ background:"none", border:"none", color:C.textMuted, fontSize:11, cursor:"pointer", padding:"0 4px" }}>×</button>
                    )}
                  </div>
                ) : (
                  <div onClick={()=>setTodoEditing({id:t.id, field:"priority"})} style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer" }}>
                    <span style={{ fontSize:13, fontWeight:600, color:C.text, display:"flex", alignItems:"center", gap:6 }}>
                      {t.priority ? (
                        <>
                          <span style={{ width:6, height:6, borderRadius:"50%", background:PRIORITY_COLORS[t.priority] }}/>
                          {PRIORITY_LABELS[t.priority]}
                        </>
                      ) : <span style={{color:"#b8aa92", fontWeight:500, fontStyle:"italic"}}>None</span>}
                    </span>
                    <span style={{ color:"#b8aa92", fontSize:14 }}>›</span>
                  </div>
                )}
              </div>
            </div>

            {/* NOTES ROW */}
            <div style={{ borderTop:`1px solid rgba(140,126,106,0.12)`, padding:"10px 0" }}>
              <div style={{ display:"flex", alignItems:"flex-start", gap:10 }}>
                <span style={{ fontSize:10, letterSpacing:1, textTransform:"uppercase", color:C.mutedGray, fontWeight:700, minWidth:70, paddingTop:2 }}>Notes</span>
                {isEditingNotes ? (
                  <textarea defaultValue={t.notes||""} autoFocus rows="2"
                    onBlur={e=>{ updateTodo(t.id,{notes: e.target.value}); setTodoEditing(null); }}
                    style={{ flex:1, background:"#ffffff", border:`1px solid ${C.accent}`, borderRadius:8, padding:"6px 10px", fontSize:13, color:C.text, fontFamily:"Inter,sans-serif", resize:"vertical", minHeight:42 }} />
                ) : (
                  <div onClick={()=>setTodoEditing({id:t.id, field:"notes"})} style={{ flex:1, display:"flex", alignItems:"flex-start", justifyContent:"space-between", cursor:"pointer", gap:8 }}>
                    <span style={{ fontSize:13, fontWeight:t.notes?500:500, color: t.notes?C.text:"#b8aa92", fontStyle: t.notes?"normal":"italic", lineHeight:1.4, flex:1 }}>
                      {t.notes || "Add a note…"}
                    </span>
                    <span style={{ color:"#b8aa92", fontSize:14 }}>›</span>
                  </div>
                )}
              </div>
            </div>

            {/* ACTIONS */}
            <div style={{ display:"flex", gap:8, marginTop:6, paddingTop:12, borderTop:`1px solid rgba(140,126,106,0.12)` }}>
              <button onClick={()=>setTodoExpandedId(null)} style={{
                flex:1, background:"#ffffff", border:`1px solid #e7eae3`,
                borderRadius:10, padding:10, fontSize:12, fontWeight:600, color:C.textMuted,
                cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.3,
              }}>CLOSE</button>
              <button onClick={()=>{ if (window.confirm(`Delete "${t.title}"?`)) deleteTodo(t.id); }} style={{
                flex:1, background:"rgba(204,68,68,0.05)", border:`1px solid rgba(204,68,68,0.3)`,
                borderRadius:10, padding:10, fontSize:12, fontWeight:600, color:C.red,
                cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.3,
                display:"flex", alignItems:"center", justifyContent:"center", gap:6,
              }}>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                DELETE
              </button>
            </div>
          </div>
        );
      };

      const renderTodoGroup = (label, todos, options={}) => {
        if (todos.length === 0) return null;
        const isToday = options.isToday;
        const dateSubtitle = options.dateSubtitle;
        return (
          <div key={label} style={{ marginBottom:18 }}>
            <div style={{ display:"flex", alignItems:"baseline", gap:10, padding:"0 6px", marginBottom:10 }}>
              <span style={{ fontSize:11, fontWeight: isToday?600:500, letterSpacing:0.2, color: isToday?C.greenDark:C.mutedGray }}>{label}</span>
              <span style={{ fontSize:11, fontWeight:500, color:C.mutedGray, letterSpacing:0.2 }}>{todos.length}</span>
              {dateSubtitle && (
                <span style={{ fontSize:11, fontWeight:500, color:C.mutedGray, letterSpacing:0.2, marginLeft:"auto" }}>{dateSubtitle}</span>
              )}
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {todos.map(t => renderTodoCard(t))}
            </div>
          </div>
        );
      };

      const renderAddSheet = () => {
        if (!todoSheetOpen) return null;
        const hasTitle = (todoDraft.title||"").trim().length > 0;
        const dueLabel = todoDraft.dueDate ? formatTodoDate(todoDraft.dueDate) : null;
        return (
          <>
            <div onClick={()=>{ setTodoSheetOpen(false); setTodoDateOpen(false); setTodoPriorityOpen(false); }}
              style={{ position:"fixed", inset:0, background:"rgba(13,19,12,0.28)", zIndex:99, pointerEvents:"auto" }}/>
            <div style={{
              position:"fixed",
              bottom: "calc(84px + env(safe-area-inset-bottom, 0px))",
              left:12, right:12, maxWidth: 406, margin:"0 auto",
              zIndex:101,
              background:"rgba(255, 252, 246, 0.97)",
              
              borderRadius:22,
              padding:"18px 18px 14px",
              boxShadow:"none",
            }}>
              <input type="text" value={todoDraft.title} autoFocus
                onChange={e=>setTodoDraft({...todoDraft, title: e.target.value})}
                onKeyDown={e=>{ if (e.key==="Enter") addTodo(); if (e.key==="Escape") setTodoSheetOpen(false); }}
                placeholder="What needs doing?"
                style={{ width:"100%", background:"transparent", border:"none", outline:"none", fontSize:17, color:C.text, fontFamily:"Inter,sans-serif", fontWeight:600, letterSpacing:-0.2, padding:"4px 0 12px" }} />

              <div style={{ height:1, background:"rgba(140,126,106,0.15)", margin:"0 -4px 12px" }}/>

              {/* Date sub-picker */}
              {todoDateOpen && (
                <div style={{ marginBottom:10, padding:"10px", background:"#ffffff", borderRadius:12, border:`1px solid #e7eae3` }}>
                  <div style={{ display:"flex", gap:6, marginBottom:8, flexWrap:"wrap" }}>
                    <button onClick={()=>{ setTodoDraft({...todoDraft, dueDate: today}); setTodoDateOpen(false); }} style={chipStyle(todoDraft.dueDate===today)}>Today</button>
                    {(() => {
                      const tm = new Date(today+"T12:00:00"); tm.setDate(tm.getDate()+1);
                      const k = localDateKey(tm);
                      return <button onClick={()=>{ setTodoDraft({...todoDraft, dueDate: k}); setTodoDateOpen(false); }} style={chipStyle(todoDraft.dueDate===k)}>Tomorrow</button>;
                    })()}
                    {(() => {
                      const w = new Date(today+"T12:00:00"); w.setDate(w.getDate()+7);
                      const k = localDateKey(w);
                      return <button onClick={()=>{ setTodoDraft({...todoDraft, dueDate: k}); setTodoDateOpen(false); }} style={chipStyle(todoDraft.dueDate===k)}>In a week</button>;
                    })()}
                  </div>
                  <input type="date" value={todoDraft.dueDate||""}
                    onChange={e=>{ setTodoDraft({...todoDraft, dueDate: e.target.value || ""}); }}
                    style={{ width:"100%", background:"#ffffff", border:`1px solid #e7eae3`, borderRadius:8, padding:"7px 10px", fontSize:13, color:C.text, fontFamily:"Inter,sans-serif" }} />
                  {todoDraft.dueDate && (
                    <button onClick={()=>setTodoDraft({...todoDraft, dueDate:""})} style={{ marginTop:6, background:"none", border:"none", color:C.textMuted, fontSize:11, cursor:"pointer", fontFamily:"Inter,sans-serif" }}>Clear</button>
                  )}
                </div>
              )}

              {/* Priority sub-picker */}
              {todoPriorityOpen && (
                <div style={{ marginBottom:10, padding:"10px", background:"#ffffff", borderRadius:12, border:`1px solid #e7eae3` }}>
                  <div style={{ display:"flex", gap:6 }}>
                    {["high","med","low"].map(p => (
                      <button key={p} onClick={()=>{ setTodoDraft({...todoDraft, priority:p}); setTodoPriorityOpen(false); }} style={{
                        flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:5,
                        background: todoDraft.priority===p ? "#fbe9e8" : "#ffffff",
                        border:`1px solid ${todoDraft.priority===p?"#f0b3b0":"#e7eae3"}`,
                        borderRadius:8, padding:"7px 8px", fontSize:11, fontWeight:600,
                        color: todoDraft.priority===p?C.accent:C.textMuted,
                        cursor:"pointer", fontFamily:"Inter,sans-serif",
                      }}>
                        <span style={{ width:6, height:6, borderRadius:"50%", background:PRIORITY_COLORS[p] }}/>
                        {PRIORITY_LABELS[p]}
                      </button>
                    ))}
                  </div>
                  {todoDraft.priority && (
                    <button onClick={()=>setTodoDraft({...todoDraft, priority:""})} style={{ marginTop:6, background:"none", border:"none", color:C.textMuted, fontSize:11, cursor:"pointer", fontFamily:"Inter,sans-serif" }}>Clear</button>
                  )}
                </div>
              )}

              {/* TOOLS ROW */}
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:8 }}>
                <div style={{ display:"flex", gap:6 }}>
                  <button onClick={()=>{ setTodoDateOpen(!todoDateOpen); setTodoPriorityOpen(false); }} style={chipStyle(!!todoDraft.dueDate)}>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
                      <rect x="3" y="5" width="18" height="16" rx="2.5" stroke="currentColor" strokeWidth="1.8" fill="none"/>
                      <path d="M3 10h18" stroke="currentColor" strokeWidth="1.8"/>
                      <path d="M8 2v4M16 2v4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
                    </svg>
                    {dueLabel || "Due date"}
                  </button>
                  <button onClick={()=>{ setTodoPriorityOpen(!todoPriorityOpen); setTodoDateOpen(false); }} style={chipStyle(!!todoDraft.priority)}>
                    <span style={{ width:6, height:6, borderRadius:"50%", background: todoDraft.priority ? PRIORITY_COLORS[todoDraft.priority] : PRIORITY_COLORS.low }}/>
                    {todoDraft.priority ? PRIORITY_LABELS[todoDraft.priority] : "Priority"}
                  </button>
                </div>
                <div style={{ display:"flex", gap:6 }}>
                  <button onClick={()=>{ setTodoSheetOpen(false); setTodoDraft({title:"",dueDate:"",priority:""}); setTodoDateOpen(false); setTodoPriorityOpen(false); }}
                    style={{ background:"none", border:"none", color:C.textMuted, fontSize:12, fontWeight:600, padding:"7px 10px", cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.2 }}>Cancel</button>
                  <button onClick={addTodo} disabled={!hasTitle} style={{
                    width:34, height:34, borderRadius:"50%",
                    background: hasTitle ? `${C.accent}` : "rgba(140,126,106,0.25)",
                    border:"none", color:"#fff", cursor: hasTitle?"pointer":"not-allowed",
                    display:"flex", alignItems:"center", justifyContent:"center",
                    boxShadow:"none",
                  }}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  </button>
                </div>
              </div>
            </div>
          </>
        );
      };

      const chipStyle = active => ({
        display:"inline-flex", alignItems:"center", gap:5,
        background: active?"#fbe9e8":"#ffffff",
        border:`1px solid ${active?"#f0b3b0":"#e7eae3"}`,
        borderRadius:100, padding:"6px 11px 6px 9px",
        fontSize:11, fontWeight:600,
        color: active?C.accent:C.textMuted,
        cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:0.1,
      });

      const renderTodoTab = () => {
        const allTodos = data.todos || [];
        const active = allTodos.filter(t => !t.done);
        const completed = allTodos.filter(t => t.done).sort((a,b) => (b.doneAt||"").localeCompare(a.doneAt||""));

        // Bucket active
        const tomorrowKey = (() => { const t = new Date(today+"T12:00:00"); t.setDate(t.getDate()+1); return localDateKey(t); })();
        const todayList = active.filter(t => {
          const b = todoBucket(t.dueDate);
          return b === "today" || b === "overdue";
        }).sort((a,b) => {
          // overdue first, then by priority, then by date
          const aB = todoBucket(a.dueDate), bB = todoBucket(b.dueDate);
          if (aB !== bB) return aB === "overdue" ? -1 : 1;
          return (a.dueDate||"").localeCompare(b.dueDate||"");
        });
        const tomorrowList = active.filter(t => todoBucket(t.dueDate) === "tomorrow");
        const laterList = active.filter(t => todoBucket(t.dueDate) === "later")
          .sort((a,b) => (a.dueDate||"").localeCompare(b.dueDate||""));
        const noDateList = active.filter(t => !t.dueDate);

        const todayFormatted = formatDate(today,{weekday:"short", month:"short", day:"numeric"});
        const tomorrowFormatted = formatDate(tomorrowKey,{weekday:"short", month:"short", day:"numeric"});

        return (
          <div style={S.bodyPad}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", fontSize:11, fontWeight:600, color:C.textMuted, textTransform:"uppercase", letterSpacing:1.5, margin:"6px 4px 18px" }}>
              <span>Todo</span>
              <span style={{ fontFamily:"'Inter',sans-serif", fontSize:13, color:C.accent, fontWeight:700, letterSpacing:0, textTransform:"none" }}>{active.length} active</span>
            </div>

            {active.length === 0 && completed.length === 0 && (
              <div style={{ ...S.card, textAlign:"center", padding:"40px 20px" }}>
                <div style={{ fontSize:28, marginBottom:10, opacity:0.4 }}>✓</div>
                <div style={{ fontFamily:"'Inter',sans-serif", fontSize:18, fontWeight:600, letterSpacing:-0.3, marginBottom:4 }}>Nothing to do</div>
                <div style={{ fontSize:12, color:C.textMuted, fontWeight:500 }}>Tap "Add task" below to get started.</div>
              </div>
            )}

            {renderTodoGroup("Today", todayList, { isToday:true, dateSubtitle: todayFormatted })}
            {renderTodoGroup("Tomorrow", tomorrowList, { dateSubtitle: tomorrowFormatted })}
            {renderTodoGroup("Later", laterList)}
            {renderTodoGroup("No date", noDateList)}

            {completed.length > 0 && (
              <div style={{ marginTop:18 }}>
                <div style={{ display:"flex", alignItems:"baseline", gap:10, padding:"0 6px", marginBottom:10 }}>
                  <span style={{ fontSize:11, fontWeight:500, color:C.mutedGray, letterSpacing:0.2 }}>Completed</span>
                  <span style={{ fontSize:11, fontWeight:500, color:C.mutedGray, letterSpacing:0.2 }}>{completed.length}</span>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                  {completed.slice(0,20).map(t => renderTodoCard(t))}
                </div>
              </div>
            )}
          </div>
        );
      };

      const renderTodoFAB = () => {
        if (activeTab !== "todo") return null;
        if (todoSheetOpen) return null;
        return (
          <div style={{
            position:"fixed", left:0, right:0,
            bottom: "calc(86px + env(safe-area-inset-bottom, 0px))",
            display:"flex", justifyContent:"center",
            pointerEvents:"none", zIndex:50,
          }}>
            <button onClick={()=>setTodoSheetOpen(true)} style={{
              pointerEvents:"auto",
              display:"inline-flex", alignItems:"center", gap:8,
              background:`${C.accent}`,
              color:"#fff", padding:"13px 22px", borderRadius:100,
              fontSize:14, fontWeight:700, letterSpacing:0.3,
              border:"none", cursor:"pointer", fontFamily:"Inter,sans-serif",
              boxShadow:"none",
            }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" strokeWidth="2.5" strokeLinecap="round"/></svg>
              Add task
            </button>
          </div>
        );
      };

      const renderWorkoutTab = () => (
        <div style={S.bodyPad}>
          {todaySession ? renderWorkoutSession() : renderWorkoutPicker()}
        </div>
      );


      // ─── TAB: PROGRESS ──────────────────────────────────────────────────
      const renderProgressTab = () => {
        const items = [
          { label:"Pimsleur Lessons", current:data.pimsleurTotal||0, target:currentMilestone.pimsleur, unit:"lessons", emoji:"🎧" },
          { label:"Inner French",     current:data.innerFrenchTotal||0, target:currentMilestone.innerFrench, unit:"episodes", emoji:"🎙️" },
          { label:"Ear Comprehension",current:lastComp||0, target:currentMilestone.comprehension, unit:"%", emoji:"👂" },
        ];
        return (
          <div style={S.bodyPad}>
            <div style={S.sectionLabel}>Next: {currentMilestone.label}</div>
            {items.map(item => {
              const p = pct(item.current, item.target);
              return (
                <div key={item.label} style={S.card}>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:10, alignItems:"baseline" }}>
                    <div style={{ fontSize:14, color:C.text, fontWeight:600 }}>{item.emoji} {item.label}</div>
                    <div style={{ fontFamily:"'Inter',sans-serif", fontSize:16, color:C.accent, fontWeight:600, letterSpacing:-0.4 }}>{item.current}/{item.target} <span style={{ fontSize:11, color:C.textMuted, fontWeight:500 }}>{item.unit}</span></div>
                  </div>
                  <div style={{ height:6, background:"rgba(140,126,106,0.15)", borderRadius:100, overflow:"hidden" }}>
                    <div style={{ height:"100%", borderRadius:100, width:`${p}%`, background: p>=100?C.accentDeep:C.accent, transition:"width 0.6s ease" }} />
                  </div>
                  <div style={{ fontSize:11, color:C.textMuted, marginTop:6, textAlign:"right", fontWeight:500 }}>{p}% complete</div>
                </div>
              );
            })}

            <div style={S.card}>
              <div style={{ fontSize:14, color:C.text, marginBottom:12, fontWeight:600 }}>🏋️ Workout Breakdown</div>
              <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                {WORKOUT_TYPES.map(w => (
                  <div key={w.key} style={{ flex:"1 1 calc(33% - 8px)", background:"#ffffff", borderRadius:12, padding:"12px 6px", textAlign:"center", boxShadow:"0 1px 0 #ffffff inset" }}>
                    <div style={{ fontSize:18 }}>{w.emoji}</div>
                    <div style={{ fontFamily:"'Inter',sans-serif", fontSize:22, fontWeight:600, color:C.accent, marginTop:4, letterSpacing:-0.6 }}>{workoutCounts[w.key]||0}</div>
                    <div style={{ fontSize:9, color:C.textMuted, textTransform:"uppercase", letterSpacing:1, fontWeight:600, marginTop:1 }}>{w.label}</div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{ marginTop:20, paddingTop:20 }}>
              <div style={S.sectionLabel}>6-month roadmap</div>
              {MILESTONES.map(m => {
                const done = (data.pimsleurTotal||0) >= m.pimsleur;
                return (
                  <div key={m.month} style={{ display:"flex", alignItems:"center", gap:14, marginBottom:14, opacity: done?1:0.6 }}>
                    <div style={{ width:36, height:36, borderRadius:"50%", flexShrink:0, background: done?`${C.accent}`:"#ffffff", border:done?"none":`1.5px solid #e7eae3`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, color: done?"#fff":C.textMuted, fontWeight:700, boxShadow:"none" }}>{done?"✓":m.month}</div>
                    <div>
                      <div style={{ fontSize:14, color: done?C.greenText:C.text, fontWeight:700, letterSpacing:-0.2 }}>{m.label}</div>
                      <div style={{ fontSize:11, color:C.textMuted, marginTop:2 }}>Pimsleur {m.pimsleur} · Ear {m.comprehension}% · Inner French {m.innerFrench} eps</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      };

      // ─── TAB: YEAR ──────────────────────────────────────────────────────
      const renderYearTab = () => {
        const yearRange = (() => {
          const t = new Date();
          const end = new Date(t.getFullYear(), t.getMonth()+12, 1);
          return `${t.getFullYear()} — ${MONTH_LABELS[end.getMonth()]} ${end.getFullYear()}`;
        })();
        const todayColIdx = yearGrid.findIndex(w => w.days.some(d => d.isToday));

        return (
          <div style={S.bodyPad}>
            <div style={S.sectionLabel}>{yearRange}</div>

            <div style={{ ...S.card, display:"flex", justifyContent:"space-around", textAlign:"center" }}>
              {[
                { label:"Active days", value:yearStats.active },
                { label:"Full days", value:yearStats.full },
                { label:"Workouts", value:yearStats.workouts },
              ].map(st => (
                <div key={st.label}>
                  <div style={{ fontFamily:"'Inter',sans-serif", fontSize:26, fontWeight:600, color:C.accent, letterSpacing:-1, lineHeight:1 }}>{st.value}</div>
                  <div style={{ fontSize:10, color:C.textMuted, letterSpacing:1, textTransform:"uppercase", marginTop:4, fontWeight:600 }}>{st.label}</div>
                </div>
              ))}
            </div>

            <div ref={yearScrollRef} style={{ ...S.card, overflowX:"auto" }}>
              <div style={{ display:"flex", gap:3, minWidth:"fit-content" }}>
                <div style={{ display:"flex", flexDirection:"column", gap:3, marginRight:4, paddingTop:34, position:"sticky", left:0, background:"#ffffff", zIndex:1, paddingRight:4 }}>
                  {["","M","","W","","F",""].map((d,i) => (
                    <div key={i} style={{ height:16, fontSize:8, color:C.textMuted, display:"flex", alignItems:"center", width:14, fontWeight:600 }}>{d}</div>
                  ))}
                </div>
                <div style={{ display:"flex", gap:3 }}>
                  {yearGrid.map((week, wi) => {
                    const firstDay = week.days.find(d => d.day===1);
                    const mLabel = firstDay
                      ? (firstDay.month===0 ? `Jan ${String(firstDay.year).slice(2)}` : MONTH_LABELS[firstDay.month])
                      : "";
                    const wn = week.weekNum;
                    const showWeek = wn>0 && (wn%4===0 || wi===0 || wi===yearGrid.length-1);
                    const isTodayCol = wi === todayColIdx;
                    return (
                      <div key={wi} data-today={isTodayCol?"1":undefined} style={{ display:"flex", flexDirection:"column", gap:3 }}>
                        <div style={{ height:14, fontSize:8, color:C.accent, fontWeight:700, whiteSpace:"nowrap", textAlign:"center", width:16 }}>{showWeek ? `W${wn}` : ""}</div>
                        <div style={{ height:14, fontSize:9, color:C.textMuted, fontWeight:700, whiteSpace:"nowrap", overflow:"visible" }}>{mLabel}</div>
                        {week.days.map((cell, di) => {
                          const bgCol = heatColor(cell);
                          const isDark = [HEAT[3], HEAT[4], C.workoutOnly].includes(bgCol);
                          const numCol = isDark ? "#ffffff" : "rgba(0,0,0,0.45)";
                          return (
                            <div key={di} style={{
                              width:16, height:16, borderRadius:3,
                              background: bgCol,
                              outline: cell.isToday?`1.5px solid ${C.text}`:"none",
                              outlineOffset: cell.isToday?"1px":"0",
                              boxSizing:"border-box",
                              display:"flex", alignItems:"center", justifyContent:"center",
                              fontSize:7, fontWeight:700, color:numCol, lineHeight:1,
                              fontFamily:"Inter,sans-serif",
                            }}>{cell.label||""}</div>
                          );
                        })}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            <div style={{ fontSize:10, color:C.textMuted, letterSpacing:1, textAlign:"center", fontWeight:600 }}>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:6, marginBottom:6 }}>
                <span>COMBO</span>
                {[0,1,2,3,4].map(c => <div key={c} style={{ width:14, height:14, borderRadius:3, background:HEAT[c] }}/>)}
                <span>MORE</span>
              </div>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:6 }}>
                <div style={{ width:14, height:14, borderRadius:3, background:C.workoutOnly }}/>
                <span>WORKOUT ONLY</span>
              </div>
            </div>
            <div style={{ marginTop:16, fontSize:11, color:C.textMuted, textAlign:"center", lineHeight:1.6, fontWeight:500 }}>
              Each square = one day. Fill every square before your exam.
            </div>
          </div>
        );
      };


      // ─── TAB: HISTORY ───────────────────────────────────────────────────
      const renderHistoryEditor = (date, log) => (
        <div style={{ background:"#ffffff", borderRadius:14, padding:14, marginBottom:12, boxShadow:"none" }}>
          {[{key:"pimsleur",emoji:"🎧",label:"Pimsleur"},{key:"anki",emoji:"🃏",label:"Flash cards"},{key:"innerFrench",emoji:"🎙️",label:"Inner French"},...(data.customHabits||[])].map(h => (
            <div key={h.key} onClick={()=>toggleDayHabit(date,h.key)} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 0", cursor:"pointer", borderBottom:`1px solid ${C.border}` }}>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ fontSize:20 }}>{h.emoji}</span>
                <span style={{ fontSize:13, color:C.text, fontWeight:500 }}>{h.label}</span>
              </div>
              <Toggle on={log[h.key]} onClick={()=>toggleDayHabit(date,h.key)} />
            </div>
          ))}
          <div style={{ padding:"12px 0 8px" }}>
            <div style={{ fontSize:11, color:C.textMuted, marginBottom:8, letterSpacing:1, textTransform:"uppercase", fontWeight:600 }}>Workout</div>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
              {WORKOUT_TYPES.map(wk => {
                const active = log.workout === wk.key;
                return (
                  <button key={wk.key} onClick={()=>setDayWorkout(date,wk.key)} style={{
                    flex:"1 1 calc(33% - 6px)", padding:"8px 4px", borderRadius:10,
                    background: active?`${C.accent}`:"#ffffff",
                    border:"none",
                    color: active?"#fff":C.text,
                    fontSize:11, fontWeight:600, cursor:"pointer", fontFamily:"Inter,sans-serif", textAlign:"center",
                    boxShadow:"none",
                  }}>
                    <div style={{ fontSize:16 }}>{wk.emoji}</div>
                    <div style={{ marginTop:2 }}>{wk.label}</div>
                  </button>
                );
              })}
            </div>
          </div>
          <button onClick={()=>{ if(window.confirm(`Delete ${formatDate(date,{weekday:"long",month:"short",day:"numeric"})}?`)) deleteDay(date); }}
            style={{ width:"100%", padding:"10px", borderRadius:12, background:"#ffffff", border:`1px solid ${C.red}`, color:C.red, fontSize:12, fontWeight:600, cursor:"pointer", fontFamily:"Inter,sans-serif", marginTop:10 }}>
            Delete this day
          </button>
        </div>
      );

      const renderHistoryTab = () => (
        <div style={S.bodyPad}>
          <div style={S.sectionLabel}>Daily log</div>
          <div style={{ fontSize:11, color:C.textMuted, marginBottom:14, fontStyle:"italic", fontWeight:500 }}>Tap a day to edit or delete it.</div>
          <div style={S.card}>
          {Object.entries(data.logs).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,30).map(([date, log], i) => {
            const w = WORKOUT_TYPES.find(w => w.key===log.workout);
            const isEditing = editingDate === date;
            const isToday = date === today;
            return (
              <div key={date} style={{ borderTop: i===0?"none":`1px solid ${C.border}` }}>
                <div onClick={()=>setEditingDate(isEditing?null:date)} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 0", cursor:"pointer" }}>
                  <div style={{ fontSize:12, color: isEditing?C.accent:C.textMuted, fontWeight: isEditing?700:500 }}>
                    {formatDate(date,{weekday:"short",month:"short",day:"numeric"})}
                    {isToday && <span style={{ marginLeft:6, fontSize:9, color:C.accent, letterSpacing:1, fontWeight:700 }}>TODAY</span>}
                  </div>
                  <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                    {[{key:"pimsleur",emoji:"🎧"},{key:"anki",emoji:"🃏"},{key:"innerFrench",emoji:"🎙️"},...(data.customHabits||[])].map(h => (
                      <span key={h.key} style={{ fontSize:16, opacity: log[h.key]?1:0.15 }}>{h.emoji}</span>
                    ))}
                    <span style={{ fontSize:16, opacity: w?1:0.15 }}>{w?w.emoji:"🏋️"}</span>
                    <span style={{ fontSize:11, color:C.textMuted, marginLeft:4 }}>{isEditing?"▲":"▼"}</span>
                  </div>
                </div>
                {isEditing && renderHistoryEditor(date, log)}
              </div>
            );
          })}
          {Object.keys(data.logs).length === 0 && (
            <div style={{ color:C.textMuted, fontSize:13, textAlign:"center", padding:"20px 0" }}>No days logged yet.</div>
          )}
          </div>
        </div>
      );


      // ─── TAB: SETTINGS ──────────────────────────────────────────────────
      const renderSettingsHabits = () => (
        <SectionDivider>
          <div style={S.sectionLabel}>Habits</div>

          <div style={S.card}>
            <div style={S.smallLabel}>Built-in</div>
            {BUILTIN_HABITS.map((h, i) => {
              const hidden = hiddenBuiltins.includes(h.key);
              return (
                <div key={h.key} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 0", borderTop: i===0?"none":`1px solid ${C.border}`, opacity: hidden?0.5:1 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                    <span style={{ fontSize:18 }}>{h.emoji}</span>
                    <span style={{ fontSize:14, color:C.text, textDecoration: hidden?"line-through":"none", fontWeight:500 }}>{h.label}</span>
                  </div>
                  <button onClick={()=>toggleBuiltin(h.key)} style={{
                    background: hidden?`${C.accent}`:"#ffffff",
                    border: hidden?"none":`1px solid ${C.border}`,
                    borderRadius:8, color: hidden?"#fff":C.textMuted,
                    fontSize:11, fontWeight:700, letterSpacing:0.3, padding:"5px 12px", cursor:"pointer", fontFamily:"Inter,sans-serif",
                    boxShadow:"none",
                  }}>{hidden ? "RESTORE" : "HIDE"}</button>
                </div>
              );
            })}
            <div style={{ fontSize:10, color:C.textMuted, marginTop:10, fontStyle:"italic", lineHeight:1.5 }}>Hiding a built-in habit removes it from new days. Days where you already logged it keep their data.</div>
          </div>

          <div style={S.card}>
            <div style={S.smallLabel}>Custom</div>
            <div style={{ display:"flex", gap:8, marginBottom:10 }}>
              <input type="text" value={newHabitEmoji} onChange={e=>setNewHabitEmoji(e.target.value || "📌")} maxLength="4"
                style={{ width:54, textAlign:"center", background:"#ffffff", border:`1px solid ${C.border}`, borderRadius:10, fontSize:20, padding:"8px 0", fontFamily:"Inter,sans-serif" }} />
              <input type="text" value={newHabitName} onChange={e=>setNewHabitName(e.target.value)} placeholder="New habit name…"
                onKeyDown={e=>{ if(e.key==="Enter") addCustomHabit(); }}
                style={{ ...S.input, flex:1 }} />
              <button onClick={addCustomHabit} style={S.primaryBtn}>ADD</button>
            </div>
            <EmojiPalette selected={newHabitEmoji} onSelect={setNewHabitEmoji} />
            <div style={{ fontSize:10, color:C.textMuted, marginBottom:14, fontStyle:"italic", lineHeight:1.5 }}>Pick from above or type any emoji in the box. Tap an existing habit's emoji to change it.</div>

            {(data.customHabits||[]).length === 0 && (
              <div style={{ color:C.textMuted, fontSize:12, textAlign:"center", padding:"8px 0" }}>No custom habits yet. Type a name above to add one.</div>
            )}
            {(data.customHabits||[]).map(h => {
              const isEditing = editingEmojiFor === h.key;
              return (
                <div key={h.key} style={{ borderTop:`1px solid ${C.border}` }}>
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 0" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                      <span onClick={()=>setEditingEmojiFor(isEditing?null:h.key)} style={{
                        fontSize:22, cursor:"pointer", padding:"2px 8px", borderRadius:8,
                        background: isEditing?"#ffffff":"none",
                        border: `1px solid ${isEditing?C.border:"transparent"}`,
                      }}>{h.emoji}</span>
                      <span style={{ fontSize:14, color:C.text, fontWeight:500 }}>{h.label}</span>
                    </div>
                    <button onClick={()=>deleteCustomHabit(h.key)} style={{ background:"#ffffff", border:`1px solid ${C.red}`, borderRadius:8, color:C.red, fontSize:11, fontWeight:700, letterSpacing:0.3, padding:"5px 12px", cursor:"pointer", fontFamily:"Inter,sans-serif" }}>DELETE</button>
                  </div>
                  {isEditing && (
                    <div style={{ display:"flex", flexWrap:"wrap", gap:6, padding:"8px 0 12px" }}>
                      <input type="text" defaultValue={h.emoji}
                        onBlur={e=>{ updateHabitEmoji(h.key, e.target.value || "📌"); setEditingEmojiFor(null); }}
                        maxLength="4"
                        style={{ width:54, textAlign:"center", background:"#ffffff", border:`1px solid ${C.border}`, borderRadius:10, fontSize:18, padding:"6px 0", fontFamily:"Inter,sans-serif" }} />
                      {EMOJI_PRESETS.map(e => (
                        <button key={e} onClick={()=>{ updateHabitEmoji(h.key, e); setEditingEmojiFor(null); }} style={{
                          width:34, height:34, fontSize:18, borderRadius:8,
                          background: h.emoji===e?`${C.accent}`:"#ffffff",
                          border: h.emoji===e?"none":`1px solid ${C.border}`,
                          cursor:"pointer", fontFamily:"Inter,sans-serif",
                          boxShadow:"none",
                        }}>{e}</button>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </SectionDivider>
      );

      const renderSettingsHabitOrder = () => (
        <SectionDivider>
          <div style={S.sectionLabel}>Habit order</div>
          <div style={S.card}>
            <div style={{ fontSize:12, color:C.textMuted, marginBottom:12, lineHeight:1.5, fontWeight:500 }}>Tap ▲▼ to reorder how habits appear on the Day tab.</div>
            {allActiveHabits.map((h, i) => {
              const btnStyle = disabled => ({
                width:32, height:32, borderRadius:10,
                background: "#ffffff",
                border: "none",
                color: disabled?C.mutedGray:C.text,
                fontSize:14, cursor: disabled?"default":"pointer",
                fontFamily:"Inter,sans-serif",
                opacity: disabled?0.4:1,
                boxShadow:"none",
              });
              return (
                <div key={h.key} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 0", borderTop: i===0?"none":`1px solid ${C.border}` }}>
                  <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                    <span style={{ fontSize:18 }}>{h.emoji}</span>
                    <span style={{ fontSize:14, color:C.text, fontWeight:500 }}>{h.label}</span>
                  </div>
                  <div style={{ display:"flex", gap:6 }}>
                    <button onClick={()=>moveHabit(h.key,-1)} disabled={i===0} style={btnStyle(i===0)}>▲</button>
                    <button onClick={()=>moveHabit(h.key,1)} disabled={i===allActiveHabits.length-1} style={btnStyle(i===allActiveHabits.length-1)}>▼</button>
                  </div>
                </div>
              );
            })}
          </div>
        </SectionDivider>
      );

      const renderSettingsTab = () => (
        <div style={S.bodyPad}>
          <div style={S.sectionLabel}>Adjust current progress</div>

          <div style={S.card}>
            <div style={{ fontSize:14, fontWeight:700, color:C.text, marginBottom:4, letterSpacing:-0.2 }}>🎧 Pimsleur</div>
            <div style={{ fontSize:12, color:C.textMuted, marginBottom:16, fontWeight:500 }}>Set the lesson number you are currently on</div>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              <div style={{ color:C.textMuted, fontSize:13, fontWeight:500 }}>Current lesson</div>
              <NumberStepper value={data.pimsleurTotal||0} onChange={v=>updateCount("pimsleurTotal",v)} min={0} max={180} />
            </div>
          </div>

          <div style={S.card}>
            <div style={{ fontSize:14, fontWeight:700, color:C.text, marginBottom:4, letterSpacing:-0.2 }}>🎙️ Inner French</div>
            <div style={{ fontSize:12, color:C.textMuted, marginBottom:16, fontWeight:500 }}>Set the episode number you are currently on</div>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              <div style={{ color:C.textMuted, fontSize:13, fontWeight:500 }}>Current episode</div>
              <NumberStepper value={data.innerFrenchTotal||0} onChange={v=>updateCount("innerFrenchTotal",v)} min={0} max={200} />
            </div>
          </div>

          <SavedToast show={saved} />

          {renderSettingsHabits()}
          {renderSettingsHabitOrder()}

          {(() => {
            // Linked accounts section
            const providers = window.__firebase ? window.__firebase.getLinkedProviders() : [];
            const hasGoogle = providers.includes("google.com");
            const hasEmail = providers.includes("password");
            const _ = linkedRefresh; // force re-read on changes

            const linkEmailAccount = async () => {
              setLinkError(""); setLinkSuccess(""); setLinkBusy(true);
              const r = await window.__firebase.linkEmailToCurrentUser(linkEmail.trim(), linkPassword);
              setLinkBusy(false);
              if (r.ok) {
                setLinkSuccess(`Email login linked! You can now sign in with ${linkEmail.trim()} or with Google.`);
                setLinkEmail(""); setLinkPassword("");
                setLinkPanelOpen(false);
                setLinkedRefresh(x => x+1);
              } else {
                setLinkError(r.error);
              }
            };

            const linkGoogleAccount = async () => {
              setLinkError(""); setLinkSuccess(""); setLinkBusy(true);
              const r = await window.__firebase.linkGoogleToCurrentUser();
              setLinkBusy(false);
              if (r.ok) {
                setLinkSuccess("Google login linked! You can now sign in either way.");
                setLinkedRefresh(x => x+1);
              } else {
                setLinkError(r.error);
              }
            };

            const unlinkProvider = async (pid, label) => {
              if (!window.confirm(`Remove ${label} login? You'll only be able to sign in with your other method.`)) return;
              setLinkError(""); setLinkSuccess("");
              const r = await window.__firebase.unlinkProvider(pid);
              if (r.ok) {
                setLinkSuccess(`${label} login removed.`);
                setLinkedRefresh(x => x+1);
              } else {
                setLinkError(r.error);
              }
            };

            return (
              <SectionDivider>
                <div style={S.sectionLabel}>Sign-in methods</div>
                <div style={S.card}>
                  <div style={{ fontSize:12, color:C.textMuted, marginBottom:14, lineHeight:1.5, fontWeight:500 }}>
                    Add a second way to sign in so you can access this same data even if one login stops working. Methods you link here all open this same account.
                  </div>

                  {/* Current account email */}
                  <div style={{ fontSize:11, color:C.mutedGray, marginBottom:10, fontWeight:600, letterSpacing:0.3 }}>
                    Signed in as <span style={{color:C.text, fontWeight:700}}>{user?.email || "(no email)"}</span>
                  </div>

                  {/* Google row */}
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 0", borderTop:`1px solid ${C.border}` }}>
                    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                      <div>
                        <div style={{ fontSize:14, color:C.text, fontWeight:600 }}>Google</div>
                        <div style={{ fontSize:10, color:C.textMuted, fontWeight:500 }}>{hasGoogle ? "Linked" : "Not linked"}</div>
                      </div>
                    </div>
                    {hasGoogle ? (
                      <button onClick={()=>unlinkProvider("google.com","Google")} disabled={linkBusy} style={{ background:"#ffffff", border:`1px solid ${C.border}`, borderRadius:8, color:C.textMuted, fontSize:11, fontWeight:700, letterSpacing:0.3, padding:"5px 12px", cursor:"pointer", fontFamily:"Inter,sans-serif" }}>UNLINK</button>
                    ) : (
                      <button onClick={linkGoogleAccount} disabled={linkBusy} style={{ background:`${C.accent}`, border:"none", borderRadius:8, color:"#fff", fontSize:11, fontWeight:700, letterSpacing:0.3, padding:"5px 12px", cursor:"pointer", fontFamily:"Inter,sans-serif" }}>LINK</button>
                    )}
                  </div>

                  {/* Email row */}
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 0", borderTop:`1px solid ${C.border}` }}>
                    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                      <div style={{ width:18, height:18, display:"flex", alignItems:"center", justifyContent:"center" }}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="2.5" stroke={C.textMuted} strokeWidth="1.8" fill="none"/><path d="M2.5 6L12 13L21.5 6" stroke={C.textMuted} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
                      </div>
                      <div>
                        <div style={{ fontSize:14, color:C.text, fontWeight:600 }}>Email & Password</div>
                        <div style={{ fontSize:10, color:C.textMuted, fontWeight:500 }}>{hasEmail ? "Linked" : "Not linked"}</div>
                      </div>
                    </div>
                    {hasEmail ? (
                      <button onClick={()=>unlinkProvider("password","Email")} disabled={linkBusy} style={{ background:"#ffffff", border:`1px solid ${C.border}`, borderRadius:8, color:C.textMuted, fontSize:11, fontWeight:700, letterSpacing:0.3, padding:"5px 12px", cursor:"pointer", fontFamily:"Inter,sans-serif" }}>UNLINK</button>
                    ) : (
                      <button onClick={()=>{ setLinkPanelOpen(!linkPanelOpen); setLinkError(""); setLinkSuccess(""); }} disabled={linkBusy} style={{ background:`${C.accent}`, border:"none", borderRadius:8, color:"#fff", fontSize:11, fontWeight:700, letterSpacing:0.3, padding:"5px 12px", cursor:"pointer", fontFamily:"Inter,sans-serif" }}>{linkPanelOpen ? "CANCEL" : "LINK"}</button>
                    )}
                  </div>

                  {/* Email link panel */}
                  {linkPanelOpen && !hasEmail && (
                    <div style={{ marginTop:12, padding:12, background:"#ffffff", borderRadius:12, border:`1px solid ${C.border}` }}>
                      <div style={{ fontSize:11, color:C.textMuted, marginBottom:10, lineHeight:1.5, fontWeight:500 }}>
                        Pick an email + password for this account. Use the same email as your Google account if you want, or a different one — either works. You'll be able to sign in with either method.
                      </div>
                      <input type="email" placeholder="Email" autoComplete="email" autoCapitalize="off"
                        value={linkEmail} onChange={e=>setLinkEmail(e.target.value)}
                        style={{ width:"100%", background:"#ffffff", border:`1px solid ${C.border}`, borderRadius:10, padding:"10px 12px", fontSize:13, color:C.text, fontFamily:"Inter,sans-serif", marginBottom:8, outline:"none" }}/>
                      <input type="password" placeholder="Password (min 6 characters)" autoComplete="new-password"
                        value={linkPassword} onChange={e=>setLinkPassword(e.target.value)}
                        onKeyDown={e=>{ if (e.key==="Enter" && linkEmail && linkPassword.length>=6) linkEmailAccount(); }}
                        style={{ width:"100%", background:"#ffffff", border:`1px solid ${C.border}`, borderRadius:10, padding:"10px 12px", fontSize:13, color:C.text, fontFamily:"Inter,sans-serif", marginBottom:10, outline:"none" }}/>
                      <button onClick={linkEmailAccount} disabled={linkBusy || !linkEmail || linkPassword.length<6} style={{ width:"100%", padding:"11px", borderRadius:10, background:`${C.accent}`, border:"none", color:"#fff", fontSize:12, fontWeight:700, letterSpacing:0.5, cursor:(linkBusy || !linkEmail || linkPassword.length<6)?"not-allowed":"pointer", opacity:(linkBusy || !linkEmail || linkPassword.length<6)?0.5:1, fontFamily:"Inter,sans-serif" }}>
                        {linkBusy ? "LINKING…" : "LINK EMAIL TO THIS ACCOUNT"}
                      </button>
                    </div>
                  )}

                  {linkError && <div style={{ marginTop:10, fontSize:11, color:C.red, fontWeight:500 }}>{linkError}</div>}
                  {linkSuccess && <div style={{ marginTop:10, fontSize:11, color:C.greenText, fontWeight:600 }}>{linkSuccess}</div>}
                </div>
              </SectionDivider>
            );
          })()}

          <SectionDivider>
            <div style={S.sectionLabel}>Export</div>
            <div style={S.card}>
              <div style={{ fontSize:13, color:C.textMuted, marginBottom:12, lineHeight:1.5, fontWeight:500 }}>Download everything as an Excel workbook with 5 sheets: Summary, Daily Logs, Workout Sets, Workout Sessions, and Todos.</div>
              <button onClick={exportCSV} style={{ width:"100%", padding:"14px", borderRadius:12, background:`${C.accent}`, border:"none", color:"#fff", fontSize:13, fontWeight:700, cursor:"pointer", fontFamily:"Inter,sans-serif", letterSpacing:1 }}>
                📊 EXPORT TO EXCEL
              </button>
            </div>
          </SectionDivider>

          <SectionDivider>
            <div style={S.sectionLabel}>Danger zone</div>
            <button onClick={resetAllData} style={S.dangerBtn}>Reset all data</button>
          </SectionDivider>
        </div>
      );

      // ─── Root render ────────────────────────────────────────────────────
      return (
        <div style={{ fontFamily:"Inter,sans-serif", minHeight:"100vh", color:C.text, maxWidth:430, margin:"0 auto", paddingBottom:"calc(96px + env(safe-area-inset-bottom, 0px))" }}>
          {renderHeader()}
          {activeTab === "day" && renderDayHero()}
          {activeTab === "day"      && renderDayTab()}
          {activeTab === "todo"     && renderTodoTab()}
          {activeTab === "workout"  && renderWorkoutTab()}
          {activeTab === "progress" && renderProgressTab()}
          {activeTab === "year"     && renderYearTab()}
          {activeTab === "history"  && renderHistoryTab()}
          {activeTab === "settings" && renderSettingsTab()}
          {renderTodoFAB()}
          {renderAddSheet()}
          {renderTabs()}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
